    /* ─── Body Scan Timeline ─────────────────────────────────────────────────── */
    function BodyScanTimeline({ rows, videos, onPlayVideo }) {
      if (!videos.length) return null;

      const VW = 360;
      const PAD = { l: 38, r: 14, t: 8, b: 28 };
      const cW = VW - PAD.l - PAD.r;
      const BAR_H = 18, LANE_GAP = 4;

      const pts = [...rows].reverse();
      const startMs = pts.length ? new Date(pts[0].date + 'T12:00:00').getTime() : Date.now();
      const todayMs = new Date().setHours(12,0,0,0);
      const endMs   = todayMs + 14 * 86400000;
      const xOf = ms => PAD.l + (ms - startMs) / (endMs - startMs) * cW;

      // Pack clips into lanes to avoid overlap
      const sorted = [...videos].sort((a,b) => a.startDate.localeCompare(b.startDate));
      const lanes = [];
      const placed = sorted.map(v => {
        const sMs = new Date(v.startDate + 'T12:00:00').getTime();
        const eMs = new Date(v.endDate + 'T12:00:00').getTime();
        let lane = lanes.findIndex(laneEnd => laneEnd < sMs - 86400000);
        if (lane === -1) { lane = lanes.length; lanes.push(eMs); }
        else { lanes[lane] = eMs; }
        return { ...v, sMs, eMs, lane };
      });

      const numLanes = Math.max(1, lanes.length);
      const svgH = PAD.t + numLanes * (BAR_H + LANE_GAP) - LANE_GAP + PAD.b;

      const xTicks = [];
      const td = new Date(startMs); td.setDate(1); td.setMonth(td.getMonth()+1);
      while (td.getTime() <= endMs) { xTicks.push(td.getTime()); td.setMonth(td.getMonth()+1); }

      const COLORS = ['#5c6bc0','#26a69a','#ef5350','#ab47bc','#ff7043'];

      return (
        <div style={{ background:'#fff', borderRadius:14, margin:'0 0 12px',
                      overflow:'hidden', border:'.5px solid rgba(0,0,0,.06)' }}>
          <div style={{ padding:'10px 14px 4px' }}>
            <div style={{ fontSize:13, fontWeight:700, color:'#1c1c1e' }}>Body Scans</div>
          </div>
          <svg viewBox={`0 0 ${VW} ${svgH}`}
               style={{ width:'100%', height:'auto', display:'block' }}>
            {xTicks.map(ms => (
              <g key={ms}>
                <line x1={xOf(ms)} y1={PAD.t} x2={xOf(ms)} y2={svgH - PAD.b}
                      stroke="rgba(0,0,0,.05)" strokeWidth="0.8" />
                <text x={xOf(ms)} y={svgH - PAD.b + 10} textAnchor="middle"
                      fontSize="5" fill="#aeaeb2">
                  {new Date(ms).toLocaleDateString('en-US', { month:'short' })}
                </text>
              </g>
            ))}
            {placed.map((v, i) => {
              const x1    = Math.max(PAD.l, xOf(v.sMs));
              const x2    = Math.min(PAD.l + cW, xOf(v.eMs));
              const y     = PAD.t + v.lane * (BAR_H + LANE_GAP);
              const color = COLORS[i % COLORS.length];
              const barW  = Math.max(4, x2 - x1);
              return (
                <g key={v.startDate} style={{ cursor:'pointer' }}
                   onClick={() => onPlayVideo && onPlayVideo(v)}>
                  <rect x={x1} y={y} width={barW} height={BAR_H} rx={BAR_H/2}
                        fill={color} opacity="0.85" />
                  <text x={x1 + 9} y={y + BAR_H/2 + 3.5} fontSize="9" fill="#fff">▶</text>
                  {barW > 40 && (
                    <text x={x1 + 20} y={y + BAR_H/2 + 3.5} fontSize="6.5" fontWeight="600"
                          fill="#fff">
                      {v.label || `${fmtShort(v.startDate)} – ${fmtShort(v.endDate)}`}
                    </text>
                  )}
                </g>
              );
            })}
          </svg>
        </div>
      );
    }

    /* ─── Daily Weight Change by Day-of-Week ──────────────────────────────────── */
    function DailyWeightChart({ rows }) {
      if (!rows || rows.length < 2) return null;

      // Build day-of-week deltas from consecutive logged days (rows is newest-first)
      const dayDeltas = [[], [], [], [], [], [], []]; // 0=Sun … 6=Sat
      for (let i = 0; i < rows.length - 1; i++) {
        const todayMs = new Date(rows[i].date   + 'T12:00:00').getTime();
        const yestMs  = new Date(rows[i+1].date + 'T12:00:00').getTime();
        if (todayMs - yestMs !== 86400000) continue; // must be consecutive calendar days
        const dow   = new Date(rows[i].date + 'T12:00:00').getDay();
        const delta = rows[i].lbs - rows[i+1].lbs;   // negative = lost weight (today < yesterday)
        dayDeltas[dow].push(delta);
      }

      // Display Mon→Sun (Mon=1 … Sun=0)
      const DISPLAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
      const bars = DISPLAY_ORDER.map(dow => ({
        dow,
        wd:    WD[dow],
        avg:   dayDeltas[dow].length
                 ? dayDeltas[dow].reduce((s, v) => s + v, 0) / dayDeltas[dow].length
                 : null,
        count: dayDeltas[dow].length,
      }));

      const hasData = bars.filter(b => b.avg !== null);
      if (!hasData.length) return null;

      const VW = 360, VH = 120;
      const PAD = { t: 10, r: 14, b: 30, l: 36 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;

      const maxAbs = Math.max(...hasData.map(b => Math.abs(b.avg)), 0.1);
      const yScale = maxAbs * 1.4;
      const zeroY  = PAD.t + cH / 2;
      const yOf    = v => zeroY - (v / yScale) * (cH / 2);

      const slotW = cW / 7;
      const barW  = Math.max(8, slotW * 0.55);
      const xOf   = i => PAD.l + (i + 0.5) * slotW;

      return (
        <div>
          <svg viewBox={`0 0 ${VW} ${VH}`} style={{ width:'100%', height:'auto', display:'block' }}>
            {/* Y-axis labels: positive = gain (top), negative = loss (bottom) */}
            <text x={PAD.l-3} y={PAD.t+5} textAnchor="end" fontSize="5" fill="#aeaeb2">
              +{maxAbs.toFixed(2)}
            </text>
            <text x={PAD.l-3} y={zeroY+2} textAnchor="end" fontSize="5" fill="#aeaeb2">0</text>
            <text x={PAD.l-3} y={PAD.t+cH-1} textAnchor="end" fontSize="5" fill="#aeaeb2">
              -{maxAbs.toFixed(2)}
            </text>

            {/* Axis lines */}
            <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={PAD.t+cH}
                  stroke="rgba(0,0,0,.08)" strokeWidth="0.5" />
            <line x1={PAD.l} y1={zeroY} x2={PAD.l+cW} y2={zeroY}
                  stroke="rgba(0,0,0,.18)" strokeWidth="0.8" />
            {/* Light grid at ±half */}
            {[-maxAbs*0.5, maxAbs*0.5].map(v => (
              <line key={v} x1={PAD.l} y1={yOf(v)} x2={PAD.l+cW} y2={yOf(v)}
                    stroke="rgba(0,0,0,.05)" strokeWidth="0.5" />
            ))}

            {/* Bars */}
            {bars.map((b, i) => {
              if (b.avg === null) return (
                <g key={b.dow}>
                  <text x={xOf(i)} y={PAD.t+cH+10} textAnchor="middle"
                        fontSize="5" fill="#d1d1d6">{b.wd}</text>
                </g>
              );
              const y   = yOf(b.avg);
              const h   = Math.max(1, Math.abs(zeroY - y));
              const top = b.avg < 0 ? zeroY : y;     // loss (neg) bar goes below zero
              const col = b.avg < 0 ? '#34c759' : '#ff9500'; // loss=green, gain=orange
              const txtCol = b.avg < 0 ? '#1a7f3c' : '#c0392b';
              return (
                <g key={b.dow}>
                  <rect x={xOf(i)-barW/2} y={top} width={barW} height={h}
                        rx={2} fill={col} opacity="0.82" />
                  {h > 7 && (
                    <text x={xOf(i)} y={b.avg < 0 ? top+h+6 : top-2}
                          textAnchor="middle" fontSize="4.5" fontWeight="600" fill={txtCol}>
                      {b.avg > 0 ? '+' : ''}{b.avg.toFixed(2)}
                    </text>
                  )}
                  <text x={xOf(i)} y={PAD.t+cH+11} textAnchor="middle"
                        fontSize="6" fontWeight="600" fill="#3c3c43">{b.wd}</text>
                  <text x={xOf(i)} y={PAD.t+cH+20} textAnchor="middle"
                        fontSize="4" fill="#c7c7cc">n={b.count}</text>
                </g>
              );
            })}
          </svg>
          <div style={{ padding:'2px 14px 10px', fontSize:9, color:'#aeaeb2', textAlign:'center' }}>
            Avg daily weight change vs prior day · green = loss · orange = gain · n = consecutive pairs
          </div>
        </div>
      );
    }

    /* ─── Weight Loss Per Dose ──────────────────────────────────────────────── */
    function DoseWeightLossChart({ rows, injections }) {
      const [hoveredDose, setHoveredDose] = useState(null);
      if (!rows || rows.length < 2 || !injections || injections.length < 2) return null;

      const DOSE_PALETTE = ['#4a90d9','#34c759','#ff9500','#ff3b30','#b06dff','#00c7be','#ff2d55','#5856d6','#ffcc00','#8e8e93'];

      const pts = [...rows].reverse().map(r => ({
        ms: new Date(r.date + 'T12:00:00').getTime(), lbs: r.lbs
      }));
      const lbsAt = ms => {
        if (!pts.length) return null;
        if (ms <= pts[0].ms) return pts[0].lbs;
        if (ms >= pts[pts.length-1].ms) return pts[pts.length-1].lbs;
        for (let i = 0; i < pts.length-1; i++) {
          if (ms >= pts[i].ms && ms <= pts[i+1].ms) {
            const f = (ms - pts[i].ms) / (pts[i+1].ms - pts[i].ms);
            return pts[i].lbs + (pts[i+1].lbs - pts[i].lbs) * f;
          }
        }
        return pts[pts.length-1].lbs;
      };

      const sortedInj = [...injections].sort((a,b) => a.date.localeCompare(b.date));
      const weekStartMs = ms => { const d = new Date(ms); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); };
      const weekGroups = {};
      for (const inj of sortedInj) {
        const ms = new Date(inj.date + 'T12:00:00').getTime();
        const wk = weekStartMs(ms);
        if (!weekGroups[wk]) weekGroups[wk] = { doseMg: 0, firstMs: ms };
        weekGroups[wk].doseMg += inj.doseMg;
        weekGroups[wk].firstMs = Math.min(weekGroups[wk].firstMs, ms);
      }
      const weeklyCycles = Object.values(weekGroups)
        .sort((a,b) => a.firstMs - b.firstMs)
        .map(g => ({ startMs: g.firstMs, doseMg: Math.round(g.doseMg * 1000) / 1000 }));
      const doseChanges = [];
      let prevDose = null;
      for (const c of weeklyCycles) {
        if (c.doseMg !== prevDose) { doseChanges.push({ ms: c.startMs, doseMg: c.doseMg }); prevDose = c.doseMg; }
      }
      if (doseChanges.length < 2) return null;

      const todayMs = new Date().setHours(12,0,0,0);
      const dosePeriods = doseChanges.map((dc, i) => {
        const endMs = i < doseChanges.length - 1 ? doseChanges[i+1].ms : todayMs;
        const startW = lbsAt(dc.ms), endW = lbsAt(endMs);
        // Allow negative (weight gained during a period) — clipping to 0 inflates
        // the total vs the actual net weight change.
        const lostLbs = startW != null && endW != null ? startW - endW : 0;
        return { doseMg: dc.doseMg, lostLbs, color: DOSE_PALETTE[i % DOSE_PALETTE.length] };
      });

      if (!dosePeriods.length) return null;
      // Pie only shows periods where weight was lost; table shows all
      const pieSlices = dosePeriods.filter(p => p.lostLbs > 0);
      const totalLost = dosePeriods.reduce((s, p) => s + p.lostLbs, 0);
      if (pieSlices.length === 0) return null;
      if (totalLost <= 0) return null;

      // Pie geometry — 40% larger than previous (85 → 119), centered
      const cx = 140, cy = 140, r = 119;
      let angle = -Math.PI / 2;
      const totalPieLost = pieSlices.reduce((s, p) => s + p.lostLbs, 0);
      const slices = pieSlices.map((p, i) => {
        const fraction = p.lostLbs / totalPieLost;
        const startA = angle;
        angle += fraction * 2 * Math.PI;
        const endA = angle;
        const large = fraction > 0.5 ? 1 : 0;
        const x1 = cx + r * Math.cos(startA), y1 = cy + r * Math.sin(startA);
        const x2 = cx + r * Math.cos(endA),   y2 = cy + r * Math.sin(endA);
        return { ...p, i, fraction,
          d: `M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z` };
      });

      const hov = hoveredDose != null ? slices.find(s => s.doseMg === hoveredDose) : null;

      return (
        <div style={{ display:'flex', justifyContent:'center', alignItems:'flex-start',
                      padding:'12px 14px 16px', gap:24, flexWrap:'wrap' }}>
          {/* Pie chart — no perimeter labels, hover tooltip in center */}
          <svg viewBox="0 0 280 280" style={{ width:240, flexShrink:0, cursor:'default' }}
               onMouseLeave={() => setHoveredDose(null)}>
            {slices.map((s) => (
              <path key={s.i} d={s.d}
                    fill={s.color}
                    stroke="#fff" strokeWidth="1.5"
                    opacity={hov && hov.doseMg !== s.doseMg ? 0.55 : 1}
                    style={{ cursor:'pointer', transition:'opacity .15s' }}
                    onMouseEnter={() => setHoveredDose(s.doseMg)}
                    onClick={() => setHoveredDose(v => v === s.doseMg ? null : s.doseMg)} />
            ))}
            {/* Center tooltip on hover */}
            {hov && (
              <g pointerEvents="none">
                <circle cx={cx} cy={cy} r={58} fill="rgba(28,28,30,.88)" />
                <text x={cx} y={cy - 17} textAnchor="middle" fontSize="15" fontWeight="800"
                      fill={hov.color}>{hov.doseMg} mg</text>
                <text x={cx} y={cy + 3} textAnchor="middle" fontSize="11" fill="rgba(255,255,255,.65)">
                  {(hov.fraction * 100).toFixed(1)}% of loss
                </text>
                <text x={cx} y={cy + 20} textAnchor="middle" fontSize="13" fontWeight="700" fill="#fff">
                  {hov.lostLbs.toFixed(1)} lbs
                </text>
              </g>
            )}
          </svg>

          {/* Compact data table — constrained width so columns stay close */}
          <div style={{ minWidth:180, maxWidth:260 }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
              <thead>
                <tr style={{ borderBottom:'1.5px solid rgba(0,0,0,.1)' }}>
                  <th style={{ textAlign:'left', padding:'4px 16px 6px 0', fontSize:11, fontWeight:700,
                               color:'#8e8e93', textTransform:'uppercase', letterSpacing:.4 }}>Dose</th>
                  <th style={{ textAlign:'right', padding:'4px 0 6px', fontSize:11, fontWeight:700,
                               color:'#8e8e93', textTransform:'uppercase', letterSpacing:.4 }}>lbs lost</th>
                </tr>
              </thead>
              <tbody>
                {dosePeriods.map((p, i) => (
                  <tr key={i} style={{ borderBottom:'.5px solid rgba(0,0,0,.06)',
                                       background: hoveredDose === p.doseMg ? `${p.color}12` : 'transparent',
                                       cursor:'pointer' }}
                      onMouseEnter={() => setHoveredDose(p.doseMg)}
                      onMouseLeave={() => setHoveredDose(null)}>
                    <td style={{ padding:'6px 16px 6px 0' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <span style={{ width:10, height:10, borderRadius:'50%', background:p.color, flexShrink:0 }} />
                        <span style={{ fontWeight:600, color:'#1c1c1e' }}>{p.doseMg} mg</span>
                      </div>
                    </td>
                    <td style={{ textAlign:'right', padding:'6px 0', fontWeight:600,
                                 color: p.lostLbs < 0 ? '#ff3b30' : '#1c1c1e',
                                 fontVariantNumeric:'tabular-nums' }}>
                      {p.lostLbs >= 0 ? p.lostLbs.toFixed(1) : `+${Math.abs(p.lostLbs).toFixed(1)}`}
                    </td>
                  </tr>
                ))}
                <tr style={{ borderTop:'1.5px solid rgba(0,0,0,.1)' }}>
                  <td style={{ padding:'6px 16px 4px 18px', fontSize:12, color:'#8e8e93' }}>Total</td>
                  <td style={{ textAlign:'right', padding:'6px 0 4px', fontWeight:700,
                               color:'#1c1c1e', fontVariantNumeric:'tabular-nums' }}>
                    {totalLost.toFixed(1)}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function GistPanel({ gistOk, gistMsg, onSave, onLogout, style }) {

    function SyringeGraphic({ doseMg, concentration = 12.5, color = '#4a90d9', maxUnits = 100 }) {
      const units = doseMg > 0 ? Math.round(doseMg / concentration * 100 * 10) / 10 : 0;
      const ml    = doseMg > 0 ? (doseMg / concentration).toFixed(2) : '—';
      const syringeMax = maxUnits;
      const pct   = Math.min(units / syringeMax, 1);
      const uid   = `syr${Math.round(doseMg*1000)}_${Math.round(concentration*100)}`;

      const VW = 360, VH = 108;
      const bx = 80, by = 42, bw = 210, bh = 28;
      const ncy   = by + bh / 2;
      const fillW = pct * bw;
      // Gasket left edge (face touching liquid) aligns with the dose mark.
      // The gasket extends rightward from there, which is anatomically correct.
      const gaskL = Math.max(bx + 2, bx + fillW);
      const gaskR = gaskL + 10;

      return (
        <svg viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
          <defs>
            <clipPath id={`${uid}c`}>
              <rect x={bx} y={by} width={bw} height={bh} />
            </clipPath>
            <linearGradient id={`${uid}f`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor={color} stopOpacity="0.14" />
              <stop offset="50%"  stopColor={color} stopOpacity="0.34" />
              <stop offset="100%" stopColor={color} stopOpacity="0.22" />
            </linearGradient>
          </defs>

          {/* ── Needle: top edge longer than bottom — classic bevel tip ── */}
          <line x1={12} y1={ncy - 1.4} x2={70} y2={ncy - 1.4}
                stroke="#b8b8c8" strokeWidth="1.8" strokeLinecap="square" />
          <line x1={28} y1={ncy + 1.4} x2={70} y2={ncy + 1.4}
                stroke="#a8a8b8" strokeWidth="1.2" strokeLinecap="square" />
          <line x1={12} y1={ncy - 1.4} x2={28} y2={ncy + 1.4}
                stroke="#9898a8" strokeWidth="0.9" />

          {/* ── Hub (needle-to-barrel connector) ── */}
          <rect x={62} y={ncy - 9} width={13} height={18} rx={2}
                fill="#c4c4d6" stroke="#acacc0" strokeWidth="0.7" />
          <line x1={66} y1={ncy - 9} x2={66} y2={ncy + 9} stroke="rgba(255,255,255,.5)" strokeWidth="1" />
          <line x1={70} y1={ncy - 9} x2={70} y2={ncy + 9} stroke="rgba(255,255,255,.35)" strokeWidth="1" />

          {/* ── Left barrel flange ── */}
          <rect x={bx - 5} y={by - 5} width={7} height={bh + 10} rx={3}
                fill="#cacada" stroke="#b8b8ca" strokeWidth="0.5" />

          {/* ── Barrel background ── */}
          <rect x={bx} y={by} width={bw} height={bh} fill="#eeeefb" />

          {/* Liquid fill — full inner height ── */}
          {fillW > 0 && (
            <rect x={bx} y={by} width={fillW} height={bh}
                  fill={`url(#${uid}f)`} clipPath={`url(#${uid}c)`} />
          )}

          {/* Subtle sheen at very top only */}
          <rect x={bx} y={by} width={bw} height={4}
                fill="rgba(255,255,255,.58)" clipPath={`url(#${uid}c)`} />

          {/* ── Tick marks from top edge down ── */}
          {Array.from({ length: syringeMax / 5 + 1 }, (_, i) => i * 5).map(u => {
            const tx  = bx + (u / syringeMax) * bw;
            const big = u % (syringeMax / 3 < 10 ? 10 : 20) === 0, med = u % 10 === 0;
            const h   = big ? 12 : med ? 8 : 5;
            return (
              <line key={u} x1={tx} y1={by} x2={tx} y2={by + h}
                    stroke={u / syringeMax < pct ? 'rgba(255,255,255,.78)' : '#9898b2'}
                    strokeWidth={big ? 1.4 : med ? 1.0 : 0.65} />
            );
          })}

          {/* ── Number labels above barrel ── */}
          {Array.from({ length: syringeMax / 10 }, (_, i) => (i + 1) * 10).map(u => (
            <text key={u} x={bx + (u / syringeMax) * bw} y={by - 4}
                  textAnchor="middle" fontSize={7.5} fill="#9090a8">{u}</text>
          ))}

          {/* Barrel border */}
          <rect x={bx} y={by} width={bw} height={bh}
                fill="none" stroke="#b0b0c6" strokeWidth="1" />

          {/* ── Right barrel flange ── */}
          <rect x={bx + bw - 2} y={by - 5} width={7} height={bh + 10} rx={3}
                fill="#cacada" stroke="#b8b8ca" strokeWidth="0.5" />

          {/* ── Gasket (rubber stopper — spans full inner height) ── */}
          <rect x={gaskL} y={by + 1} width={10} height={bh - 2} rx={2.5}
                fill="#262636" />
          <rect x={gaskL} y={by + 1} width={3.5} height={bh - 2} rx={1.5}
                fill="#40404e" />
          <line x1={gaskL + 1.8} y1={by + 5} x2={gaskL + 1.8} y2={by + bh - 5}
                stroke="rgba(255,255,255,.18)" strokeWidth="1.5" strokeLinecap="round" />

          {/* ── Plunger rod ── */}
          <rect x={gaskR + 1} y={ncy - 2.5}
                width={Math.max(0, bx + bw + 12 - (gaskR + 1))} height={5}
                rx={2.5} fill="#b8b8cc" />

          {/* ── Thumb rest: flat plate ── */}
          <rect x={bx + bw + 14} y={by - 5} width={5} height={bh + 10} rx={2.5}
                fill="#9090a6" />

          {/* ── Dose callout below barrel ── */}
          {doseMg > 0 && (() => {
            const cx = Math.min(Math.max(bx + fillW / 2, bx + 20), bx + bw - 20);
            return (
              <>
                <text x={cx} y={by + bh + 18}
                      textAnchor="middle" fontSize={11.5} fontWeight="700" fill={color}>
                  {units} units
                </text>
                <text x={cx} y={by + bh + 30}
                      textAnchor="middle" fontSize={8.5} fill={color} opacity={0.7}>
                  {ml} mL
                </text>
              </>
            );
          })()}
        </svg>
      );
    }

            {/* Result */}

    /* ─── Injection Schedule Modal ───────────────────────────────────────────── */
    const SCHED_DAYS     = ['Su','Mo','Tu','We','Th','Fr','Sa'];
    const SCHED_DAYS_LNG = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function InjScheduleModal({ schedule, onSave, onClose, isAdmin }) {
      const [draft, setDraft] = useState(() => [...(schedule ?? [])].sort((a,b) => a.day - b.day));

      const toggleDay = (i) => {
        if (!isAdmin) return;
        const has = draft.find(s => s.day === i);
        setDraft(has
          ? draft.filter(s => s.day !== i)
          : [...draft, { day: i, ampm: 'am' }].sort((a, b) => a.day - b.day));
      };
      const toggleAmPm = (i) => {
        if (!isAdmin) return;
        setDraft(draft.map(s => s.day === i ? { ...s, ampm: s.ampm === 'am' ? 'pm' : 'am' } : s));
      };

      const sorted  = [...draft].sort((a, b) => a.day - b.day);
      const changed = JSON.stringify(sorted) !== JSON.stringify([...(schedule ?? [])].sort((a,b) => a.day - b.day));

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.45)',
                      zIndex: 1000, display: 'flex', alignItems: 'center',
                      justifyContent: 'center', padding: 16 }}
             onClick={onClose}>
          <div style={{ background: '#fff', borderRadius: 22, padding: '22px 20px 24px',
                        width: '100%', maxWidth: 380, boxShadow: '0 24px 64px rgba(0,0,0,.28)' }}
               onClick={e => e.stopPropagation()}>

            <div style={{ display: 'flex', justifyContent: 'space-between',
                          alignItems: 'center', marginBottom: 20 }}>
              <div style={{ fontSize: 18, fontWeight: 700, color: '#1c1c1e' }}>Injection Schedule</div>
              <button onClick={onClose}
                      style={{ fontSize: 18, color: '#8e8e93', background: '#f2f2f7',
                               border: 'none', cursor: 'pointer', borderRadius: 50,
                               width: 32, height: 32, display: 'flex', alignItems: 'center',
                               justifyContent: 'center' }}>✕</button>
            </div>

            {/* Day picker */}
            <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93',
                          textTransform: 'uppercase', letterSpacing: .5, marginBottom: 8 }}>
              Injection days
            </div>
            <div style={{ display: 'flex', gap: 4, marginBottom: 16 }}>
              {SCHED_DAYS.map((d, i) => {
                const sel = !!draft.find(s => s.day === i);
                return (
                  <button key={i} onClick={() => toggleDay(i)}
                          style={{ flex: 1, padding: '8px 0', borderRadius: 10,
                                   fontSize: 13, fontWeight: 600,
                                   background: sel ? '#4a90d9' : '#f2f2f7',
                                   color: sel ? '#fff' : '#8e8e93',
                                   border: 'none', cursor: isAdmin ? 'pointer' : 'default' }}>
                    {d}
                  </button>
                );
              })}
            </div>

            {/* AM/PM per selected day */}
            {sorted.length > 0 ? (
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 20 }}>
                {sorted.map(s => (
                  <div key={s.day} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: '#3c3c43' }}>
                      {SCHED_DAYS_LNG[s.day]}
                    </span>
                    <button onClick={() => toggleAmPm(s.day)}
                            style={{ fontSize: 12, fontWeight: 600, padding: '5px 12px',
                                     borderRadius: 10, background: '#f2f2f7', color: '#3c3c43',
                                     border: 'none', cursor: isAdmin ? 'pointer' : 'default' }}>
                      {s.ampm === 'am' ? 'Morning' : 'Evening'}
                    </button>
                  </div>
                ))}
              </div>
            ) : (
              <div style={{ fontSize: 13, color: '#aeaeb2', marginBottom: 20 }}>
                {isAdmin ? 'Tap days above to set your injection days.' : 'No schedule configured.'}
              </div>
            )}

            {!isAdmin && (
              <div style={{ fontSize: 12, color: '#aeaeb2', marginBottom: 16 }}>
                Log in to edit the schedule.
              </div>
            )}

            <div style={{ display: 'flex', gap: 8 }}>
              {isAdmin && changed && (
                <button onClick={() => { onSave(sorted); onClose(); }}
                        style={{ flex: 1, fontSize: 15, fontWeight: 600, padding: '12px',
                                 borderRadius: 12, background: '#4a90d9', color: '#fff',
                                 border: 'none', cursor: 'pointer' }}>
                  Save
                </button>
              )}
              <button onClick={onClose}
                      style={{ flex: 1, fontSize: 15, fontWeight: 600, padding: '12px',
                               borderRadius: 12, background: '#f2f2f7', color: '#3c3c43',
                               border: 'none', cursor: 'pointer' }}>
                {isAdmin && changed ? 'Cancel' : 'Done'}
              </button>
            </div>
          </div>
        </div>
      );
    }

      const [error,      setError]      = useState('');

      const [showInj,    setShowInj]    = useState(false);
      const [injDate,    setInjDate]    = useState(today);
      const [injDose,    setInjDose]    = useState('');
      // Export folder auto-import
      const [exportDir,  setExportDir]  = useState(null);   // FileSystemDirectoryHandle
      const [autoMsg,    setAutoMsg]    = useState('');      // transient status line
      const [needsPerm,  setNeedsPerm]  = useState(false);  // permission lapsed
      const [gistOk,  setGistOk]  = useState(false);
      const [gistMsg, setGistMsg] = useState('');
      const [isAdmin, setIsAdmin] = useState(() => !!localStorage.getItem(LS_GIST_PAT_KEY));
      const [loading, setLoading] = useState(true);
      const [intervalsCfg, setIntervalsCfg] = useState(() => {
        try { return JSON.parse(localStorage.getItem(LS_INTERVALS_KEY) || 'null'); } catch (_) { return null; }
      });
      // Seeded from the last successful sync so the chart never paints with a
      // blank "0 burned" flash while the fresh fetch below is in flight.
      const [intervalsCalories, setIntervalsCalories] = useState(() => {
        try { return JSON.parse(localStorage.getItem(LS_INTERVALS_CAL_KEY) || '{}'); } catch (_) { return {}; }
      });
      const [intervalRides, setIntervalRides] = useState(() => {
        try { return JSON.parse(localStorage.getItem(LS_INTERVALS_RIDES_KEY) || '{}'); } catch (_) { return {}; }
      });
      const [intervalsMsg,      setIntervalsMsg]      = useState('');
      const inputRef  = useRef();
      const msgTimer  = useRef();

      const showMsg = (msg, ms = 4000) => {
        setAutoMsg(msg);
        clearTimeout(msgTimer.current);
        msgTimer.current = setTimeout(() => setAutoMsg(''), ms);
      };

      // Always reads PAT from localStorage so closures don't go stale.
      // newCalories defaults to closure state but callers that just updated
      // calories synchronously (e.g. applyResult) should pass the fresh value.
      const writeToGist = async (newRows, newMeta, newInj, newCalories = calories) => {
        const pat = localStorage.getItem(LS_GIST_PAT_KEY);
        if (!pat) return;
        let icuCfg = null;
        try { icuCfg = JSON.parse(localStorage.getItem(LS_INTERVALS_KEY) || 'null'); } catch (_) {}
        try {
          await patchGist(GIST_ID, pat, newRows, newMeta, newInj, injSchedule, newCalories, icuCfg);
          setGistOk(true); setGistMsg('');
        } catch (e) {
          setGistOk(false); setGistMsg(e.message);
          console.warn('[Gist] write failed:', e.message);
        }
      };

      // On mount: always load from Gist (no PAT needed for reads)
      useEffect(() => {
        const pat = localStorage.getItem(LS_GIST_PAT_KEY);
        (async () => {
          try {
            const result = await fetchGist(GIST_ID, pat || undefined);
            if (result === null) {
              setGistOk(!!pat);
            } else {
              const { logbook, meta: m, injections: inj, injSchedule: sched, calories: gistCals, intervalsCfg: gistIcuCfg } = result;
              if (sched) { setInjSchedule(sched); lsSaveSchedule(sched); }
              if (pat) {
                // Admin: merge gist with local, gist wins
                const gistMap = Object.fromEntries(logbook.map(r => [r.date, r.wKg]));
                const merged  = { ...lsLoadRaw(), ...gistMap };
                const daily   = Object.entries(merged)
                  .map(([date, wKg]) => ({ date, wKg }))
                  .sort((a, b) => b.date.localeCompare(a.date));
                const newLogbook = daily.length ? computeLogbook(daily) : logbook;
                setRows(newLogbook); setMeta(m); setInjections(inj);
                lsSave(newLogbook, m); lsSaveInjections(inj);
                if (gistCals && gistCals.length) setCalories(mergeCaloriesWithStored(gistCals));
                // Restore intervals config on new/reset device
                if (gistIcuCfg && !localStorage.getItem(LS_INTERVALS_KEY)) {
                  localStorage.setItem(LS_INTERVALS_KEY, JSON.stringify(gistIcuCfg));
                  setIntervalsCfg(gistIcuCfg);
                }
              } else {
                // View-only: show gist data directly
                setRows(logbook); setMeta(m); setInjections(inj);
                if (gistCals) setCalories(gistCals);
                // Use intervals config from gist so anyone can see ride data
                if (gistIcuCfg) setIntervalsCfg(prev => prev ?? gistIcuCfg);
              }
              setGistOk(!!pat);
            }
          } catch (e) {
            setGistOk(false); setGistMsg(e.message);
          } finally {
            setLoading(false);
          }
        })();
      }, []);

      // Save PAT and reconnect (admin already logged in, reconfiguring token)
      const saveGistConfig = useCallback(async (rawPat) => {
        const pat = rawPat.trim();
        localStorage.setItem(LS_GIST_PAT_KEY, pat);
        setGistMsg('Connecting…');
        try {
          const result = await fetchGist(GIST_ID, pat);
          if (result === null) {
            await patchGist(GIST_ID, pat, rows, meta, injections, injSchedule, calories);
            setGistOk(true); setGistMsg('');
            showMsg('Gist initialized ✓');
          } else {
            const { logbook, meta: m, injections: inj, injSchedule: sched, calories: gistCals, intervalsCfg: gistIcuCfg } = result;
            setRows(logbook); setMeta(m); setInjections(inj);
            if (sched) { setInjSchedule(sched); lsSaveSchedule(sched); }
            lsSave(logbook, m); lsSaveInjections(inj);
            if (gistCals && gistCals.length) setCalories(mergeCaloriesWithStored(gistCals));
            if (gistIcuCfg && !localStorage.getItem(LS_INTERVALS_KEY)) {
              localStorage.setItem(LS_INTERVALS_KEY, JSON.stringify(gistIcuCfg));
              setIntervalsCfg(gistIcuCfg);
            }
            setGistOk(true); setGistMsg('');
            showMsg('Gist connected ✓');
          }
        } catch (e) {
          setGistOk(false); setGistMsg(e.message);
        }
      }, [rows, meta, injections, injSchedule, calories]);

      // Admin login (view-only user entering PAT)
      const adminLogin = useCallback(async (rawPat, setMsg) => {
        const pat = rawPat.trim();
        setMsg('Verifying…');
        try {
          const result = await fetchGist(GIST_ID, pat);
          localStorage.setItem(LS_GIST_PAT_KEY, pat);
          setIsAdmin(true); setGistOk(true); setGistMsg('');
          if (result !== null) {
            const { logbook, meta: m, injections: inj, injSchedule: sched, calories: gistCals, intervalsCfg: gistIcuCfg } = result;
            setRows(logbook); setMeta(m); setInjections(inj);
            if (sched) setInjSchedule(sched);
            lsSave(logbook, m); lsSaveInjections(inj);
            if (gistCals && gistCals.length) setCalories(mergeCaloriesWithStored(gistCals));
            if (gistIcuCfg && !localStorage.getItem(LS_INTERVALS_KEY)) {
              localStorage.setItem(LS_INTERVALS_KEY, JSON.stringify(gistIcuCfg));
              setIntervalsCfg(gistIcuCfg);
            }
          }
          setMsg('');
        } catch (e) { setMsg(e.message); }
      }, []);

      const saveInjSchedule = useCallback(async (newSched) => {
        setInjSchedule(newSched);
        lsSaveSchedule(newSched);
        const pat = localStorage.getItem(LS_GIST_PAT_KEY);
        if (!pat) return;
        try {
          await patchGist(GIST_ID, pat, rows, meta, injections, newSched, calories);
          setGistOk(true); setGistMsg('');
        } catch (e) { setGistOk(false); setGistMsg(e.message); }
      }, [rows, meta, injections, calories, videos]);

      // Admin logout
      const adminLogout = useCallback(() => {
        localStorage.removeItem(LS_GIST_PAT_KEY);
        setIsAdmin(false); setGistOk(false); setGistMsg('');
      }, []);

      // Apply processed result to state + localStorage + Gist
      const applyResult = useCallback(({ logbook, meta: newMeta, injSchedule: newSched, calorieData: newCals }) => {
        setRows(logbook);
        setMeta(newMeta);
        if (newSched) { setInjSchedule(newSched); lsSaveSchedule(newSched); }
        const mergedCalories = (newCals && newCals.length > 0) ? mergeCaloriesWithStored(newCals) : calories;
        if (newCals && newCals.length > 0) setCalories(mergedCalories);
        setError('');
        lsSave(logbook, newMeta);
        writeToGist(logbook, newMeta, injections, mergedCalories);
      }, [injections, calories]);

      // Daily chart data with Active Energy replaced by intervals.icu ride calories
      // (0 on non-ride days) once connected — matches MFP's net-calorie definition.
      const calorieDataForChart = useMemo(() => {
        if (!intervalsCfg) return calories;
        return calories.map(d => ({ ...d, ActiveEnergy: intervalsCalories[d.date] ?? 0 }));
      }, [calories, intervalsCfg, intervalsCalories]);

      // Fetch ride calories from intervals.icu and merge into intervalsCalories map.
      // Reads config fresh from localStorage (mirrors writeToGist) so callers don't
      // need intervalsCfg in their dependency array. Once a cache exists, only the
      // last REFRESH_WINDOW_DAYS are re-fetched (older rides don't change) instead
      // of re-pulling the entire history every sync.
      const REFRESH_WINDOW_DAYS = 14;
      const refreshIntervals = useCallback(async (calRows) => {
        let cfg;
        try { cfg = JSON.parse(localStorage.getItem(LS_INTERVALS_KEY) || 'null'); } catch (_) { cfg = null; }
        if (!cfg?.apiKey || !cfg?.athleteId) return;
        const rows = (calRows && calRows.length > 0) ? calRows : calories;
        if (!rows.length) return;
        // Rides cache is checked separately — it was added later than calorie cache,
        // so existing calorie history doesn't imply rides history exists.
        const hasCalCache   = Object.keys(intervalsCalories).length > 0;
        const hasRidesCache = Object.keys(intervalRides).length > 0;
        const hasCache = hasCalCache && hasRidesCache;
        const earliest = [...rows].map(d => d.date).sort()[0];
        const recentCutoff = msToLocalDate(Date.now() - REFRESH_WINDOW_DAYS * 86400000);
        const oldest = hasCache ? recentCutoff : earliest;
        const newest = msToLocalDate(Date.now());
        setIntervalsMsg('Syncing…');
        try {
          const { calMap, ridesMap } = await fetchIntervalsCalories(cfg.apiKey, cfg.athleteId, oldest, newest);
          const mergedCal   = { ...intervalsCalories, ...calMap };
          const mergedRides = { ...intervalRides,     ...ridesMap };
          setIntervalsCalories(mergedCal);
          setIntervalRides(mergedRides);
          try { localStorage.setItem(LS_INTERVALS_CAL_KEY,   JSON.stringify(mergedCal));   } catch (_) {}
          try { localStorage.setItem(LS_INTERVALS_RIDES_KEY, JSON.stringify(mergedRides)); } catch (_) {}
          setIntervalsMsg('');
        } catch (e) {
          setIntervalsMsg(e.message);
        }
      }, [calories, intervalsCalories, intervalRides]);

      // Clears only the rides cache then forces a full re-fetch from the beginning
      // of the weight data — useful when an activity was updated on intervals.icu
      // (e.g. a recovered/re-uploaded file) and the stale cached values need refreshing.
      const resyncRides = useCallback(() => {
        localStorage.removeItem(LS_INTERVALS_RIDES_KEY);
        setIntervalRides({});
        setIntervalsMsg('Re-syncing rides…');
        setTimeout(() => refreshIntervals(), 50); // let state flush first
      }, [refreshIntervals]);

      const saveIntervalsConfig = useCallback((apiKey, athleteId) => {
        const cfg = { apiKey, athleteId };
        localStorage.setItem(LS_INTERVALS_KEY, JSON.stringify(cfg));
        setIntervalsCfg(cfg);
        // Persist to gist so any viewer (phone, other device) gets ride data
        (async () => {
          const pat = localStorage.getItem(LS_GIST_PAT_KEY);
          if (pat) {
            try { await patchGist(GIST_ID, pat, rows, meta, injections, injSchedule, calories, cfg); } catch (_) {}
          }
        })();
        refreshIntervals();
      }, [refreshIntervals, rows, meta, injections, injSchedule, calories]);

      const disconnectIntervals = useCallback(() => {
        localStorage.removeItem(LS_INTERVALS_KEY);
        localStorage.removeItem(LS_INTERVALS_CAL_KEY);
        localStorage.removeItem(LS_INTERVALS_RIDES_KEY);
        setIntervalsCfg(null);
        setIntervalsCalories({});
        setIntervalRides({});
        setIntervalsMsg('');
      }, []);

      // Auto-import: scan export folder for newest matching CSV
      const runAutoImport = useCallback(async (dirHandle, { silent = false } = {}) => {
        try {
          const perm = await dirHandle.queryPermission({ mode: 'read' });
          if (perm !== 'granted') {
            const req = await dirHandle.requestPermission({ mode: 'read' });
            if (req !== 'granted') { setNeedsPerm(true); return; }
          }
          setNeedsPerm(false);
          const latest = await findLatestExport(dirHandle);
          if (!latest) { if (!silent) showMsg('No export files found in that folder.'); return; }
          const lastLoaded = localStorage.getItem(LS_LAST_CSV_KEY);
          console.log(`[Weight Tracker] Last loaded: ${lastLoaded ?? '(none)'}`);
          const isNewFile = latest.name !== lastLoaded;
          if (latest.name === lastLoaded && calories.length > 0) {
            console.log('[Weight Tracker] Already up to date — skipping import.');
            refreshIntervals();
            if (!silent) showMsg('Already up to date — no new export found.');
            return;
          }
          console.log(`[Weight Tracker] ${isNewFile ? 'Importing' : 'Re-processing'}: ${latest.name}`);
          const text = await readFileWithRetry(latest.handle, {
            onWaiting: attempt => showMsg(`Downloading from iCloud… (attempt ${attempt})`, 10000),
          });
          const result = processCSVText(text);
          applyResult(result);
          refreshIntervals(result.calorieData);
          localStorage.setItem(LS_LAST_CSV_KEY, latest.name);
          console.log(`[Weight Tracker] Import complete.`);
          if (!silent) showMsg(`${isNewFile ? 'Updated' : 'Calorie data refreshed'} from ${latest.name.replace('Automation_Daily_export_', '').replace('HealthExport_', '').replace('.csv', '')}`);
        } catch (ex) {
          if (!silent) setError('Auto-import error: ' + ex.message);
        }
      }, [applyResult, calories.length, refreshIntervals]);

      // On mount: restore dir handle and silently try auto-import
      useEffect(() => {
        (async () => {
          try {
            const handle = await idbGet('export-dir');
            if (!handle) return;
            setExportDir(handle);
            const perm = await handle.queryPermission({ mode: 'read' });
            if (perm === 'granted') {
              await runAutoImport(handle, { silent: true });
            } else {
              setNeedsPerm(true);
            }
          } catch (_) {}
        })();
        return () => clearTimeout(msgTimer.current);
      }, []);

      // Background polling while the tab is open: fast burst (20s) for 3 min
      // after load/refocus while today's export hasn't landed yet, then 5 min
      // all day; intervals.icu checked independently every 15 min. Refs avoid
      // retriggering this effect (and resetting the burst) when calories.length
      // changes runAutoImport's identity on every successful import.
      const exportDirRef       = useRef(exportDir);       exportDirRef.current       = exportDir;
      const intervalsCfgRef    = useRef(intervalsCfg);    intervalsCfgRef.current    = intervalsCfg;
      const runAutoImportRef   = useRef(runAutoImport);   runAutoImportRef.current   = runAutoImport;
      const refreshIntervalsRef = useRef(refreshIntervals); refreshIntervalsRef.current = refreshIntervals;

      useEffect(() => {
        const FAST_MS = 20_000, FAST_WINDOW_MS = 3 * 60_000, SLOW_MS = 5 * 60_000;
        const INTERVALS_MS = 15 * 60_000;
        let csvTimer = null, intervalsTimer = null, cancelled = false;
        let burstStartedAt = Date.now();

        const scheduleCsv = () => {
          if (cancelled) return;
          const inBurst = !lastImportIsToday() && (Date.now() - burstStartedAt < FAST_WINDOW_MS);
          csvTimer = setTimeout(csvTick, inBurst ? FAST_MS : SLOW_MS);
        };
        const csvTick = async () => {
          if (cancelled) return;
          if (!document.hidden && exportDirRef.current) {
            try { await runAutoImportRef.current(exportDirRef.current, { silent: true }); }
            catch (_) {}
          }
          scheduleCsv();
        };

        const scheduleIntervals = () => {
          if (cancelled) return;
          intervalsTimer = setTimeout(intervalsTick, INTERVALS_MS);
        };
        const intervalsTick = async () => {
          if (cancelled) return;
          if (!document.hidden && intervalsCfgRef.current) {
            try { await refreshIntervalsRef.current(); } catch (_) {}
          }
          scheduleIntervals();
        };

        const onVisible = () => {
          if (document.hidden) return;
          burstStartedAt = Date.now(); // resume fast burst on refocus
          clearTimeout(csvTimer); csvTick();
          clearTimeout(intervalsTimer); intervalsTick();
        };
        document.addEventListener('visibilitychange', onVisible);

        // CSV: don't fire blind here — exportDir restores async from IndexedDB in the
        // other mount effect, so exportDirRef.current would still be null right now.
        // The restore effect itself already runs an immediate check once the handle
        // loads; we just need to arm the next one.
        scheduleCsv();
        intervalsTick();  // intervalsCfg loads sync from localStorage, safe immediately

        return () => {
          cancelled = true;
          clearTimeout(csvTimer);
          clearTimeout(intervalsTimer);
          document.removeEventListener('visibilitychange', onVisible);
        };
      }, []);

      const pickExportFolder = useCallback(async () => {
        try {
          const handle = await window.showDirectoryPicker({ mode: 'read' });
          await idbSet('export-dir', handle);
          setExportDir(handle);
          await runAutoImport(handle);
        } catch (ex) {
          if (ex.name !== 'AbortError') setError('Could not access folder: ' + ex.message);
        }
      }, [runAutoImport]);

      const loadCSV = useCallback((file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            // Try JSON first
            if (file.name.endsWith('.json')) {
              const data = JSON.parse(text);
              if (data.version && data.entries) {
                // This is our export format
                const daily = (data.entries ?? [])
                  .filter(e => e.date && e.wKg != null)
                  .sort((a, b) => b.date.localeCompare(a.date));
                const logbook = daily.length ? computeLogbook(daily) : [];
                if (data.vialConc) {
                  try { localStorage.setItem(LS_VIAL_CONC_KEY, String(data.vialConc)); } catch (_) {}
                }
                applyResult({
                  logbook,
                  meta: data.meta ?? { metric: 'Weight', source: '' },
                  injSchedule: data.injSchedule,
                });
              } else {
                throw new Error('Invalid JSON format');
              }
            } else {
              applyResult(processCSVText(text));
            }
          } catch (ex) { setError(ex.message); }
        };
        reader.readAsText(file);
      }, [applyResult]);

      const addInjection = useCallback(() => {
        const dose = parseFloat(injDose);
        if (!injDate || isNaN(dose) || dose <= 0) return;
        const next = [...injections.filter(i => i.date !== injDate), { date: injDate, doseMg: dose }]
          .sort((a, b) => b.date.localeCompare(a.date));
        setInjections(next);
        lsSaveInjections(next);
        writeToGist(rows, meta, next);
        setInjDose('');
        setInjDate(today());
        setShowInj(false);
      }, [injections, injDate, injDose, rows, meta]);

      const deleteInjection = useCallback((date) => {
        const next = injections.filter(i => i.date !== date);
        setInjections(next);
        lsSaveInjections(next);
        writeToGist(rows, meta, next);
      }, [injections, rows, meta]);

      // Load body scan videos from the body-scans/ folder in the repo.
      // Filename drives everything — no form, no Gist storage needed.
      useEffect(() => {
        fetchBodyScans().then(scans => { if (scans.length) setVideos(scans); });
      }, []);

      const deleteRow = useCallback((date) => {
        const daily = rows.filter(r => r.date !== date).map(r => ({ date: r.date, wKg: r.wKg }));
        const newLogbook = computeLogbook(daily);
        setRows(newLogbook);
        lsSave(newLogbook, meta);
        writeToGist(newLogbook, meta, injections);
      }, [rows, meta, injections]);

      const exportJSON = useCallback(() => {
        const vialConc = localStorage.getItem(LS_VIAL_CONC_KEY);
        const payload = JSON.stringify({
          version: 1, savedAt: new Date().toISOString(), meta,
          injSchedule,
          vialConc: vialConc ? parseFloat(vialConc) : 12.5,
          injections: injections.map(({ date, doseMg }) => ({ date, doseMg })),
          entries: rows.map(r => ({ date: r.date, wKg: r.wKg })),
        }, null, 2);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
        a.download = 'weight-data.json';
        a.click();
      }, [rows, meta, injections]);

      const onInput = useCallback(e => loadCSV(e.target.files[0]), [loadCSV]);
      const onDrop  = useCallback(e => { e.preventDefault(); setDragging(false); loadCSV(e.dataTransfer.files[0]); }, [loadCSV]);

      const hasFSA = typeof window.showDirectoryPicker === 'function';
      const items       = buildItems(rows, injections);
      const baselineLbs = rows.length ? rows[rows.length - 1].lbs : null;

      return (
        <div style={{ minHeight: '100vh', background: '#f2f2f7' }}>

          {playingVideo && <VideoPlayerModal video={playingVideo} onClose={() => setPlayingVideo(null)} />}

          {/* ── Nav ── */}
          <div style={{ position: 'sticky', top: 0, zIndex: 20,
                        background: 'rgba(242,242,247,.94)',
                        backdropFilter: 'saturate(180%) blur(20px)',
                        WebkitBackdropFilter: 'saturate(180%) blur(20px)',
                        borderBottom: '.5px solid rgba(0,0,0,.12)' }}>
            <div style={{ padding: '12px 16px 10px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: -.3, color: '#1c1c1e' }}>Weight Tracker</div>
                <div style={{ fontSize: 13, color: '#8e8e93', marginTop: 1, minHeight: 14 }}>
                  {autoMsg ? (
                    <span style={{ color: '#34c759' }}>{autoMsg}</span>
                  ) : meta && rows.length > 0 ? (
                    <>
                      {rows.length} days logged · {fmtShort(rows[rows.length - 1].date)} – {fmtShort(rows[0].date)}
                    </>
                  ) : null}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                {isAdmin && needsPerm && exportDir && (
                  <button onClick={() => runAutoImport(exportDir)}
                          style={{ fontSize: 14, fontWeight: 600, padding: '5px 12px', borderRadius: 10,
                                   background: '#ff9500', color: '#fff', border: 'none', cursor: 'pointer' }}>
                    Check for new export
                  </button>
                )}
                {isAdmin && rows.length > 0 && (
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={() => inputRef.current?.click()}
                            style={{ fontSize: 15, fontWeight: 600, padding: '6px 14px', borderRadius: 10,
                                     background: '#e5e5ea', color: '#1c1c1e', border: 'none', cursor: 'pointer' }}>
                      Import
                    </button>
                    <button onClick={exportJSON}
                            style={{ fontSize: 15, fontWeight: 600, padding: '6px 14px', borderRadius: 10,
                                     background: '#e5e5ea', color: '#1c1c1e', border: 'none', cursor: 'pointer' }}>
                      Export
                    </button>
                  </div>
                )}
              </div>
              <input ref={inputRef} type="file" accept=".csv,.txt,.json" style={{ display: 'none' }} onChange={onInput} />
            </div>
            {/* Tab pills — part of the sticky header so they never scroll away */}
            {!loading && rows.length > 0 && (
              <div style={{ display:'flex', gap:6, padding:'0 12px 8px',
                            overflowX:'auto', WebkitOverflowScrolling:'touch' }}>
                {[['weight','Weight'],['tirz','Tirzepatide'],['dosing','Dosing'],['activity','Activity']].map(([id,label]) => (
                  <button key={id} onClick={() => setActiveTab(id)}
                          style={{ flexShrink:0, fontSize:13, fontWeight:600, padding:'6px 18px',
                                   borderRadius:20, border:'none', cursor:'pointer', whiteSpace:'nowrap',
                                   background: activeTab===id ? '#4a90d9' : '#e5e5ea',
                                   color:      activeTab===id ? '#fff' : '#3c3c43' }}>
                    {label}
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* ── Loading ── */}
          {loading && (
            <div style={{ padding: '60px 16px', textAlign: 'center', color: '#aeaeb2', fontSize: 15 }}>
              Loading…
            </div>
          )}

          {/* ── Upload / landing (admin only) ── */}
          {!loading && rows.length === 0 && isAdmin && (
            <div style={{ padding: '16px 16px 24px' }}>

              {/* Auto-import prompt if folder set but needs permission */}
              {needsPerm && exportDir && (
                <button onClick={() => runAutoImport(exportDir)}
                        style={{ marginBottom: 10, width: '100%', borderRadius: 14,
                                 background: '#4a90d9', border: 'none', padding: '14px 16px',
                                 display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                                 cursor: 'pointer', textAlign: 'left' }}>
                  <div>
                    <div style={{ fontSize: 16, fontWeight: 600, color: '#fff' }}>Load latest export</div>
                    <div style={{ fontSize: 14, color: 'rgba(255,255,255,.75)', marginTop: 2 }}>
                      Check {exportDir.name} for Automation_Daily_export_*.csv
                    </div>
                  </div>
                  <div style={{ fontSize: 18, color: 'rgba(255,255,255,.8)' }}>›</div>
                </button>
              )}

              <div style={{ borderRadius: 18, padding: '32px 24px', textAlign: 'center',
                            background: dragging ? '#e6f9ef' : '#fff',
                            border: `2px dashed ${dragging ? '#34c759' : '#d1d1d6'}`,
                            transition: 'all .15s' }}
                   onDragOver={e => { e.preventDefault(); setDragging(true); }}
                   onDragLeave={() => setDragging(false)}
                   onDrop={onDrop}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>⚖️</div>
                <div style={{ fontSize: 17, fontWeight: 600, color: '#1c1c1e', marginBottom: 6 }}>
                  Upload Apple Health Export
                </div>
                <div style={{ fontSize: 16, color: '#8e8e93', marginBottom: 20, lineHeight: 1.5 }}>
                  Drop your <code style={{ fontSize: 14, background: '#f2f2f7', padding: '1px 5px', borderRadius: 4 }}>Automation_Daily_export_...</code> CSV here,<br />
                  or tap below to browse.
                </div>
                <label style={{ cursor: 'pointer' }}>
                  <input type="file" accept=".csv,.txt,.json" style={{ display: 'none' }} onChange={onInput} />
                  <span style={{ display: 'inline-block', background: '#34c759', color: '#fff',
                                 fontWeight: 600, fontSize: 15, padding: '12px 28px', borderRadius: 50 }}>
                    Choose File
                  </span>
                </label>
              </div>

              <GistPanel gistOk={gistOk} gistMsg={gistMsg} onSave={saveGistConfig} onLogout={adminLogout} style={{ marginTop: 10 }} />
              <IntervalsPanel connected={!!intervalsCfg} msg={intervalsMsg} onSave={saveIntervalsConfig} onRefresh={refreshIntervals} onResync={resyncRides} onDisconnect={disconnectIntervals} style={{ marginTop: 10 }} />

              {/* Set export folder */}
              {hasFSA && (
                <button onClick={exportDir ? () => runAutoImport(exportDir) : pickExportFolder}
                        style={{ marginTop: 10, width: '100%', borderRadius: 14, background: '#fff',
                                 border: '.5px solid #d1d1d6', padding: '14px 16px',
                                 display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                                 cursor: 'pointer', textAlign: 'left' }}>
                  <div>
                    <div style={{ fontSize: 16, fontWeight: 600, color: '#1c1c1e' }}>
                      {exportDir ? `Auto-import from ${exportDir.name}` : 'Set export folder'}
                    </div>
                    <div style={{ fontSize: 14, color: '#8e8e93', marginTop: 2 }}>
                      {exportDir
                        ? 'Tap to check for a newer Automation_Daily_export_*.csv'
                        : 'Point to your iCloud export folder to auto-load on every open'}
                    </div>
                  </div>
                  <div style={{ fontSize: 18, color: '#8e8e93' }}>›</div>
                </button>
              )}

              {error && <ErrBox msg={error} />}
            </div>
          )}

          {/* ── Logbook ── */}
          {!loading && rows.length > 0 && (
            <div>

              <div style={{ padding:'12px 12px 32px' }}>

              {/* ── TIRZEPATIDE TAB ── */}
              <div style={{ display: activeTab==='tirz' ? undefined : 'none' }}>
                <div style={{ borderRadius: 18, background: '#fff', border: '.5px solid rgba(0,0,0,.08)',
                              marginBottom: 10, overflow: 'hidden' }}>
                  <div style={{ padding: '10px 14px 6px', borderBottom: '.5px solid rgba(0,0,0,.06)',
                                display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: '#4a90d9',
                                  textTransform: 'uppercase', letterSpacing: .6 }}>
                      Tirzepatide · Drug on Board
                    </div>
                    <div style={{ fontSize: 12, color: '#aeaeb2' }}>t½ = 5 d · tpeak = 36 h</div>
                  </div>
                  <PkChart injections={injections} rows={rows} isAdmin={isAdmin}
                           injSchedule={injSchedule} onSaveSchedule={saveInjSchedule} />
                </div>
              </div>

              {/* ── WEIGHT TAB ── */}
              <div style={{ display: activeTab==='weight' ? undefined : 'none' }}>
              {/* Weight Trend Chart */}
              <div style={{ borderRadius: 18, overflow: 'hidden', background: '#fff',
                            border: '.5px solid rgba(0,0,0,.08)', marginBottom: 10 }}>
                <div style={{ padding: '10px 14px 6px', borderBottom: '.5px solid rgba(0,0,0,.06)',
                              display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: '#1c1c1e' }}>Weight Trend</div>
                  <div style={{ fontSize: 12, color: '#aeaeb2' }}>goal: {GOAL_LBS} lbs</div>
                </div>
                <WeightChart rows={rows} injections={injections}
                             videos={videos} onPlayVideo={setPlayingVideo} />
              </div>

              {/* Weight Loss Per Dose */}
              {injections.length >= 2 && (
                <div style={{ borderRadius:18, overflow:'hidden', background:'#fff',
                              border:'.5px solid rgba(0,0,0,.08)', marginBottom:10 }}>
                  <div style={{ padding:'10px 14px 4px', borderBottom:'.5px solid rgba(0,0,0,.06)' }}>
                    <div style={{ fontSize:13, fontWeight:700, color:'#1c1c1e' }}>Weight Loss per Dose</div>
                    <div style={{ fontSize:10, color:'#8e8e93', marginTop:2 }}>
                      lbs lost during each dose period
                    </div>
                  </div>
                  <DoseWeightLossChart rows={rows} injections={injections} />
                </div>
              )}

              </div>{/* end weight tab inner content */}
              {/* ── ACTIVITY TAB ── */}
              <div style={{ display: activeTab==='activity' ? undefined : 'none' }}>
              {/* Calorie Chart */}
              {calories.length > 0 && (
                <div style={{ borderRadius: 18, overflow: 'hidden', background: '#fff',
                              border: '.5px solid rgba(0,0,0,.08)', marginBottom: 10 }}>
                  <div style={{ padding: '10px 14px 6px', borderBottom: '.5px solid rgba(0,0,0,.06)' }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: '#1c1c1e' }}>Daily Net Calories</div>
                  </div>
                  <div style={{ padding: '0 14px 8px' }}>
                    <CalorieChart calorieData={calorieDataForChart} />
                  </div>
                </div>
              )}

              {/* Rides Chart */}
              {Object.keys(intervalRides).length > 0 && (
                <div style={{ borderRadius: 18, overflow: 'hidden', background: '#fff',
                              border: '.5px solid rgba(0,0,0,.08)', marginBottom: 10 }}>
                  <div style={{ padding: '10px 14px 6px', borderBottom: '.5px solid rgba(0,0,0,.06)' }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: '#1c1c1e' }}>Rides</div>
                  </div>
                  <RidesChart ridesData={intervalRides} />
                </div>
              )}

              </div>{/* end activity tab */}

              {/* ── Back in weight tab: Weight Change + Logbook ── */}
              <div style={{ display: activeTab==='weight' ? undefined : 'none' }}>
              {/* Weight Change by Day of Week */}
              {rows.length >= 2 && (
                <div style={{ borderRadius:18, overflow:'hidden', background:'#fff',
                              border:'.5px solid rgba(0,0,0,.08)', marginBottom:10 }}>
                  <div style={{ padding:'10px 14px 4px', borderBottom:'.5px solid rgba(0,0,0,.06)' }}>
                    <div style={{ fontSize:13, fontWeight:700, color:'#1c1c1e' }}>Weight Change by Day</div>
                    <div style={{ fontSize:10, color:'#8e8e93', marginTop:2 }}>
                      Average daily loss/gain compared to prior day
                    </div>
                  </div>
                  <DailyWeightChart rows={rows} />
                </div>
              )}

              {/* Weight logbook */}
              <div style={{ borderRadius: 18, overflow: 'hidden', background: '#fff',
                            border: '.5px solid rgba(0,0,0,.08)' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '2fr 1.1fr 1.1fr 1.5fr 1.1fr 1fr',
                              padding: '8px 14px', background: '#f2f2f7',
                              borderBottom: '.5px solid rgba(0,0,0,.1)' }}>
                  {['DATE', "REC'D", '7D AVG', '2WK LOSS', 'BMI', '% LOST'].map((h, i) => (
                    <div key={h} style={{ fontSize: 12, fontWeight: 700, letterSpacing: .6,
                                          color: '#8e8e93', textAlign: i === 0 ? 'left' : 'right' }}>{h}</div>
                  ))}
                </div>

                <div style={{ maxHeight: 600, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
                {items.map((item, idx) => {
                  if (item.type === 'injection') {
                    const next  = items[idx + 1];
                    const isEnd = !next || next.type === 'injection';
                    return (
                      <div key={'inj-' + item.date}
                           style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 14px',
                                    background: '#f0f6ff',
                                    borderBottom: isEnd ? 'none' : '.5px solid rgba(0,0,0,.06)' }}>
                        <span style={{ fontSize: 13, color: '#4a90d9', fontWeight: 700, whiteSpace: 'nowrap' }}>
                          💉 Tirz {item.doseMg} mg
                        </span>
                        <span style={{ fontSize: 13, color: '#8eb8e8' }}>·</span>
                        <span style={{ fontSize: 13, color: '#6a9fd4' }}>{fmtShort(item.date)}</span>
                        <div style={{ flex: 1, height: '.5px', background: 'rgba(74,144,217,.2)' }} />
                        {isAdmin && (
                          <button onClick={() => deleteInjection(item.date)}
                                  style={{ fontSize: 13, color: '#aac6e8', background: 'none',
                                           border: 'none', cursor: 'pointer', padding: '0 2px' }}>✕</button>
                        )}
                      </div>
                    );
                  }

                  const { mo, day, wd } = fmtDate(item.date);
                  const rate    = rateInfo(item.rate);

                  return (
                    <div key={item.date} className="row-in"
                         style={{ display: 'grid', gridTemplateColumns: '2fr 1.1fr 1.1fr 1.5fr 1.1fr 1fr',
                                  padding: '11px 14px', alignItems: 'center',
                                  borderBottom: item.isLast ? 'none' : '.5px solid rgba(0,0,0,.06)' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap' }}>
                        <span style={{ fontSize: 16, fontWeight: 600, color: '#1c1c1e' }}>{mo} {day}</span>
                        <span style={{ fontSize: 13, color: '#aeaeb2' }}>{wd}</span>
                        {item.isInjDay && (
                          <span style={{ fontSize: 12, fontWeight: 700, color: '#4a90d9',
                                         background: '#e8f2fd', padding: '1px 5px', borderRadius: 4 }}>inj</span>
                        )}
                        {isAdmin && (
                          <button onClick={() => deleteRow(item.date)}
                                  style={{ marginLeft: 2, fontSize: 12, color: '#c7c7cc', background: 'none',
                                           border: 'none', cursor: 'pointer', padding: '0 2px', lineHeight: 1 }}>✕</button>
                        )}
                      </div>
                      <div style={{ textAlign: 'right', fontSize: 16, fontWeight: 500,
                                    color: '#1c1c1e', fontVariantNumeric: 'tabular-nums' }}>
                        {fw(item.lbs)}
                      </div>
                      <div style={{ textAlign: 'right', fontSize: 16, color: '#3c3c43',
                                    fontVariantNumeric: 'tabular-nums' }}>
                        {fw(item.movAvg)}
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        {(() => {
                          const g = doseGuidance(item.twoWeekLoss);
                          if (!g) return <span style={{ fontSize: 14, color: '#c7c7cc' }}>—</span>;
                          const sign = item.twoWeekLoss >= 0 ? '↓' : '↑';
                          return (
                            <span style={{ display: 'inline-block', fontSize: 13, fontWeight: 600,
                                           fontVariantNumeric: 'tabular-nums', padding: '2px 6px',
                                           borderRadius: 6, color: g.color, background: g.bg }}>
                              {sign}{Math.abs(item.twoWeekLoss).toFixed(1)}
                            </span>
                          );
                        })()}
                      </div>
                      <div style={{ textAlign: 'right', fontSize: 16, color: '#3c3c43',
                                    fontVariantNumeric: 'tabular-nums' }}>
                        {(703 * item.lbs / (HEIGHT_IN * HEIGHT_IN)).toFixed(1)}
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        {baselineLbs != null && (() => {
                          const pct = (baselineLbs - item.lbs) / baselineLbs * 100;
                          const pos = pct >= 0;
                          return (
                            <span style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                                           color: pos ? '#34c759' : '#ff3b30' }}>
                              {pos ? '↓' : '↑'}{Math.abs(pct).toFixed(1)}%
                            </span>
                          );
                        })()}
                      </div>
                    </div>
                  );
                })}
                </div>
              </div>

              <Summary rows={rows} />
              </div>{/* end weight tab */}

              {/* ── DOSING TAB ── */}
              <div style={{ display: activeTab==='dosing' ? undefined : 'none' }}>
                <DosePanel rows={rows} injections={injections} injSchedule={injSchedule}
                           isAdmin={isAdmin} onSaveSchedule={saveInjSchedule} />

              {/* Injection log */}
              <div style={{ marginTop: 10, borderRadius: 18, background: '#fff',
                            border: '.5px solid rgba(0,0,0,.08)', overflow: 'hidden' }}>
                <div style={{ padding: '10px 14px 8px', display: 'flex', alignItems: 'center',
                              justifyContent: 'space-between', borderBottom: '.5px solid rgba(0,0,0,.06)' }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: '#4a90d9',
                                textTransform: 'uppercase', letterSpacing: .6 }}>Injections</div>
                  {isAdmin && (
                    <button onClick={() => setShowInj(v => !v)}
                            style={{ fontSize: 14, fontWeight: 600, padding: '4px 12px', borderRadius: 8,
                                     background: showInj ? '#e5e5ea' : '#007aff',
                                     color: showInj ? '#1c1c1e' : '#fff', border: 'none', cursor: 'pointer' }}>
                      {showInj ? 'Cancel' : '+ Log injection'}
                    </button>
                  )}
                </div>

                {isAdmin && showInj && (
                  <div style={{ padding: '12px 14px', borderBottom: '.5px solid rgba(0,0,0,.06)',
                                display: 'flex', gap: 8, alignItems: 'flex-end' }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                                    letterSpacing: .4, marginBottom: 4 }}>Date</div>
                      <input type="date" value={injDate} onChange={e => setInjDate(e.target.value)}
                             style={{ width: '100%', fontSize: 16, padding: '8px 10px', borderRadius: 10,
                                      border: '1px solid #d1d1d6', background: '#f9f9f9',
                                      color: '#1c1c1e', outline: 'none' }} />
                    </div>
                    <div style={{ width: 90 }}>
                      <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                                    letterSpacing: .4, marginBottom: 4 }}>Dose (mg)</div>
                      <input type="number" step="0.25" min="0.25" placeholder="2.5"
                             value={injDose} onChange={e => setInjDose(e.target.value)}
                             style={{ width: '100%', fontSize: 16, padding: '8px 10px', borderRadius: 10,
                                      border: '1px solid #d1d1d6', background: '#f9f9f9',
                                      color: '#1c1c1e', outline: 'none' }} />
                    </div>
                    <button onClick={addInjection} disabled={!injDate || !injDose}
                            style={{ fontSize: 16, fontWeight: 600, padding: '8px 16px', borderRadius: 10,
                                     background: (!injDate || !injDose) ? '#e5e5ea' : '#34c759',
                                     color: (!injDate || !injDose) ? '#aeaeb2' : '#fff',
                                     border: 'none', cursor: (!injDate || !injDose) ? 'default' : 'pointer' }}>
                      Add
                    </button>
                  </div>
                )}

                <div style={{ maxHeight: 440, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
                {[...injections].sort((a, b) => b.date.localeCompare(a.date)).map((inj, i, arr) => (
                  <div key={inj.date}
                       style={{ display: 'flex', alignItems: 'center', padding: '10px 14px',
                                borderBottom: i < arr.length - 1 ? '.5px solid rgba(0,0,0,.06)' : 'none' }}>
                    <div style={{ flex: 1, fontSize: 16, fontWeight: 600, color: '#1c1c1e' }}>
                      {fmtShort(inj.date)}
                      <span style={{ fontSize: 13, color: '#aeaeb2', marginLeft: 6 }}>
                        {WD[new Date(inj.date + 'T12:00:00').getDay()]}
                      </span>
                    </div>
                    <div style={{ fontSize: 16, fontWeight: 600, color: '#4a90d9',
                                  fontVariantNumeric: 'tabular-nums' }}>{inj.doseMg} mg</div>
                    {isAdmin && (
                      <button onClick={() => deleteInjection(inj.date)}
                              style={{ marginLeft: 12, fontSize: 15, color: '#c7c7cc', background: 'none',
                                       border: 'none', cursor: 'pointer', padding: '2px 4px' }}>✕</button>
                    )}
                  </div>
                ))}
                </div>
              </div>

              </div>{/* end dosing tab */}

              {/* ── Admin settings (outside tabs) ── */}
              {isAdmin ? (
                <>
                  <GistPanel gistOk={gistOk} gistMsg={gistMsg} onSave={saveGistConfig} onLogout={adminLogout} style={{ marginTop: 10 }} />
                  <IntervalsPanel connected={!!intervalsCfg} msg={intervalsMsg} onSave={saveIntervalsConfig} onRefresh={refreshIntervals} onResync={resyncRides} onDisconnect={disconnectIntervals} style={{ marginTop: 10 }} />

                  {/* Export folder control */}
                  {hasFSA && (
                    <button onClick={exportDir ? () => runAutoImport(exportDir) : pickExportFolder}
                            style={{ marginTop: 10, width: '100%', borderRadius: 14, background: '#fff',
                                     border: '.5px solid #d1d1d6', padding: '12px 16px',
                                     display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                                     cursor: 'pointer', textAlign: 'left' }}>
                      <div>
                        <div style={{ fontSize: 15, fontWeight: 600, color: '#1c1c1e' }}>
                          {exportDir ? `Auto-import · ${exportDir.name}` : 'Set export folder'}
                        </div>
                        <div style={{ fontSize: 13, color: '#8e8e93', marginTop: 1 }}>
                          {exportDir ? 'Tap to check for a newer export now' : 'Auto-load Automation_Daily_export_*.csv on every open'}
                        </div>
                      </div>
                      <div style={{ fontSize: 16, color: exportDir ? '#34c759' : '#8e8e93' }}>
                        {exportDir ? '↺' : '›'}
                      </div>
                    </button>
                  )}
                </>
              ) : (
                <AdminLogin onLogin={adminLogin} style={{ marginTop: 16, textAlign: 'center' }} />
              )}

              {error && <ErrBox msg={error} />}
              </div>{/* end inner padding div */}
            </div>
          )}
        </div>
      );
    }

    function Summary({ rows }) {
      if (rows.length < 2) return null;
      const change = rows[0].lbs - rows[rows.length - 1].lbs;
      const rate   = rows.find(r => r.rate != null)?.rate;
      return (
        <div style={{ marginTop: 10, borderRadius: 18, background: '#fff',
                      border: '.5px solid rgba(0,0,0,.08)', padding: '14px 16px',
                      display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
          <Tile label="Days Tracked" value={String(rows.length)} />
          <Tile label="Total Change"
                value={(change >= 0 ? '+' : '') + change.toFixed(1) + ' lbs'}
                accent={change < -0.1 ? '#1a7f3c' : change > 0.1 ? '#c0392b' : undefined} />
          <Tile label="Cur. Rate/wk"
                value={rate != null ? (rate >= 0 ? '+' : '') + rate.toFixed(2) : '—'}
                accent={rate != null && rate < -0.01 ? '#1a7f3c' : rate > 0.01 ? '#c0392b' : undefined} />
        </div>
      );
    }

    function Tile({ label, value, accent }) {
      return (
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                        letterSpacing: .4, marginBottom: 4 }}>{label}</div>
          <div style={{ fontSize: 16, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                        color: accent ?? '#1c1c1e' }}>{value}</div>
        </div>
      );
    }

    function ErrBox({ msg }) {
      return (
        <div style={{ marginTop: 10, borderRadius: 14, background: '#fff2f2',
                      border: '.5px solid #ffb3b3', padding: '10px 14px',
                      fontSize: 15, color: '#c0392b' }}>{msg}</div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
