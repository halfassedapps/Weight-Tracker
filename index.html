<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Weight Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
           background: #f2f2f7; margin: 0; }
    .row-in { animation: fadeSlide .12s ease-out; }
    @keyframes fadeSlide { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:none; } }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef } = React;

    /* ─── CSV parser ─────────────────────────────────────────────────────────── */
    function splitLine(line) {
      const out = []; let cur = ''; let q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { q = !q; }
        else if (c === ',' && !q) { out.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
        else { cur += c; }
      }
      out.push(cur.trim().replace(/^"|"$/g, ''));
      return out;
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const headers = splitLine(lines[0]);
      return lines.slice(1).map(line => {
        const vals = splitLine(line);
        const row = {};
        headers.forEach((h, i) => { row[h] = (vals[i] ?? '').trim(); });
        return row;
      });
    }

    /* ─── Schema detection ───────────────────────────────────────────────────── */
    // Supports two formats:
    //   Long/pivot: date, metric, value, unit, source  (Apple Health Shortcuts export)
    //   Wide:       date, weight/value, unit            (one row per day)
    function detectSchema(headers, rows) {
      const lc  = h => h.toLowerCase().replace(/[\s_\-]/g, '');
      const find = (...keys) => headers.find(h => keys.some(k => lc(h) === k || lc(h).includes(k)));

      const dateCol   = find('date', 'startdate', 'datetime', 'timestamp');
      const metricCol = find('metric', 'metricname', 'type', 'category', 'name');
      const valueCol  = find('value', 'qty');
      const unitCol   = find('unit', 'units');

      if (metricCol && valueCol && dateCol) {
        const metricValues = [...new Set(rows.map(r => r[metricCol]).filter(Boolean))];
        const weightMetric = metricValues.find(m =>
          ['bodyweight', 'body weight', 'weight', 'bodymass', 'body mass']
            .includes(m.toLowerCase().replace(/\s+/g, ' ').trim())
        ) ?? metricValues.find(m => m.toLowerCase().includes('weight'));
        return { format: 'long', dateCol, metricCol, valueCol, unitCol, weightMetric, allMetrics: metricValues };
      }

      const wideValue = find('weight', 'bodymass', 'body mass', 'mass', 'value');
      if (dateCol && wideValue) {
        return { format: 'wide', dateCol, valueCol: wideValue, unitCol };
      }

      return { format: 'unknown', dateCol, valueCol, unitCol };
    }

    /* ─── Data processing ────────────────────────────────────────────────────── */
    function toKg(weight, unit) {
      const u = (unit ?? '').toLowerCase().trim();
      if (u === 'lb' || u === 'lbs' || u === 'pound' || u === 'pounds') return weight / 2.20462;
      return weight;
    }
    const toLbs = kg => kg * 2.20462;

    function buildDailyMap(rows, schema) {
      const map = {};
      for (const row of rows) {
        if (schema.format === 'long' && row[schema.metricCol] !== schema.weightMetric) continue;
        const rawDate = row[schema.dateCol];
        if (!rawDate) continue;
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) continue;
        const rawVal = (row[schema.valueCol] ?? '').replace(/,/g, '');
        const wRaw = parseFloat(rawVal);
        if (isNaN(wRaw)) continue;
        const unit = schema.unitCol ? row[schema.unitCol] : '';
        const wKg  = toKg(wRaw, unit);
        const key  = d.toISOString().slice(0, 10);
        if (!map[key] || d > map[key].ts) map[key] = { date: key, wKg, ts: d };
      }
      return Object.values(map).sort((a, b) => b.date.localeCompare(a.date));
    }

    const avg = arr => arr.reduce((s, v) => s + v, 0) / arr.length;

    function computeLogbook(data) {
      const n = data.length;
      return data.map((entry, i) => {
        const maSlice  = data.slice(i, i + 7).map(d => d.wKg);
        const movAvgKg = avg(maSlice);
        let weeklyRateKg = null;
        if (i + 7 < n) {
          const prev = data.slice(i + 7, i + 14).map(d => d.wKg);
          if (prev.length) weeklyRateKg = movAvgKg - avg(prev);
        }
        const hiSlice  = data.slice(i, i + 10).map(d => d.wKg);
        const tenHiKg  = Math.max(...hiSlice);
        return {
          ...entry,
          lbs:     toLbs(entry.wKg),
          movAvg:  toLbs(movAvgKg),
          rate:    weeklyRateKg != null ? toLbs(weeklyRateKg) : null,
          tenHigh: toLbs(tenHiKg),
        };
      });
    }

    /* ─── Formatting ─────────────────────────────────────────────────────────── */
    const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const fmtDate = s => { const d = new Date(s + 'T12:00:00'); return { mo: MO[d.getMonth()], day: d.getDate(), wd: WD[d.getDay()] }; };
    const fw = v => v != null ? v.toFixed(1) : '—';

    function rateInfo(v) {
      if (v == null) return null;
      const abs = Math.abs(v).toFixed(2);
      if (v < -0.01) return { label: `↓ ${abs}`, cls: 'loss' };
      if (v >  0.01) return { label: `↑ ${abs}`, cls: 'gain' };
      return { label: `→ ${abs}`, cls: 'flat' };
    }

    const BADGE = {
      loss: { background: '#e6f9ef', color: '#1a7f3c' },
      gain: { background: '#fff2f0', color: '#c0392b' },
      flat: { background: '#f2f2f7', color: '#8e8e93' },
    };

    /* ─── App ────────────────────────────────────────────────────────────────── */
    function App() {
      const [rows,     setRows]     = useState([]);
      const [meta,     setMeta]     = useState(null);
      const [error,    setError]    = useState('');
      const [dragging, setDragging] = useState(false);
      const inputRef = useRef();

      const loadFile = useCallback((file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = parseCSV(e.target.result);
            if (!parsed.length) { setError('CSV is empty.'); return; }
            const schema = detectSchema(Object.keys(parsed[0]), parsed);
            if (schema.format === 'unknown') {
              setError(`Couldn't identify schema. Headers: ${Object.keys(parsed[0]).join(', ')}`);
              return;
            }
            if (schema.format === 'long' && !schema.weightMetric) {
              const sample = (schema.allMetrics ?? []).slice(0, 8).join(', ');
              setError(`No weight metric found. Metrics present: ${sample}`);
              return;
            }
            const daily   = buildDailyMap(parsed, schema);
            if (!daily.length) { setError('No valid weight entries found.'); return; }
            const logbook = computeLogbook(daily);
            const srcCol  = Object.keys(parsed[0]).find(h => h.toLowerCase() === 'source');
            const wRows   = schema.format === 'long' ? parsed.filter(r => r[schema.metricCol] === schema.weightMetric) : parsed;
            const source  = srcCol ? [...new Set(wRows.map(r => r[srcCol]).filter(Boolean))].join(', ') : '';
            setRows(logbook);
            setMeta({ metric: schema.weightMetric ?? 'Weight', source });
            setError('');
          } catch (ex) { setError('Parse error: ' + ex.message); }
        };
        reader.readAsText(file);
      }, []);

      const onInput = useCallback(e => loadFile(e.target.files[0]), [loadFile]);
      const onDrop  = useCallback(e => { e.preventDefault(); setDragging(false); loadFile(e.dataTransfer.files[0]); }, [loadFile]);

      return (
        <div style={{ minHeight: '100vh', background: '#f2f2f7' }}>

          {/* ── Nav ── */}
          <div style={{ position: 'sticky', top: 0, zIndex: 20,
                        background: 'rgba(242,242,247,.94)',
                        backdropFilter: 'saturate(180%) blur(20px)',
                        WebkitBackdropFilter: 'saturate(180%) blur(20px)',
                        borderBottom: '.5px solid rgba(0,0,0,.12)' }}>
            <div style={{ padding: '12px 16px 10px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div>
                <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: -.3, color: '#1c1c1e' }}>Weight Tracker</div>
                {meta && (
                  <div style={{ fontSize: 11, color: '#8e8e93', marginTop: 1 }}>
                    {rows.length} entries · lbs{meta.source ? ` · ${meta.source}` : ''}
                  </div>
                )}
              </div>
              {rows.length > 0 && (
                <button onClick={() => inputRef.current?.click()}
                        style={{ fontSize: 13, fontWeight: 600, padding: '6px 14px', borderRadius: 10,
                                 background: '#e5e5ea', color: '#1c1c1e', border: 'none', cursor: 'pointer' }}>
                  Import
                </button>
              )}
              <input ref={inputRef} type="file" accept=".csv,.txt" style={{ display: 'none' }} onChange={onInput} />
            </div>
          </div>

          {/* ── Upload ── */}
          {rows.length === 0 && (
            <div style={{ padding: '16px 16px 24px' }}>
              <div style={{ borderRadius: 18, padding: '32px 24px', textAlign: 'center',
                            background: dragging ? '#e6f9ef' : '#fff',
                            border: `2px dashed ${dragging ? '#34c759' : '#d1d1d6'}`,
                            transition: 'all .15s' }}
                   onDragOver={e => { e.preventDefault(); setDragging(true); }}
                   onDragLeave={() => setDragging(false)}
                   onDrop={onDrop}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>⚖️</div>
                <div style={{ fontSize: 17, fontWeight: 600, color: '#1c1c1e', marginBottom: 6 }}>
                  Upload Apple Health Export
                </div>
                <div style={{ fontSize: 14, color: '#8e8e93', marginBottom: 20, lineHeight: 1.5 }}>
                  Drop your <code style={{ fontSize: 12, background: '#f2f2f7', padding: '1px 5px', borderRadius: 4 }}>Automation_D...</code> CSV here,<br />
                  or tap below to browse.
                </div>
                <label style={{ cursor: 'pointer' }}>
                  <input type="file" accept=".csv,.txt" style={{ display: 'none' }} onChange={onInput} />
                  <span style={{ display: 'inline-block', background: '#34c759', color: '#fff',
                                 fontWeight: 600, fontSize: 15, padding: '12px 28px', borderRadius: 50 }}>
                    Choose File
                  </span>
                </label>
              </div>

              <div style={{ marginTop: 10, borderRadius: 14, background: '#fff',
                            border: '.5px solid #d1d1d6', padding: '12px 14px' }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: '#8e8e93', marginBottom: 6,
                              textTransform: 'uppercase', letterSpacing: .5 }}>Expected format</div>
                <div style={{ fontSize: 12, color: '#3c3c43', lineHeight: 1.6 }}>
                  Supports Apple Health Shortcuts exports:<br />
                  <code style={{ fontSize: 11, background: '#f2f2f7', padding: '1px 4px', borderRadius: 3 }}>
                    date, metric, value, unit, source
                  </code><br />
                  Filters for <strong>Body Weight</strong> rows · converts kg → lbs automatically.
                </div>
              </div>

              {error && <ErrBox msg={error} />}
            </div>
          )}

          {/* ── Logbook table ── */}
          {rows.length > 0 && (
            <div style={{ padding: '12px 12px 32px' }}>
              <div style={{ borderRadius: 18, overflow: 'hidden', background: '#fff',
                            border: '.5px solid rgba(0,0,0,.08)' }}>

                {/* Header */}
                <div style={{ display: 'grid', gridTemplateColumns: '2fr 1.1fr 1.1fr 1.5fr 1.2fr',
                              padding: '8px 14px', background: '#f2f2f7',
                              borderBottom: '.5px solid rgba(0,0,0,.1)' }}>
                  {['DATE', "REC'D", '7D AVG', 'RATE/WK', '10D HIGH'].map((h, i) => (
                    <div key={h} style={{ fontSize: 10, fontWeight: 700, letterSpacing: .6,
                                          color: '#8e8e93', textAlign: i === 0 ? 'left' : 'right' }}>{h}</div>
                  ))}
                </div>

                {/* Rows */}
                {rows.map((row, i) => {
                  const { mo, day, wd } = fmtDate(row.date);
                  const rate   = rateInfo(row.rate);
                  const prevHi = i > 0 ? rows[i - 1].tenHigh : null;
                  const hiDrop = prevHi != null && row.tenHigh < prevHi - 0.05;
                  const isLast = i === rows.length - 1;

                  return (
                    <div key={row.date} className="row-in"
                         style={{ display: 'grid', gridTemplateColumns: '2fr 1.1fr 1.1fr 1.5fr 1.2fr',
                                  padding: '11px 14px', alignItems: 'center',
                                  borderBottom: isLast ? 'none' : '.5px solid rgba(0,0,0,.06)' }}>

                      <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                        <span style={{ fontSize: 14, fontWeight: 600, color: '#1c1c1e' }}>{mo} {day}</span>
                        <span style={{ fontSize: 11, color: '#aeaeb2' }}>{wd}</span>
                      </div>

                      <div style={{ textAlign: 'right', fontSize: 14, fontWeight: 500,
                                    color: '#1c1c1e', fontVariantNumeric: 'tabular-nums' }}>
                        {fw(row.lbs)}
                      </div>

                      <div style={{ textAlign: 'right', fontSize: 14,
                                    color: '#3c3c43', fontVariantNumeric: 'tabular-nums' }}>
                        {fw(row.movAvg)}
                      </div>

                      <div style={{ textAlign: 'right' }}>
                        {rate ? (
                          <span style={{ display: 'inline-block', fontSize: 11, fontWeight: 600,
                                         fontVariantNumeric: 'tabular-nums', padding: '2px 6px',
                                         borderRadius: 6, ...BADGE[rate.cls] }}>
                            {rate.label}
                          </span>
                        ) : (
                          <span style={{ fontSize: 12, color: '#c7c7cc' }}>—</span>
                        )}
                      </div>

                      <div style={{ textAlign: 'right' }}>
                        {hiDrop ? (
                          <span style={{ display: 'inline-block', fontSize: 11, fontWeight: 600,
                                         fontVariantNumeric: 'tabular-nums', padding: '2px 6px',
                                         borderRadius: 6, ...BADGE.loss }}>
                            ↓ {fw(row.tenHigh)}
                          </span>
                        ) : (
                          <span style={{ fontSize: 14, color: '#3c3c43', fontVariantNumeric: 'tabular-nums' }}>
                            {fw(row.tenHigh)}
                          </span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              <Summary rows={rows} />
              {error && <ErrBox msg={error} />}
            </div>
          )}
        </div>
      );
    }

    function Summary({ rows }) {
      if (rows.length < 2) return null;
      const change = rows[0].lbs - rows[rows.length - 1].lbs;
      const rate   = rows.find(r => r.rate != null)?.rate;
      return (
        <div style={{ marginTop: 10, borderRadius: 18, background: '#fff',
                      border: '.5px solid rgba(0,0,0,.08)', padding: '14px 16px',
                      display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
          <Tile label="Days Tracked" value={String(rows.length)} />
          <Tile label="Total Change"
                value={(change >= 0 ? '+' : '') + change.toFixed(1) + ' lbs'}
                accent={change < -0.1 ? '#1a7f3c' : change > 0.1 ? '#c0392b' : undefined} />
          <Tile label="Cur. Rate/wk"
                value={rate != null ? (rate >= 0 ? '+' : '') + rate.toFixed(2) : '—'}
                accent={rate != null && rate < -0.01 ? '#1a7f3c' : rate > 0.01 ? '#c0392b' : undefined} />
        </div>
      );
    }

    function Tile({ label, value, accent }) {
      return (
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 10, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                        letterSpacing: .4, marginBottom: 4 }}>{label}</div>
          <div style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                        color: accent ?? '#1c1c1e' }}>{value}</div>
        </div>
      );
    }

    function ErrBox({ msg }) {
      return (
        <div style={{ marginTop: 10, borderRadius: 14, background: '#fff2f2',
                      border: '.5px solid #ffb3b3', padding: '10px 14px',
                      fontSize: 13, color: '#c0392b' }}>{msg}</div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
