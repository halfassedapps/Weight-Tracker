      // window (not any single day) is what makes this a reasonable estimate
      // despite daily TDEE being noisy; see the comment above the component.
      const avgNet = avg(pts.map(p => p.net));
      const predictedLbsPerWeek = avgNet * 7 / 3500;
      const avgDeviation = withDeviation.length ? avg(withDeviation.map(p => p.deviation)) : null;
      const avgTier = avgDeviation != null ? netTier(avgDeviation) : null;

      const windowStartDate = msToLocalDate(visStartMs);
      const windowEndDate = msToLocalDate(Math.min(todayMs, visEndMs));
      const actualRates = (rows || [])
        .filter(r => r.date >= windowStartDate && r.date < windowEndDate && r.rate != null)
        .map(r => r.rate);
      const actualLbsPerWeek = actualRates.length ? avg(actualRates) : null;

      return (
        <div>
          <svg viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', height: 'auto', display: 'block' }}
               onMouseMove={(e) => {
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = (e.clientX - rect.left) / rect.width * VW;
                 if (x < PAD.l || x > PAD.l + cW) { setTip(null); return; }
                 const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                 let idx = 0, minDist = Infinity;
                 pts.forEach((p, i) => { const d = Math.abs(p.ms - targetMs); if (d < minDist) { minDist = d; idx = i; } });
                 setTip(pts[idx]);
               }}
               onMouseLeave={() => setTip(null)}>
            {withDeviation.map(p => {
              const x = xOf(p.ms) - barW / 2;
              const rx = Math.min(3, barW * 0.3);
              return <path key={p.date} d={roundedBarPath(x, barW, yZero, yOf(p.deviation), rx)} fill={NET_TIER_COLOR[p.tier]} opacity="0.88" />;
            })}

            <line x1={PAD.l} y1={yZero} x2={PAD.l + cW} y2={yZero} stroke="rgba(0,0,0,.2)" strokeWidth="0.7" />

            {/* Nudged in from the very top/bottom edge so they don't collide
                with the x-axis date row directly below the chart. */}
            <text x={PAD.l - 3} y={PAD.t + 6} textAnchor="end" fontSize="7" fill="#aeaeb2">+{Math.round(maxAbs)}</text>
            <text x={PAD.l - 3} y={PAD.t + cH - 2} textAnchor="end" fontSize="7" fill="#aeaeb2">-{Math.round(maxAbs)}</text>
            <text x={PAD.l - 3} y={yZero + 2} textAnchor="end" fontSize="7" fill="#aeaeb2">0</text>

            {pts.filter((_, i) => i % Math.max(1, Math.floor(pts.length / 4)) === 0).map(p => (
              <text key={p.date} x={xOf(p.ms)} y={PAD.t + cH + 10} textAnchor="middle" fontSize="7" fill="#aeaeb2">{p.date.slice(5)}</text>
            ))}

            {tip && tip.deviation != null && (() => {
              const hasExercise = tip.exercise > 0;
              const TW = 88, TH = hasExercise ? 33 : 27;
              const tx = Math.max(PAD.l, Math.min(xOf(tip.ms) - TW / 2, PAD.l + cW - TW));
              const ty = PAD.t + 2;
              return (
                <g style={{ pointerEvents: 'none' }}>
                  <line x1={xOf(tip.ms)} y1={PAD.t} x2={xOf(tip.ms)} y2={PAD.t + cH} stroke="rgba(28,28,30,.2)" strokeWidth="1" />
                  <rect x={tx} y={ty} width={TW} height={TH} rx={3} fill="#1c1c1e" opacity="0.92" />
                  <text x={tx + TW / 2} y={ty + 7} textAnchor="middle" fontSize="4.5" fill="#aeaeb2">{tip.date.slice(5)}</text>
                  <text x={tx + TW / 2} y={ty + 16} textAnchor="middle" fontSize="6" fontWeight="700" fill={NET_TIER_COLOR[tip.tier]}>
                    {Math.round(Math.abs(tip.deviation))} {tip.deviation >= 0 ? 'over' : 'under'}
                  </text>
                  <text x={tx + TW / 2} y={ty + 23} textAnchor="middle" fontSize="4" fill="#aeaeb2">
                    {Math.round(tip.Calories || 0)} of {Math.round(tip.target)} cal
                  </text>
                  {hasExercise && (
                    <text x={tx + TW / 2} y={ty + 29} textAnchor="middle" fontSize="4" fill="#aeaeb2">
                      ({tip.baseTarget} + {Math.round(tip.exercise)} workout)
                    </text>
                  )}
                </g>
              );
            })()}
          </svg>

          <div style={{ display: 'flex', padding: '8px 14px 4px', gap: 12, alignItems: 'flex-start' }}>
            <PkStat label="Avg Off Target" value={avgDeviation != null ? `${avgDeviation >= 0 ? '+' : ''}${Math.round(avgDeviation)} cal` : '—'}
                    color={avgTier != null ? NET_TIER_COLOR[avgTier] : '#3c3c43'} />
            <PkStat label="Predicted Pace" note="from TDEE, noisy"
                    value={`${predictedLbsPerWeek >= 0 ? '+' : ''}${predictedLbsPerWeek.toFixed(2)} lb/wk`}
                    color={predictedLbsPerWeek <= 0 ? '#0ca30c' : '#d03b3b'} />
            <PkStat label="Actual Pace" note="from scale"
                    value={actualLbsPerWeek != null ? `${actualLbsPerWeek >= 0 ? '+' : ''}${actualLbsPerWeek.toFixed(2)} lb/wk` : '—'}
                    color={actualLbsPerWeek == null ? '#3c3c43' : (actualLbsPerWeek <= 0 ? '#0ca30c' : '#d03b3b')} />
          </div>

          <div style={{ padding: '2px 14px 4px', fontSize: 10, color: '#aeaeb2' }}>
            Bars show consumed vs. target — bumped up on workout days by real logged-activity calories (intervals.icu) or, when unavailable, that day's measured Active Energy (MFP-style exercise credit; not a recomputed deficit). TDEE-based pace (above) is a multi-day estimate, not a daily one.
          </div>
          <div style={{ padding: '6px 14px 12px', fontSize: 11, fontWeight: 600, color: '#3c3c43', display: 'flex', gap: 14, flexWrap: 'wrap' }}>
            <div><span style={swatch(NET_TIER_COLOR.good)}></span>On Plan</div>
            <div><span style={swatch(NET_TIER_COLOR.ok)}></span>Off Plan</div>
            <div><span style={swatch(NET_TIER_COLOR.bad)}></span>Way Off</div>
          </div>
        </div>
      );
    }

    /* ─── Card 3: Protein ─────────────────────────────────────────────────────── */
    // Protein is colored by proteinTier (see definition near the top of the
    // file) — a floor, not a two-sided target, so anything at/above the floor
    // is just "good" with no extra credit for going further over.
    function ProteinChart({ periodDaily, visStartMs, visEndMs, proteinTargets, isAdmin, onSaveProteinTargets }) {
      const [tip, setTip] = useState(null);
      const [editing, setEditing] = useState(false);
      const [draftTarget, setDraftTarget] = useState('');
      const [saving, setSaving] = useState(false);
      const [saveErr, setSaveErr] = useState('');

      const VW = 360, VH = 110;
      const PAD = { t: 10, r: 8, b: 26, l: 28 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;

      const pts = periodDaily.map(d => {
        const target = targetActiveAt(proteinTargets, d.date);
        const value = d.Protein || 0;
        return { ...d, target, tier: proteinTier(value, target) };
      });

      const maxVal = Math.max(...pts.map(p => Math.max(p.Protein || 0, p.target || 0)), 20) * 1.15;
      const xOf = ms => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const yOf = v => PAD.t + cH - (v / maxVal) * cH;
      const yBaseline = PAD.t + cH;
      const barW = Math.max(0.5, Math.min(10, (cW / pts.length) * 0.55));

      const avgProtein = avg(pts.map(p => p.Protein || 0));
      const withTarget = pts.filter(p => p.target != null);
      const pctAtFloor = withTarget.length
        ? Math.round(withTarget.filter(p => (p.Protein || 0) >= p.target).length / withTarget.length * 100)
        : null;

      const currentTarget = targetActiveAt(proteinTargets, today());
      const startEdit = () => { setDraftTarget(String(currentTarget ?? 171)); setEditing(true); setSaveErr(''); };
      const saveTarget = async () => {
        const n = parseFloat(draftTarget);
        if (isNaN(n) || n <= 0) { setSaveErr('Enter a valid number'); return; }
        setSaving(true); setSaveErr('');
        const ok = await onSaveProteinTargets(n);
        setSaving(false);
        if (ok) setEditing(false); else setSaveErr("Couldn't save — try again.");
      };

      return (
        <div>
          <svg viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', height: 'auto', display: 'block' }}
               onMouseMove={(e) => {
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = (e.clientX - rect.left) / rect.width * VW;
                 if (x < PAD.l || x > PAD.l + cW) { setTip(null); return; }
                 const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                 let idx = 0, minDist = Infinity;
                 pts.forEach((p, i) => { const d = Math.abs(p.ms - targetMs); if (d < minDist) { minDist = d; idx = i; } });
                 setTip(pts[idx]);
               }}
               onMouseLeave={() => setTip(null)}>
            {pts.map(p => {
              const x = xOf(p.ms) - barW / 2;
              const rx = Math.min(3, barW * 0.3);
              const fill = p.tier ? NET_TIER_COLOR[p.tier] : '#2a78d6';
              return <path key={p.date} d={roundedBarPath(x, barW, yBaseline, yOf(p.Protein || 0), rx)} fill={fill} opacity="0.9" />;
            })}
            <line x1={PAD.l} y1={yBaseline} x2={PAD.l + cW} y2={yBaseline} stroke="rgba(0,0,0,.12)" strokeWidth="0.5" />
            {/* Floor line — a solid tick per day (not a full-width line) so a
                changed target mid-window still reads correctly per-day. */}
            {pts.map(p => p.target != null && (
              <line key={`t-${p.date}`} x1={xOf(p.ms) - barW * 0.7} x2={xOf(p.ms) + barW * 0.7}
                    y1={yOf(p.target)} y2={yOf(p.target)}
                    stroke="#1c1c1e" strokeWidth="1" strokeLinecap="round" opacity="0.7" />
            ))}
            {pts.filter((_, i) => i % Math.max(1, Math.floor(pts.length / 4)) === 0).map(p => (
              <text key={p.date} x={xOf(p.ms)} y={yBaseline + 10} textAnchor="middle" fontSize="7" fill="#aeaeb2">{p.date.slice(5)}</text>
            ))}
            {tip && (() => {
              const TW = 58, TH = 24;
              const tx = Math.max(PAD.l, Math.min(xOf(tip.ms) - TW / 2, PAD.l + cW - TW));
              const ty = PAD.t + 2;
              return (
                <g style={{ pointerEvents: 'none' }}>
                  <line x1={xOf(tip.ms)} y1={PAD.t} x2={xOf(tip.ms)} y2={yBaseline} stroke="rgba(28,28,30,.2)" strokeWidth="1" />
                  <rect x={tx} y={ty} width={TW} height={TH} rx={3} fill="#1c1c1e" opacity="0.92" />
                  <text x={tx + TW / 2} y={ty + 7} textAnchor="middle" fontSize="4.5" fill="#aeaeb2">{tip.date.slice(5)}</text>
                  <text x={tx + TW / 2} y={ty + 16} textAnchor="middle" fontSize="7" fontWeight="700"
                        fill={tip.tier ? NET_TIER_COLOR[tip.tier] : '#6ba9e8'}>
                    {Math.round(tip.Protein || 0)}g
                  </text>
                  {tip.target != null && (
                    <text x={tx + TW / 2} y={ty + 22} textAnchor="middle" fontSize="4" fill="#aeaeb2">
                      of {tip.target}g floor
                    </text>
                  )}
                </g>
              );
            })()}
          </svg>

          <div style={{ display: 'flex', padding: '8px 14px 4px', gap: 12, alignItems: 'flex-start' }}>
            <PkStat label="Avg Protein" value={`${Math.round(avgProtein)} g/day`} color="#2a78d6" />
            <PkStat label="Days at Floor" value={pctAtFloor != null ? pctAtFloor + '%' : '—'} note="of days" color="#3c3c43" />
          </div>

          <div style={{ padding: '6px 14px', fontSize: 11, fontWeight: 600, color: '#3c3c43', display: 'flex', gap: 14, flexWrap: 'wrap' }}>
            <div><span style={swatch(NET_TIER_COLOR.good)}></span>At floor</div>
            <div><span style={swatch(NET_TIER_COLOR.ok)}></span>Close (85–99%)</div>
            <div><span style={swatch(NET_TIER_COLOR.bad)}></span>Short (&lt;85%)</div>
          </div>

          <div style={{ padding: '0 14px 12px', display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            {!editing ? (
              <>
                <span style={{ fontSize: 11, color: '#8e8e93' }}>
                  Floor: {currentTarget != null ? `${currentTarget}g` : 'not set'}
                </span>
                {isAdmin && (
                  <button onClick={startEdit}
                          style={{ fontSize: 11, color: '#2a78d6', background: 'none', border: 'none',
                                   cursor: 'pointer', fontWeight: 600 }}>Edit</button>
                )}
              </>
            ) : (
              <>
                <input type="number" step="1" value={draftTarget} onChange={e => setDraftTarget(e.target.value)}
                       style={{ width: 68, fontSize: 12, padding: '4px 6px', borderRadius: 6,
                                border: '1px solid #d1d1d6', background: '#f9f9f9', outline: 'none' }} />
                <button onClick={saveTarget} disabled={saving}
                        style={{ fontSize: 11, fontWeight: 600, color: '#fff',
                                 background: saving ? '#a9c8ea' : '#2a78d6', border: 'none', borderRadius: 6,
                                 padding: '5px 10px', cursor: saving ? 'default' : 'pointer' }}>
                  {saving ? 'Saving…' : 'Save'}
                </button>
                <button onClick={() => { setEditing(false); setSaveErr(''); }} disabled={saving}
                        style={{ fontSize: 11, color: '#8e8e93', background: 'none', border: 'none', cursor: 'pointer' }}>
                  Cancel
                </button>
                {saveErr && <span style={{ fontSize: 11, color: '#d03b3b' }}>{saveErr}</span>}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ─── Blood Pressure Chart ───────────────────────────────────────────────── */
    const BP_SYS_COLOR = '#e05252';
    const BP_DIA_COLOR = '#4a90d9';

    // Soft background bands for the standard AHA systolic categories — context
    // only, not a medical judgment. Diastolic isn't separately banded (its
    // thresholds differ from systolic's) to avoid a cluttered dual-threshold
    // overlay sharing one y-axis.
    const BP_BANDS = [
      { max: 120,      color: '#34c759', label: 'Normal' },
      { max: 130,      color: '#ffd60a', label: 'Elevated' },
      { max: 140,      color: '#ff9500', label: 'Stage 1' },
      { max: Infinity, color: '#ff3b30', label: 'Stage 2' },
    ];

    const fmtTime = ms => {
      const d = new Date(ms);
      let h = d.getHours(); const m = d.getMinutes();
      const ap = h < 12 ? 'am' : 'pm';
      h = h % 12; if (h === 0) h = 12;
      return `${h}:${String(m).padStart(2, '0')}${ap}`;
    };

    function BpChart({ bpData }) {
      const [rangeMode, setRangeMode] = useState('all');
      const [customDays, setCustomDays] = useState(30);
      const [windowOffset, setWindowOffset] = useState(0);
      const [tip, setTip] = useState(null);
      const [viewMode, setViewMode] = useState('table'); // 'graph' | 'table'
      const [sharing, setSharing] = useState(false);
      const svgRef = useRef(null);
      const selectRange = mode => { setRangeMode(mode); setWindowOffset(0); };

      const sorted = computeDailyBp(bpData);
      if (sorted.length === 0) return null;

      const VW = 360, VH = 180;
      const PAD = { t: 14, r: 10, b: 28, l: 32 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;
      const STEP = 86400000;

      const todayMs = new Date().setHours(0, 0, 0, 0);
      const startMs = sorted[0].ms;

      const windowDays = windowDaysForRange(rangeMode, customDays);
      const refEnd = todayMs + STEP;
      const pageShift = windowOffset * windowDays * STEP;
      const visStartMs = windowDays ? refEnd - windowDays * STEP - pageShift : startMs;
      const visEndMs   = windowDays ? refEnd - pageShift : todayMs + STEP;
      const canScrollEarlier = windowDays && startMs < visStartMs;
      const canScrollLater   = windowDays && windowOffset > 0;

      const pts = sorted.filter(s => s.ms >= visStartMs && s.ms < visEndMs);
      const periodRangeStr = `${fmtShort(msToLocalDate(visStartMs))} – ${fmtShort(msToLocalDate(Math.min(todayMs, visEndMs)))}`;

      const avgSys = pts.length ? avg(pts.map(p => p.systolic))  : null;
      const avgDia = pts.length ? avg(pts.map(p => p.diastolic)) : null;

      const dataMax = pts.length ? Math.max(...pts.map(p => p.systolic))  : 140;
      const dataMin = pts.length ? Math.min(...pts.map(p => p.diastolic)) : 60;
      const yMax = Math.max(160, Math.ceil((dataMax + 10) / 10) * 10);
      const yMin = Math.min(50,  Math.floor((dataMin - 10) / 10) * 10);

      const xOf = ms    => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const yOf = mmHg  => PAD.t + cH - ((mmHg - yMin) / (yMax - yMin)) * cH;

      const yTicks = [];
      for (let v = Math.ceil(yMin / 20) * 20; v <= yMax; v += 20) yTicks.push(v);

      // Reference bands, clipped to the visible [yMin, yMax] window.
      const bandRects = [];
      let prevMax = yMin;
      for (const b of BP_BANDS) {
        const top = Math.min(b.max, yMax);
        if (top > prevMax) bandRects.push({ y1: prevMax, y2: top, color: b.color });
        prevMax = top;
        if (prevMax >= yMax) break;
      }

      const sysPath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xOf(p.ms)},${yOf(p.systolic)}`).join(' ');
      const diaPath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xOf(p.ms)},${yOf(p.diastolic)}`).join(' ');
      const bandPath = pts.length > 1
        ? pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${xOf(p.ms)},${yOf(p.systolic)}`).join(' ')
          + ' ' + [...pts].reverse().map(p => `L ${xOf(p.ms)},${yOf(p.diastolic)}`).join(' ') + ' Z'
        : '';

      // Every raw reading in the visible range, newest first — the table view
      // trades the chart's daily-average smoothing for full transparency into
      // what was actually logged (same raw data the chart's hover tooltip
      // already exposes one day at a time).
      const flatRows = pts
        .flatMap(p => p.readings.map(r => ({ date: p.date, ms: r.ms, systolic: r.systolic, diastolic: r.diastolic })))
        .sort((a, b) => b.ms - a.ms);

      // Share — captures whichever view (graph/table) is currently showing.
      const shareChart = async () => {
        if (sharing) return;
        setSharing(true);
        try {
          const scale = 3, headerH = 54;
          const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif";
          const subtitle = `Avg ${avgSys != null ? Math.round(avgSys) : '—'}/${avgDia != null ? Math.round(avgDia) : '—'} mmHg · ${periodRangeStr}`;
          let canvas;
          if (viewMode === 'graph') {
            if (!svgRef.current) return;
            const svgClone = svgRef.current.cloneNode(true);
            svgClone.setAttribute('width', VW * scale);
            svgClone.setAttribute('height', VH * scale);
            const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
            styleEl.textContent = `text { font-family: ${FONT}; }`;
            svgClone.insertBefore(styleEl, svgClone.firstChild);
            const svgString = new XMLSerializer().serializeToString(svgClone);
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
            const img = new Image();
            await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = svgUrl; });
            canvas = document.createElement('canvas');
            canvas.width = VW * scale; canvas.height = (VH + headerH) * scale;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.scale(scale, scale);
            ctx.fillStyle = '#1c1c1e'; ctx.font = `700 13px ${FONT}`;
            ctx.fillText('Blood Pressure', 14, 18);
            ctx.fillStyle = '#4a90d9'; ctx.font = `700 10px ${FONT}`;
            ctx.fillText(subtitle, 14, 34);
            ctx.drawImage(img, 0, headerH, VW, VH);
          } else {
            const rowH = 16, tableHeaderH = 16;
            const bodyH = tableHeaderH + flatRows.length * rowH;
            canvas = document.createElement('canvas');
            canvas.width = VW * scale; canvas.height = (headerH + bodyH + 8) * scale;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.scale(scale, scale);
            ctx.fillStyle = '#1c1c1e'; ctx.font = `700 13px ${FONT}`;
            ctx.fillText('Blood Pressure', 14, 18);
            ctx.fillStyle = '#4a90d9'; ctx.font = `700 10px ${FONT}`;
            ctx.fillText(subtitle, 14, 34);
            const colDate = 14, colTime = 100, colSys = 165, colDia = 220;
            let y = headerH + tableHeaderH;
            ctx.font = `700 8px ${FONT}`; ctx.fillStyle = '#8e8e93';
            ctx.fillText('DATE', colDate, y); ctx.fillText('TIME', colTime, y);
            ctx.fillText('SYS', colSys, y); ctx.fillText('DIA', colDia, y);
            flatRows.forEach((r, i) => {
              y = headerH + tableHeaderH + (i + 1) * rowH;
              if (i % 2 === 1) { ctx.fillStyle = '#f7f7f9'; ctx.fillRect(10, y - 11, VW - 20, rowH); }
              const { mo, day } = fmtDate(r.date);
              ctx.font = `600 9px ${FONT}`; ctx.fillStyle = '#3c3c43';
              ctx.fillText(`${mo} ${day}`, colDate, y);
              ctx.fillStyle = '#8e8e93'; ctx.fillText(fmtTime(r.ms), colTime, y);
              ctx.fillStyle = BP_SYS_COLOR; ctx.fillText(String(Math.round(r.systolic)), colSys, y);
              ctx.fillStyle = BP_DIA_COLOR; ctx.fillText(String(Math.round(r.diastolic)), colDia, y);
            });
          }
          const fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const file = new File([fileBlob], 'blood-pressure.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Blood Pressure', text: subtitle });
          } else {
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = url; a.download = 'blood-pressure.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        } catch (e) { if (e.name !== 'AbortError') console.warn('[BpChart] share failed:', e); }
        finally { setSharing(false); }
      };

      return (
        <div>
          {/* Controls */}
          <div style={{ display:'flex', gap:6, padding:'8px 14px 4px', alignItems:'center' }}>
            <select value={rangeMode} onChange={e => selectRange(e.target.value)}
                    style={{ fontSize:10, fontWeight:600, padding:'5px 8px', borderRadius:8,
                             background:'#f2f2f7', color:'#3c3c43', border:'none', outline:'none', cursor:'pointer' }}>
              <option value="7d">7 Days</option>
              <option value="14d">14 Days</option>
              <option value="30d">Month</option>
              <option value="all">All</option>
              <option value="custom">Custom</option>
            </select>
            {rangeMode === 'custom' && (
              <input type="number" min="1" step="1" value={customDays}
                     onChange={e => setCustomDays(e.target.value)} placeholder="days"
                     style={{ width:56, fontSize:10, fontWeight:600, padding:'5px 6px', borderRadius:8,
                              border:'1px solid #d1d1d6', background:'#f9f9f9', color:'#1c1c1e', outline:'none' }} />
            )}
            <div style={{ marginLeft:'auto', display:'flex', background:'#f2f2f7', borderRadius:8, padding:2 }}>
              {[['graph','Graph'],['table','Table']].map(([id,label]) => (
                <button key={id} onClick={() => setViewMode(id)}
                        style={{ fontSize:10, fontWeight:600, padding:'4px 10px', borderRadius:6, border:'none',
                                 cursor:'pointer', background: viewMode===id ? '#fff' : 'transparent',
                                 color: viewMode===id ? '#1c1c1e' : '#8e8e93',
                                 boxShadow: viewMode===id ? '0 1px 2px rgba(0,0,0,.1)' : 'none' }}>
                  {label}
                </button>
              ))}
            </div>
          </div>

          {/* Earlier/Later */}
          {windowDays !== 0 && (
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
                          padding:'0 14px 2px', fontSize:9, color:'#aeaeb2' }}>
              <button onClick={() => canScrollEarlier && setWindowOffset(o => o + 1)} disabled={!canScrollEarlier}
                      style={{ fontSize:9, fontWeight:600, padding:'2px 8px', borderRadius:6,
                               background: canScrollEarlier ? '#e5e5ea' : 'transparent',
                               color: canScrollEarlier ? '#3c3c43' : '#c7c7cc',
                               border:'none', cursor: canScrollEarlier ? 'pointer' : 'default' }}>← Earlier</button>
              <span>{periodRangeStr}</span>
              <button onClick={() => canScrollLater && setWindowOffset(o => o - 1)} disabled={!canScrollLater}
                      style={{ fontSize:9, fontWeight:600, padding:'2px 8px', borderRadius:6,
                               background: canScrollLater ? '#e5e5ea' : 'transparent',
                               color: canScrollLater ? '#3c3c43' : '#c7c7cc',
                               border:'none', cursor: canScrollLater ? 'pointer' : 'default' }}>Later →</button>
            </div>
          )}

          {/* Header stats */}
          <div style={{ display:'flex', padding:'8px 14px 4px', gap:12, alignItems:'flex-start' }}>
            <PkStat label="Avg Systolic"  value={avgSys != null ? Math.round(avgSys) + ' mmHg' : '—'} color={BP_SYS_COLOR} />
            <PkStat label="Avg Diastolic" value={avgDia != null ? Math.round(avgDia) + ' mmHg' : '—'} color={BP_DIA_COLOR} />
            <PkStat label="Readings" value={String(pts.reduce((s, p) => s + p.readings.length, 0))}
                    note={pts.length ? periodRangeStr : ''} color="#8e8e93" />
          </div>

          {/* Chart */}
          {viewMode === 'table' ? (
            pts.length > 0 ? (
              <div style={{ maxHeight: 320, overflowY: 'auto', margin: '0 14px', borderRadius: 10,
                            border: '.5px solid rgba(0,0,0,.08)' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1.3fr 1fr .8fr .8fr', padding: '6px 10px',
                              background: '#f2f2f7', borderBottom: '.5px solid rgba(0,0,0,.1)', position: 'sticky', top: 0 }}>
                  {['DATE', 'TIME', 'SYS', 'DIA'].map(h => (
                    <div key={h} style={{ fontSize: 10, fontWeight: 700, letterSpacing: .5, color: '#8e8e93' }}>{h}</div>
                  ))}
                </div>
                {flatRows.map((r, i) => {
                  const { wd, mo, day } = fmtDate(r.date);
                  return (
                    <div key={r.ms} style={{ display: 'grid', gridTemplateColumns: '1.3fr 1fr .8fr .8fr',
                                              padding: '6px 10px', fontSize: 11,
                                              background: i % 2 === 1 ? '#fafafb' : '#fff',
                                              borderBottom: i < flatRows.length - 1 ? '.5px solid rgba(0,0,0,.04)' : 'none' }}>
                      <div style={{ color: '#1c1c1e', fontWeight: 600 }}>{wd} {mo} {day}</div>
                      <div style={{ color: '#8e8e93' }}>{fmtTime(r.ms)}</div>
                      <div style={{ color: BP_SYS_COLOR, fontWeight: 600 }}>{Math.round(r.systolic)}</div>
                      <div style={{ color: BP_DIA_COLOR, fontWeight: 600 }}>{Math.round(r.diastolic)}</div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div style={{ padding:'24px 16px', textAlign:'center', color:'#aeaeb2', fontSize:13 }}>
                No readings in this range.
              </div>
            )
          ) : pts.length > 0 ? (
            <svg ref={svgRef} viewBox={`0 0 ${VW} ${VH}`} style={{ width:'100%', height:'auto', display:'block' }}
                 onMouseMove={e => {
                   const rect = e.currentTarget.getBoundingClientRect();
                   const x = (e.clientX - rect.left) / rect.width * VW;
                   if (x < PAD.l || x > PAD.l + cW) { setTip(null); return; }
                   const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                   let idx = 0, minDist = Infinity;
                   pts.forEach((p, i) => { const d = Math.abs(p.ms - targetMs); if (d < minDist) { minDist = d; idx = i; } });
                   setTip({ ...pts[idx], x: xOf(pts[idx].ms) });
                 }}
                 onMouseLeave={() => setTip(null)}>

              {/* Reference bands */}
              {bandRects.map((b, i) => (
                <rect key={i} x={PAD.l} y={yOf(b.y2)} width={cW} height={yOf(b.y1) - yOf(b.y2)}
                      fill={b.color} opacity="0.07" />
              ))}

              {/* Y grid + labels */}
              {yTicks.map(v => (
                <g key={v}>
                  <line x1={PAD.l} y1={yOf(v)} x2={PAD.l + cW} y2={yOf(v)} stroke="rgba(0,0,0,.05)" strokeWidth="0.5" />
                  <text x={PAD.l - 3} y={yOf(v) + 2} textAnchor="end" fontSize="7" fill="#aeaeb2">{v}</text>
                </g>
              ))}

              {/* Axes */}
              <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="0.5" />
              <line x1={PAD.l} y1={PAD.t + cH} x2={PAD.l + cW} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="0.5" />

              {/* Shaded pulse-pressure band */}
              {pts.length > 1 && <path d={bandPath} fill="rgba(74,144,217,0.08)" />}

              {/* Systolic / diastolic trend lines */}
              <path d={sysPath} fill="none" stroke={BP_SYS_COLOR} strokeWidth="1" />
              <path d={diaPath} fill="none" stroke={BP_DIA_COLOR} strokeWidth="1" />

              {/* Markers — one point per day, however many readings went into it */}
              {pts.map(p => (
                <g key={p.date}>
                  <circle cx={xOf(p.ms)} cy={yOf(p.systolic)}  r="1.5" fill={BP_SYS_COLOR} />
                  <circle cx={xOf(p.ms)} cy={yOf(p.diastolic)} r="1.5" fill={BP_DIA_COLOR} />
                </g>
              ))}

              {/* X labels */}
              {(() => {
                const winMs = visEndMs - visStartMs;
                const tickMs = winMs > 60 * STEP ? 14 * STEP : winMs > 20 * STEP ? 7 * STEP : 3 * STEP;
                const first = Math.ceil(visStartMs / tickMs) * tickMs;
                const ticks = [];
                for (let ms = first; ms <= visEndMs; ms += tickMs) ticks.push(ms);
                return ticks.map(ms => (
                  <text key={ms} x={xOf(ms)} y={PAD.t + cH + 10} textAnchor="middle" fontSize="7" fill="#aeaeb2">
                    {fmtShort(msToLocalDate(ms))}
                  </text>
                ));
              })()}

              {/* Tooltip — date + averaged value, plus every raw reading that
                  went into it (a day can hold more than one sitting). */}
              {tip && (() => {
                const TW = 96, TR = 3;
                const rowH = 6.5;
                const headH = 21; // date line + big avg line
                const TH = headH + (tip.readings.length ? 5 + tip.readings.length * rowH : 0) + 4;
                const tx = Math.max(PAD.l, Math.min(tip.x - TW / 2, PAD.l + cW - TW));
                const ty = PAD.t + 2;
                const { wd, mo, day } = fmtDate(tip.date);
                const colT = tx + 5, colS = tx + 46, colD = tx + 70;
                let row = ty + 7;
                return (
                  <g style={{ pointerEvents:'none' }}>
                    <line x1={tip.x} y1={PAD.t} x2={tip.x} y2={PAD.t + cH} stroke="rgba(28,28,30,.25)" strokeWidth="1" />
                    <rect x={tx} y={ty} width={TW} height={TH} rx={TR} fill="rgba(28,28,30,.9)" />
                    <text x={tx+5} y={row} fontSize="5" fill="rgba(255,255,255,.5)">
                      {wd} {mo} {day}{tip.readings.length > 1 ? ` · ${tip.readings.length} readings` : ''}
                    </text>
                    <text x={tx+5} y={row+=10} fontSize="8" fontWeight="700">
                      <tspan fill={BP_SYS_COLOR}>{Math.round(tip.systolic)}</tspan>
                      <tspan fill="rgba(255,255,255,.5)"> / </tspan>
                      <tspan fill={BP_DIA_COLOR}>{Math.round(tip.diastolic)}</tspan>
                    </text>
                    {tip.readings.length > 0 && (
                      <>
                        <text x={colT} y={row+=8} fontSize="4.5" fill="rgba(255,255,255,.35)">TIME</text>
                        <text x={colS} y={row} fontSize="4.5" fill="rgba(255,255,255,.35)">SYS</text>
                        <text x={colD} y={row} fontSize="4.5" fill="rgba(255,255,255,.35)">DIA</text>
                        {tip.readings.map((r, i) => (
                          <g key={r.ms}>
                            <text x={colT} y={row + (i+1) * rowH} fontSize="5" fill="rgba(255,255,255,.85)">{fmtTime(r.ms)}</text>
                            <text x={colS} y={row + (i+1) * rowH} fontSize="5" fill={BP_SYS_COLOR}>{Math.round(r.systolic)}</text>
                            <text x={colD} y={row + (i+1) * rowH} fontSize="5" fill={BP_DIA_COLOR}>{Math.round(r.diastolic)}</text>
                          </g>
                        ))}
                      </>
                    )}
                  </g>
                );
              })()}
            </svg>
          ) : (
            <div style={{ padding:'24px 16px', textAlign:'center', color:'#aeaeb2', fontSize:13 }}>
              No readings in this range.
            </div>
          )}

          {/* Legend */}
          <div style={{ display:'flex', gap:14, alignItems:'center', justifyContent:'center',
                        padding:'4px 14px 10px', fontSize:10, color:'#8e8e93' }}>
            <span><span style={swatch(BP_SYS_COLOR)} />Systolic</span>
            <span><span style={swatch(BP_DIA_COLOR)} />Diastolic</span>
            {viewMode === 'graph' && <span style={{ color:'#c7c7cc' }}>Hover a point for readings</span>}
          </div>

          {/* Share */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', padding:'6px 14px 10px' }}>
            <button onClick={shareChart} disabled={sharing}
                    style={{ display:'flex', alignItems:'center', gap:4, fontSize:11, fontWeight:600,
                             color:'#4a90d9', background:'#f0f6ff', border:'none', borderRadius:12,
                             padding:'4px 10px', cursor: sharing ? 'default' : 'pointer', opacity: sharing ? .6 : 1 }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4a90d9" strokeWidth="2.2"
                   strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .09 1.74L8.91 9.13a3 3 0 1 0 0 5.74l6.18 3.39A3 3 0 1 0 18 16a3 3 0 0 0-2.6 1.51l-6.19-3.4a3 3 0 0 0 0-.22l6.19-3.4A3 3 0 0 0 18 8z" />
              </svg>
              {sharing ? 'Sharing…' : 'Share'}
            </button>
          </div>
        </div>
      );
    }

    /* ─── Rides Chart ────────────────────────────────────────────────────────── */
    function RidesChart({ ridesData }) {
      const [rangeMode, setRangeMode] = useState('30d');
      const [customDays, setCustomDays] = useState(30);
      const [windowOffset, setWindowOffset] = useState(0);
      const [tip, setTip] = useState(null);
      const [selectedDate, setSelectedDate] = useState(null);
      const [sharing, setSharing] = useState(false);
      const svgRef = useRef(null);
      const rideCardsRef = useRef(null);
      useEffect(() => {
        if (selectedDate && rideCardsRef.current) {
          rideCardsRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, [selectedDate]);
      const selectRange = mode => { setRangeMode(mode); setWindowOffset(0); setSelectedDate(null); };

      const sorted = Object.values(ridesData)
        .filter(d => d.totalDurSecs > 0)
        .sort((a, b) => a.date.localeCompare(b.date));

      if (sorted.length === 0) return null;

      const VW = 360, VH = 140;
      const PAD = { t: 10, r: 8, b: 28, l: 40 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;
      const STEP = 86400000;

      const todayMs = new Date().setHours(0, 0, 0, 0);
      const startMs = new Date(sorted[0].date + 'T00:00:00').getTime();

      const windowDays = windowDaysForRange(rangeMode, customDays);
      const refEnd = todayMs + STEP;
      const pageShift = windowOffset * windowDays * STEP;
      const visStartMs = windowDays ? refEnd - windowDays * STEP - pageShift : startMs;
      const visEndMs   = windowDays ? refEnd - pageShift : todayMs + STEP;
      const canScrollEarlier = windowDays && startMs < visStartMs;
      const canScrollLater   = windowDays && windowOffset > 0;

      const pts = sorted.filter(d => {
        const ms = new Date(d.date + 'T00:00:00').getTime();
        return ms >= visStartMs && ms < visEndMs;
      }).map(d => ({ ...d, ms: new Date(d.date + 'T00:00:00').getTime() }));

      const periodData = sorted.filter(d => {
        const ms = new Date(d.date + 'T00:00:00').getTime();
        return ms >= visStartMs && ms < visEndMs;
      });
      const totalDurSecs = periodData.reduce((s, d) => s + d.totalDurSecs, 0);
      const totalDistMi  = periodData.reduce((s, d) => s + d.totalDistM, 0) / 1609.34;
      const totalCal     = periodData.reduce((s, d) => s + d.totalCal, 0);
      const periodRangeStr = `${fmtShort(msToLocalDate(visStartMs))} – ${fmtShort(msToLocalDate(Math.min(todayMs, visEndMs)))}`;

      const fmtDur = secs => {
        const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
        return h > 0 ? `${h}h ${m}m` : `${m}m`;
      };

      const maxMins = Math.max(...pts.map(p => p.totalDurSecs / 60), 1);
      const yMax = maxMins * 1.15;

      const xOf = ms  => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const yOf = min => PAD.t + cH - (min / yMax) * cH;

      const slotW = cW / Math.max(1, pts.length);
      const barW  = Math.max(0.5, Math.min(4, slotW * 0.6));

      // Y-axis labels in h:mm or mm format
      const yTicks = [];
      const tickStep = yMax > 180 ? 60 : yMax > 60 ? 30 : 15;
      for (let v = 0; v <= yMax; v += tickStep) yTicks.push(v);

      // Share
      const shareChart = async () => {
        if (!svgRef.current || sharing) return;
        setSharing(true);
        try {
          const scale = 3, headerH = 54;
          const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif";
          const svgClone = svgRef.current.cloneNode(true);
          svgClone.setAttribute('width', VW * scale);
          svgClone.setAttribute('height', VH * scale);
          const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
          styleEl.textContent = `text { font-family: ${FONT}; }`;
          svgClone.insertBefore(styleEl, svgClone.firstChild);
          const svgString = new XMLSerializer().serializeToString(svgClone);
          const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
          const img = new Image();
          await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = svgUrl; });
          const canvas = document.createElement('canvas');
          canvas.width = VW * scale; canvas.height = (VH + headerH) * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#1c1c1e'; ctx.font = `700 13px ${FONT}`;
          ctx.fillText('My Rides', 14, 18);
          ctx.fillStyle = '#4a90d9'; ctx.font = `700 10px ${FONT}`;
          ctx.fillText(`${fmtDur(totalDurSecs)} · ${totalDistMi.toFixed(1)} mi · ${Math.round(totalCal).toLocaleString()} cal`, 14, 34);
          ctx.fillStyle = '#8e8e93'; ctx.font = `400 9px ${FONT}`;
          ctx.fillText(periodRangeStr, 14, 46);
          ctx.drawImage(img, 0, headerH, VW, VH);
          const fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const file = new File([fileBlob], 'rides.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'My Rides', text: `${fmtDur(totalDurSecs)} · ${totalDistMi.toFixed(1)} mi · ${periodRangeStr}` });
          } else {
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = url; a.download = 'rides.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        } catch (e) { if (e.name !== 'AbortError') console.warn('[RidesChart] share failed:', e); }
        finally { setSharing(false); }
      };

      return (
        <div>
          {/* Controls */}
          <div style={{ display:'flex', gap:6, padding:'8px 14px 4px', alignItems:'center' }}>
            <select value={rangeMode} onChange={e => selectRange(e.target.value)}
                    style={{ fontSize:10, fontWeight:600, padding:'5px 8px', borderRadius:8,
                             background:'#f2f2f7', color:'#3c3c43', border:'none', outline:'none', cursor:'pointer' }}>
              <option value="7d">7 Days</option>
              <option value="14d">14 Days</option>
              <option value="30d">Month</option>
              <option value="all">All</option>
              <option value="custom">Custom</option>
            </select>
            {rangeMode === 'custom' && (
              <input type="number" min="1" step="1" value={customDays}
                     onChange={e => setCustomDays(e.target.value)} placeholder="days"
                     style={{ width:56, fontSize:10, fontWeight:600, padding:'5px 6px', borderRadius:8,
                              border:'1px solid #d1d1d6', background:'#f9f9f9', color:'#1c1c1e', outline:'none' }} />
            )}
          </div>

          {/* Earlier/Later */}
          {windowDays !== 0 && (
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
                          padding:'0 14px 2px', fontSize:9, color:'#aeaeb2' }}>
              <button onClick={() => canScrollEarlier && setWindowOffset(o => o + 1)} disabled={!canScrollEarlier}
                      style={{ fontSize:9, fontWeight:600, padding:'2px 8px', borderRadius:6,
                               background: canScrollEarlier ? '#e5e5ea' : 'transparent',
                               color: canScrollEarlier ? '#3c3c43' : '#c7c7cc',
                               border:'none', cursor: canScrollEarlier ? 'pointer' : 'default' }}>← Earlier</button>
              <span>{new Date(visStartMs).toISOString().slice(5,10)} – {new Date(Math.min(todayMs, visEndMs)).toISOString().slice(5,10)}</span>
              <button onClick={() => canScrollLater && setWindowOffset(o => o - 1)} disabled={!canScrollLater}
                      style={{ fontSize:9, fontWeight:600, padding:'2px 8px', borderRadius:6,
                               background: canScrollLater ? '#e5e5ea' : 'transparent',
                               color: canScrollLater ? '#3c3c43' : '#c7c7cc',
                               border:'none', cursor: canScrollLater ? 'pointer' : 'default' }}>Later →</button>
            </div>
          )}

          {/* Chart */}
          <svg ref={svgRef} viewBox={`0 0 ${VW} ${VH}`}
               style={{ width:'100%', height:'auto', display:'block', overflow:'hidden', cursor:'pointer' }}
               onMouseMove={e => {
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = (e.clientX - rect.left) / rect.width * VW;
                 if (x < PAD.l || x > PAD.l + cW || pts.length === 0) { setTip(null); return; }
                 const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                 let idx = 0, minDist = Infinity;
                 pts.forEach((p, i) => { const d = Math.abs(p.ms - targetMs); if (d < minDist) { minDist = d; idx = i; } });
                 setTip({ ...pts[idx], x });
               }}
               onMouseLeave={() => setTip(null)}
               onClick={e => {
                 // Click anywhere in chart finds nearest data point — bars are too thin to click precisely
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = (e.clientX - rect.left) / rect.width * VW;
                 if (x < PAD.l || x > PAD.l + cW || pts.length === 0) return;
                 const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                 let idx = 0, minDist = Infinity;
                 pts.forEach((p, i) => { const d = Math.abs(p.ms - targetMs); if (d < minDist) { minDist = d; idx = i; } });
                 const date = pts[idx].date;
                 setSelectedDate(d => d === date ? null : date);
               }}>

            {/* Y grid + labels */}
            {yTicks.map(v => (
              <g key={v}>
                <line x1={PAD.l} y1={yOf(v)} x2={PAD.l + cW} y2={yOf(v)}
                      stroke="rgba(0,0,0,.05)" strokeWidth="0.5" />
                <text x={PAD.l - 3} y={yOf(v) + 2} textAnchor="end" fontSize="7" fill="#aeaeb2">
                  {v >= 60 ? `${Math.floor(v/60)}h` : `${v}m`}
                </text>
              </g>
            ))}

            {/* Axes */}
            <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="0.5" />
            <line x1={PAD.l} y1={PAD.t + cH} x2={PAD.l + cW} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="0.5" />

            {/* Bars */}
            {pts.map(p => {
              const x = xOf(p.ms);
              const mins = p.totalDurSecs / 60;
              return (
                <rect key={p.date}
                      x={x - barW / 2} y={yOf(mins)} width={barW} height={PAD.t + cH - yOf(mins)}
                      fill="#4a90d9" opacity="0.8" />
              );
            })}

            {/* X labels — calendar ticks spaced by time, not by ride-data density */}
            {(() => {
              const winMs = visEndMs - visStartMs;
              const tickMs = winMs > 60 * STEP ? 14 * STEP
                           : winMs > 20 * STEP ?  7 * STEP
                           :                       3 * STEP;
              const first = Math.ceil(visStartMs / tickMs) * tickMs;
              const ticks = [];
              for (let ms = first; ms <= visEndMs; ms += tickMs) ticks.push(ms);
              return ticks.map(ms => (
                <text key={ms} x={xOf(ms)} y={PAD.t + cH + 10} textAnchor="middle"
                      fontSize="7" fill="#aeaeb2">
                  {new Date(ms).toISOString().slice(5,10)}
                </text>
              ));
            })()}

            {/* Tooltip */}
            {tip && pts.length > 0 && (() => {
              const TW = 90, TH = 57, TR = 3;
              const tx = Math.max(PAD.l, Math.min(tip.x - TW / 2, PAD.l + cW - TW));
              const ty = PAD.t + 2;
              const { wd, mo, day } = fmtDate(tip.date);
              const pwr = tip.rides.reduce((s, r) => r.pwr ? s + r.pwr : s, 0);
              const pwrN = tip.rides.filter(r => r.pwr).length;
              const hr  = tip.rides.reduce((s, r) => r.hr ? s + r.hr : s, 0);
              const hrN = tip.rides.filter(r => r.hr).length;
              let row = ty + 7;
              return (
                <g style={{ pointerEvents:'none' }}>
                  <line x1={xOf(tip.ms)} y1={PAD.t} x2={xOf(tip.ms)} y2={PAD.t + cH}
                        stroke="rgba(28,28,30,.25)" strokeWidth="1" />
                  <rect x={tx} y={ty} width={TW} height={TH} rx={TR} fill="rgba(28,28,30,.9)" />
                  <text x={tx+5} y={row} fontSize="5" fill="rgba(255,255,255,.5)">{wd} {mo} {day}</text>
                  <text x={tx+5} y={row+=9} fontSize="6.5" fontWeight="700" fill="#fff">{fmtDur(tip.totalDurSecs)}</text>
                  <text x={tx+5} y={row+=9} fontSize="6" fill="#aeaeb2">
                    <tspan fill="#6cb2ff">⬡ {(tip.totalDistM/1609.34).toFixed(1)} mi</tspan>
                    <tspan fill="#48484a">  </tspan>
                    <tspan fill="#ffb04d">🔥{Math.round(tip.totalCal)}</tspan>
                  </text>
                  <text x={tx+5} y={row+=9} fontSize="6" fill="#aeaeb2">
                    {pwrN ? <tspan fill="#bf5af2">⚡{Math.round(pwr/pwrN)}W</tspan> : <tspan>— W</tspan>}
                    <tspan fill="#48484a">  </tspan>
                    {hrN ? <tspan fill="#ff375f">♥ {Math.round(hr/hrN)} bpm</tspan> : <tspan>— bpm</tspan>}
                  </text>
                  <text x={tx+5} y={row+=9} fontSize="5" fill="rgba(255,255,255,.4)">
                    {tip.rides.length} {tip.rides.length === 1 ? 'activity' : 'activities'}
                  </text>
                </g>
              );
            })()}
          </svg>

          {/* Period stats */}
          <div style={{ display:'flex', padding:'8px 14px 4px', gap:12, alignItems:'flex-start' }}>
            <PkStat label="Time" value={fmtDur(totalDurSecs)} color="#4a90d9" />
            <PkStat label="Distance" value={totalDistMi.toFixed(1) + ' mi'} color="#ff9500" />
            <PkStat label="Calories" value={Math.round(totalCal).toLocaleString() + ' cal'} color="#8e73de" />
          </div>

          {/* Ride cards — visible after clicking a bar */}
          {selectedDate && ridesData[selectedDate] && (
            <div ref={rideCardsRef} style={{ padding:'8px 14px 12px', borderTop:'.5px solid rgba(0,0,0,.06)' }}>
              <div style={{ fontSize:11, fontWeight:600, color:'#8e8e93', marginBottom:8 }}>
                {(d => `${d.wd} ${d.mo} ${d.day}`)(fmtDate(selectedDate))}
              </div>
              {ridesData[selectedDate].rides.map((r, i) => {
                // intervals.icu activity URLs use an 'i' prefix: /activities/i162107047
                const actId  = r.id ? (String(r.id).startsWith('i') ? String(r.id) : `i${r.id}`) : null;
                const actUrl = actId ? `https://intervals.icu/activities/${actId}` : null;
                console.log('[RidesChart] ride', i, 'id:', r.id, '→ url:', actUrl);
                return (
                  <div key={String(r.id || i)}
                       style={{ padding:'10px 12px', borderRadius:10, background:'#f9f9f9',
                                marginBottom: i < ridesData[selectedDate].rides.length - 1 ? 8 : 0 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:'#1c1c1e', marginBottom:3 }}>
                      {r.sport && r.sport !== 'Ride' && r.sport !== 'VirtualRide' ? `${r.sport} · ` : ''}{r.name}
                    </div>
                    <div style={{ fontSize:11, color:'#8e8e93', marginBottom:8 }}>
                      {fmtDur(r.durSecs)} · {(r.distM / 1609.34).toFixed(1)} mi · 🔥{Math.round(r.cal)} cal
                      {r.pwr ? ` · ⚡${Math.round(r.pwr)}W` : ''}
                      {r.hr  ? ` · ♥ ${Math.round(r.hr)} bpm` : ''}
                    </div>
                    {actUrl ? (
                      <a href={actUrl} target="_blank" rel="noopener noreferrer"
                         style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:12,
                                  fontWeight:600, color:'#4a90d9', background:'#e8f0ff',
                                  borderRadius:8, padding:'5px 12px', textDecoration:'none' }}>
                        Open on Intervals.icu ↗
                      </a>
                    ) : (
                      <span style={{ fontSize:11, color:'#aeaeb2' }}>No link (id: {String(r.id)})</span>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* Share */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', padding:'6px 14px 10px' }}>
            <button onClick={shareChart} disabled={sharing}
                    style={{ display:'flex', alignItems:'center', gap:4, fontSize:11, fontWeight:600,
                             color:'#4a90d9', background:'#f0f6ff', border:'none', borderRadius:12,
                             padding:'4px 10px', cursor: sharing ? 'default' : 'pointer', opacity: sharing ? .6 : 1 }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4a90d9" strokeWidth="2.2"
                   strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .09 1.74L8.91 9.13a3 3 0 1 0 0 5.74l6.18 3.39A3 3 0 1 0 18 16a3 3 0 0 0-2.6 1.51l-6.19-3.4a3 3 0 0 0 0-.22l6.19-3.4A3 3 0 0 0 18 8z" />
              </svg>
              {sharing ? 'Preparing…' : 'Share'}
            </button>
          </div>
        </div>
      );
    }

    /* ─── PK Chart ───────────────────────────────────────────────────────────── */
    function PkChart({ injections, rows, isAdmin, injSchedule, onSaveSchedule }) {
      if (!injections.length) return null;
      const [tip, setTip] = useState(null); // { x, y, level, dateStr, wLbs }
      const [splitManual, setSplitManual] = useState(
        () => localStorage.getItem(LS_SPLIT_KEY) === 'true'
      );
      const [sharing,      setSharing]      = useState(false);
      const svgRef = useRef(null);
      const [rangeMode,    setRangeMode]    = useState('30d'); // '7d' | '14d' | '30d' | 'all' | 'custom'
      const [customDays,   setCustomDays]   = useState(30);
      const [windowOffset, setWindowOffset] = useState(0);
      const selectRange = (mode) => { setRangeMode(mode); setWindowOffset(0); };
      const toggleSplit = () => {
        const next = !splitManual;
        setSplitManual(next);
        localStorage.setItem(LS_SPLIT_KEY, String(next));
      };

      const sortedInj = [...injections].sort((a, b) => a.date.localeCompare(b.date));

      const startMs = new Date(sortedInj[0].date + 'T12:00:00').getTime();
      const todayD  = new Date(); todayD.setHours(12, 0, 0, 0);
      const todayMs = todayD.getTime();
      const endMs   = todayMs + 21 * 86400000;

      const windowDays       = windowDaysForRange(rangeMode, customDays);
      const refEnd           = windowDays ? todayMs - windowOffset * windowDays * 86400000 : null;
      const visStartMs       = (() => {
        if (windowDays) return refEnd - windowDays * 86400000;
        // "all" view: snap to first of the month so month labels land inside the chart
        const d = new Date(startMs); d.setDate(1); d.setHours(12, 0, 0, 0);
        return d.getTime();
      })();
      const visEndMs         = windowDays ? (windowOffset === 0 ? todayMs + 7 * 86400000 : refEnd) : todayMs + 7 * 86400000;
      const canScrollEarlier = !!windowDays && visStartMs > startMs;
      const canScrollLater   = windowOffset > 0;

      const STEP = 6 * 3600000;
      const pts  = [];
      for (let ms = startMs; ms <= endMs; ms += STEP) {
        pts.push({ ms, v: pkTotal(sortedInj, ms) });
      }
      const visPts = pts.filter(p => p.ms >= visStartMs && p.ms <= visEndMs);
      const weeklyPkPts = (() => {
        const weeks = {};
        pts.forEach(p => {
          const d = new Date(p.ms);
          const sun = new Date(d); sun.setDate(d.getDate() - d.getDay()); sun.setHours(12,0,0,0);
          const key = sun.getTime();
          if (!weeks[key]) weeks[key] = { ms: sun.getTime() + 3.5*86400000, sum: 0, n: 0 };
          weeks[key].sum += p.v; weeks[key].n++;
        });
        return Object.values(weeks).map(w => ({ ms: w.ms, v: w.sum/w.n })).sort((a,b) => a.ms - b.ms);
      })();
      const displayPts = (() => {
        const base = (rangeMode === 'all' ? weeklyPkPts : visPts).filter(p => p.ms <= visEndMs);
        if (rangeMode !== 'all') return base;
        // Weekly midpoints can fall before visStartMs when the week's Sunday is in the
        // prior month. Filter those out and anchor the line at (visStartMs, 0) instead.
        const visible = base.filter(p => p.ms >= visStartMs);
        return visible.length < base.length ? [{ ms: visStartMs, v: 0 }, ...visible] : visible;
      })();
      // Include visPts (full visible PK trajectory including near-future from current dose)
      // so the y-scale isn't clipped when a recent dose increase raises future peaks.
      const maxV = Math.max(...displayPts.map(p => p.v), ...visPts.map(p => p.v), 0.01);
      const yMax = maxV * 1.5; // 50% headroom so scheduled-injection projected peaks don't touch the top

      const VW = 360, VH = 190;
      const PAD = { t: 18, r: 40, b: rangeMode === 'all' ? 22 : 60, l: 36 };
      const cW  = VW - PAD.l - PAD.r;
      const cH  = VH - PAD.t - PAD.b;

      // Weight line: all data for y-axis scaling; visible/averaged subset for display
      const wAllPts = (rows ?? [])
        .map(r => ({ ms: new Date(r.date + 'T12:00:00').getTime(), lbs: r.lbs }))
        .filter(p => p.ms >= startMs && p.ms <= todayMs)
        .sort((a, b) => a.ms - b.ms);
      const wVals = wAllPts.map(p => p.lbs);
      const wMin  = wVals.length ? Math.min(...wVals) : 0;
      const wMax  = wVals.length ? Math.max(...wVals) : 1;
      const wPad  = Math.max((wMax - wMin) * 0.15, 2);
      const wLo   = wMin - wPad;
      const wHi   = wMax + wPad;
      const yOfW  = lbs => PAD.t + cH - ((lbs - wLo) / (wHi - wLo)) * cH;
      const wWeeklyPts = (() => {
        const weeks = {};
        wAllPts.forEach(p => {
          const d = new Date(p.ms);
          const sun = new Date(d); sun.setDate(d.getDate() - d.getDay()); sun.setHours(12,0,0,0);
          const key = sun.getTime();
          if (!weeks[key]) weeks[key] = { ms: sun.getTime() + 3.5*86400000, sum: 0, n: 0 };
          weeks[key].sum += p.lbs; weeks[key].n++;
        });
        return Object.values(weeks).map(w => ({ ms: w.ms, lbs: w.sum/w.n })).sort((a,b) => a.ms - b.ms);
      })();
      const wPts = (() => {
        if (rangeMode !== 'all') {
          return wAllPts.filter(p => p.ms >= visStartMs && p.ms <= Math.min(todayMs, visEndMs));
        }
        // Anchor the line at visStartMs (mirrors the PK line's anchor fix above) so it
        // reaches the left edge whether the earliest weekly bucket's midpoint falls
        // after visStartMs (weight logging started a few days into the month — the
        // common case) or before it (week's Sunday in the prior month). Either way,
        // hold flat at the nearest known weight rather than leaving a gap.
        const visible = wWeeklyPts.filter(p => p.ms >= visStartMs);
        if (!wWeeklyPts.length || (visible.length && visible[0].ms === visStartMs)) return visible;
        const prior = wWeeklyPts.filter(p => p.ms < visStartMs);
        const anchorLbs = prior.length ? prior[prior.length - 1].lbs : wWeeklyPts[0].lbs;
        return [{ ms: visStartMs, lbs: anchorLbs }, ...visible];
      })();

      // Interpolate weight at any ms for tooltip
      const interpW = (ms) => {
        if (!wAllPts.length) return null;
        let lo = null, hi = null;
        for (const p of wAllPts) {
          if (p.ms <= ms) lo = p; else if (!hi) hi = p;
        }
        if (!lo && !hi) return null;
        if (!lo) return hi.lbs;
        if (!hi) return lo.lbs;
        return lo.lbs + (ms - lo.ms) / (hi.ms - lo.ms) * (hi.lbs - lo.lbs);
      };

      // Period summary stats — average on-board level from the full-resolution
      // `pts` (not `displayPts`, which is weekly-bucketed and zero-anchored in 'all' mode).
      const periodPts = pts.filter(p => p.ms >= visStartMs && p.ms <= visEndMs);
      const avgOnBoard = periodPts.length
        ? periodPts.reduce((s, p) => s + p.v, 0) / periodPts.length
        : 0;

      // Weight change over the period, using the smoothed 7-day moving average
      // (movAvg) for consistency with the rest of the app's trend calculations.
      const wMaAllPts = (rows ?? [])
        .map(r => ({ ms: new Date(r.date + 'T12:00:00').getTime(), ma: r.movAvg }))
        .filter(p => p.ms >= startMs && p.ms <= todayMs && p.ma != null)
        .sort((a, b) => a.ms - b.ms);
      const interpMovAvg = (ms) => {
        if (!wMaAllPts.length) return null;
        let lo = null, hi = null;
        for (const p of wMaAllPts) {
          if (p.ms <= ms) lo = p; else if (!hi) hi = p;
        }
        if (!lo && !hi) return null;
        if (!lo) return hi.ma;
        if (!hi) return lo.ma;
        return lo.ma + (ms - lo.ms) / (hi.ms - lo.ms) * (hi.ma - lo.ma);
      };
      // Use raw weight interpolation (interpW) to match the tooltip's calculation
      // — interpMovAvg uses the 7-day smoothed series which diverges by ~1 lb.
      const periodStartW = interpW(Math.max(visStartMs, startMs));
      const periodEndW   = interpW(Math.min(visEndMs, todayMs));
      const periodWeightChange = (periodStartW != null && periodEndW != null)
        ? periodEndW - periodStartW
        : null;

      const xOf = ms => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const yOf = v  => PAD.t + cH - Math.min(v / yMax, 1) * cH;

      const monthTicks = (() => {
        const ticks = [];
        const d = new Date(visStartMs); d.setDate(1); d.setHours(12,0,0,0);
        while (d.getTime() <= visEndMs) {
          ticks.push({ ms: d.getTime(), label: MO[d.getMonth()] + ' \'' + String(d.getFullYear()).slice(2) });
          d.setMonth(d.getMonth() + 1);
        }
        return ticks;
      })();

      const line = displayPts.map((p, i) =>
        `${i === 0 ? 'M' : 'L'}${xOf(p.ms).toFixed(1)},${yOf(p.v).toFixed(1)}`
      ).join(' ');
      const area = `${line} L${xOf(visEndMs).toFixed(1)},${(PAD.t+cH).toFixed(1)} L${xOf(visStartMs).toFixed(1)},${(PAD.t+cH).toFixed(1)} Z`;

      const todayX   = xOf(todayMs);
      const curLevel = pkTotal(sortedInj, todayMs);

      const ds = getDoseSchedule(injections, injSchedule);
      const { lastInjMs, injInterval, scheduleActive, injPerWeek, weeklyDose } = ds;
      const nextInjMs = ds.nextInjMs;

      // All upcoming injection dates within the visible window
      const upcomingInjMs = (() => {
        if (scheduleActive) {
          const dates = [];
          let after = lastInjMs;
          for (let i = 0; i < 10; i++) {
            const ms = nextScheduledMs(after, injSchedule, lastInjMs);
            if (!ms || ms > visEndMs) break;
            dates.push(ms);
            after = ms;
          }
          return dates;
        }
        return nextInjMs <= visEndMs ? [nextInjMs] : [];
      })();
      const troughLevel = pkTotal(sortedInj, nextInjMs - 3600000);

      // Future projection: PK curve + interval averages assuming scheduled doses at current dose
      const lastDoseMg = ds.lastDose;
      const projInjs = scheduleActive
        ? [...sortedInj, ...upcomingInjMs.map(ms => ({ _ms: ms, doseMg: lastDoseMg }))]
        : sortedInj;
      const projPts = scheduleActive && upcomingInjMs.length > 0 ? (() => {
        const ps = [];
        for (let ms = todayMs; ms <= visEndMs; ms += STEP) {
          ps.push({ ms, v: pkTotal(projInjs, ms) });
        }
        return ps;
      })() : [];
      const futureIntervalAvgs = scheduleActive && projPts.length > 0
        ? upcomingInjMs.map((ms, i) => {
            const iEnd = upcomingInjMs[i + 1] ?? visEndMs;
            const iPts = projPts.filter(p => p.ms >= ms && p.ms < iEnd);
            const mean = iPts.length ? iPts.reduce((s, p) => s + p.v, 0) / iPts.length : 0;
            return { startMs: ms, endMs: iEnd, mean };
          }).filter(s => s.mean > 0)
        : [];

      const yTicks = [maxV * 0.5, maxV];
      const yLabelPivot = PAD.t + cH + 4; // baseline for rotated injection labels

      // Weekly grid lines aligned to calendar Sundays (for 30d/60d views)
      const xWeekTicks = [];
      const firstSun = new Date(visStartMs); firstSun.setHours(12, 0, 0, 0);
      firstSun.setDate(firstSun.getDate() - firstSun.getDay());
      for (let tw = new Date(firstSun); tw.getTime() <= visEndMs; tw.setDate(tw.getDate() + 7)) {
        if (tw.getTime() >= visStartMs) xWeekTicks.push(tw.getTime());
      }

      // Per-injection-interval average; last interval extends to next scheduled injection
      const intervalAvgs = sortedInj.map((inj, i) => {
        const iStart = new Date(inj.date + 'T12:00:00').getTime();
        const iEnd   = i < sortedInj.length - 1
          ? new Date(sortedInj[i + 1].date + 'T12:00:00').getTime()
          : nextInjMs;
        const iPts = pts.filter(p => p.ms >= iStart && p.ms <= iEnd);
        const mean = iPts.length ? iPts.reduce((s, p) => s + p.v, 0) / iPts.length : 0;
        return { startMs: iStart, endMs: iEnd, mean, isLast: i === sortedInj.length - 1 };
      }).filter(s => s.mean > 0);

      const handleMouseMove = (e) => {
        const rect  = e.currentTarget.getBoundingClientRect();
        const svgX  = (e.clientX - rect.left) / rect.width * VW;
        if (svgX < PAD.l || svgX > PAD.l + cW) { setTip(null); return; }
        const frac    = (svgX - PAD.l) / cW;
        const ms      = visStartMs + frac * (visEndMs - visStartMs);
        const level   = pkTotal(sortedInj, ms);
        const wLbs    = interpW(ms);
        const dateStr = new Date(ms).toISOString().slice(0, 10);
        const seg     = intervalAvgs.find(s => ms >= s.startMs && ms <= s.endMs);
        const segAvg  = seg ? seg.mean : null;
        setTip({ x: svgX, y: yOf(level), level, dateStr, wLbs, segAvg });
      };

      // Tooltip box dimensions
      const TW = 62, TR = 4;

      const shareChart = async () => {
        if (!svgRef.current || sharing) return;
        setSharing(true);
        try {
          const scale = 3, headerH = 48;
          const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif";
          const svgClone = svgRef.current.cloneNode(true);
          svgClone.setAttribute('width', VW * scale);
          svgClone.setAttribute('height', VH * scale);
          const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
          styleEl.textContent = `text { font-family: ${FONT}; }`;
          svgClone.insertBefore(styleEl, svgClone.firstChild);
          const svgString = new XMLSerializer().serializeToString(svgClone);
          const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
          const img = new Image();
          await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = svgUrl; });
          const canvas = document.createElement('canvas');
          canvas.width = VW * scale; canvas.height = (VH + headerH) * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#1c1c1e'; ctx.font = `700 13px ${FONT}`;
          ctx.fillText('Tirzepatide · Drug on Board', 14, 18);
          ctx.fillStyle = '#4a90d9'; ctx.font = `700 10px ${FONT}`;
          ctx.fillText(`On board now: ${curLevel.toFixed(2)} mg · Weekly dose: ${round1(weeklyDose)} mg`, 14, 34);
          ctx.fillStyle = '#8e8e93'; ctx.font = `400 9px ${FONT}`;
          ctx.fillText(`Trough: ${troughLevel.toFixed(2)} mg · ${fmtShort(msToLocalDate(nextInjMs))}`, 14, 44);
          ctx.drawImage(img, 0, headerH, VW, VH);
          const fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const file = new File([fileBlob], 'tirz-on-board.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Tirzepatide · Drug on Board',
              text: `On board now: ${curLevel.toFixed(2)} mg · ${round1(weeklyDose)} mg/wk` });
          } else {
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = url; a.download = 'tirz-on-board.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        } catch (e) { if (e.name !== 'AbortError') console.warn('[PkChart] share failed:', e); }
        finally { setSharing(false); }
      };

      return (
        <div>


          {/* View range selector */}
          <div style={{ display: 'flex', gap: 6, padding: '8px 14px 4px', alignItems: 'center' }}>
            <select value={rangeMode} onChange={e => selectRange(e.target.value)}
                    style={{ fontSize: 11, fontWeight: 600, padding: '5px 8px', borderRadius: 10,
                             background: '#e5e5ea', color: '#3c3c43', border: 'none', outline: 'none', cursor: 'pointer' }}>
              <option value="7d">7 Days</option>
              <option value="14d">14 Days</option>
              <option value="30d">Month</option>
              <option value="all">All · Weekly</option>
              <option value="custom">Custom</option>
            </select>
            {rangeMode === 'custom' && (
              <input type="number" min="1" step="1" value={customDays}
                     onChange={e => setCustomDays(e.target.value)}
                     placeholder="days"
                     style={{ width: 60, fontSize: 11, fontWeight: 600, padding: '5px 6px', borderRadius: 10,
                              border: '1px solid #d1d1d6', background: '#f9f9f9', color: '#1c1c1e', outline: 'none' }} />
            )}
          </div>
          {rangeMode !== 'all' && (
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                          padding: '0 14px 2px' }}>
              <button onClick={() => canScrollEarlier && setWindowOffset(o => o + 1)}
                      disabled={!canScrollEarlier}
                      style={{ fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 10,
                               background: canScrollEarlier ? '#e5e5ea' : 'transparent',
                               color: canScrollEarlier ? '#3c3c43' : '#c7c7cc',
                               border: 'none', cursor: canScrollEarlier ? 'pointer' : 'default' }}>
                ← Earlier
              </button>
              <span style={{ fontSize: 10, color: '#aeaeb2' }}>
                {fmtShort(msToLocalDate(visStartMs))} – {fmtShort(msToLocalDate(Math.min(todayMs, visEndMs)))}
              </span>
              <button onClick={() => canScrollLater && setWindowOffset(o => o - 1)}
                      disabled={!canScrollLater}
                      style={{ fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 10,
                               background: canScrollLater ? '#e5e5ea' : 'transparent',
                               color: canScrollLater ? '#3c3c43' : '#c7c7cc',
                               border: 'none', cursor: canScrollLater ? 'pointer' : 'default' }}>
                Later →
              </button>
            </div>
          )}

          <svg ref={svgRef} viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', height: 'auto', display: 'block', cursor: 'crosshair', overflow: 'hidden' }}
               onMouseMove={handleMouseMove}
               onMouseLeave={() => setTip(null)}>

            {rangeMode !== 'all' && xWeekTicks.map(ms => (
              <line key={ms} x1={xOf(ms)} y1={PAD.t} x2={xOf(ms)} y2={PAD.t + cH}
                    stroke="rgba(0,0,0,.08)" strokeWidth="0.6" />
            ))}
            {rangeMode === 'all' && monthTicks.map(({ ms }) => (
              <line key={ms} x1={xOf(ms)} y1={PAD.t} x2={xOf(ms)} y2={PAD.t + cH}
                    stroke="rgba(0,0,0,.08)" strokeWidth="0.6" />
            ))}
            {yTicks.map((v, i) => (
              <line key={i} x1={PAD.l} y1={yOf(v)} x2={PAD.l + cW} y2={yOf(v)}
                    stroke="rgba(0,0,0,.06)" strokeWidth="1" />
            ))}
            {todayMs >= visStartMs && todayMs <= visEndMs && (
              <rect x={todayX} y={PAD.t} width={Math.max(0, xOf(visEndMs) - todayX)} height={cH}
                    fill="rgba(0,0,0,.025)" />
            )}
            <path d={area} fill="#4a90d9" opacity="0.10" />
            <path d={line} fill="none" stroke="#4a90d9" strokeWidth="1.5" strokeLinejoin="round" />

            {/* Future projected PK curve — dashed, same algorithm, next scheduled injections */}
            {projPts.length > 1 && (
              <path d={projPts.map((p, i) =>
                        `${i === 0 ? 'M' : 'L'}${xOf(p.ms).toFixed(1)},${Math.max(PAD.t, yOf(p.v)).toFixed(1)}`
                      ).join(' ')}
                    fill="none" stroke="#4a90d9" strokeWidth="1.5"
                    strokeLinejoin="round" strokeDasharray="5,3" opacity="0.6" />
            )}

            {/* Future interval averages — dashed purple */}
            {futureIntervalAvgs.map((seg, i) => {
              const x1 = Math.max(PAD.l, xOf(seg.startMs));
              const x2 = Math.min(PAD.l + cW, xOf(seg.endMs));
              if (x2 <= x1) return null;
              return (
                <g key={i}>
                  <rect x={x1} y={yOf(seg.mean)} width={x2 - x1}
                        height={Math.max(0, (PAD.t + cH) - yOf(seg.mean))}
                        fill="#b06dff" opacity="0.04" />
                  <line x1={x1} y1={yOf(seg.mean)} x2={x2} y2={yOf(seg.mean)}
                        stroke="#b06dff" strokeWidth="1" opacity="0.4"
                        strokeLinecap="round" strokeDasharray="3,2" />
                </g>
              );
            })}

            {/* Per-interval average bars; last segment split at today: solid past, dashed future */}
            {rangeMode !== 'all' && intervalAvgs.map((seg, i) => {
              const x1  = Math.max(PAD.l, xOf(seg.startMs));
              const x2  = Math.min(PAD.l + cW, xOf(seg.endMs));
              if (x2 <= x1) return null;
              const xNow = seg.isLast ? Math.max(x1, Math.min(xOf(todayMs), x2)) : x2;
              const y    = yOf(seg.mean);
              const h    = Math.max(0, (PAD.t + cH) - y);
              return (
                <g key={i}>
                  {/* Solid historical portion */}
                  <rect x={x1} y={y} width={xNow - x1} height={h} fill="#b06dff" opacity="0.08" />
                  <line x1={x1} y1={y} x2={xNow} y2={y}
                        stroke="#b06dff" strokeWidth="1" opacity="0.55" strokeLinecap="round" />
                  {/* Dashed future portion (last interval only, today → nextInjMs) */}
                  {seg.isLast && xNow < x2 && (
                    <g>
                      <rect x={xNow} y={y} width={x2 - xNow} height={h} fill="#b06dff" opacity="0.04" />
                      <line x1={xNow} y1={y} x2={x2} y2={y}
                            stroke="#b06dff" strokeWidth="1" opacity="0.45"
                            strokeLinecap="round" strokeDasharray="3,2" />
                    </g>
                  )}
                </g>
              );
            })}

            {/* Weight line (right axis) */}
            {wPts.length > 1 && (
              <polyline
                points={wPts.map(p => `${xOf(p.ms).toFixed(1)},${yOfW(p.lbs).toFixed(1)}`).join(' ')}
                fill="none" stroke="#34c759" strokeWidth="1" strokeLinejoin="round" opacity="0.85" />
            )}
            {wPts.length === 1 && (
              <circle cx={xOf(wPts[0].ms)} cy={yOfW(wPts[0].lbs)} r="2" fill="#34c759" />
            )}

            {/* Right Y axis — weight */}
            {wAllPts.length > 0 && (() => {
              const rx   = PAD.l + cW;
              const ticks = [wLo + wPad, (wLo + wHi) / 2, wHi - wPad].map(v => Math.round(v * 10) / 10);
              return (
                <g>
                  <line x1={rx} y1={PAD.t} x2={rx} y2={PAD.t + cH} stroke="rgba(52,198,89,.3)" strokeWidth="0.7" />
                  {ticks.map((v, i) => (
                    <g key={i}>
                      <line x1={rx} y1={yOfW(v)} x2={rx + 3} y2={yOfW(v)} stroke="rgba(52,198,89,.4)" strokeWidth="0.7" />
                      <text x={rx + 5} y={yOfW(v) + 2.5} fontSize="4.5" fill="#34c759" opacity="0.8">{Math.round(v)}</text>
                    </g>
                  ))}
                  <text x={rx + 24} y={PAD.t + cH / 2} fontSize="4" fill="#34c759" opacity="0.6"
                        textAnchor="middle" transform={`rotate(90, ${rx + 24}, ${PAD.t + cH / 2})`}>lbs</text>
                </g>
              );
            })()}

            {rangeMode !== 'all' && sortedInj.filter(inj => {
              const ms = new Date(inj.date + 'T12:00:00').getTime();
              return ms >= visStartMs && ms <= visEndMs;
            }).map(inj => {
              const ms = new Date(inj.date + 'T12:00:00').getTime();
              const x  = xOf(ms);
              const y  = yOf(pkTotal(sortedInj, ms));
              const { mo, day } = fmtDate(inj.date);
              return (
                <g key={inj.date}>
                  <line x1={x} y1={PAD.t} x2={x} y2={PAD.t + cH}
                        stroke="#4a90d9" strokeWidth="0.7" strokeDasharray="3,2" opacity="0.45" />
                  <circle cx={x} cy={y} r="2" fill="#fff" stroke="#4a90d9" strokeWidth="1" />
                  <text x={x} y={yLabelPivot} textAnchor="end" fontSize="5" fill="#4a90d9"
                        transform={`rotate(-90, ${x}, ${yLabelPivot})`}>
                    {mo} {day} · {inj.doseMg} mg
                  </text>
                </g>
              );
            })}

            {rangeMode !== 'all' && upcomingInjMs.map(ms => {
              const nx = xOf(ms);
              if (nx < PAD.l || nx > PAD.l + cW) return null;
              return (
                <g key={ms}>
                  <line x1={nx} y1={PAD.t} x2={nx} y2={PAD.t + cH}
                        stroke="#4a90d9" strokeWidth="0.7" strokeDasharray="2,3" opacity="0.25" />
                  <text x={nx} y={yLabelPivot} textAnchor="end" fontSize="5" fill="#4a90d9" opacity="0.45"
                        transform={`rotate(-90, ${nx}, ${yLabelPivot})`}>
                    {fmtShort(msToLocalDate(ms))}{scheduleActive ? '' : ' · next?'}
                  </text>
                </g>
              );
            })}

            {todayMs >= visStartMs && todayMs <= visEndMs && (
              <g>
                <line x1={todayX} y1={PAD.t} x2={todayX} y2={PAD.t + cH} stroke="#ff6b35" strokeWidth="1" />
                <circle cx={todayX} cy={yOf(curLevel)} r="2.5" fill="#ff6b35" stroke="#fff" strokeWidth="1" />
                <text x={todayX + 4} y={PAD.t + 7} fontSize="5" fill="#ff6b35" fontWeight="600">today</text>
              </g>
            )}
