    function SyringeGraphic({ doseMg, concentration = 12.5, color = '#4a90d9', maxUnits = 100 }) {
      const units = doseMg > 0 ? Math.round(doseMg / concentration * 100 * 10) / 10 : 0;
      const ml    = doseMg > 0 ? (doseMg / concentration).toFixed(2) : '—';
      const syringeMax = maxUnits;
      const pct   = Math.min(units / syringeMax, 1);
      const uid   = `syr${Math.round(doseMg*1000)}_${Math.round(concentration*100)}`;

      const VW = 360, VH = 108;
      const bx = 80, by = 42, bw = 210, bh = 28;
      const ncy   = by + bh / 2;
      const fillW = pct * bw;
      // Gasket left edge (face touching liquid) aligns with the dose mark.
      // The gasket extends rightward from there, which is anatomically correct.
      const gaskL = Math.max(bx + 2, bx + fillW);
      const gaskR = gaskL + 10;

      return (
        <svg viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
          <defs>
            <clipPath id={`${uid}c`}>
              <rect x={bx} y={by} width={bw} height={bh} />
            </clipPath>
            <linearGradient id={`${uid}f`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor={color} stopOpacity="0.14" />
              <stop offset="50%"  stopColor={color} stopOpacity="0.34" />
              <stop offset="100%" stopColor={color} stopOpacity="0.22" />
            </linearGradient>
          </defs>

          {/* ── Needle: top edge longer than bottom — classic bevel tip ── */}
          <line x1={12} y1={ncy - 1.4} x2={70} y2={ncy - 1.4}
                stroke="#b8b8c8" strokeWidth="1.8" strokeLinecap="square" />
          <line x1={28} y1={ncy + 1.4} x2={70} y2={ncy + 1.4}
                stroke="#a8a8b8" strokeWidth="1.2" strokeLinecap="square" />
          <line x1={12} y1={ncy - 1.4} x2={28} y2={ncy + 1.4}
                stroke="#9898a8" strokeWidth="0.9" />

          {/* ── Hub (needle-to-barrel connector) ── */}
          <rect x={62} y={ncy - 9} width={13} height={18} rx={2}
                fill="#c4c4d6" stroke="#acacc0" strokeWidth="0.7" />
          <line x1={66} y1={ncy - 9} x2={66} y2={ncy + 9} stroke="rgba(255,255,255,.5)" strokeWidth="1" />
          <line x1={70} y1={ncy - 9} x2={70} y2={ncy + 9} stroke="rgba(255,255,255,.35)" strokeWidth="1" />

          {/* ── Left barrel flange ── */}
          <rect x={bx - 5} y={by - 5} width={7} height={bh + 10} rx={3}
                fill="#cacada" stroke="#b8b8ca" strokeWidth="0.5" />

          {/* ── Barrel background ── */}
          <rect x={bx} y={by} width={bw} height={bh} fill="#eeeefb" />

          {/* Liquid fill — full inner height ── */}
          {fillW > 0 && (
            <rect x={bx} y={by} width={fillW} height={bh}
                  fill={`url(#${uid}f)`} clipPath={`url(#${uid}c)`} />
          )}

          {/* Subtle sheen at very top only */}
          <rect x={bx} y={by} width={bw} height={4}
                fill="rgba(255,255,255,.58)" clipPath={`url(#${uid}c)`} />

          {/* ── Tick marks from top edge down ── */}
          {Array.from({ length: syringeMax / 5 + 1 }, (_, i) => i * 5).map(u => {
            const tx  = bx + (u / syringeMax) * bw;
            const big = u % (syringeMax / 3 < 10 ? 10 : 20) === 0, med = u % 10 === 0;
            const h   = big ? 12 : med ? 8 : 5;
            return (
              <line key={u} x1={tx} y1={by} x2={tx} y2={by + h}
                    stroke={u / syringeMax < pct ? 'rgba(255,255,255,.78)' : '#9898b2'}
                    strokeWidth={big ? 1.4 : med ? 1.0 : 0.65} />
            );
          })}

          {/* ── Number labels above barrel ── */}
          {Array.from({ length: syringeMax / 10 }, (_, i) => (i + 1) * 10).map(u => (
            <text key={u} x={bx + (u / syringeMax) * bw} y={by - 4}
                  textAnchor="middle" fontSize={7.5} fill="#9090a8">{u}</text>
          ))}

          {/* Barrel border */}
          <rect x={bx} y={by} width={bw} height={bh}
                fill="none" stroke="#b0b0c6" strokeWidth="1" />

          {/* ── Right barrel flange ── */}
          <rect x={bx + bw - 2} y={by - 5} width={7} height={bh + 10} rx={3}
                fill="#cacada" stroke="#b8b8ca" strokeWidth="0.5" />

          {/* ── Gasket (rubber stopper — spans full inner height) ── */}
          <rect x={gaskL} y={by + 1} width={10} height={bh - 2} rx={2.5}
                fill="#262636" />
          <rect x={gaskL} y={by + 1} width={3.5} height={bh - 2} rx={1.5}
                fill="#40404e" />
          <line x1={gaskL + 1.8} y1={by + 5} x2={gaskL + 1.8} y2={by + bh - 5}
                stroke="rgba(255,255,255,.18)" strokeWidth="1.5" strokeLinecap="round" />

          {/* ── Plunger rod ── */}
          <rect x={gaskR + 1} y={ncy - 2.5}
                width={Math.max(0, bx + bw + 12 - (gaskR + 1))} height={5}
                rx={2.5} fill="#b8b8cc" />

          {/* ── Thumb rest: flat plate ── */}
          <rect x={bx + bw + 14} y={by - 5} width={5} height={bh + 10} rx={2.5}
                fill="#9090a6" />

          {/* ── Dose callout below barrel ── */}
          {doseMg > 0 && (() => {
            const cx = Math.min(Math.max(bx + fillW / 2, bx + 20), bx + bw - 20);
            return (
              <>
                <text x={cx} y={by + bh + 18}
                      textAnchor="middle" fontSize={11.5} fontWeight="700" fill={color}>
                  {units} units
                </text>
                <text x={cx} y={by + bh + 30}
                      textAnchor="middle" fontSize={8.5} fill={color} opacity={0.7}>
                  {ml} mL
                </text>
              </>
            );
          })()}
        </svg>
      );
    }

    function DoseCalculatorModal({ initialDose = 2.25, initialConc = 12.5, onClose }) {

            {/* Syringe */}

    /* ─── Injection Schedule Modal ───────────────────────────────────────────── */
    const SCHED_DAYS     = ['Su','Mo','Tu','We','Th','Fr','Sa'];
    const SCHED_DAYS_LNG = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function InjScheduleModal({ schedule, onSave, onClose, isAdmin }) {
      const [mode, setMode] = useState(() => isIntervalSchedule(schedule) ? 'interval' : 'days');
      const [draft, setDraft] = useState(
        () => isWeekdaySchedule(schedule) ? [...schedule].sort((a,b) => a.day - b.day) : []
      );
      const [everyN, setEveryN] = useState(() => isIntervalSchedule(schedule) ? schedule.everyNDays : 2);
      const [intervalAmpm, setIntervalAmpm] = useState(() => isIntervalSchedule(schedule) ? schedule.ampm : 'am');
      const [saving, setSaving] = useState(false);
      const [saveError, setSaveError] = useState('');

      const setModeIfAdmin = (m) => { if (isAdmin) setMode(m); };
      const toggleDay = (i) => {
        if (!isAdmin) return;
        const has = draft.find(s => s.day === i);
        setDraft(has
          ? draft.filter(s => s.day !== i)
          : [...draft, { day: i, ampm: 'am' }].sort((a, b) => a.day - b.day));
      };
      const toggleAmPm = (i) => {
        if (!isAdmin) return;
        setDraft(draft.map(s => s.day === i ? { ...s, ampm: s.ampm === 'am' ? 'pm' : 'am' } : s));
      };
      const toggleIntervalAmpm = () => {
        if (!isAdmin) return;
        setIntervalAmpm(v => v === 'am' ? 'pm' : 'am');
      };
      const handleEveryN = (v) => {
        const n = Math.max(1, Math.min(28, parseInt(v, 10) || 1));
        setEveryN(n);
      };

      const sorted  = [...draft].sort((a, b) => a.day - b.day);
      const changed = mode === 'days'
        ? JSON.stringify(sorted) !== JSON.stringify(isWeekdaySchedule(schedule) ? [...schedule].sort((a,b)=>a.day-b.day) : [])
        : (!isIntervalSchedule(schedule) || schedule.everyNDays !== everyN || schedule.ampm !== intervalAmpm);

      const handleSave = async () => {
        const next = mode === 'days' ? sorted : { mode: 'interval', everyNDays: everyN, ampm: intervalAmpm };
        setSaving(true);
        setSaveError('');
        try {
          const ok = await onSave(next);
          if (ok) { onClose(); return; }
          setSaveError("Couldn't save — check your connection and try again.");
        } finally {
          setSaving(false);
        }
      };

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.45)',
                      zIndex: 1000, display: 'flex', alignItems: 'center',
                      justifyContent: 'center', padding: 16 }}
             onClick={onClose}>
          <div style={{ background: '#fff', borderRadius: 22, padding: '22px 20px 24px',
                        width: '100%', maxWidth: 380, boxShadow: '0 24px 64px rgba(0,0,0,.28)' }}
               onClick={e => e.stopPropagation()}>

            <div style={{ display: 'flex', justifyContent: 'space-between',
                          alignItems: 'center', marginBottom: 20 }}>
              <div style={{ fontSize: 18, fontWeight: 700, color: '#1c1c1e' }}>Injection Schedule</div>
              <button onClick={onClose}
                      style={{ fontSize: 18, color: '#8e8e93', background: '#f2f2f7',
                               border: 'none', cursor: 'pointer', borderRadius: 50,
                               width: 32, height: 32, display: 'flex', alignItems: 'center',
                               justifyContent: 'center' }}>✕</button>
            </div>

            {/* Mode toggle */}
            {isAdmin && (
              <div style={{ display: 'flex', gap: 4, marginBottom: 16, background: '#f2f2f7',
                            borderRadius: 10, padding: 3 }}>
                {[['days','Specific days'], ['interval','Every N days']].map(([m, label]) => (
                  <button key={m} onClick={() => setModeIfAdmin(m)}
                          disabled={!isAdmin}
                          style={{ flex: 1, padding: '7px 0', borderRadius: 8,
                                   fontSize: 12.5, fontWeight: 600,
                                   background: mode === m ? '#fff' : 'transparent',
                                   color: mode === m ? '#1c1c1e' : '#8e8e93',
                                   boxShadow: mode === m ? '0 1px 3px rgba(0,0,0,.15)' : 'none',
                                   border: 'none', cursor: isAdmin ? 'pointer' : 'default' }}>
                    {label}
                  </button>
                ))}
              </div>
            )}

            {mode === 'days' ? (
              <>
                {/* Day picker */}
                <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93',
                              textTransform: 'uppercase', letterSpacing: .5, marginBottom: 8 }}>
                  Injection days
                </div>
                <div style={{ display: 'flex', gap: 4, marginBottom: 16 }}>
                  {SCHED_DAYS.map((d, i) => {
                    const sel = !!draft.find(s => s.day === i);
                    return (
                      <button key={i} onClick={() => toggleDay(i)}
                              style={{ flex: 1, padding: '8px 0', borderRadius: 10,
                                       fontSize: 13, fontWeight: 600,
                                       background: sel ? '#4a90d9' : '#f2f2f7',
                                       color: sel ? '#fff' : '#8e8e93',
                                       border: 'none', cursor: isAdmin ? 'pointer' : 'default' }}>
                        {d}
                      </button>
                    );
                  })}
                </div>

                {/* AM/PM per selected day */}
                {sorted.length > 0 ? (
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 20 }}>
                    {sorted.map(s => (
                      <div key={s.day} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                        <span style={{ fontSize: 13, fontWeight: 600, color: '#3c3c43' }}>
                          {SCHED_DAYS_LNG[s.day]}
                        </span>
                        <button onClick={() => toggleAmPm(s.day)}
                                style={{ fontSize: 12, fontWeight: 600, padding: '5px 12px',
                                         borderRadius: 10, background: '#f2f2f7', color: '#3c3c43',
                                         border: 'none', cursor: isAdmin ? 'pointer' : 'default' }}>
                          {s.ampm === 'am' ? 'Morning' : 'Evening'}
                        </button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div style={{ fontSize: 13, color: '#aeaeb2', marginBottom: 20 }}>
                    {isAdmin ? 'Tap days above to set your injection days.' : 'No schedule configured.'}
                  </div>
                )}
              </>
            ) : (
              <>
                {/* Every-N-days picker */}
                <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93',
                              textTransform: 'uppercase', letterSpacing: .5, marginBottom: 8 }}>
                  Interval
                </div>
                {isAdmin ? (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 20 }}>
                    <span style={{ fontSize: 13, color: '#3c3c43' }}>Every</span>
                    <input type="number" min="1" max="28" value={everyN}
                           onChange={e => handleEveryN(e.target.value)}
                           style={{ width: 52, fontSize: 14, fontWeight: 600, padding: '6px 8px',
                                    borderRadius: 8, border: '1px solid #d1d1d6', background: '#f9f9f9',
                                    color: '#1c1c1e', outline: 'none', textAlign: 'center' }} />
                    <span style={{ fontSize: 13, color: '#3c3c43' }}>days</span>
                    <button onClick={toggleIntervalAmpm}
                            style={{ fontSize: 12, fontWeight: 600, padding: '5px 12px',
                                     borderRadius: 10, background: '#f2f2f7', color: '#3c3c43',
                                     border: 'none', cursor: 'pointer', marginLeft: 4 }}>
                      {intervalAmpm === 'am' ? 'Morning' : 'Evening'}
                    </button>
                  </div>
                ) : (
                  <div style={{ fontSize: 13, color: '#aeaeb2', marginBottom: 20 }}>
                    Every {everyN} days · {intervalAmpm === 'am' ? 'Morning' : 'Evening'}
                  </div>
                )}
              </>
            )}

            {!isAdmin && (
              <div style={{ fontSize: 12, color: '#aeaeb2', marginBottom: 16 }}>
                Log in to edit the schedule.
              </div>
            )}

            {saveError && (
              <div style={{ fontSize: 12.5, color: '#ff3b30', marginBottom: 12 }}>{saveError}</div>
            )}

            <div style={{ display: 'flex', gap: 8 }}>
              {isAdmin && changed && (
                <button onClick={handleSave} disabled={saving}
                        style={{ flex: 1, fontSize: 15, fontWeight: 600, padding: '12px',
                                 borderRadius: 12, background: saving ? '#a9c8ea' : '#4a90d9', color: '#fff',
                                 border: 'none', cursor: saving ? 'default' : 'pointer' }}>
                  {saving ? 'Saving…' : 'Save'}
                </button>
              )}
              <button onClick={onClose} disabled={saving}
                      style={{ flex: 1, fontSize: 15, fontWeight: 600, padding: '12px',
                               borderRadius: 12, background: '#f2f2f7', color: '#3c3c43',
                               border: 'none', cursor: saving ? 'default' : 'pointer', opacity: saving ? .6 : 1 }}>
                {isAdmin && changed ? 'Cancel' : 'Done'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Injection-day banner ───────────────────────────────────────────────── */
    function InjectionDayBanner({ rows, injections, injSchedule, calories, calorieTargets, intervalsCalories,
                                   pendingSurvey, onSavePendingSurvey }) {
      const [dismissedDate, setDismissedDate] = useState(
        () => localStorage.getItem(LS_POPOVER_DISMISS_KEY)
      );
      // Hooks must run unconditionally (before the early returns below), so
      // these are declared here even though they're only rendered further down.
      const [surveyOpen, setSurveyOpen] = useState(false);
      const hasPendingToday = pendingSurvey && pendingSurvey.date === today();
      const [surveyNausea,    setSurveyNausea]    = useState(() => hasPendingToday && pendingSurvey.nausea    != null ? String(pendingSurvey.nausea)    : '0');
      const [surveyHunger,    setSurveyHunger]    = useState(() => hasPendingToday && pendingSurvey.hunger    != null ? String(pendingSurvey.hunger)    : '0');
      const [surveyFoodNoise, setSurveyFoodNoise] = useState(() => hasPendingToday && pendingSurvey.foodNoise != null ? String(pendingSurvey.foodNoise) : '0');

      const ds = getDoseSchedule(injections, injSchedule);
      if (!ds || !ds.scheduleActive) return null;

      const todayStr = today();
      const isToday      = msToLocalDate(ds.nextInjMs) === todayStr;
      const alreadyLogged = injections.some(i => i.date === todayStr);
      if (!isToday || alreadyLogged || dismissedDate === todayStr) return null;

      const todayMs = new Date().setHours(0, 0, 0, 0);
      const rec = getRecommendation(rows ?? [], ds, calories, calorieTargets, intervalsCalories, todayMs, pendingSurvey);
      if (!rec) return null;
      const { g, perInjMg } = rec;
      const currentPerInjMg = ds.lastDose;
      const changing = round1(perInjMg) !== round1(currentPerInjMg);

      const vialConc = Math.max(parseFloat(localStorage.getItem(LS_VIAL_CONC_KEY) || '12.5'), 0.01);
      const syringeUnits = parseInt(localStorage.getItem(LS_SYRINGE_UNITS_KEY) || '100', 10);

      const dismiss = () => {
        localStorage.setItem(LS_POPOVER_DISMISS_KEY, todayStr);
        setDismissedDate(todayStr);
      };

      const saveSurvey = () => {
        onSavePendingSurvey(todayStr, {
          nausea: Number(surveyNausea), hunger: Number(surveyHunger), foodNoise: Number(surveyFoodNoise),
        });
        setSurveyOpen(false);
      };

      return (
        <div style={{ borderRadius: 18, overflow: 'hidden', background: g.bg,
                      border: `1px solid ${g.color}33`, marginBottom: 10, position: 'relative' }}>
          <button onClick={dismiss} aria-label="Dismiss"
                  style={{ position: 'absolute', top: 10, right: 10, width: 22, height: 22,
                           borderRadius: '50%', border: 'none', background: 'rgba(0,0,0,.08)',
                           color: '#8e8e93', fontSize: 12, display: 'flex', alignItems: 'center',
                           justifyContent: 'center', cursor: 'pointer' }}>✕</button>
          <div style={{ padding: '14px 40px 14px 16px', display: 'flex', alignItems: 'center', gap: 16 }}>
            <div style={{ width: 140, flexShrink: 0 }}>
              <SyringeGraphic doseMg={perInjMg} concentration={vialConc} color={g.color} maxUnits={syringeUnits} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: g.color, textTransform: 'uppercase',
                            letterSpacing: .5, marginBottom: 3 }}>
                Today is injection day
              </div>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginBottom: 3 }}>
                <span style={{ fontSize: 20, fontWeight: 800, color: '#1c1c1e' }}>{round1(perInjMg)} mg</span>
                {changing && (
                  <span style={{ fontSize: 12, color: '#8e8e93' }}>(was {round1(currentPerInjMg)} mg)</span>
                )}
              </div>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: g.color }}>{g.label}</div>
              <button onClick={() => setSurveyOpen(v => !v)}
                      style={{ fontSize: 11.5, fontWeight: 600, color: g.color, background: 'none',
                               border: 'none', padding: 0, marginTop: 5, cursor: 'pointer',
                               textDecoration: 'underline', opacity: .85 }}>
                {surveyOpen ? 'Cancel' : hasPendingToday ? '✓ Update how you’re feeling' : 'Log how you’re feeling'}
              </button>
            </div>
          </div>
          {surveyOpen && (
            <div style={{ padding: '0 16px 14px' }}>
              <div style={{ padding: '10px 12px', borderRadius: 12, background: 'rgba(255,255,255,.55)',
                            display: 'flex', flexDirection: 'column', gap: 10 }}>
                <div style={{ fontSize: 11, color: '#8e8e93', marginTop: -2 }}>
                  Symptoms since last injection
                </div>
                <SurveySlider label="Nausea"     value={surveyNausea}    onChange={setSurveyNausea} />
                <SurveySlider label="Hunger"     value={surveyHunger}    onChange={setSurveyHunger} />
                <SurveySlider label="Food noise" value={surveyFoodNoise} onChange={setSurveyFoodNoise} />
                <button onClick={saveSurvey}
                        style={{ fontSize: 13, fontWeight: 600, padding: '7px', borderRadius: 8,
                                 background: g.color, color: '#fff', border: 'none', cursor: 'pointer' }}>
                  Save
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ─── App ────────────────────────────────────────────────────────────────── */
    function App() {
      const saved = lsLoad();
      const [rows,        setRows]        = useState(saved?.logbook ?? []);
      const [meta,        setMeta]        = useState(saved?.meta    ?? null);
      const [injections,  setInjections]  = useState(lsLoadInjections);
      const [injSchedule, setInjSchedule] = useState(lsLoadSchedule);
      const [pendingSurvey, setPendingSurvey] = useState(() => {
        try { return JSON.parse(localStorage.getItem(LS_PENDING_SURVEY_KEY) || 'null'); }
        catch (_) { return null; }
      });
      const savePendingSurvey = useCallback((date, vals) => {
        const next = { date, ...vals };
        setPendingSurvey(next);
        try { localStorage.setItem(LS_PENDING_SURVEY_KEY, JSON.stringify(next)); } catch (_) {}
      }, []);
      const clearPendingSurvey = () => {
        setPendingSurvey(null);
        try { localStorage.removeItem(LS_PENDING_SURVEY_KEY); } catch (_) {}
      };
      const [calories,    setCalories]    = useState(() =>
        Object.values(lsLoadCaloriesRaw()).sort((a, b) => a.date.localeCompare(b.date))
      );
      const [bloodPressure, setBloodPressure] = useState(() =>
        Object.values(lsLoadBpRaw()).sort((a, b) => a.ms - b.ms)
      );
      const [calorieTargets, setCalorieTargets] = useState(lsLoadCalorieTargets);
      const [proteinTargets, setProteinTargets] = useState(lsLoadProteinTargets);
      const [videos,      setVideos]      = useState([]);
      const [playingVideo, setPlayingVideo] = useState(null);
      const [activeTab,  setActiveTab]   = useState('weight');
      const [error,      setError]      = useState('');
      const [dragging,   setDragging]   = useState(false);
      const [showInj,    setShowInj]    = useState(false);
      const [injDate,    setInjDate]    = useState(today);
      const [injDose,    setInjDose]    = useState('');
      const [injSite,    setInjSite]    = useState('');
      const [injNausea,    setInjNausea]    = useState('');
      const [injHunger,    setInjHunger]    = useState('');
      const [injFoodNoise, setInjFoodNoise] = useState('');
      // Export folder auto-import
      const [exportDir,  setExportDir]  = useState(null);   // FileSystemDirectoryHandle
      const [autoMsg,    setAutoMsg]    = useState('');      // transient status line
      const [needsPerm,  setNeedsPerm]  = useState(false);  // permission lapsed
      const [gistOk,  setGistOk]  = useState(false);
      const [gistMsg, setGistMsg] = useState('');
      const [syncPending, setSyncPending] = useState(false); // a mutating write is in flight
      const [dismissedGistMsg, setDismissedGistMsg] = useState(''); // last gistMsg the user dismissed
      const [isAdmin, setIsAdmin] = useState(() => !!localStorage.getItem(LS_GIST_PAT_KEY));
      const [loading, setLoading] = useState(true);
      // Seeded from the last gist read so the chart never paints with a blank
      // "0 burned" flash while the mount-effect fetch below is in flight.
      // Populated only from the Gist's intervalsActivities field (written by
      // the watcher) — never fetched live client-side, see IntervalsPanel.
      const [intervalsActivities, setIntervalsActivities] = useState(() => {
        try { return JSON.parse(localStorage.getItem(LS_INTERVALS_ACTIVITIES_KEY) || 'null'); } catch (_) { return null; }
      });
      const intervalsCalories = intervalsActivities?.calMap ?? {};
      const intervalRides     = intervalsActivities?.ridesMap ?? {};
      const inputRef  = useRef();
      const msgTimer  = useRef();

      const showMsg = (msg, ms = 4000) => {
        setAutoMsg(msg);
        clearTimeout(msgTimer.current);
        msgTimer.current = setTimeout(() => setAutoMsg(''), ms);
      };

      // Always reads PAT from localStorage so closures don't go stale.
      // newCalories defaults to closure state but callers that just updated
      // calories synchronously (e.g. applyResult) should pass the fresh value.
      // Returns true/false so callers can commit local state only on a confirmed
      // write — a mutation must never appear to "succeed" locally while silently
      // failing to reach the shared Gist.
      const writeToGist = async (newRows, newMeta, newInj, newCalories = calories, sched = injSchedule, targets = calorieTargets, protTargets = proteinTargets, newBp = bloodPressure) => {
        const pat = localStorage.getItem(LS_GIST_PAT_KEY);
        if (!pat) {
          setGistOk(false); setGistMsg('Not logged in');
          return false;
        }
        try {
          await patchGist(GIST_ID, pat, newRows, newMeta, newInj, sched, newCalories, targets, protTargets, newBp, intervalsActivities);
          setGistOk(true); setGistMsg('');
          return true;
        } catch (e) {
          setGistOk(false); setGistMsg(e.message);
          console.warn('[Gist] write failed:', e.message);
          return false;
        }
      };

      // On mount: always load from Gist (no PAT needed for reads)
      useEffect(() => {
        const pat = localStorage.getItem(LS_GIST_PAT_KEY);
        (async () => {
          try {
            const result = await fetchGist(GIST_ID, pat || undefined);
            if (result === null) {
              setGistOk(!!pat);
            } else {
              const { logbook, meta: m, injections: inj, injSchedule: sched, calories: gistCals, intervalsActivities: gistIcuActivities, calorieTargets: gistTargets, proteinTargets: gistProtTargets, bloodPressure: gistBp } = result;
              if (sched) { setInjSchedule(sched); lsSaveSchedule(sched); }
              if (gistTargets) { setCalorieTargets(gistTargets); lsSaveCalorieTargets(gistTargets); }
              if (gistProtTargets) { setProteinTargets(gistProtTargets); lsSaveProteinTargets(gistProtTargets); }
              if (pat) {
                // Admin: merge gist with local, gist wins
                const gistMap = Object.fromEntries(logbook.map(r => [r.date, r.wKg]));
                const merged  = { ...lsLoadRaw(), ...gistMap };
                const daily   = Object.entries(merged)
                  .map(([date, wKg]) => ({ date, wKg }))
                  .sort((a, b) => b.date.localeCompare(a.date));
                const newLogbook = daily.length ? computeLogbook(daily) : logbook;
                setRows(newLogbook); setMeta(m); setInjections(inj);
                lsSave(newLogbook, m); lsSaveInjections(inj);
                if (gistCals && gistCals.length) setCalories(mergeCaloriesWithStored(gistCals));
                if (gistBp && gistBp.length) setBloodPressure(mergeBpWithStored(gistBp));
              } else {
                // View-only: show gist data directly
                setRows(logbook); setMeta(m); setInjections(inj);
                if (gistCals) setCalories(gistCals);
                if (gistBp) setBloodPressure(gistBp);
              }
              // Ride/calorie data from intervals.icu — key-free, watcher-published,
              // same for admin and viewers alike (see IntervalsPanel).
              if (gistIcuActivities) {
                setIntervalsActivities(gistIcuActivities);
                try { localStorage.setItem(LS_INTERVALS_ACTIVITIES_KEY, JSON.stringify(gistIcuActivities)); } catch (_) {}
              }
              setGistOk(!!pat);
            }
          } catch (e) {
            setGistOk(false); setGistMsg(e.message);
          } finally {
            setLoading(false);
          }
        })();
      }, []);

      // Save PAT and reconnect (admin already logged in, reconfiguring token)
      const saveGistConfig = useCallback(async (rawPat) => {
        const pat = rawPat.trim();
        localStorage.setItem(LS_GIST_PAT_KEY, pat);
        setGistMsg('Connecting…');
        try {
          const result = await fetchGist(GIST_ID, pat);
          if (result === null) {
            await patchGist(GIST_ID, pat, rows, meta, injections, injSchedule, calories, calorieTargets, proteinTargets, bloodPressure);
            setGistOk(true); setGistMsg('');
            showMsg('Gist initialized ✓');
          } else {
            const { logbook, meta: m, injections: inj, injSchedule: sched, calories: gistCals, intervalsActivities: gistIcuActivities, calorieTargets: gistTargets, proteinTargets: gistProtTargets, bloodPressure: gistBp } = result;
            setRows(logbook); setMeta(m); setInjections(inj);
            if (sched) { setInjSchedule(sched); lsSaveSchedule(sched); }
            if (gistTargets) { setCalorieTargets(gistTargets); lsSaveCalorieTargets(gistTargets); }
            if (gistProtTargets) { setProteinTargets(gistProtTargets); lsSaveProteinTargets(gistProtTargets); }
            lsSave(logbook, m); lsSaveInjections(inj);
            if (gistCals && gistCals.length) setCalories(mergeCaloriesWithStored(gistCals));
            if (gistBp && gistBp.length) setBloodPressure(mergeBpWithStored(gistBp));
            if (gistIcuActivities) {
              setIntervalsActivities(gistIcuActivities);
              try { localStorage.setItem(LS_INTERVALS_ACTIVITIES_KEY, JSON.stringify(gistIcuActivities)); } catch (_) {}
            }
            setGistOk(true); setGistMsg('');
            showMsg('Gist connected ✓');
          }
        } catch (e) {
          setGistOk(false); setGistMsg(e.message);
        }
      }, [rows, meta, injections, injSchedule, calories, calorieTargets, proteinTargets, bloodPressure]);

      // Admin login (view-only user entering PAT)
      const adminLogin = useCallback(async (rawPat, setMsg) => {
        const pat = rawPat.trim();
        setMsg('Verifying…');
        try {
          const result = await fetchGist(GIST_ID, pat);
          localStorage.setItem(LS_GIST_PAT_KEY, pat);
          setIsAdmin(true); setGistOk(true); setGistMsg('');
          if (result !== null) {
            const { logbook, meta: m, injections: inj, injSchedule: sched, calories: gistCals, intervalsActivities: gistIcuActivities, calorieTargets: gistTargets, proteinTargets: gistProtTargets, bloodPressure: gistBp } = result;
            setRows(logbook); setMeta(m); setInjections(inj);
            if (sched) setInjSchedule(sched);
            if (gistTargets) setCalorieTargets(gistTargets);
            if (gistProtTargets) setProteinTargets(gistProtTargets);
            lsSave(logbook, m); lsSaveInjections(inj);
            if (gistCals && gistCals.length) setCalories(mergeCaloriesWithStored(gistCals));
            if (gistBp && gistBp.length) setBloodPressure(mergeBpWithStored(gistBp));
            if (gistIcuActivities) {
              setIntervalsActivities(gistIcuActivities);
              try { localStorage.setItem(LS_INTERVALS_ACTIVITIES_KEY, JSON.stringify(gistIcuActivities)); } catch (_) {}
            }
          }
          setMsg('');
        } catch (e) { setMsg(e.message); }
      }, []);

      // Attempts the write first — only commits the new schedule locally once
      // it's confirmed saved, so InjScheduleModal can tell the difference
      // between "saved" and "failed, please retry" instead of always closing.
      const saveInjSchedule = useCallback(async (newSched) => {
        setSyncPending(true);
        try {
          const ok = await writeToGist(rows, meta, injections, calories, newSched);
          if (ok) { setInjSchedule(newSched); lsSaveSchedule(newSched); }
          return ok;
        } finally {
          setSyncPending(false);
        }
      }, [rows, meta, injections, calories]);

      // Sets today's calorie target, replacing any entry already dated today
      // (repeated same-day edits don't create duplicate history rows) — past
      // entries are never rewritten, matching "applies today and forward only."
      const saveCalorieTargets = useCallback(async (newTarget) => {
        const todayStr = today();
        const next = [...calorieTargets.filter(t => t.date !== todayStr), { date: todayStr, target: newTarget }]
          .sort((a, b) => a.date.localeCompare(b.date));
        setSyncPending(true);
        try {
          const ok = await writeToGist(rows, meta, injections, calories, injSchedule, next);
          if (ok) { setCalorieTargets(next); lsSaveCalorieTargets(next); }
          return ok;
        } finally {
          setSyncPending(false);
        }
      }, [rows, meta, injections, calories, injSchedule, calorieTargets]);

      // Sets today's protein-floor target, same dated-history/dedup convention
      // as saveCalorieTargets above.
      const saveProteinTargets = useCallback(async (newTarget) => {
        const todayStr = today();
        const next = [...proteinTargets.filter(t => t.date !== todayStr), { date: todayStr, target: newTarget }]
          .sort((a, b) => a.date.localeCompare(b.date));
        setSyncPending(true);
        try {
          const ok = await writeToGist(rows, meta, injections, calories, injSchedule, calorieTargets, next);
          if (ok) { setProteinTargets(next); lsSaveProteinTargets(next); }
          return ok;
        } finally {
          setSyncPending(false);
        }
      }, [rows, meta, injections, calories, injSchedule, calorieTargets, proteinTargets]);

      // Admin logout
      const adminLogout = useCallback(() => {
        localStorage.removeItem(LS_GIST_PAT_KEY);
        setIsAdmin(false); setGistOk(false); setGistMsg('');
      }, []);

      // Apply processed result to state + localStorage + Gist
      // Imported data isn't committed to local state until the Gist write is
      // confirmed — an import that parses fine but fails to sync shouldn't
      // silently leave this device out of step with everywhere else.
      const applyResult = useCallback(async ({ logbook, meta: newMeta, injSchedule: newSched, calorieData: newCals, bpData: newBp }) => {
        const mergedCalories = (newCals && newCals.length > 0) ? mergeCaloriesWithStored(newCals) : calories;
        const mergedBp       = (newBp  && newBp.length  > 0) ? mergeBpWithStored(newBp)       : bloodPressure;
        setSyncPending(true);
        try {
          const ok = await writeToGist(logbook, newMeta, injections, mergedCalories, newSched || injSchedule, calorieTargets, proteinTargets, mergedBp);
          if (!ok) {
            setError("Import parsed fine but failed to sync to the Gist — try again.");
            return false;
          }
          setRows(logbook);
          setMeta(newMeta);
          if (newSched) { setInjSchedule(newSched); lsSaveSchedule(newSched); }
          if (newCals && newCals.length > 0) setCalories(mergedCalories);
          if (newBp && newBp.length > 0) setBloodPressure(mergedBp);
          setError('');
          lsSave(logbook, newMeta);
          return true;
        } finally {
          setSyncPending(false);
        }
      }, [injections, calories, injSchedule, calorieTargets, proteinTargets, bloodPressure]);

      // Auto-import: scan export folder for newest matching CSV
      const runAutoImport = useCallback(async (dirHandle, { silent = false } = {}) => {
        try {
          const perm = await dirHandle.queryPermission({ mode: 'read' });
          if (perm !== 'granted') {
            const req = await dirHandle.requestPermission({ mode: 'read' });
            if (req !== 'granted') { setNeedsPerm(true); return; }
          }
          setNeedsPerm(false);
          const latest = await findLatestExport(dirHandle);
          if (!latest) { if (!silent) showMsg('No export files found in that folder.'); return; }
          const lastLoaded = localStorage.getItem(LS_LAST_CSV_KEY);
          console.log(`[Weight Tracker] Last loaded: ${lastLoaded ?? '(none)'}`);
          const isNewFile = latest.name !== lastLoaded;
          if (latest.name === lastLoaded && calories.length > 0) {
            console.log('[Weight Tracker] Already up to date — skipping import.');
            if (!silent) showMsg('Already up to date — no new export found.');
            return;
          }
          console.log(`[Weight Tracker] ${isNewFile ? 'Importing' : 'Re-processing'}: ${latest.name}`);
          const text = await readFileWithRetry(latest.handle, {
            onWaiting: attempt => showMsg(`Downloading from iCloud… (attempt ${attempt})`, 10000),
          });
          const result = processCSVText(text);
          const ok = await applyResult(result);
          if (!ok) return; // applyResult already surfaced the sync error
          localStorage.setItem(LS_LAST_CSV_KEY, latest.name);
          console.log(`[Weight Tracker] Import complete.`);
          if (!silent) showMsg(`${isNewFile ? 'Updated' : 'Calorie data refreshed'} from ${latest.name.replace('Automation_Daily_export_', '').replace('HealthExport_', '').replace('.csv', '')}`);
        } catch (ex) {
          if (!silent) setError('Auto-import error: ' + ex.message);
        }
      }, [applyResult, calories.length]);

      // On mount: restore dir handle and silently try auto-import
      useEffect(() => {
        (async () => {
          try {
            const handle = await idbGet('export-dir');
            if (!handle) return;
            setExportDir(handle);
            const perm = await handle.queryPermission({ mode: 'read' });
            if (perm === 'granted') {
              await runAutoImport(handle, { silent: true });
            } else {
              setNeedsPerm(true);
            }
          } catch (_) {}
        })();
        return () => clearTimeout(msgTimer.current);
      }, []);

      // Background polling while the tab is open: fast burst (20s) for 3 min
      // after load/refocus while today's export hasn't landed yet, then 5 min
      // all day. intervals.icu data is no longer polled from the client at all
      // — it arrives passively via the normal Gist read (intervalsActivities,
      // written by the watcher) alongside weight/calories/BP. Refs avoid
      // retriggering this effect (and resetting the burst) when calories.length
      // changes runAutoImport's identity on every successful import.
      const exportDirRef       = useRef(exportDir);       exportDirRef.current       = exportDir;
      const runAutoImportRef   = useRef(runAutoImport);   runAutoImportRef.current   = runAutoImport;

      useEffect(() => {
        const FAST_MS = 20_000, FAST_WINDOW_MS = 3 * 60_000, SLOW_MS = 5 * 60_000;
        let csvTimer = null, cancelled = false;
        let burstStartedAt = Date.now();

        const scheduleCsv = () => {
          if (cancelled) return;
          const inBurst = !lastImportIsToday() && (Date.now() - burstStartedAt < FAST_WINDOW_MS);
          csvTimer = setTimeout(csvTick, inBurst ? FAST_MS : SLOW_MS);
        };
        const csvTick = async () => {
          if (cancelled) return;
          if (!document.hidden && exportDirRef.current) {
            try { await runAutoImportRef.current(exportDirRef.current, { silent: true }); }
            catch (_) {}
          }
          scheduleCsv();
        };

        const onVisible = () => {
          if (document.hidden) return;
          burstStartedAt = Date.now(); // resume fast burst on refocus
          clearTimeout(csvTimer); csvTick();
        };
        document.addEventListener('visibilitychange', onVisible);

        // Don't fire blind here — exportDir restores async from IndexedDB in the
        // other mount effect, so exportDirRef.current would still be null right now.
        // The restore effect itself already runs an immediate check once the handle
        // loads; we just need to arm the next one.
        scheduleCsv();

        return () => {
          cancelled = true;
          clearTimeout(csvTimer);
          document.removeEventListener('visibilitychange', onVisible);
        };
      }, []);

      const pickExportFolder = useCallback(async () => {
        try {
          const handle = await window.showDirectoryPicker({ mode: 'read' });
          await idbSet('export-dir', handle);
          setExportDir(handle);
          await runAutoImport(handle);
        } catch (ex) {
          if (ex.name !== 'AbortError') setError('Could not access folder: ' + ex.message);
        }
      }, [runAutoImport]);

      const loadCSV = useCallback((file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            // Try JSON first
            if (file.name.endsWith('.json')) {
              const data = JSON.parse(text);
              if (data.version && data.entries) {
                // This is our export format
                const daily = (data.entries ?? [])
                  .filter(e => e.date && e.wKg != null)
                  .sort((a, b) => b.date.localeCompare(a.date));
                const logbook = daily.length ? computeLogbook(daily) : [];
                if (data.vialConc) {
                  try { localStorage.setItem(LS_VIAL_CONC_KEY, String(data.vialConc)); } catch (_) {}
                }
                applyResult({
                  logbook,
                  meta: data.meta ?? { metric: 'Weight', source: '' },
                  injSchedule: data.injSchedule,
                });
              } else {
                throw new Error('Invalid JSON format');
              }
            } else {
              applyResult(processCSVText(text));
            }
          } catch (ex) { setError(ex.message); }
        };
        reader.readAsText(file);
      }, [applyResult]);

      // Attempts the Gist write before touching local state — a shot must be
      // confirmed saved before it can look logged. On failure the form stays
      // open with what was typed so retrying doesn't mean retyping.
      const addInjection = useCallback(async () => {
        const dose = parseFloat(injDose);
        if (!injDate || isNaN(dose) || dose <= 0) return;
        const entry = buildInjEntry(injDate, dose, injSite, injNausea, injHunger, injFoodNoise);
        const next = [...injections.filter(i => i.date !== injDate), entry]
          .sort((a, b) => b.date.localeCompare(a.date));
        setSyncPending(true);
        try {
          const ok = await writeToGist(rows, meta, next);
          if (!ok) return;
          setInjections(next);
          lsSaveInjections(next);
          if (pendingSurvey && pendingSurvey.date === injDate) clearPendingSurvey();
          setInjDose('');
          setInjSite('');
          setInjNausea('');
          setInjHunger('');
          setInjFoodNoise('');
          setInjDate(today());
          setShowInj(false);
        } finally {
          setSyncPending(false);
        }
      }, [injections, injDate, injDose, injSite, injNausea, injHunger, injFoodNoise, rows, meta, pendingSurvey]);

      const deleteInjection = useCallback(async (date) => {
        const next = injections.filter(i => i.date !== date);
        setSyncPending(true);
        try {
          const ok = await writeToGist(rows, meta, next);
          if (!ok) return;
          setInjections(next);
          lsSaveInjections(next);
        } finally {
          setSyncPending(false);
        }
      }, [injections, rows, meta]);

      // editingDate tracks the *original* date of the row being edited — kept
      // separate from editDate (the field's current draft value) so a date
      // change can still find and remove the right original entry on save,
      // and so it doubles as a collision target: if the edited date is
      // changed to match a different existing entry, that entry is replaced
      // too (same last-write-wins behavior as addInjection).
      const [editingDate, setEditingDate] = useState(null);
      const [editDate,    setEditDate]    = useState('');
      const [editDose,    setEditDose]    = useState('');
      const [editSite,    setEditSite]    = useState('');
      const [editNausea,    setEditNausea]    = useState('');
      const [editHunger,    setEditHunger]    = useState('');
      const [editFoodNoise, setEditFoodNoise] = useState('');

      const startEditInjection = (inj) => {
        setEditingDate(inj.date);
        setEditDate(inj.date);
        setEditDose(String(inj.doseMg));
        setEditSite(inj.site || '');
        setEditNausea(inj.nausea != null ? String(inj.nausea) : '');
        setEditHunger(inj.hunger != null ? String(inj.hunger) : '');
        setEditFoodNoise(inj.foodNoise != null ? String(inj.foodNoise) : '');

      const cancelEditInjection = () => setEditingDate(null);

      const saveEditInjection = useCallback(async () => {
        const dose = parseFloat(editDose);
        if (!editDate || isNaN(dose) || dose <= 0) return;
        const entry = buildInjEntry(editDate, dose, editSite, editNausea, editHunger, editFoodNoise);
        const next = [...injections.filter(i => i.date !== editingDate && i.date !== editDate), entry]
          .sort((a, b) => b.date.localeCompare(a.date));
        setSyncPending(true);
        try {
          const ok = await writeToGist(rows, meta, next);
          if (!ok) return;
          setInjections(next);
          lsSaveInjections(next);
          setEditingDate(null);
        } finally {
          setSyncPending(false);

      }, [injections, editingDate, editDate, editDose, editSite, editNausea, editHunger, editFoodNoise, rows, meta]);

      // Load body scan videos from the body-scans/ folder in the repo.

      useEffect(() => {

      const deleteRow = useCallback(async (date) => {

        const newLogbook = computeLogbook(daily);

        try {

          if (!ok) return;

      const exportJSON = useCallback(() => {

      const onInput = useCallback(e => loadCSV(e.target.files[0]), [loadCSV]);

      const hasFSA = typeof window.showDirectoryPicker === 'function';

      return (

                    </div>
                  </div>
                  <div style={{ fontSize: 18, color: 'rgba(255,255,255,.8)' }}>›</div>
                </button>

              <div style={{ borderRadius: 18, padding: '32px 24px', textAlign: 'center',

                <div style={{ fontSize: 48, marginBottom: 12 }}>⚖️</div>

                <div style={{ fontSize: 16, color: '#8e8e93', marginBottom: 20, lineHeight: 1.5 }}>

                  or tap below to browse.

                <label style={{ cursor: 'pointer' }}>

                  <span style={{ display: 'inline-block', background: '#34c759', color: '#fff',

              <GistPanel gistOk={gistOk} gistMsg={gistMsg} onSave={saveGistConfig} onLogout={adminLogout} style={{ marginTop: 10 }} />
              <IntervalsPanel syncedAt={intervalsActivities?.syncedAt} style={{ marginTop: 10 }} />

              {/* Set export folder */}
              {hasFSA && (
                <button onClick={exportDir ? () => runAutoImport(exportDir) : pickExportFolder}
                        style={{ marginTop: 10, width: '100%', borderRadius: 14, background: '#fff',
                                 border: '.5px solid #d1d1d6', padding: '14px 16px',
                                 display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                                 cursor: 'pointer', textAlign: 'left' }}>
                  <div>
                    <div style={{ fontSize: 16, fontWeight: 600, color: '#1c1c1e' }}>
                      {exportDir ? `Auto-import from ${exportDir.name}` : 'Set export folder'}
                    </div>
                    <div style={{ fontSize: 14, color: '#8e8e93', marginTop: 2 }}>
                      {exportDir
                        ? 'Tap to check for a newer Automation_Daily_export_*.csv'

                    </div>
                  </div>
                  <div style={{ fontSize: 18, color: '#8e8e93' }}>›</div>
                </button>

              {error && <ErrBox msg={error} />}
            </div>
          )}

          {/* ── Logbook ── */}
          {!loading && rows.length > 0 && (
            <div>

              <div style={{ padding:'12px 12px 32px' }}>

              <InjectionDayBanner rows={rows} injections={injections} injSchedule={injSchedule}
                                  calories={calories} calorieTargets={calorieTargets} intervalsCalories={intervalsCalories}
                                  pendingSurvey={pendingSurvey} onSavePendingSurvey={savePendingSurvey} />

              {/* ── TIRZEPATIDE TAB ── */}
              <div style={{ display: activeTab==='tirz' ? undefined : 'none' }}>
                <div style={{ borderRadius: 18, background: '#fff', border: '.5px solid rgba(0,0,0,.08)',
                              marginBottom: 10, overflow: 'hidden' }}>
                  <div style={{ padding: '10px 14px 6px', borderBottom: '.5px solid rgba(0,0,0,.06)',
                                display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: '#4a90d9',
                                  textTransform: 'uppercase', letterSpacing: .6 }}>
                      Tirzepatide · Drug on Board
                    </div>
                    <div style={{ fontSize: 12, color: '#aeaeb2' }}>t½ = 5 d · tpeak = 36 h</div>
                  </div>
                  <PkChart injections={injections} rows={rows} isAdmin={isAdmin}

                </div>
              </div>

              {/* ── WEIGHT TAB ── */}
              <div style={{ display: activeTab==='weight' ? undefined : 'none' }}>
              {/* Weight Trend Chart */}
              <div style={{ borderRadius: 18, overflow: 'hidden', background: '#fff',

                  <div style={{ fontSize: 13, fontWeight: 700, color: '#1c1c1e' }}>Weight Trend</div>

              {injections.length >= 2 && (

                                         background: '#e8f2fd', padding: '1px 5px', borderRadius: 4 }}>inj</span>
                        )}
                        {isAdmin && (
                          <button onClick={() => deleteRow(item.date)} disabled={syncPending}
                                  style={{ marginLeft: 2, fontSize: 12, color: '#c7c7cc', background: 'none',
                                           border: 'none', cursor: syncPending ? 'default' : 'pointer',
                                           padding: '0 2px', lineHeight: 1, opacity: syncPending ? .5 : 1 }}>✕</button>
                        )}
                      </div>
                      <div style={{ textAlign: 'right', fontSize: 16, fontWeight: 500,
                                    color: '#1c1c1e', fontVariantNumeric: 'tabular-nums' }}>
                        {fw(item.lbs)}
                      </div>
                      <div style={{ textAlign: 'right', fontSize: 16, color: '#3c3c43',
                                    fontVariantNumeric: 'tabular-nums' }}>
                        {fw(item.movAvg)}
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        {(() => {
                          const g = doseGuidance(item.twoWeekLoss);
                          if (!g) return <span style={{ fontSize: 14, color: '#c7c7cc' }}>—</span>;
                          const sign = item.twoWeekLoss >= 0 ? '↓' : '↑';
                          return (
                            <span style={{ display: 'inline-block', fontSize: 13, fontWeight: 600,
                                           fontVariantNumeric: 'tabular-nums', padding: '2px 6px',
                                           borderRadius: 6, color: g.color, background: g.bg }}>
                              {sign}{Math.abs(item.twoWeekLoss).toFixed(1)}
                            </span>
                          );
                        })()}
                      </div>
                      <div style={{ textAlign: 'right', fontSize: 16, color: '#3c3c43',
                                    fontVariantNumeric: 'tabular-nums' }}>
                        {(703 * item.lbs / (HEIGHT_IN * HEIGHT_IN)).toFixed(1)}
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        {baselineLbs != null && (() => {
                          const pct = (baselineLbs - item.lbs) / baselineLbs * 100;
                          const pos = pct >= 0;
                          return (
                            <span style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                                           color: pos ? '#34c759' : '#ff3b30' }}>
                              {pos ? '↓' : '↑'}{Math.abs(pct).toFixed(1)}%
                            </span>
                          );
                        })()}
                      </div>
                    </div>
                  );
                })}
                </div>
              </div>

              <Summary rows={rows} />
              </div>{/* end weight tab */}

              {/* ── DOSING TAB ── */}
              <div style={{ display: activeTab==='dosing' ? undefined : 'none' }}>
                <DosePanel rows={rows} injections={injections} injSchedule={injSchedule}
                           isAdmin={isAdmin} onSaveSchedule={saveInjSchedule}
                           calories={calories} calorieTargets={calorieTargets} intervalsCalories={intervalsCalories}
                           pendingSurvey={pendingSurvey} />

              {/* Injection log */}
              <div style={{ marginTop: 10, borderRadius: 18, background: '#fff',
                            border: '.5px solid rgba(0,0,0,.08)', overflow: 'hidden' }}>
                <div style={{ padding: '10px 14px 8px', display: 'flex', alignItems: 'center',
                              justifyContent: 'space-between', borderBottom: '.5px solid rgba(0,0,0,.06)' }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: '#4a90d9',
                                textTransform: 'uppercase', letterSpacing: .6 }}>Injections</div>
                  {isAdmin && (
                    <button onClick={() => {
                              // Pre-fill from a banner-completed survey for the
                              // date this form is about to open on, if any.
                              if (!showInj && pendingSurvey && pendingSurvey.date === injDate) {
                                if (pendingSurvey.nausea    != null) setInjNausea(String(pendingSurvey.nausea));
                                if (pendingSurvey.hunger    != null) setInjHunger(String(pendingSurvey.hunger));
                                if (pendingSurvey.foodNoise != null) setInjFoodNoise(String(pendingSurvey.foodNoise));
                              }
                              setShowInj(v => !v);
                            }}
                            style={{ fontSize: 14, fontWeight: 600, padding: '4px 12px', borderRadius: 8,
                                     background: showInj ? '#e5e5ea' : '#007aff',
                                     color: showInj ? '#1c1c1e' : '#fff', border: 'none', cursor: 'pointer' }}>
                      {showInj ? 'Cancel' : '+ Log injection'}
                    </button>
                  )}
                </div>

                {isAdmin && showInj && (
                  <div style={{ padding: '12px 14px', borderBottom: '.5px solid rgba(0,0,0,.06)',
                                display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                                      letterSpacing: .4, marginBottom: 4 }}>Date</div>
                        <input type="date" value={injDate} onChange={e => setInjDate(e.target.value)}
                               style={{ width: '100%', fontSize: 16, padding: '8px 10px', borderRadius: 10,
                                        border: '1px solid #d1d1d6', background: '#f9f9f9',
                                        color: '#1c1c1e', outline: 'none' }} />
                      </div>
                      <div style={{ width: 90 }}>
                        <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                                      letterSpacing: .4, marginBottom: 4 }}>Dose (mg)</div>
                        <input type="number" step="0.25" min="0.25" placeholder="2.5"
                               value={injDose} onChange={e => setInjDose(e.target.value)}
                               style={{ width: '100%', fontSize: 16, padding: '8px 10px', borderRadius: 10,
                                        border: '1px solid #d1d1d6', background: '#f9f9f9',
                                        color: '#1c1c1e', outline: 'none' }} />
                      </div>
                      <button onClick={addInjection} disabled={!injDate || !injDose || syncPending}
                              style={{ fontSize: 16, fontWeight: 600, padding: '8px 16px', borderRadius: 10,
                                       background: (!injDate || !injDose || syncPending) ? '#e5e5ea' : '#34c759',
                                       color: (!injDate || !injDose || syncPending) ? '#aeaeb2' : '#fff',
                                       border: 'none', cursor: (!injDate || !injDose || syncPending) ? 'default' : 'pointer' }}>
                        {syncPending ? 'Saving…' : 'Add'}
                      </button>
                    </div>
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                                    letterSpacing: .4, marginBottom: 4 }}>Site (optional)</div>
                      <select value={injSite} onChange={e => setInjSite(e.target.value)}
                              style={{ width: '100%', fontSize: 16, padding: '8px 10px', borderRadius: 10,
                                       border: '1px solid #d1d1d6', background: '#f9f9f9',
                                       color: '#1c1c1e', outline: 'none' }}>
                        <option value="">— Not specified —</option>
                        {INJECTION_SITES.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                      <div style={{ fontSize: 11, color: '#8e8e93', marginTop: -2 }}>
                        Symptoms since last injection
                      </div>
                      <SurveySlider label="Nausea"     value={injNausea}    onChange={setInjNausea} />
                      <SurveySlider label="Hunger"     value={injHunger}    onChange={setInjHunger} />
                      <SurveySlider label="Food noise" value={injFoodNoise} onChange={setInjFoodNoise} />
                    </div>
                  </div>
                )}

                <div style={{ maxHeight: 440, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
                {[...injections].sort((a, b) => b.date.localeCompare(a.date)).map((inj, i, arr) => (
                  editingDate === inj.date ? (
                    <div key={inj.date}
                         style={{ padding: '10px 14px', display: 'flex', flexDirection: 'column', gap: 8,
                                  borderBottom: i < arr.length - 1 ? '.5px solid rgba(0,0,0,.06)' : 'none',
                                  background: '#f9f9fb' }}>
                      <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 11, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                                        letterSpacing: .4, marginBottom: 4 }}>Date</div>
                          <input type="date" value={editDate} onChange={e => setEditDate(e.target.value)}
                                 style={{ width: '100%', fontSize: 15, padding: '7px 9px', borderRadius: 9,
                                          border: '1px solid #d1d1d6', background: '#fff',
                                          color: '#1c1c1e', outline: 'none' }} />
                        </div>
                        <div style={{ width: 80 }}>
                          <div style={{ fontSize: 11, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                                        letterSpacing: .4, marginBottom: 4 }}>Dose (mg)</div>
                          <input type="number" step="0.25" min="0.25"
                                 value={editDose} onChange={e => setEditDose(e.target.value)}
                                 style={{ width: '100%', fontSize: 15, padding: '7px 9px', borderRadius: 9,
                                          border: '1px solid #d1d1d6', background: '#fff',
                                          color: '#1c1c1e', outline: 'none' }} />
                        </div>
                      </div>
                      <select value={editSite} onChange={e => setEditSite(e.target.value)}
                              style={{ width: '100%', fontSize: 15, padding: '7px 9px', borderRadius: 9,
                                       border: '1px solid #d1d1d6', background: '#fff',
                                       color: '#1c1c1e', outline: 'none' }}>
                        <option value="">— Not specified —</option>
                        {INJECTION_SITES.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                        <div style={{ fontSize: 11, color: '#8e8e93', marginTop: -2 }}>
                          Symptoms since last injection
                        </div>
                        <SurveySlider label="Nausea"     value={editNausea}    onChange={setEditNausea} />
                        <SurveySlider label="Hunger"     value={editHunger}    onChange={setEditHunger} />
                        <SurveySlider label="Food noise" value={editFoodNoise} onChange={setEditFoodNoise} />
                      </div>
                      <div style={{ display: 'flex', gap: 8 }}>
                        <button onClick={saveEditInjection} disabled={!editDate || !editDose || syncPending}
                                style={{ flex: 1, fontSize: 15, fontWeight: 600, padding: '8px', borderRadius: 9,
                                         background: (!editDate || !editDose || syncPending) ? '#e5e5ea' : '#34c759',
                                         color: (!editDate || !editDose || syncPending) ? '#aeaeb2' : '#fff',
                                         border: 'none', cursor: (!editDate || !editDose || syncPending) ? 'default' : 'pointer' }}>
                          {syncPending ? 'Saving…' : 'Save'}
                        </button>
                        <button onClick={cancelEditInjection} disabled={syncPending}
                                style={{ flex: 1, fontSize: 15, fontWeight: 600, padding: '8px', borderRadius: 9,
                                         background: '#e5e5ea', color: '#1c1c1e', border: 'none',
                                         cursor: syncPending ? 'default' : 'pointer' }}>
                          Cancel
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div key={inj.date}
                         style={{ display: 'flex', alignItems: 'center', padding: '10px 14px',
                                  borderBottom: i < arr.length - 1 ? '.5px solid rgba(0,0,0,.06)' : 'none' }}>
                      <div style={{ flex: 1, fontSize: 16, fontWeight: 600, color: '#1c1c1e' }}>
                        {fmtShort(inj.date)}
                        <span style={{ fontSize: 13, color: '#aeaeb2', marginLeft: 6 }}>
                          {WD[new Date(inj.date + 'T12:00:00').getDay()]}
                        </span>
                        {inj.site && (
                          <span style={{ fontSize: 13, color: '#8e8e93', marginLeft: 6 }}>· {inj.site}</span>
                        )}
                        {(inj.nausea != null || inj.hunger != null || inj.foodNoise != null) && (
                          <div style={{ fontSize: 11.5, color: '#aeaeb2', marginTop: 2 }}>
                            {inj.nausea    != null && `N${inj.nausea} `}
                            {inj.hunger    != null && `H${inj.hunger} `}
                            {inj.foodNoise != null && `F${inj.foodNoise}`}
                          </div>
                        )}
                      </div>
                      <div style={{ fontSize: 16, fontWeight: 600, color: '#4a90d9',
                                    fontVariantNumeric: 'tabular-nums' }}>{inj.doseMg} mg</div>
                      {isAdmin && (
                        <>
                          <button onClick={() => startEditInjection(inj)} disabled={syncPending}
                                  style={{ marginLeft: 12, fontSize: 13, fontWeight: 600, color: '#4a90d9',
                                           background: 'none', border: 'none', cursor: syncPending ? 'default' : 'pointer',
                                           padding: '2px 4px', opacity: syncPending ? .5 : 1 }}>Edit</button>
                          <button onClick={() => deleteInjection(inj.date)} disabled={syncPending}
                                  style={{ marginLeft: 4, fontSize: 15, color: '#c7c7cc', background: 'none',
                                           border: 'none', cursor: syncPending ? 'default' : 'pointer',
                                           padding: '2px 4px', opacity: syncPending ? .5 : 1 }}>✕</button>
                        </>
                      )}
                    </div>
                  )
                ))}
                </div>
              </div>

              </div>{/* end dosing tab */}

              {/* ── PROGRESS VIDEOS TAB ── */}
              <div style={{ display: activeTab==='videos' ? undefined : 'none' }}>
                <ProgressVideosGrid videos={videos} onPlayVideo={setPlayingVideo} />
              </div>{/* end videos tab */}

              {/* ── Admin settings (outside tabs) ── */}
              {isAdmin ? (
                <>
                  <GistPanel gistOk={gistOk} gistMsg={gistMsg} onSave={saveGistConfig} onLogout={adminLogout} style={{ marginTop: 10 }} />
                  <IntervalsPanel syncedAt={intervalsActivities?.syncedAt} style={{ marginTop: 10 }} />

                  {/* Export folder control */}
                  {hasFSA && (
                    <button onClick={exportDir ? () => runAutoImport(exportDir) : pickExportFolder}
                            style={{ marginTop: 10, width: '100%', borderRadius: 14, background: '#fff',
                                     border: '.5px solid #d1d1d6', padding: '12px 16px',
                                     display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                                     cursor: 'pointer', textAlign: 'left' }}>
                      <div>
                        <div style={{ fontSize: 15, fontWeight: 600, color: '#1c1c1e' }}>
                          {exportDir ? `Auto-import · ${exportDir.name}` : 'Set export folder'}
                        </div>
                        <div style={{ fontSize: 13, color: '#8e8e93', marginTop: 1 }}>
                          {exportDir ? 'Tap to check for a newer export now' : 'Auto-load Automation_Daily_export_*.csv on every open'}
                        </div>
                      </div>
                      <div style={{ fontSize: 16, color: exportDir ? '#34c759' : '#8e8e93' }}>
                        {exportDir ? '↺' : '›'}
                      </div>
                    </button>
                  )}
                </>
              ) : (
                <AdminLogin onLogin={adminLogin} style={{ marginTop: 16, textAlign: 'center' }} />
              )}

              {error && <ErrBox msg={error} />}
              </div>{/* end inner padding div */}
            </div>
          )}
        </div>
      );
    }

    function Summary({ rows }) {
      if (rows.length < 2) return null;
      const change = rows[0].lbs - rows[rows.length - 1].lbs;
      const rate   = rows.find(r => r.rate != null)?.rate;
      return (
        <div style={{ marginTop: 10, borderRadius: 18, background: '#fff',
                      border: '.5px solid rgba(0,0,0,.08)', padding: '14px 16px',
                      display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
          <Tile label="Days Tracked" value={String(rows.length)} />
          <Tile label="Total Change"
                value={(change >= 0 ? '+' : '') + change.toFixed(1) + ' lbs'}
                accent={change < -0.1 ? '#1a7f3c' : change > 0.1 ? '#c0392b' : undefined} />
          <Tile label="Cur. Rate/wk"
                value={rate != null ? (rate >= 0 ? '+' : '') + rate.toFixed(2) : '—'}
                accent={rate != null && rate < -0.01 ? '#1a7f3c' : rate > 0.01 ? '#c0392b' : undefined} />
        </div>
      );
    }

    function Tile({ label, value, accent }) {
      return (
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: '#8e8e93', textTransform: 'uppercase',
                        letterSpacing: .4, marginBottom: 4 }}>{label}</div>
          <div style={{ fontSize: 16, fontWeight: 600, fontVariantNumeric: 'tabular-nums',
                        color: accent ?? '#1c1c1e' }}>{value}</div>
        </div>
      );
    }

    function ErrBox({ msg }) {
      return (
        <div style={{ marginTop: 10, borderRadius: 14, background: '#fff2f2',
                      border: '.5px solid #ffb3b3', padding: '10px 14px',
                      fontSize: 15, color: '#c0392b' }}>{msg}</div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
