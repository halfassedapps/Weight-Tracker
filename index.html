            {yTicks.map((v, i) => (
              <text key={i} x={PAD.l - 4} y={yOf(v) + 2.5} textAnchor="end" fontSize="4.5" fill="#aeaeb2">
                {v.toFixed(1)}
              </text>
            ))}
            <text x={PAD.l - 4} y={PAD.t + cH + 4} textAnchor="end" fontSize="4.5" fill="#aeaeb2">0</text>
            <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="1" />
            <line x1={PAD.l} y1={PAD.t + cH} x2={PAD.l + cW} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="1" />

            {rangeMode === 'all' && monthTicks.map(({ ms, label }) => {
              const gx = xOf(ms);
              const lx = Math.max(PAD.l + 16, Math.min(PAD.l + cW - 16, gx));
              return (
                <g key={ms}>
                  <line x1={gx} y1={PAD.t + cH} x2={gx} y2={PAD.t + cH + 4}
                        stroke="rgba(0,0,0,.15)" strokeWidth="0.8" />
                  <text x={lx} y={PAD.t + cH + 13} textAnchor="middle" fontSize="7" fill="#8e8e93">
                    {label}
                  </text>
                </g>
              );
            })}

            {/* Hover tooltip */}
            {tip && (() => {
              const startLbs = rows && rows.length ? rows[rows.length - 1].lbs : null;
              const lostLbs  = (tip.wLbs != null && startLbs != null) ? tip.wLbs - startLbs : null;
              const TH = 18 + (tip.wLbs != null ? 9 : 0) + (tip.segAvg != null ? 9 : 0);
              const flipLeft = tip.x > PAD.l + cW * 0.65;
              const tx = flipLeft ? tip.x - TW - 5 : tip.x + 5;
              const ty = Math.max(PAD.t, Math.min(tip.y - TH / 2, PAD.t + cH - TH));
              const { mo, day, wd } = fmtDate(tip.dateStr);
              let row = ty + 6;
              return (
                <g style={{ pointerEvents: 'none' }}>
                  <line x1={tip.x} y1={PAD.t} x2={tip.x} y2={PAD.t + cH}
                        stroke="rgba(28,28,30,.25)" strokeWidth="1" />
                  <circle cx={tip.x} cy={tip.y} r="3" fill="#4a90d9" stroke="#fff" strokeWidth="1" />
                  <rect x={tx} y={ty} width={TW} height={TH} rx={TR}
                        fill="rgba(28,28,30,.88)" />
                  <text x={tx + 5} y={row} fontSize="5" fill="rgba(255,255,255,.55)">{wd} {mo} {day}</text>
                  <text x={tx + 5} y={row += 8} fontSize="7.5" fontWeight="700" fill="#fff"
                        fontVariantNumeric="tabular-nums">{tip.level.toFixed(2)} mg</text>
                  {tip.wLbs != null && (
                    <text x={tx + 5} y={row += 9} fontSize="6.5" fill="#34c759"
                          fontVariantNumeric="tabular-nums">
                      {tip.wLbs.toFixed(1)}{lostLbs != null ? ` / ${lostLbs.toFixed(1)}` : ''}
                    </text>
                  )}
                  {tip.segAvg != null && (
                    <text x={tx + 5} y={row += 9} fontSize="6.5" fill="#b06dff"
                          fontVariantNumeric="tabular-nums">{tip.segAvg.toFixed(2)} mg</text>
                  )}
                </g>
              );
            })()}
          </svg>

          <div style={{ display: 'flex', padding: '8px 14px 4px', gap: 12, alignItems: 'flex-start' }}>
            <PkStat label="On board now" value={curLevel.toFixed(2) + ' mg'} color="#4a90d9" />
            <PkStat label="Pre-dose trough" value={troughLevel.toFixed(2) + ' mg'}
                    note={'(' + fmtShort(msToLocalDate(nextInjMs)) + ')'} color="#8e8e93" />
            <PkStat label="Half-life" value="5 days" color="#8e8e93" />
          </div>
          <div style={{ display: 'flex', padding: '0 14px 4px', gap: 12, alignItems: 'flex-start' }}>
            <PkStat label="Avg on board (period)" value={avgOnBoard.toFixed(2) + ' mg'} color="#4a90d9" />
            <PkStat label="Weight change (period)"
                    value={periodWeightChange != null
                      ? (periodWeightChange <= 0 ? '↓ ' : '↑ ') + Math.abs(periodWeightChange).toFixed(1) + ' lbs'
                      : '—'}
                    color={periodWeightChange != null && periodWeightChange <= 0 ? '#34c759' : '#ff3b30'} />
          </div>

          {/* Share */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', padding:'6px 14px 10px' }}>
            <button onClick={shareChart} disabled={sharing}
                    style={{ display:'flex', alignItems:'center', gap:4, fontSize:11, fontWeight:600,
                             color:'#4a90d9', background:'#f0f6ff', border:'none', borderRadius:12,
                             padding:'4px 10px', cursor: sharing ? 'default' : 'pointer', opacity: sharing ? .6 : 1 }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4a90d9" strokeWidth="2.2"
                   strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .09 1.74L8.91 9.13a3 3 0 1 0 0 5.74l6.18 3.39A3 3 0 1 0 18 16a3 3 0 0 0-2.6 1.51l-6.19-3.4a3 3 0 0 0 0-.22l6.19-3.4A3 3 0 0 0 18 8z" />
              </svg>
              {sharing ? 'Preparing…' : 'Share'}
            </button>
          </div>
        </div>
      );
    }

    /* ─── Dose Panel ──────────────────────────────────────────────────────────── */
    // Standalone component for the dose recommendation, calculator, and syringe.
    // Extracted from PkChart so it can live in the "Dosing" tab independently.
    function DosePanel({ rows, injections, injSchedule, isAdmin, onSaveSchedule, calories, calorieTargets, intervalsCalories, pendingSurvey }) {
      const [showCalc,     setShowCalc]     = useState(false);
      const [calcInitDose, setCalcInitDose] = useState(2.25);
      const [showSchedule, setShowSchedule] = useState(false);
      const [rulesOpen,    setRulesOpen]    = useState(false);
      const rulesRef = useRef(null);
      useEffect(() => {
        if (!rulesOpen) return;
        const onPointerDown = e => {
          if (rulesRef.current && !rulesRef.current.contains(e.target)) setRulesOpen(false);
        };
        document.addEventListener('pointerdown', onPointerDown);
        return () => document.removeEventListener('pointerdown', onPointerDown);
      }, [rulesOpen]);
      // Vial strength as entered on the label — total mg per some volume (e.g.
      // "15 mg / 0.5 mL") — rather than a pre-computed mg/mL concentration.
      // Volume defaults to 1 mL so a bare mg entry behaves exactly like the old
      // single mg/mL field. The derived concentration is still mirrored into
      // LS_VIAL_CONC_KEY so the calculator modal and syringe graphic (which only
      // know about mg/mL) don't need to change.
      const [vialMg, setVialMgState] = useState(
        () => Math.max(parseFloat(localStorage.getItem(LS_VIAL_MG_KEY) || localStorage.getItem(LS_VIAL_CONC_KEY) || '12.5'), 0.1)
      );
      const [vialVol, setVialVolState] = useState(
        () => Math.max(parseFloat(localStorage.getItem(LS_VIAL_VOL_KEY) || '1'), 0.01)
      );
      const vialConc = Math.max(vialMg / vialVol, 0.01);
      useEffect(() => {
        try { localStorage.setItem(LS_VIAL_CONC_KEY, String(vialConc)); } catch (_) {}
      }, [vialConc]);
      const handleVialMg = v => {
        const n = Math.max(parseFloat(v) || 12.5, 0.1);
        setVialMgState(n);
        try { localStorage.setItem(LS_VIAL_MG_KEY, String(n)); } catch (_) {}
      };
      const handleVialVol = v => {
        const n = Math.max(parseFloat(v) || 1, 0.01);
        setVialVolState(n);
        try { localStorage.setItem(LS_VIAL_VOL_KEY, String(n)); } catch (_) {}
      };
      const [syringeUnits, setSyringeUnits] = useState(
        () => parseInt(localStorage.getItem(LS_SYRINGE_UNITS_KEY) || '100', 10)
      );
      const handleSyringeUnits = v => {
        const n = parseInt(v, 10);
        setSyringeUnits(n);
        try { localStorage.setItem(LS_SYRINGE_UNITS_KEY, String(n)); } catch (_) {}
      };

      if (!injections || injections.length === 0) return null;

      const ds = getDoseSchedule(injections, injSchedule);
      const { lastInj, lastInjMs, injInterval, scheduleActive, weekdayActive, intervalActive, injPerWeek, weeklyDose, nextInjMs } = ds;

      const recent = (rows ?? []).find(r => r.twoWeekLoss != null);
      if (!recent) return null;
      const todayMs = new Date().setHours(0, 0, 0, 0);
      const rec = getRecommendation(rows ?? [], ds, calories, calorieTargets, intervalsCalories, todayMs, pendingSurvey);
      if (!rec) return null;

      const { g, dose, recWeekly, perInjMg, gi, crossCheck } = rec;
      const lossSign   = recent.twoWeekLoss >= 0 ? '↓' : '↑';
      const nextInjDate  = new Date(nextInjMs);
      const nextInjLabel = `${SCHED_DAYS_LNG[nextInjDate.getDay()]} ${nextInjDate.getHours() < 12 ? 'AM' : 'PM'}`;
      const subtext = g.giOverride
        ? (gi.avgNausea >= GI_NAUSEA_BAD
            ? `You're averaging ${gi.avgNausea.toFixed(1)}/10 nausea over the last ${GI_TOLERANCE_WINDOW_DAYS} days — GI tolerability appears to be the limiting factor, so this holds rather than increasing. Confirm with your prescriber.`
            : `Today's nausea (${gi.latestNausea}/10) is severe enough on its own to hold this week, even though your recent average is milder. Confirm with your prescriber.`)
        : g.overridden
        ? `You're averaging ${Math.round(Math.abs(rec.appetite.avgDeviation))} cal/day under your exercise-adjusted target over the last ${rec.appetite.days} days — appetite appears well-suppressed at the current dose, so this holds rather than increasing. Confirm with your prescriber.`
        : g.crossCheckBypassed
        ? `You're averaging ${Math.round(Math.abs(rec.appetite.avgDeviation))} cal/day under target, but still reporting real hunger/food noise — that deficit may be coming from effort rather than suppressed appetite, so this increases rather than holding.`
        : g.action === 'increase'
        ? (recent.twoWeekLoss < 0
            ? `Weight trending up — increase by ${DOSE_STEP_MG} mg`
            : `Progress below 3 lbs/2wk — increase by ${DOSE_STEP_MG} mg`)
        : g.action === 'stay'    ? 'Weight loss on track — hold current dose'
        : g.action === 'monitor' ? 'Strong loss — stay put; drop down if >5 lbs next 2 wks too'
        : 'Unusually rapid loss — consult your prescriber';

      const DOSING_RULES = [
        { range: '> 8 lbs / 2 wks',  action: 'Contact prescriber',        color: '#ff3b30' },
        { range: '> 5–8 lbs / 2 wks', action: `Stay — monitor closely; decrease dose by ${DOSE_STEP_MG} mg if it repeats next 2 wks`, color: '#ff9500' },
        { range: '3–5 lbs / 2 wks',  action: 'Stay at current dose',      color: '#34c759' },
        { range: '< 3 lbs / 2 wks',  action: `Increase by ${DOSE_STEP_MG} mg (incl. weight gain)`, color: '#ff9500' },
      ];

      // Last up to 4 injections with any survey data logged — so the
      // subjective data isn't just write-only. Purely a display convenience,
      // not used by the recommendation logic (that reads the trailing window
      // directly off ds.sortedInj).
      const surveyTrend = ds.sortedInj
        .filter(inj => inj.nausea != null || inj.hunger != null || inj.foodNoise != null)
        .slice(-4);

      return (
        <div>
          {showCalc && <DoseCalculatorModal initialDose={calcInitDose} initialConc={vialConc} onClose={() => setShowCalc(false)} />}

          <div style={{ margin: '0 0 12px' }}>
            <div ref={rulesRef} style={{ display: 'flex', alignItems: 'center', gap: 5,
                          marginBottom: 6, position: 'relative' }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: '#8e8e93', textTransform: 'uppercase',
                            letterSpacing: .6 }}>Next Dose Recommendation</div>
              <button onClick={() => setRulesOpen(v => !v)}
                      aria-label="Dosing increment rules"
                      style={{ width: 14, height: 14, borderRadius: '50%', border: '1px solid #c7c7cc',

                               fontSize: 9, fontWeight: 700, lineHeight: 1, fontStyle: 'italic',

              {rulesOpen && (
                <div style={{ position: 'absolute', top: 18, left: 0, zIndex: 20, width: 250,
                              background: '#1c1c1e', color: '#fff', borderRadius: 10, padding: '10px 12px',
                              boxShadow: '0 8px 24px rgba(0,0,0,.28)' }}>
                  <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 7 }}>Dosing increment rules</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
                    {DOSING_RULES.map(r => (
                      <div key={r.range} style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                        <span style={{ width: 6, height: 6, borderRadius: '50%', background: r.color,
                                       flexShrink: 0, marginTop: 2 }} />
                        <span style={{ fontSize: 11.5, lineHeight: 1.4 }}>
                          <span style={{ color: '#fff', fontWeight: 600 }}>{r.range}</span>
                          <span style={{ color: 'rgba(255,255,255,.7)' }}> — {r.action}</span>
                        </span>
                      </div>
                    ))}
                  </div>
                  <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,.5)', marginTop: 8,
                                paddingTop: 7, borderTop: '1px solid rgba(255,255,255,.15)' }}>
                    Based on weight change over the trailing 2 weeks. Capped at {MAX_DOSE_MG} mg/week.

                    (≥{GI_NAUSEA_BAD}/10 over {GI_TOLERANCE_WINDOW_DAYS} days) or one severe day alone
                    (≥{GI_SEVERE_TODAY_BAD}/10) — or for a deep calorie deficit, unless you're still
                    reporting real hunger/food noise despite that deficit, in which case it increases

                  </div>
                </div>

            </div>
            <div style={{ padding: '12px 14px', borderRadius: 10,
                          background: g.bg, border: `1px solid ${g.color}33` }}>

                  </div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: g.color, lineHeight: 1,

                  <div style={{ fontSize: 11, color: g.color, opacity: .75, marginTop: 2 }}>
                    {intervalActive ? `${round1(perInjMg)} mg every ${injSchedule.everyNDays}d`
                      : injPerWeek > 1 ? `${round1(perInjMg)} mg × ${injPerWeek}/wk` : 'per week'}
                  </div>
                  {g.action === 'increase' && dose == null && (
                    <div style={{ fontSize: 11, color: '#aeaeb2', marginTop: 2 }}>max reached</div>
                  )}
                </div>
                <div style={{ width: 1, alignSelf: 'stretch', background: `${g.color}33` }} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: '#1c1c1e', marginBottom: 3 }}>{g.label}</div>
                  <div style={{ fontSize: 13, color: '#3c3c43', lineHeight: 1.4 }}>{subtext}</div>
                  <div style={{ fontSize: 12, color: '#8e8e93', marginTop: 5 }}>
                    2-wk loss: {lossSign}{Math.abs(recent.twoWeekLoss).toFixed(1)} lbs &nbsp;·&nbsp;
                    current: ≈{round1(weeklyDose)} mg/wk
                    {intervalActive ? ` (${lastInj.doseMg} mg every ${injSchedule.everyNDays}d)`
                      : injPerWeek > 1 ? ` (${lastInj.doseMg} mg × ${injPerWeek})` : ''}
                  </div>
                  <div style={{ fontSize: 12, color: '#8e8e93', marginTop: 3 }}>
                    Your next injection is planned for {nextInjLabel}.

                              background: '#fff8ee', border: '1px solid #ff950055' }}>

              {/* Schedule */}
              <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: 12, color: '#8e8e93' }}>Injection schedule</span>
                <button onClick={() => setShowSchedule(true)}
                        style={{ fontSize: 13, fontWeight: 700, padding: '5px 14px', borderRadius: 20,
                                 background: '#4a90d9', color: '#fff', border: 'none', cursor: 'pointer', lineHeight: 1.3 }}>
                  {weekdayActive
                    ? [...injSchedule].sort((a,b)=>a.day-b.day).map(s=>SCHED_DAYS_LNG[s.day]).join(' · ')
                    : intervalActive ? `Every ${injSchedule.everyNDays}d`
                    : (injPerWeek > 1 ? '2× / week' : '1× / week')}
                </button>
              </div>
              {/* Syringe draw-up */}
              <div style={{ marginTop: 12, paddingTop: 10, borderTop: `1px solid ${g.color}22` }}>
                {/* Vial config row */}
                <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8, flexWrap:'wrap' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                    <span style={{ fontSize:11, color:'#8e8e93', fontWeight:600 }}>Vial</span>
                    <input type="number" step="0.5" min="0.1" value={vialMg}
                           onChange={e => handleVialMg(e.target.value)}
                           style={{ width:64, fontSize:13, fontWeight:600, padding:'3px 8px', borderRadius:8,
                                    border:'1px solid #d1d1d6', background:'#f9f9f9',
                                    color:'#1c1c1e', outline:'none', textAlign:'center' }} />
                    <span style={{ fontSize:11, color:'#8e8e93' }}>mg /</span>
                    <input type="number" step="0.1" min="0.01" value={vialVol}
                           onChange={e => handleVialVol(e.target.value)}
                           style={{ width:54, fontSize:13, fontWeight:600, padding:'3px 8px', borderRadius:8,
                                    border:'1px solid #d1d1d6', background:'#f9f9f9',
                                    color:'#1c1c1e', outline:'none', textAlign:'center' }} />
                    <span style={{ fontSize:11, color:'#8e8e93' }}>mL ({vialConc.toFixed(2)} mg/mL)</span>
                  </div>
                  <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                    <span style={{ fontSize:11, color:'#8e8e93', fontWeight:600 }}>Syringe</span>
                    <select value={syringeUnits} onChange={e => handleSyringeUnits(e.target.value)}
                            style={{ fontSize:13, fontWeight:600, padding:'3px 8px', borderRadius:8,
                                     border:'1px solid #d1d1d6', background:'#f9f9f9',
                                     color:'#1c1c1e', outline:'none', cursor:'pointer' }}>
                      <option value="30">30 units</option>
                      <option value="60">60 units</option>
                      <option value="100">100 units</option>
                    </select>
                  </div>
                </div>
                {/* Draw-up header + calculator button */}
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: g.color,
                                textTransform: 'uppercase', letterSpacing: .4 }}>
                    {injPerWeek > 1 ? 'Draw up per injection' : 'Draw up'}
                  </div>
                  <button onClick={() => { setCalcInitDose(perInjMg); setShowCalc(true); }}
                          style={{ fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 12,
                                   background: `${g.color}18`, color: g.color,
                                   border: `1px solid ${g.color}33`, cursor: 'pointer' }}>
                    Calculator
                  </button>
                </div>
                <SyringeGraphic doseMg={perInjMg} concentration={vialConc} color={g.color} maxUnits={syringeUnits} />
              </div>
            </div>
          </div>
        </div>
      );
    }

    const GOAL_LBS        = 155;
    const HEIGHT_IN       = 67; // 5'7"

    function WeightChart({ rows, injections, injSchedule }) {
      if (!rows || rows.length < 2) return null;
      const [goalTip, setGoalTip] = useState(false);
      const [sharing, setSharing] = useState(false);
      const [trendLineTip, setTrendLineTip] = useState(null);
      const [weightTip, setWeightTip] = useState(null);
      // Regression window for the Current Trend line. 0 = all data.
      const [trendDays, setTrendDays] = useState(21);
      const svgRef = useRef(null);
      const [trendModes, setTrendModes] = useState(['current']); // ids of checked trend lines
      const [trendMenuOpen, setTrendMenuOpen] = useState(false);
      const [ratesFromToday, setRatesFromToday] = useState(false); // false: rate lines span from the starting date, like Current
      const trendMenuRef = useRef(null);
      useEffect(() => {
        if (!trendMenuOpen) return;
        const onPointerDown = e => {
          if (trendMenuRef.current && !trendMenuRef.current.contains(e.target)) setTrendMenuOpen(false);
        };
        document.addEventListener('pointerdown', onPointerDown);
        return () => document.removeEventListener('pointerdown', onPointerDown);
      }, [trendMenuOpen]);

      const VW = 360, VH = 200;
      // Extra top padding reserves a dedicated band for dose-change pills,
      // kept clear of the plotted line entirely (linked via leader lines).
      const PAD = { t: 32, r: 14, b: 38, l: 38 };
      const cW  = VW - PAD.l - PAD.r;
      const cH  = VH - PAD.t - PAD.b;

      // oldest-first for regression + charting
      const pts = [...rows].reverse().map(r => ({
        ms:  new Date(r.date + 'T12:00:00').getTime(),
        lbs: r.lbs,
      }));

      // Dose timeline: which *weekly* tirz dose was active at any point in
      // time, and where the weekly total actually changed (used to color-grade
      // the weight line and place subtle markers — not every injection, just
      // changes). Weekly totals, not per-injection amounts, so an uneven split
      // (e.g. two different-dose shots the same week while titrating) reads as
      // one combined figure instead of one pill per shot.
      const dosePeriods = buildWeeklyDoseCycles(injections, getDoseSchedule(injections, injSchedule));
      const doseAt = ms => doseActiveAt(dosePeriods, ms);
      const doseChanges = dosePeriods.map(p =>
        ({ ms: p.startMs, doseMg: p.doseMg, count: p.count, date: msToLocalDate(p.startMs) }));
      // Distinct color per dose level (not a magnitude gradient) so adjacent
      // changes are always clearly different, regardless of how close the
      // mg values are.
      const DOSE_PALETTE = ['#4a90d9', '#34c759', '#ff9500', '#ff3b30', '#b06dff', '#00c7be', '#ff2d55', '#5856d6', '#ffcc00', '#8e8e93'];
      // Trend-line options for the checkbox dropdown — "current" is the existing
      // regression line; the rest are hypothetical fixed weekly loss rates.
      const TREND_OPTIONS = [
        { id: 'current', label: 'Current', ratePerWeek: null, color: '#ff9500' },
        { id: 'r1', label: '1 lb/wk', ratePerWeek: 1, color: '#5ac8fa' },
        { id: 'r2', label: '2 lb/wk', ratePerWeek: 2, color: '#a2845e' },
        { id: 'r3', label: '3 lb/wk', ratePerWeek: 3, color: '#bf5af2' },
        { id: 'r4', label: '4 lb/wk', ratePerWeek: 4, color: '#1d4e89' },
      ];
      const doseColorMap = new Map();
      doseChanges.forEach((c, i) => doseColorMap.set(c.doseMg, DOSE_PALETTE[i % DOSE_PALETTE.length]));
      const colorForDose = doseMg => doseColorMap.get(doseMg) ?? '#4a90d9';
      const lbsAt = ms => {
        if (ms <= pts[0].ms) return pts[0].lbs;
        if (ms >= pts[pts.length - 1].ms) return pts[pts.length - 1].lbs;
        for (let i = 0; i < pts.length - 1; i++) {
          if (ms >= pts[i].ms && ms <= pts[i + 1].ms) {
            const f = (ms - pts[i].ms) / (pts[i + 1].ms - pts[i].ms);
            return pts[i].lbs + (pts[i + 1].lbs - pts[i].lbs) * f;
          }
        }
        return pts[pts.length - 1].lbs;
      };

      const startMs  = pts[0].ms;
      const todayD   = new Date(); todayD.setHours(12,0,0,0);
      const todayMs  = todayD.getTime();

      // Regression window driven by trendDays selector (0 = all data)
      const cutoffMs = trendDays > 0 ? todayMs - trendDays * 86400000 : 0;
      const rPts     = trendDays > 0 ? pts.filter(p => p.ms >= cutoffMs) : pts;
      const regPts   = rPts.length >= 4 ? rPts : pts;

      const n     = regPts.length;
      const rxs   = regPts.map(p => (p.ms - startMs) / 86400000);
      const rys   = regPts.map(p => p.lbs);
      const mX    = rxs.reduce((s,v) => s+v, 0) / n;
      const mY    = rys.reduce((s,v) => s+v, 0) / n;
      const slope = rxs.reduce((s,x,i) => s + (x-mX)*(rys[i]-mY), 0)
                  / rxs.reduce((s,x) => s + (x-mX)**2, 0);
      const intcp = mY - slope * mX;

      // Projected goal date
      const goalDays = slope < 0 ? (GOAL_LBS - intcp) / slope : null;
      const goalMs   = goalDays != null ? startMs + goalDays * 86400000 : null;

      // Goal date drift: compare to projection from 7 days ago (same window)
      const prevToMs     = todayMs - 7 * 86400000;
      const prevCutoffMs = trendDays > 0 ? prevToMs - trendDays * 86400000 : 0;
      const prevRPts     = trendDays > 0
        ? pts.filter(p => p.ms >= prevCutoffMs && p.ms <= prevToMs)
        : pts.filter(p => p.ms <= prevToMs);
      const prevRegPts   = prevRPts.length >= 4 ? prevRPts : pts.filter(p => p.ms <= prevToMs);
      let goalDriftDays = null;
      let prevGoalMs    = null;
      if (prevRegPts.length >= 2) {
        const pn  = prevRegPts.length;
        const pxs = prevRegPts.map(p => (p.ms - startMs) / 86400000);
        const pys = prevRegPts.map(p => p.lbs);
        const pmX = pxs.reduce((s,v) => s+v,0) / pn;
        const pmY = pys.reduce((s,v) => s+v,0) / pn;
        const pSlope = pxs.reduce((s,x,i) => s+(x-pmX)*(pys[i]-pmY),0) / pxs.reduce((s,x) => s+(x-pmX)**2,0);
        const pIntcp = pmY - pSlope * pmX;
        const pGoalDays = pSlope < 0 ? (GOAL_LBS - pIntcp) / pSlope : null;
        prevGoalMs = pGoalDays != null ? startMs + pGoalDays * 86400000 : null;
        if (goalMs != null && prevGoalMs != null)
          goalDriftDays = (goalMs - prevGoalMs) / 86400000;
      }
      const fmtGoalDate = ms => ms ? new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' }) : '—';
      const prevGoalDateStr = fmtGoalDate(prevGoalMs);
      const driftAbs   = goalDriftDays != null ? Math.round(Math.abs(goalDriftDays)) : null;
      const DRIFT_THRESH = 5;
      const driftSymbol = goalDriftDays == null ? null
        : goalDriftDays < -DRIFT_THRESH ? '←'
        : goalDriftDays >  DRIFT_THRESH ? '→'
        : '–';
      const driftColor = goalDriftDays == null ? '#aeaeb2'
        : goalDriftDays < -DRIFT_THRESH ? '#30d158'
        : goalDriftDays >  DRIFT_THRESH ? '#ff9500'
        : '#aeaeb2';

      // Today's position on the current-trend regression line — used both as a
      // possible anchor for the rate lines (see below) and on its own.
      const anchorLbs = intcp + slope * ((todayMs - startMs) / 86400000);

      // The 1-4 lb/wk hypothetical lines fan out from a single shared anchor
      // point, either "today" (continuing the regression's current value forward)
      // or the chart's starting date (intcp — the regression's value at day 0,
      // exactly where the "Current" line itself begins), per the toggle below.
      const ratesAnchorMs  = ratesFromToday ? todayMs : startMs;
      const ratesAnchorLbs = ratesFromToday ? anchorLbs : intcp;

      // Goal date for each rate-based line, independent of endMs/xOf/yOf (computed
      // before the chart's x range so the range can expand to fit whichever
      // checked line's goal lands furthest out).
      const rateGoalMsById = {};
      TREND_OPTIONS.forEach(opt => {
        if (opt.id === 'current') return;
        const slopePerDay = -opt.ratePerWeek / 7;
        // Only project a goal date if there's still weight to lose at this rate —
        // avoids a nonsensical "already reached" date when the anchor is at/below goal.
        const goalDaysFixed = ratesAnchorLbs > GOAL_LBS ? (GOAL_LBS - ratesAnchorLbs) / slopePerDay : null;
        rateGoalMsById[opt.id] = goalDaysFixed != null ? ratesAnchorMs + goalDaysFixed * 86400000 : null;
      });

      // Chart x range: start → latest checked line's goal + 2wk buffer — so a
      // slower hypothetical rate line that reaches goal later than the current
      // trend still fits on-chart instead of running off the edge. The future
      // cap is relative to how much real history there is (at least 90d),
      // not a flat 18 months — otherwise a shaky short trend-period slope
      // (e.g. "Last 2 weeks" over a near-flat stretch) can project a goal date
      // so far out that it squeezes all the actual logged data into a sliver.
      const checkedGoalDates = trendModes
        .map(id => id === 'current' ? goalMs : rateGoalMsById[id])
        .filter(g => g != null);
      const latestGoalMs = checkedGoalDates.length ? Math.max(...checkedGoalDates) : null;
      const maxFutureMs = Math.max(todayMs - startMs, 90 * 86400000);
      const endMs = latestGoalMs
        ? Math.min(latestGoalMs + 14 * 86400000, todayMs + maxFutureMs)
        : startMs + 180 * 86400000;

      // Y range: full history max → goal - 8.
      // Using only the regression window (rys) caused historical dose-change
      // dots to render above the SVG when the user has lost significant weight.
      const maxLbs = Math.max(...pts.map(p => p.lbs)) + 5;
      const minLbs = GOAL_LBS - 8;

      const xOf = ms  => PAD.l + (ms - startMs) / (endMs - startMs) * cW;
      const yOf = lbs => PAD.t + (1 - (lbs - minLbs) / (maxLbs - minLbs)) * cH;

      const todayX  = xOf(todayMs);
      const goalY   = yOf(GOAL_LBS);

      const TREND_LINES = trendModes.map(id => {
        if (id === 'current') {
          return { id, color: '#ff9500',
            x1: PAD.l, y1: yOf(intcp),
            x2: PAD.l + cW, y2: yOf(intcp + slope * (endMs - startMs) / 86400000),
            goalMs, lbsPerWeek: slope * -7 };
        }
        const opt = TREND_OPTIONS.find(o => o.id === id);
        const slopePerDay = -opt.ratePerWeek / 7;
        return { id, color: opt.color,
          x1: xOf(ratesAnchorMs), y1: yOf(ratesAnchorLbs),
          x2: PAD.l + cW, y2: yOf(ratesAnchorLbs + slopePerDay * (endMs - ratesAnchorMs) / 86400000),
          goalMs: rateGoalMsById[id], lbsPerWeek: opt.ratePerWeek };
      });

      // Monthly x-axis ticks
      const xTicks = [];
      const td = new Date(startMs); td.setDate(1); td.setMonth(td.getMonth() + 1);
      while (td.getTime() <= endMs) { xTicks.push(td.getTime()); td.setMonth(td.getMonth() + 1); }

      // Weekly x-axis ticks — weeks elapsed since start. Numeric labels are
      // thinned out (every Nth week) when the visible range is long enough
      // that every-week labels would overlap; the tick marks themselves
      // still appear every week.
      const weekTicks = [];
      for (let ms = startMs, n = 0; ms <= endMs; ms += 7 * 86400000, n++) {
        weekTicks.push({ ms, n });
      }
      const weekPxGap    = cW / Math.max(weekTicks.length - 1, 1);
      const weekLabelStep = Math.max(1, Math.ceil(6 / weekPxGap));

      // Y-axis grid lines every 10 lbs
      const yTicks = [];
      for (let v = Math.ceil(minLbs / 10) * 10; v <= maxLbs; v += 10) yTicks.push(v);

      // Goal tooltip geometry (hoisted so tooltip renders last in SVG = on top)
      const tipW = 96, tipR = 5;
      const tipH = prevGoalMs ? 56 : 44;
      const statusLabel = driftSymbol === '←' ? 'Improving' : driftSymbol === '→' ? 'Worsening' : 'Stable';
      const tipGx  = goalMs ? xOf(goalMs) : null;
      const tipX   = tipGx != null ? (tipGx + tipW + 10 > PAD.l + cW ? tipGx - tipW - 8 : tipGx + 8) : 0;
      const tipY   = tipGx != null ? Math.max(PAD.t, goalY - tipH / 2) : 0;

      // Color-graded weight line: split pts into runs sharing the same active
      // dose, each run overlapping its neighbor by one point so segments
      // connect with no visual gap.
      const doseSegments = [];
      { let curDose = doseAt(pts[0].ms);
        let curRun  = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          const d = doseAt(pts[i].ms);
          if (d !== curDose) {
            curRun.push(pts[i]);
            doseSegments.push({ dose: curDose, pts: curRun });
            curRun = [pts[i]];
            curDose = d;
          } else {
            curRun.push(pts[i]);
          }
        }
        doseSegments.push({ dose: curDose, pts: curRun });
      }

      // Dose changes before the chart's first data point would otherwise be
      // dropped entirely (e.g. the first injection often predates the first
      // logged weight) — keep whichever was still active at chart start and
      // pin it to the left edge instead of losing it.
      const priorChanges = doseChanges.filter(c => c.ms < startMs);
      const visibleDoseChanges = [
        ...(priorChanges.length ? [{ ...priorChanges[priorChanges.length - 1], ms: startMs }] : []),
        ...doseChanges.filter(c => c.ms >= startMs && c.ms <= endMs),
      ];

      // Pills live in a dedicated band above the chart (clear of the line
      // entirely) and are linked to their dose-change point with a thin
      // leader line. Placed left-to-right; a pill is nudged right of its
      // ideal (dot-centered) position whenever it would overlap the
      // previous one, so dense escalation periods don't collide.
      // Two rows: when a pill would push too far right in row 0, it drops to row 1.
      const pillH = 6, pillGap = 2;
      const ROW_Y = [2, 2 + pillH + 2];  // row 0 top, row 1 top
      const prevRight = [-Infinity, -Infinity];
      const pillPlacements = visibleDoseChanges.map((c, idx, arr) => {
        const dotX = xOf(c.ms), dotY = yOf(lbsAt(c.ms));
        const color = colorForDose(c.doseMg);
        // doseMg is already the effective projected weekly dose (partial week handled upstream)
        const dosePart = `${c.doseMg}mg`;
        const pillW = 7 + dosePart.length * 2.2 + 8;
        // Pick whichever row places this pill closest to its ideal dot x
        let bestRow = 0, bestCx = Infinity;
        for (let row = 0; row < 2; row++) {
          const minCx = prevRight[row] + pillGap + pillW / 2;
          const cx = Math.min(Math.max(Math.max(dotX, minCx), PAD.l + pillW / 2), PAD.l + cW - pillW / 2);
          if (cx < bestCx) { bestCx = cx; bestRow = row; }
        }
        prevRight[bestRow] = bestCx + pillW / 2;
        return { dotX, dotY, color, dosePart, pillW, cx: bestCx, rowY: ROW_Y[bestRow] };
      });

      // Stats
      const startLbs      = pts[0].lbs;
      const currentLbs    = pts[pts.length - 1].lbs;
      const totalLost     = startLbs - currentLbs;
      const pctBodyLost   = (totalLost / startLbs) * 100;
      const pctGoal       = Math.min((totalLost / (startLbs - GOAL_LBS)) * 100, 100);
      const goalDateStr   = goalMs ? new Date(goalMs).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' }) : '—';

      const startDateStr   = new Date(startMs).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
      const currentDateStr = new Date(pts[pts.length - 1].ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });

      // Weight change over the *selected trend period* (same cutoffMs the
      // regression line itself uses) — kept next to Current so the headline
      // number always matches whatever window the Trend period selector is
      // currently showing, not a fixed span.
      const TREND_PERIOD_PHRASE = {
        14: 'last 2 weeks', 21: 'last 3 weeks', 30: 'last month',
        42: 'last 6 weeks', 90: 'last 3 months', 0: 'all time',
      };
      const periodLoss = lbsAt(cutoffMs) - currentLbs;
      const periodLossSign = periodLoss >= 0 ? '↓' : '↑';

      const stats = [
        { label: 'Starting',    value: startLbs.toFixed(1) + ' lbs', sub: startDateStr },
        { label: 'Current',     value: currentLbs.toFixed(1) + ' lbs', sub: currentDateStr },
        { label: 'Weight Loss', value: `${periodLossSign}${Math.abs(periodLoss).toFixed(1)} lbs`,
          sub: TREND_PERIOD_PHRASE[trendDays] ?? '', color: periodLoss >= 0 ? '#34c759' : '#ff3b30' },
        { label: 'Goal',        value: GOAL_LBS + ' lbs' },
        { label: '% to Goal',   value: pctGoal.toFixed(1) + '%',   color: '#34c759' },
        { label: 'Lost',        value: totalLost.toFixed(1) + ' lbs', color: '#34c759' },
        { label: '% Body Wt',   value: pctBodyLost.toFixed(1) + '%',  color: '#34c759' },
      ];

      // Renders the chart (header text + SVG) onto a canvas and shares it via
      // the Web Share API (native share sheet) when available, falling back
      // to a plain PNG download otherwise.
      const shareChart = async () => {
        if (!svgRef.current || sharing) return;
        setSharing(true);
        try {
          const scale = 3, headerH = 66;
          const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif";

          // Explicit pixel width/height (not just viewBox) so the browser
          // rasterizes the SVG at full target resolution up front, instead
          // of rendering it small and stretching a blurry bitmap. The SVG's
          // own <text> elements have no font-family set directly on them
          // (they inherit it from the page's CSS while live in the DOM) —
          // a standalone serialized copy has no access to that stylesheet,
          // so it falls back to the browser's SVG default (serif). Embed an
          // explicit <style> so the exported text matches the live page.
          const svgClone = svgRef.current.cloneNode(true);
          svgClone.setAttribute('width', VW * scale);
          svgClone.setAttribute('height', VH * scale);
          const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
          styleEl.textContent = `text { font-family: ${FONT}; }`;
          svgClone.insertBefore(styleEl, svgClone.firstChild);
          const svgString = new XMLSerializer().serializeToString(svgClone);
          const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

          const img = new Image();
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = svgUrl;
          });

          const canvas = document.createElement('canvas');
          canvas.width = VW * scale;
          canvas.height = (VH + headerH) * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#1c1c1e';
          ctx.font = `700 13px ${FONT}`;
          ctx.textAlign = 'left';
          ctx.fillText('My Weight Trend', 14, 16);
          ctx.font = `600 10px ${FONT}`;
          ctx.fillText(`Starting: ${startLbs.toFixed(1)} lbs · Current: ${currentLbs.toFixed(1)} lbs`, 14, 30);
          ctx.fillStyle = '#34c759';
          ctx.font = `700 10px ${FONT}`;
          ctx.fillText(`↓ ${totalLost.toFixed(1)} lbs lost (${pctBodyLost.toFixed(1)}%) · ${pctGoal.toFixed(1)}% to goal`, 14, 44);
          ctx.fillStyle = '#8e8e93';
          ctx.font = `400 9px ${FONT}`;
          ctx.fillText(`Since ${startDateStr}`, 14, 56);
          ctx.drawImage(img, 0, headerH, VW, VH);

          const fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const file = new File([fileBlob], 'weight-trend.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'My Weight Trend',
              text: `${currentLbs.toFixed(1)} lbs — down ${totalLost.toFixed(1)} lbs since ${startDateStr}!`,
            });
          } else {
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = url; a.download = 'weight-trend.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        } catch (e) {
          if (e.name !== 'AbortError') console.warn('[WeightChart] share failed:', e);
        } finally {
          setSharing(false);
        }
      };

      return (
        <div>
          {/* Stats header */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)',
                        borderBottom: '.5px solid rgba(0,0,0,.06)' }}>
            {stats.map(({ label, value, color, sub }) => (
              <div key={label} style={{ padding: '10px 4px', textAlign: 'center',
                                        borderRight: '.5px solid rgba(0,0,0,.05)' }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: '#8e8e93',
                              textTransform: 'uppercase', letterSpacing: .4, marginBottom: 3 }}>{label}</div>
                <div style={{ fontSize: 15, fontWeight: 700, color: color ?? '#1c1c1e',
                              fontVariantNumeric: 'tabular-nums' }}>{value}</div>
                {sub && (
                  <div style={{ fontSize: 10, color: '#aeaeb2', marginTop: 1 }}>{sub}</div>
                )}
              </div>
            ))}
          </div>

          {/* Trend period selector + Trend line picker */}
          <div style={{ display:'flex', gap:8, padding:'8px 14px 4px', alignItems:'center', flexWrap:'wrap' }}>
            <div style={{ display:'flex', alignItems:'center', gap:6 }}>
              <span style={{ fontSize:10, fontWeight:600, color:'#8e8e93' }}>Trend period</span>
              <select value={trendDays} onChange={e => setTrendDays(Number(e.target.value))}
                      style={{ fontSize:10, fontWeight:600, padding:'4px 6px', borderRadius:8,
                               background:'#f2f2f7', color:'#3c3c43', border:'none', outline:'none', cursor:'pointer' }}>
                <option value={14}>Last 2 weeks</option>
                <option value={21}>Last 3 weeks</option>
                <option value={30}>Last month</option>
                <option value={42}>Last 6 weeks</option>
                <option value={90}>Last 3 months</option>
                <option value={0}>All time</option>
              </select>
            </div>
          <div style={{ position: 'relative' }} ref={trendMenuRef}>
            <button onClick={() => setTrendMenuOpen(v => !v)}
                    style={{ fontSize: 10, fontWeight: 600, padding: '5px 8px', borderRadius: 8,
                             background: '#f2f2f7', color: '#3c3c43', border: 'none', outline: 'none', cursor: 'pointer' }}>
              Trend Lines{trendModes.length ? ` (${trendModes.length})` : ''} ▾
            </button>
            {trendMenuOpen && (
              <div style={{ position: 'absolute', top: '100%', left: 14, marginTop: 4, zIndex: 10,
                            background: '#fff', borderRadius: 10, boxShadow: '0 4px 16px rgba(0,0,0,.15)',
                            padding: 8, minWidth: 130 }}>
                {TREND_OPTIONS.map(opt => (
                  <label key={opt.id}
                         style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 4px',
                                  fontSize: 11, color: '#3c3c43', cursor: 'pointer' }}>
                    <input type="checkbox" checked={trendModes.includes(opt.id)}
                           onChange={() => setTrendModes(m =>
                             m.includes(opt.id) ? m.filter(id => id !== opt.id) : [...m, opt.id])} />
                    <span style={{ width: 8, height: 8, borderRadius: 4, background: opt.color, flexShrink: 0 }} />
                    {opt.label}
                  </label>
                ))}
                <div style={{ borderTop: '.5px solid rgba(0,0,0,.08)', margin: '4px 0' }} />
                <label style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '4px 4px',
                                 fontSize: 11, color: '#3c3c43', cursor: 'pointer' }}>
                  <input type="checkbox" checked={ratesFromToday}
                         onChange={() => setRatesFromToday(v => !v)} />
                  Start rate lines from today
                </label>
              </div>
            )}
          </div>
          </div>{/* end trend controls row */}

          {/* Chart */}
          <svg ref={svgRef} viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', height: 'auto', display: 'block' }}
               onMouseMove={e => {
                 const rect = e.currentTarget.getBoundingClientRect();
                 const svgX = (e.clientX - rect.left) / rect.width * VW;
                 if (svgX < PAD.l || svgX > PAD.l + cW) { setWeightTip(null); return; }
                 const ms = startMs + (svgX - PAD.l) / cW * (endMs - startMs);
                 let best = pts[0], minD = Infinity;
                 pts.forEach(p => { const d = Math.abs(p.ms - ms); if (d < minD) { minD = d; best = p; } });
                 // Only show tip when cursor is within 2 days of the nearest logged point
                 // — prevents phantom tooltip when hovering empty future space.
                 if (minD > 2 * 86400000) { setWeightTip(null); return; }
                 setWeightTip({ ms: best.ms, lbs: best.lbs, dateStr: msToLocalDate(best.ms) });
               }}
               onMouseLeave={() => setWeightTip(null)}>
            <defs>
              <clipPath id="wc-chart-area">
                <rect x={PAD.l} y={PAD.t} width={cW} height={cH} />
              </clipPath>
            </defs>

            {/* Y grid lines */}
            {yTicks.map(v => (
              <line key={v} x1={PAD.l} y1={yOf(v)} x2={PAD.l + cW} y2={yOf(v)}
                    stroke="rgba(0,0,0,.05)" strokeWidth="1" />
            ))}

            {/* Goal line */}
            <line x1={PAD.l} y1={goalY} x2={PAD.l + cW} y2={goalY}
                  stroke="#34c759" strokeWidth="1.5" strokeDasharray="5,3" opacity="0.55" />

            {/* Today shading */}
            <rect x={todayX} y={PAD.t} width={Math.max(0, xOf(endMs) - todayX)} height={cH}
                  fill="rgba(0,0,0,.018)" />

            {/* Trend lines — clipped to chart area, hoverable for goal date */}
            <g clipPath="url(#wc-chart-area)">
              {TREND_LINES.map(t => {
                const opt = TREND_OPTIONS.find(o => o.id === t.id);
                const mx = (t.x1 + t.x2) / 2;
                const slope = (t.y2 - t.y1) / (t.x2 - t.x1 || 1);
                const my = t.y1 + slope * (mx - t.x1);
                return (
                  <line key={t.id} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2}
                        stroke={t.color} strokeWidth="4" strokeDasharray="6,3" opacity="0"
                        style={{ cursor:'crosshair' }}
                        onMouseEnter={() => setTrendLineTip({ label: opt?.label ?? t.id, goalMs: t.goalMs, lbsPerWeek: t.lbsPerWeek, x: mx, y: my })}
                        onMouseLeave={() => setTrendLineTip(null)} />
                );
              })}
              {TREND_LINES.map(t => (
                <line key={`${t.id}-vis`} x1={t.x1} y1={t.y1} x2={t.x2} y2={t.y2}
                      stroke={t.color} strokeWidth="1.5" strokeDasharray="6,3" opacity="0.7"
                      style={{ pointerEvents:'none' }} />
              ))}
            </g>

            {/* Weight line — distinct color per weekly tirz dose */}
            {doseSegments.map((seg, i) => (
              <polyline key={i}
                points={seg.pts.map(p => `${xOf(p.ms).toFixed(1)},${yOf(p.lbs).toFixed(1)}`).join(' ')}
                fill="none" stroke={seg.dose == null ? '#4a90d9' : colorForDose(seg.dose)}
                strokeWidth="1.5" strokeLinejoin="round" />
            ))}

            {/* Dose-change markers — dot on the line, pill in the top
                band (clear of the data), linked by a thin leader line */}
            {pillPlacements.map((p, i) => (
              <g key={i}>
                <line x1={p.cx} y1={p.rowY + pillH} x2={p.dotX} y2={p.dotY}
                      stroke={p.color} strokeWidth="0.6" opacity="0.5" />
                <circle cx={p.dotX} cy={p.dotY} r="2" fill={p.color} stroke="#fff" strokeWidth="0.8" />
                <g style={{ filter: 'drop-shadow(0 1px 1px rgba(0,0,0,.2))' }}>
                  <rect x={p.cx - p.pillW / 2} y={p.rowY} width={p.pillW} height={pillH} rx={pillH / 2} fill={p.color} />
                  <text x={p.cx} y={p.rowY + pillH / 2 + 1.2} textAnchor="middle"
                        fontSize="3.2" fontWeight="700" fill="#fff">
                    {p.dosePart}<tspan fontSize="2.5" fontWeight="600"> /wk</tspan>
                  </text>
                </g>
              </g>
            ))}

            {/* Today line */}
            <line x1={todayX} y1={PAD.t} x2={todayX} y2={PAD.t + cH}
                  stroke="#ff6b35" strokeWidth="1.5" opacity="0.5" />
            <text x={todayX + 3} y={PAD.t + 9} fontSize="5" fill="#ff6b35" fontWeight="600">today</text>

            {/* Projected goal marker */}
            {trendModes.includes('current') && goalMs && goalMs > todayMs && (
              <g>
                <line x1={xOf(goalMs)} y1={PAD.t} x2={xOf(goalMs)} y2={PAD.t + cH}
                      stroke="#34c759" strokeWidth="1" strokeDasharray="3,2" opacity="0.5" />
                {/* Interactive goal dot */}
                <g style={{ cursor: 'pointer' }}
                   onMouseEnter={() => setGoalTip(true)}
                   onMouseLeave={() => setGoalTip(false)}
                   onClick={() => setGoalTip(v => !v)}>
                  <circle cx={tipGx} cy={goalY} r="10" fill="transparent" />
                  <circle cx={tipGx} cy={goalY} r="6"
                          fill={driftColor ?? '#34c759'} stroke="#fff" strokeWidth="1.5" />
                  {driftSymbol === '←' && (
                    <path d={`M ${tipGx+2.5},${goalY-2} L ${tipGx-2.5},${goalY} L ${tipGx+2.5},${goalY+2}`}
                          fill="none" stroke="#fff" strokeWidth="1.3" strokeLinejoin="round" strokeLinecap="round" />
                  )}
                  {driftSymbol === '→' && (
                    <path d={`M ${tipGx-2.5},${goalY-2} L ${tipGx+2.5},${goalY} L ${tipGx-2.5},${goalY+2}`}
                          fill="none" stroke="#fff" strokeWidth="1.3" strokeLinejoin="round" strokeLinecap="round" />
                  )}
                  {driftSymbol === '–' && (
                    <line x1={tipGx-2.5} y1={goalY} x2={tipGx+2.5} y2={goalY}
                          stroke="#fff" strokeWidth="1.3" strokeLinecap="round" />
                  )}
                </g>
                <text x={xOf(goalMs)} y={PAD.t + cH + 28} textAnchor="middle"
                      fontSize="5" fill="#34c759" fontWeight="600">{goalDateStr}</text>
              </g>
            )}

            {/* Axes */}
            <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="1" />
            <line x1={PAD.l} y1={PAD.t + cH} x2={PAD.l + cW} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="1" />

            {/* Y axis labels */}
            {yTicks.map(v => (
              <text key={v} x={PAD.l - 5} y={yOf(v) + 3} textAnchor="end"
                    fontSize="4.5" fill="#aeaeb2">{v}</text>
            ))}
            <text x={PAD.l - 5} y={goalY + 3} textAnchor="end"
                  fontSize="4.5" fill="#34c759" fontWeight="600">{GOAL_LBS}</text>

            {/* Week count ticks — weeks elapsed since start */}
            <text x={PAD.l - 3} y={PAD.t + cH + 6} textAnchor="end"
                  fontSize="3.5" fill="#aeaeb2">Week</text>
            {weekTicks.map(({ ms, n }) => (
              <g key={n}>
                <line x1={xOf(ms)} y1={PAD.t + cH} x2={xOf(ms)} y2={PAD.t + cH + 2}
                      stroke="#e5e5ea" strokeWidth="0.75" />
                {n % weekLabelStep === 0 && (
                  <text x={xOf(ms)} y={PAD.t + cH + 6} textAnchor="middle"
                        fontSize="3" fill="#c7c7cc">{n}</text>
                )}
              </g>
            ))}

            {/* X axis ticks */}
            {xTicks.map(ms => (
              <g key={ms}>
                <line x1={xOf(ms)} y1={PAD.t + cH} x2={xOf(ms)} y2={PAD.t + cH + 3}
                      stroke="#d1d1d6" strokeWidth="1" />
                <text x={xOf(ms)} y={PAD.t + cH + 14} textAnchor="middle"
                      fontSize="5" fill="#aeaeb2">
                  {new Date(ms).toLocaleDateString('en-US', { month: 'short' })}
                </text>
              </g>
            ))}

            {/* Weight line hover tooltip */}
            {weightTip && !trendLineTip && (() => {
              const startLbs = pts.length ? pts[0].lbs : null;
              const lost = startLbs != null ? weightTip.lbs - startLbs : null;
              const { wd, mo, day } = fmtDate(weightTip.dateStr);
              const wx = xOf(weightTip.ms);
              const wy = yOf(weightTip.lbs);
              const TW = 68, TH = 28, TR = 4;
              const tx = Math.max(PAD.l, Math.min(wx - TW / 2, PAD.l + cW - TW));
              const ty = Math.max(PAD.t + 2, wy - TH - 6);
              return (
                <g style={{ pointerEvents:'none' }}>
                  {/* Crosshair — smaller and less obtrusive than a filled circle */}
                  <line x1={wx-5} y1={wy} x2={wx+5} y2={wy} stroke="#1c1c1e" strokeWidth="0.7" />
                  <line x1={wx} y1={wy-5} x2={wx} y2={wy+5} stroke="#1c1c1e" strokeWidth="0.7" />
                  <circle cx={wx} cy={wy} r="1.5" fill="#1c1c1e" />
                  <rect x={tx} y={ty} width={TW} height={TH} rx={TR} fill="rgba(28,28,30,.92)" />
                  <text x={tx + TW/2} y={ty + 8} textAnchor="middle"
                        fontSize="4.5" fill="rgba(255,255,255,.55)">{wd} {mo} {day}</text>
                  <text x={tx + TW/2} y={ty + 20} textAnchor="middle"
                        fontSize="6.5" fontWeight="600" fill="#34c759" fontVariantNumeric="tabular-nums">
                    {weightTip.lbs.toFixed(1)}{lost != null ? ` / ${lost.toFixed(1)}` : ''}
                  </text>
                </g>
              );
            })()}

            {/* Trend line hover tooltip */}
            {trendLineTip && (() => {
              const TW = 130, TR = 4;
              const rate = trendLineTip.lbsPerWeek;
              const rateStr = rate != null ? `${rate >= 0 ? '' : '+'}${(-rate).toFixed(2)} lbs/wk` : null;
              const TH = rateStr ? 34 : 26;
              const tx = Math.max(PAD.l, Math.min(trendLineTip.x - TW / 2, PAD.l + cW - TW));
              const ty = Math.max(PAD.t + 2, trendLineTip.y - TH - 6);
              const dateStr = trendLineTip.goalMs
                ? new Date(trendLineTip.goalMs).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' })
                : null;
              const trendLabel = trendLineTip.label === 'Current'
                ? 'Current Trend'
                : `${trendLineTip.label} trend`;
              return (
                <g style={{ pointerEvents:'none' }}>
                  <rect x={tx} y={ty} width={TW} height={TH} rx={TR} fill="rgba(28,28,30,.92)" />
                  <text x={tx + TW/2} y={ty + 9} textAnchor="middle"
                        fontSize="5.5" fontWeight="600" fill="#fff">{trendLabel}</text>
                  {rateStr && (
                    <text x={tx + TW/2} y={ty + 18} textAnchor="middle" fontSize="5" fontWeight="600" fill="#34c759">
                      {rateStr}
                    </text>
                  )}
                  <text x={tx + TW/2} y={ty + TH - 5} textAnchor="middle" fontSize="5" fill="rgba(255,255,255,.55)">
                    {dateStr ? `Goal: ${dateStr}` : 'Beyond chart range'}
                  </text>
                </g>
              );
            })()}

            {/* Goal tooltip — rendered last so it sits above all other elements */}
            {goalTip && tipGx != null && (
              <g style={{ pointerEvents: 'none' }}>
                <rect x={tipX} y={tipY} width={tipW} height={tipH} rx={tipR} fill="#1c1c1e" />
                <text x={tipX+8} y={tipY+11} fontSize="7" fontWeight="700"
                      fill={driftColor ?? '#34c759'}>{statusLabel}</text>
                <text x={tipX+8} y={tipY+22} fontSize="6">
                  <tspan fill="rgba(255,255,255,.45)">now · </tspan>
                  <tspan fill="#fff" fontWeight="600">{goalDateStr}</tspan>
                </text>
                {prevGoalMs && (
                  <text x={tipX+8} y={tipY+32} fontSize="6">
                    <tspan fill="rgba(255,255,255,.45)">7d ago · </tspan>
                    <tspan fill="rgba(255,255,255,.75)" fontWeight="600">{prevGoalDateStr}</tspan>
                  </text>
                )}
                {driftAbs != null && driftSymbol !== '–' && (
                  <text x={tipX+8} y={tipY+(prevGoalMs ? 42 : 32)} fontSize="6" fill={driftColor}>
                    {driftSymbol === '←' ? `↓ ${driftAbs}d sooner` : `↑ ${driftAbs}d later`}
                  </text>
                )}
                <text x={tipX+8} y={tipY+tipH-4} fontSize="4.5"
                      fill="rgba(255,255,255,.3)">21-day rolling trend</text>
              </g>
            )}
          </svg>

          {/* Projection notes (one pill per checked trend line with a goal date) */}
          {TREND_LINES.some(t => t.goalMs) && (
            <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: 6, padding: '4px 14px 0' }}>

    /* ─── Progress Videos Grid ───────────────────────────────────────────────── */
    // Seeks a thumbnail <video> to a representative frame (many clips open on a
    // blank first frame) and forces the browser to actually paint it — some
    // browsers (notably Safari) won't render a seeked frame without a
    // play/pause nudge, even when muted.
    const thumbOnLoaded = e => {
      const v = e.target;
      try { v.currentTime = Math.min(1, (v.duration || 2) / 2); } catch (_) {}
    };
    const thumbOnSeeked = e => {
      const v = e.target;
      const p = v.play();
      if (p && p.then) p.then(() => v.pause()).catch(() => {});
    };

    // A single clickable video thumbnail: seeked live-frame preview, play glyph,
    // and a date-span label overlaid at the bottom.
    const THUMB_W = 176; // halfway between the old "full term" (220) and grid (~130) sizes

    function VideoThumb({ video, onPlayVideo, badge }) {
      return (
        <div onClick={() => onPlayVideo && onPlayVideo(video)}
             style={{ cursor: 'pointer', borderRadius: 12, overflow: 'hidden', width: THUMB_W,
                       position: 'relative', background: '#000', aspectRatio: '3 / 4', flexShrink: 0 }}>
          <video muted playsInline preload="auto" src={video.url}
                 onLoadedMetadata={thumbOnLoaded} onSeeked={thumbOnSeeked}
                 style={{ width: '100%', height: '100%', objectFit: 'cover', pointerEvents: 'none' }} />
          <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: '10px 8px 8px',
                        height: '30%', display: 'flex', alignItems: 'flex-end',
                        background: 'linear-gradient(to top, rgba(0,0,0,.95) 65%, transparent)' }}>
            <div style={{ color: '#fff', fontSize: 11, fontWeight: 700 }}>
              {fmtShort(video.startDate)} – {fmtShort(video.endDate)}
            </div>
          </div>
          {badge && (
            <div style={{ position: 'absolute', top: 6, left: 6, padding: '2px 7px', borderRadius: 20,
                          background: '#4a90d9', color: '#fff', fontSize: 8.5, fontWeight: 700,
                          textTransform: 'uppercase', letterSpacing: .4 }}>
              {badge}
            </div>
          )}
          <div style={{ position: 'absolute', top: 6, right: 6, width: 20, height: 20, borderRadius: '50%',
                        background: 'rgba(0,0,0,.5)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <span style={{ color: '#fff', fontSize: 9 }}>▶</span>
          </div>
        </div>
      );
    }

    function ProgressVideosGrid({ videos = [], onPlayVideo }) {
      // The "full term" clip is the one bounding every other clip's date range
      // (starts at the earliest date, ends at the latest) — shown first, flagged
      // with a badge, but otherwise sized identically to the segment clips.
      const minStart = videos.reduce((min, v) => (v.startDate < min ? v.startDate : min), videos[0]?.startDate);
      const maxEnd   = videos.reduce((max, v) => (v.endDate   > max ? v.endDate   : max), videos[0]?.endDate);
      const fullTerm = videos.find(v => v.startDate === minStart && v.endDate === maxEnd);
      const segments = videos.filter(v => v !== fullTerm)
        .sort((a, b) => a.startDate.localeCompare(b.startDate));

      return (
        <div style={{ borderRadius: 18, overflow: 'hidden', background: '#fff',
                      border: '.5px solid rgba(0,0,0,.08)', marginBottom: 10 }}>
          <div style={{ padding: '10px 14px 6px', borderBottom: '.5px solid rgba(0,0,0,.06)' }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: '#1c1c1e' }}>Progress Videos</div>
          </div>

          {!videos.length ? (
            <div style={{ padding: '14px', fontSize: 12, color: '#aeaeb2', textAlign: 'center' }}>
              No progress videos yet.
            </div>
          ) : (
            <div style={{ padding: 12, display: 'flex', flexWrap: 'wrap', gap: 10 }}>
              {fullTerm && <VideoThumb video={fullTerm} onPlayVideo={onPlayVideo} badge="Full Term" />}
              {segments.map(v => (
                <VideoThumb key={v.startDate} video={v} onPlayVideo={onPlayVideo} />
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ─── Daily Weight Change by Day-of-Week ──────────────────────────────────── */
    function DailyWeightChart({ rows }) {
      if (!rows || rows.length < 2) return null;

      // Build day-of-week deltas from consecutive logged days (rows is newest-first)
      const dayDeltas = [[], [], [], [], [], [], []]; // 0=Sun … 6=Sat
      for (let i = 0; i < rows.length - 1; i++) {
        const todayMs = new Date(rows[i].date   + 'T12:00:00').getTime();
        const yestMs  = new Date(rows[i+1].date + 'T12:00:00').getTime();
        if (todayMs - yestMs !== 86400000) continue; // must be consecutive calendar days
        const dow   = new Date(rows[i].date + 'T12:00:00').getDay();
        const delta = rows[i].lbs - rows[i+1].lbs;   // negative = lost weight (today < yesterday)
        dayDeltas[dow].push(delta);
      }

      // Display Mon→Sun (Mon=1 … Sun=0)
      const DISPLAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
      const bars = DISPLAY_ORDER.map(dow => ({
        dow,
        wd:    WD[dow],
        avg:   dayDeltas[dow].length
                 ? dayDeltas[dow].reduce((s, v) => s + v, 0) / dayDeltas[dow].length
                 : null,
        count: dayDeltas[dow].length,
      }));

      const hasData = bars.filter(b => b.avg !== null);
      if (!hasData.length) return null;

      const VW = 360, VH = 120;
      const PAD = { t: 10, r: 14, b: 30, l: 36 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;

      const maxAbs = Math.max(...hasData.map(b => Math.abs(b.avg)), 0.1);
      const yScale = maxAbs * 1.4;
      const zeroY  = PAD.t + cH / 2;
      const yOf    = v => zeroY - (v / yScale) * (cH / 2);

      const slotW = cW / 7;
      const barW  = Math.max(8, slotW * 0.55);
      const xOf   = i => PAD.l + (i + 0.5) * slotW;

      return (
        <div>
          <svg viewBox={`0 0 ${VW} ${VH}`} style={{ width:'100%', height:'auto', display:'block' }}>
            {/* Y-axis labels: positive = gain (top), negative = loss (bottom) */}
            <text x={PAD.l-3} y={PAD.t+5} textAnchor="end" fontSize="5" fill="#aeaeb2">
              +{maxAbs.toFixed(2)}
            </text>
            <text x={PAD.l-3} y={zeroY+2} textAnchor="end" fontSize="5" fill="#aeaeb2">0</text>
            <text x={PAD.l-3} y={PAD.t+cH-1} textAnchor="end" fontSize="5" fill="#aeaeb2">
              -{maxAbs.toFixed(2)}
            </text>

            {/* Axis lines */}
            <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={PAD.t+cH}
                  stroke="rgba(0,0,0,.08)" strokeWidth="0.5" />
            <line x1={PAD.l} y1={zeroY} x2={PAD.l+cW} y2={zeroY}
                  stroke="rgba(0,0,0,.18)" strokeWidth="0.8" />
            {/* Light grid at ±half */}
            {[-maxAbs*0.5, maxAbs*0.5].map(v => (
              <line key={v} x1={PAD.l} y1={yOf(v)} x2={PAD.l+cW} y2={yOf(v)}
                    stroke="rgba(0,0,0,.05)" strokeWidth="0.5" />
            ))}

            {/* Bars */}
            {bars.map((b, i) => {
              if (b.avg === null) return (
                <g key={b.dow}>
                  <text x={xOf(i)} y={PAD.t+cH+10} textAnchor="middle"
                        fontSize="5" fill="#d1d1d6">{b.wd}</text>
                </g>
              );
              const y   = yOf(b.avg);
              const h   = Math.max(1, Math.abs(zeroY - y));
              const top = b.avg < 0 ? zeroY : y;     // loss (neg) bar goes below zero
              const col = b.avg < 0 ? '#34c759' : '#ff9500'; // loss=green, gain=orange
              const txtCol = b.avg < 0 ? '#1a7f3c' : '#c0392b';
              return (
                <g key={b.dow}>
                  <rect x={xOf(i)-barW/2} y={top} width={barW} height={h}
                        rx={2} fill={col} opacity="0.82" />
                  <text x={xOf(i)} y={b.avg < 0 ? top+h+6 : top-2}
                        textAnchor="middle" fontSize="4.5" fontWeight="600" fill={txtCol}>
                    {b.avg > 0 ? '+' : ''}{b.avg.toFixed(2)}
                  </text>
                  <text x={xOf(i)} y={PAD.t+cH+11} textAnchor="middle"
                        fontSize="6" fontWeight="600" fill="#3c3c43">{b.wd}</text>
                  <text x={xOf(i)} y={PAD.t+cH+20} textAnchor="middle"
                        fontSize="4" fill="#c7c7cc">n={b.count}</text>
                </g>
              );
            })}
          </svg>
          <div style={{ padding:'2px 14px 10px', fontSize:9, color:'#aeaeb2', textAlign:'center' }}>
            Avg daily weight change vs prior day · green = loss · orange = gain · n = consecutive pairs
          </div>
        </div>
      );
    }

    /* ─── Weight Loss Per Dose ──────────────────────────────────────────────── */
    function DoseWeightLossChart({ rows, injections, injSchedule }) {
      const [hoveredDose, setHoveredDose] = useState(null);
      if (!rows || rows.length < 2 || !injections || injections.length < 2) return null;

      const DOSE_PALETTE = ['#4a90d9','#34c759','#ff9500','#ff3b30','#b06dff','#00c7be','#ff2d55','#5856d6','#ffcc00','#8e8e93'];

      const pts = [...rows].reverse().map(r => ({
        ms: new Date(r.date + 'T12:00:00').getTime(), lbs: r.lbs
      }));
      const lbsAt = ms => {
        if (!pts.length) return null;
        if (ms <= pts[0].ms) return pts[0].lbs;
        if (ms >= pts[pts.length-1].ms) return pts[pts.length-1].lbs;
        for (let i = 0; i < pts.length-1; i++) {
          if (ms >= pts[i].ms && ms <= pts[i+1].ms) {
            const f = (ms - pts[i].ms) / (pts[i+1].ms - pts[i].ms);
            return pts[i].lbs + (pts[i+1].lbs - pts[i].lbs) * f;
          }
        }
        return pts[pts.length-1].lbs;
      };

      // Weekly totals/estimates, not per-injection amounts — matches
      // WeightChart's dose pills so an uneven split (or a fractional every-N-
      // days cadence) shows one meaningful combined figure per pill.
      const doseChanges = buildWeeklyDoseCycles(injections, getDoseSchedule(injections, injSchedule))
        .map(p => ({ ms: p.startMs, doseMg: p.doseMg }));
      if (doseChanges.length < 2) return null;

      const todayMs = new Date().setHours(12,0,0,0);
      const dosePeriods = doseChanges.map((dc, i) => {
        const endMs = i < doseChanges.length - 1 ? doseChanges[i+1].ms : todayMs;
        const startW = lbsAt(dc.ms), endW = lbsAt(endMs);
        // Allow negative (weight gained during a period) — clipping to 0 inflates
        // the total vs the actual net weight change.
        const lostLbs = startW != null && endW != null ? startW - endW : 0;
        return { doseMg: dc.doseMg, lostLbs, color: DOSE_PALETTE[i % DOSE_PALETTE.length] };
      });

      if (!dosePeriods.length) return null;
      // Pie only shows periods where weight was lost; table shows all
      const pieSlices = dosePeriods.filter(p => p.lostLbs > 0);
      const totalLost = dosePeriods.reduce((s, p) => s + p.lostLbs, 0);
      if (pieSlices.length === 0) return null;
      if (totalLost <= 0) return null;

      // Pie geometry — 40% larger than previous (85 → 119), centered
      const cx = 140, cy = 140, r = 119;
      let angle = -Math.PI / 2;
      const totalPieLost = pieSlices.reduce((s, p) => s + p.lostLbs, 0);
      const slices = pieSlices.map((p, i) => {
        const fraction = p.lostLbs / totalPieLost;
        const startA = angle;
        angle += fraction * 2 * Math.PI;
        const endA = angle;
        const large = fraction > 0.5 ? 1 : 0;
        const x1 = cx + r * Math.cos(startA), y1 = cy + r * Math.sin(startA);
        const x2 = cx + r * Math.cos(endA),   y2 = cy + r * Math.sin(endA);
        return { ...p, i, fraction,
          d: `M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z` };
      });

      const hov = hoveredDose != null ? slices.find(s => s.doseMg === hoveredDose) : null;

      return (
        <div style={{ display:'flex', justifyContent:'center', alignItems:'flex-start',
                      padding:'12px 14px 16px', gap:24, flexWrap:'wrap' }}>
          {/* Pie chart — no perimeter labels, hover tooltip in center */}
          <svg viewBox="0 0 280 280" style={{ width:240, flexShrink:0, cursor:'default' }}
               onMouseLeave={() => setHoveredDose(null)}>
            {slices.map((s) => (
              <path key={s.i} d={s.d}
                    fill={s.color}
                    stroke="#fff" strokeWidth="1.5"
                    opacity={hov && hov.doseMg !== s.doseMg ? 0.55 : 1}
                    style={{ cursor:'pointer', transition:'opacity .15s' }}
                    onMouseEnter={() => setHoveredDose(s.doseMg)}
                    onClick={() => setHoveredDose(v => v === s.doseMg ? null : s.doseMg)} />
            ))}
            {/* Center tooltip on hover */}
            {hov && (
              <g pointerEvents="none">
                <circle cx={cx} cy={cy} r={58} fill="rgba(28,28,30,.88)" />
                <text x={cx} y={cy - 17} textAnchor="middle" fontSize="15" fontWeight="800"
                      fill={hov.color}>{hov.doseMg} mg</text>
                <text x={cx} y={cy + 3} textAnchor="middle" fontSize="11" fill="rgba(255,255,255,.65)">
                  {(hov.fraction * 100).toFixed(1)}% of loss
                </text>
                <text x={cx} y={cy + 20} textAnchor="middle" fontSize="13" fontWeight="700" fill="#fff">
                  {hov.lostLbs.toFixed(1)} lbs
                </text>
              </g>
            )}
          </svg>

          {/* Compact data table — constrained width so columns stay close */}
          <div style={{ minWidth:180, maxWidth:260 }}>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
              <thead>
                <tr style={{ borderBottom:'1.5px solid rgba(0,0,0,.1)' }}>
                  <th style={{ textAlign:'left', padding:'4px 16px 6px 0', fontSize:11, fontWeight:700,
                               color:'#8e8e93', textTransform:'uppercase', letterSpacing:.4 }}>Dose</th>
                  <th style={{ textAlign:'right', padding:'4px 0 6px', fontSize:11, fontWeight:700,
                               color:'#8e8e93', textTransform:'uppercase', letterSpacing:.4 }}>lbs lost</th>
                </tr>
              </thead>
              <tbody>
                {dosePeriods.map((p, i) => (
                  <tr key={i} style={{ borderBottom:'.5px solid rgba(0,0,0,.06)',
                                       background: hoveredDose === p.doseMg ? `${p.color}12` : 'transparent',
                                       cursor:'pointer' }}
                      onMouseEnter={() => setHoveredDose(p.doseMg)}
                      onMouseLeave={() => setHoveredDose(null)}>
                    <td style={{ padding:'6px 16px 6px 0' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                        <span style={{ width:10, height:10, borderRadius:'50%', background:p.color, flexShrink:0 }} />
                        <span style={{ fontWeight:600, color:'#1c1c1e' }}>{p.doseMg} mg</span>
                      </div>
                    </td>
                    <td style={{ textAlign:'right', padding:'6px 0', fontWeight:600,
                                 color: p.lostLbs < 0 ? '#ff3b30' : '#1c1c1e',
                                 fontVariantNumeric:'tabular-nums' }}>
                      {p.lostLbs >= 0 ? p.lostLbs.toFixed(1) : `+${Math.abs(p.lostLbs).toFixed(1)}`}
                    </td>
                  </tr>
                ))}
                <tr style={{ borderTop:'1.5px solid rgba(0,0,0,.1)' }}>
                  <td style={{ padding:'6px 16px 4px 18px', fontSize:12, color:'#8e8e93' }}>Total</td>
                  <td style={{ textAlign:'right', padding:'6px 0 4px', fontWeight:700,
                               color:'#1c1c1e', fontVariantNumeric:'tabular-nums' }}>
                    {totalLost.toFixed(1)}
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // Status-only — no key ever enters the browser. The sync itself runs from
    // the local watcher (weight_export_watcher.py), which reads the intervals.icu
    // API key from macOS Keychain and publishes only key-free ride/calorie data
    // into the Gist, so it never leaks to viewers via the shared page URL.
    function fmtSyncedAgo(iso) {
      if (!iso) return null;
      const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `${hrs} hr${hrs === 1 ? '' : 's'} ago`;
      return `${Math.round(hrs / 24)} day${Math.round(hrs / 24) === 1 ? '' : 's'} ago`;
    }

    function IntervalsPanel({ syncedAt, style }) {
      const connected = !!syncedAt;
      return (
        <div style={{ borderRadius: 14, padding: '12px 16px',
                      border: `.5px solid ${connected ? '#34c759' : '#d1d1d6'}`,
                      background: '#fff', ...style }}>
          <div style={{ fontSize: 15, fontWeight: 600, color: '#1c1c1e' }}>
            {connected ? 'intervals.icu synced' : 'intervals.icu not yet synced'}
          </div>
          <div style={{ fontSize: 12, color: '#8e8e93', marginTop: 1 }}>
            {connected
              ? `Ride data powers the Rides chart below · synced ${fmtSyncedAgo(syncedAt)}`
