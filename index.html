<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Weight Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
           background: #f2f2f7; margin: 0; }
    .row-in { animation: fadeSlide .12s ease-out; }
    @keyframes fadeSlide { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:none; } }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect, useMemo } = React;

    const LS_KEY          = 'weight-tracker-data';
    const LS_INJ_KEY      = 'weight-tracker-injections';
    const LS_SCHED_KEY    = 'weight-tracker-inj-schedule';
    const LS_LAST_CSV_KEY = 'weight-tracker-last-csv';
    const LS_GIST_PAT_KEY  = 'weight-tracker-gist-pat';
    const LS_SPLIT_KEY     = 'weight-tracker-split-dose';
    const LS_VIAL_CONC_KEY    = 'weight-tracker-vial-conc';
    const LS_SYRINGE_UNITS_KEY = 'weight-tracker-syringe-units';
    const LS_INTERVALS_KEY       = 'weight-tracker-intervals-config';
    const LS_CALORIE_KEY         = 'weight-tracker-calories';
    const LS_INTERVALS_CAL_KEY   = 'weight-tracker-intervals-calories';
    const LS_INTERVALS_RIDES_KEY = 'weight-tracker-intervals-rides';
    const EXPORT_RE       = /^(Automation_Daily_export|HealthExport)_\d{4}-\d{2}-\d{2}_\d{6}(\.csv)?$/i;
    function lastImportIsToday() {
      const name = localStorage.getItem(LS_LAST_CSV_KEY) ?? '';
      const m = name.match(/(\d{4}-\d{2}-\d{2})/);
      return !!m && m[1] === today();
    }
    const GIST_ID         = 'aa6e7ae2259f94c7a91637b447a0cd99';
    const GIST_USER       = 'halfassedapps';

    /* ─── IndexedDB (directory handle storage) ───────────────────────────────── */
    function openIDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open('weight-tracker-fs', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('handles');
        req.onsuccess  = () => res(req.result);
        req.onerror    = () => rej(req.error);
      });
    }
    async function idbGet(key) {
      const db = await openIDB();
      return new Promise((res, rej) => {
        const req = db.transaction('handles','readonly').objectStore('handles').get(key);
        req.onsuccess = () => res(req.result ?? null);
        req.onerror   = () => rej(req.error);
      });
    }
    async function idbSet(key, val) {
      const db = await openIDB();
      return new Promise((res, rej) => {
        const tx = db.transaction('handles','readwrite');
        tx.objectStore('handles').put(val, key);
        tx.oncomplete = res;
        tx.onerror    = () => rej(tx.error);
      });
    }

    /* ─── Export folder helpers ──────────────────────────────────────────────── */
    // Extract the YYYY-MM-DD_HHMMSS portion so sort is date-based regardless of filename prefix.
    const exportTs = name => { const m = name.match(/(\d{4}-\d{2}-\d{2}_\d{6})/); return m ? m[1] : ''; };

    async function findLatestExport(dirHandle) {
      const matches = [];
      console.log(`[Weight Tracker] Scanning folder: ${dirHandle.name}`);
      for await (const [name, handle] of dirHandle.entries()) {
        const matched = EXPORT_RE.test(name);
        console.log(`  ${matched ? '✓' : '✗'} ${name}${matched ? '  ts=' + exportTs(name) : ''}`);
        if (matched) matches.push({ name, handle });
      }
      if (!matches.length) { console.log('[Weight Tracker] No matching export files found.'); return null; }
      matches.sort((a, b) => exportTs(b.name).localeCompare(exportTs(a.name)));
      console.log(`[Weight Tracker] Latest export: ${matches[0].name} (ts=${exportTs(matches[0].name)})`);
      return matches[0];
    }

    // getFile() on an iCloud-evicted file triggers a download but may take a few seconds.
    // Retry up to maxAttempts times with a short delay between each.
    async function readFileWithRetry(fileHandle, { maxAttempts = 5, delayMs = 1500, onWaiting } = {}) {
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        try {
          const file = await fileHandle.getFile();
          return await file.text();
        } catch (ex) {
          const isCloudError = ex.name === 'NotReadableError' || ex.message?.includes('cloud');
          if (!isCloudError || attempt === maxAttempts - 1) throw ex;
          if (onWaiting) onWaiting(attempt + 1);
          await new Promise(r => setTimeout(r, delayMs));
        }
      }
    }

    /* ─── Injection localStorage ─────────────────────────────────────────────── */
    function lsLoadInjections() {
      try {
        const raw = localStorage.getItem(LS_INJ_KEY);
        if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) return p; }
      } catch (_) {}
      return [];
    }
    function lsSaveInjections(list) {
      try { localStorage.setItem(LS_INJ_KEY, JSON.stringify(list)); } catch (_) {}
    }

    /* ─── Injection Schedule localStorage ────────────────────────────────────── */
    function lsLoadSchedule() {
      try {
        const raw = localStorage.getItem(LS_SCHED_KEY);
        if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) return p; }
      } catch (_) {}
      return [];
    }
    function lsSaveSchedule(sched) {
      try { localStorage.setItem(LS_SCHED_KEY, JSON.stringify(sched)); } catch (_) {}
    }

    /* ─── Weight localStorage ────────────────────────────────────────────────── */
    function lsSave(rows, meta) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          meta,
          entries: rows.map(r => ({ date: r.date, wKg: r.wKg })),
        }));
      } catch (_) {}
    }
    function lsLoad() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        const { meta, entries } = JSON.parse(raw);
        if (!Array.isArray(entries) || !entries.length) return null;
        const daily = entries
          .filter(e => e.date && e.wKg != null)
          .sort((a, b) => b.date.localeCompare(a.date));
        return { logbook: computeLogbook(daily), meta: meta ?? { metric: 'Weight', source: '' } };
      } catch (_) { return null; }
    }
    function lsLoadRaw() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return {};
        const { entries } = JSON.parse(raw);
        if (!Array.isArray(entries)) return {};
        const map = {};
        entries.forEach(e => { if (e.date && e.wKg != null) map[e.date] = e.wKg; });
        return map;
      } catch (_) { return {}; }
    }
    function mergeWithStored(newDaily) {
      const map = lsLoadRaw();
      newDaily.forEach(e => { map[e.date] = e.wKg; });
      return Object.entries(map)
        .map(([date, wKg]) => ({ date, wKg }))
        .sort((a, b) => b.date.localeCompare(a.date));
    }

    /* ─── Calorie localStorage ───────────────────────────────────────────────── */
    // Each export file only covers a rolling ~week, so calorie history is
    // accumulated here by date across imports rather than replaced each time.
    function lsLoadCaloriesRaw() {
      try {
        const raw = localStorage.getItem(LS_CALORIE_KEY);
        const map = raw ? JSON.parse(raw) : {};
        return (map && typeof map === 'object') ? map : {};
      } catch (_) { return {}; }
    }
    function mergeCaloriesWithStored(newCalRows) {
      const map = lsLoadCaloriesRaw();
      for (const d of newCalRows) {
        map[d.date] = { date: d.date, Calories: d.Calories || 0, ActiveEnergy: d.ActiveEnergy || 0, BasalEnergy: d.BasalEnergy || 0 };
      }
      try { localStorage.setItem(LS_CALORIE_KEY, JSON.stringify(map)); } catch (_) {}
      return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
    }

    /* ─── GitHub Gist sync ───────────────────────────────────────────────────── */
    function parseGistPayload({ meta, entries = [], injections = [], injSchedule = [], calories = [], intervalsCfg = null }) {
      const seen = new Set();
      const daily = entries
        .filter(e => e.date && e.wKg != null)
        .sort((a, b) => b.date.localeCompare(a.date))
        .filter(e => { if (seen.has(e.date)) return false; seen.add(e.date); return true; });
      return {
        logbook:      daily.length ? computeLogbook(daily) : [],
        meta:         meta ?? { metric: 'Weight', source: '' },
        injections:   injections.filter(i => i.date && i.doseMg),
        injSchedule:  Array.isArray(injSchedule) ? injSchedule : [],
        calories:     Array.isArray(calories) ? calories.filter(c => c.date) : [],
        intervalsCfg: intervalsCfg && intervalsCfg.apiKey && intervalsCfg.athleteId ? intervalsCfg : null,
      };
    }

    // Fetches MP4 files from the body-scans/ folder in the repo and parses
    // dates + label from the filename: YYYY-MM-DD_YYYY-MM-DD[_Label].mp4
    const BODY_SCANS_RE = /^(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})(?:_(.+))?\.mp4$/i;
    async function fetchBodyScans() {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${GIST_USER}/Weight-Tracker/contents/body-scans?ref=github-pages-gist`,
          { headers: { Accept: 'application/vnd.github.v3+json' } }
        );
        if (!res.ok) return [];
        const files = await res.json();
        return files
          .filter(f => BODY_SCANS_RE.test(f.name))
          .map(f => {
            const [, startDate, endDate, rawLabel] = f.name.match(BODY_SCANS_RE);
            const label = rawLabel ? rawLabel.replace(/[-_]/g, ' ') : undefined;
            return { startDate, endDate, label, url: f.download_url };
          })
          .sort((a, b) => a.startDate.localeCompare(b.startDate));
      } catch { return []; }
    }

    async function fetchGist(gistId, pat) {
      if (pat) {
        // Authenticated: use API (needed for writes + detecting missing file)
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github.v3+json' },
        });
        if (!res.ok) throw new Error(`Gist fetch ${res.status}`);
        const gist = await res.json();
        const content = gist.files['weight-data.json']?.content;
        if (!content) return null;
        return parseGistPayload(JSON.parse(content));
      } else {
        // Unauthenticated: raw URL works for secret gists without auth
        const res = await fetch(
          `https://gist.githubusercontent.com/${GIST_USER}/${gistId}/raw/weight-data.json?t=${Date.now()}`
        );
        if (!res.ok) throw new Error(`Gist fetch ${res.status}`);
        return parseGistPayload(await res.json());
      }
    }

    async function patchGist(gistId, pat, rows, meta, injections, injSchedule = [], calories = [], intervalsCfg = null) {
      const payload = {
        version: 1, savedAt: new Date().toISOString(), meta,
        injSchedule,
        injections: injections.map(({ date, doseMg }) => ({ date, doseMg })),
        entries:    rows.map(r => ({ date: r.date, wKg: r.wKg })),
        calories:   calories.map(({ date, Calories, ActiveEnergy, BasalEnergy }) => ({ date, Calories, ActiveEnergy, BasalEnergy })),
      };
      if (intervalsCfg?.apiKey && intervalsCfg?.athleteId) payload.intervalsCfg = { apiKey: intervalsCfg.apiKey, athleteId: intervalsCfg.athleteId };
      const content = JSON.stringify(payload, null, 2);
      const res = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH',
        headers: {
          Authorization: `token ${pat}`, Accept: 'application/vnd.github.v3+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ files: { 'weight-data.json': { content } } }),
      });
      if (!res.ok) throw new Error(`Gist write ${res.status}`);
    }

    /* ─── intervals.icu ──────────────────────────────────────────────────────── */
    // Returns a map of date ("YYYY-MM-DD") -> summed ride calories for that day.
    async function fetchIntervalsCalories(apiKey, athleteId, oldestISODate, newestISODate) {
      const auth = btoa(`API_KEY:${apiKey}`);
      const url = `https://intervals.icu/api/v1/athlete/${athleteId}/activities?oldest=${oldestISODate}&newest=${newestISODate}`;
      const res = await fetch(url, { headers: { Authorization: `Basic ${auth}` } });
      if (!res.ok) throw new Error(`intervals.icu ${res.status}`);
      const activities = await res.json();
      const calMap   = {};
      const ridesMap = {};
      for (const a of activities) {
        const date = (a.start_date_local || '').slice(0, 10);
        if (!date) continue;
        const cal  = a.calories;
        if (cal != null) calMap[date] = (calMap[date] ?? 0) + cal;
        const dur  = a.moving_time || a.elapsed_time || 0;
        const dist = a.distance || 0;
        const pwr  = a.icu_average_watts ?? a.average_watts ?? null;
        const hr   = a.average_heartrate ?? null;
        if (!ridesMap[date]) ridesMap[date] = { date, totalDurSecs: 0, totalDistM: 0, totalCal: 0, rides: [] };
        ridesMap[date].totalDurSecs += dur;
        ridesMap[date].totalDistM   += dist;
        ridesMap[date].totalCal     += (cal || 0);
        ridesMap[date].rides.push({
          id: a.id, name: a.name || 'Activity', sport: a.sport || '',
          durSecs: dur, distM: dist, cal: cal || 0, pwr, hr,
        });
      }
      return { calMap, ridesMap };
    }

    /* ─── CSV parser ─────────────────────────────────────────────────────────── */
    function splitLine(line) {
      const out = []; let cur = ''; let q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { q = !q; }
        else if (c === ',' && !q) { out.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
        else { cur += c; }
      }
      out.push(cur.trim().replace(/^"|"$/g, ''));
      return out;
    }
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const headers = splitLine(lines[0]);
      return lines.slice(1).map(line => {
        const vals = splitLine(line);
        const row = {};
        headers.forEach((h, i) => { row[h] = (vals[i] ?? '').trim(); });
        return row;
      });
    }

    /* ─── Schema detection ───────────────────────────────────────────────────── */
    function detectSchema(headers, rows) {
      const lc  = h => h.toLowerCase().replace(/[\s_\-]/g, '');
      const find = (...keys) => headers.find(h => keys.some(k => lc(h) === k || lc(h).includes(k)));
      const dateCol   = find('date', 'startdate', 'datetime', 'timestamp');
      const metricCol = find('metric', 'metricname', 'type', 'category', 'name');
      const valueCol  = find('value', 'qty');
      const unitCol   = find('unit', 'units');
      if (metricCol && valueCol && dateCol) {
        const metricValues = [...new Set(rows.map(r => r[metricCol]).filter(Boolean))];
        const weightMetric = metricValues.find(m =>
          ['bodyweight', 'body weight', 'weight', 'bodymass', 'body mass']
            .includes(m.toLowerCase().replace(/\s+/g, ' ').trim())
        ) ?? metricValues.find(m => m.toLowerCase().includes('weight'));
        return { format: 'long', dateCol, metricCol, valueCol, unitCol, weightMetric, allMetrics: metricValues };
      }
      const wideValue = find('weight', 'bodymass', 'body mass', 'mass', 'value');
      if (dateCol && wideValue) return { format: 'wide', dateCol, valueCol: wideValue, unitCol };
      return { format: 'unknown', dateCol, valueCol, unitCol };
    }

    /* ─── Data processing ────────────────────────────────────────────────────── */
    function toKg(weight, unit) {
      const u = (unit ?? '').toLowerCase().trim();
      if (u === 'lb' || u === 'lbs' || u === 'pound' || u === 'pounds') return weight / 2.20462;
      return weight;
    }
    const toLbs = kg => kg * 2.20462;

    /* ─── Calorie data extraction ─────────────────────────────────────────────── */
    function buildCalorieMap(rows, schema) {
      const map = {};
      const calorieMetrics = {};
      let found = 0;
      for (const row of rows) {
        const rawDate = row[schema.dateCol];
        if (!rawDate) continue;
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) continue;
        const metric = row[schema.metricCol];
        if (!metric) continue;
        const rawVal = (row[schema.valueCol] ?? '').replace(/,/g, '');
        const val = parseFloat(rawVal);
        if (isNaN(val)) continue;
        const key = msToLocalDate(d.getTime());
        if (!map[key]) map[key] = { date: key, ts: d, Calories: 0, ActiveEnergy: 0, BasalEnergy: 0 };
        if (metric.toLowerCase().includes('calor')) { calorieMetrics[key] = (calorieMetrics[key] ?? 0) + val; found++; }
        else if (metric.toLowerCase().includes('active energy')) { map[key].ActiveEnergy += val; found++; }
        else if (metric.toLowerCase().includes('basal energy')) { map[key].BasalEnergy += val; found++; }
      }
      Object.entries(calorieMetrics).forEach(([key, total]) => {
        if (map[key]) map[key].Calories = total;
      });
      const result = Object.values(map)
        .filter(d => d.Calories > 0 || d.ActiveEnergy > 0)
        .sort((a, b) => b.date.localeCompare(a.date));
      console.log(`[Calorie] Extracted ${result.length} days, found ${found} metrics`);
      return result;
    }

    function buildDailyMap(rows, schema) {
      const map = {};
      for (const row of rows) {
        if (schema.format === 'long' && row[schema.metricCol] !== schema.weightMetric) continue;
        const rawDate = row[schema.dateCol];
        if (!rawDate) continue;
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) continue;
        const rawVal = (row[schema.valueCol] ?? '').replace(/,/g, '');
        const wRaw = parseFloat(rawVal);
        if (isNaN(wRaw)) continue;
        const unit = schema.unitCol ? row[schema.unitCol] : '';
        const wKg  = toKg(wRaw, unit);
        const key  = msToLocalDate(d.getTime());
        if (!map[key] || d > map[key].ts) map[key] = { date: key, wKg, ts: d };
      }
      return Object.values(map).sort((a, b) => b.date.localeCompare(a.date));
    }

    const avg = arr => arr.reduce((s, v) => s + v, 0) / arr.length;

    function computeLogbook(data) {
      const n = data.length;
      return data.map((entry, i) => {
        const maSlice  = data.slice(i, i + 7).map(d => d.wKg);
        const movAvgKg = avg(maSlice);
        let weeklyRateKg = null;
        if (i + 7 < n) {
          const prev = data.slice(i + 7, i + 14).map(d => d.wKg);
          if (prev.length) weeklyRateKg = movAvgKg - avg(prev);
        }
        const hiSlice    = data.slice(i, i + 10).map(d => d.wKg);
        const tenHiKg    = Math.max(...hiSlice);
        const prev2wSlice = data.slice(i + 14, i + 21).map(d => d.wKg);
        const twoWeekLossKg = prev2wSlice.length >= 3 ? avg(prev2wSlice) - movAvgKg : null;
        return {
          ...entry,
          lbs:         toLbs(entry.wKg),
          movAvg:      toLbs(movAvgKg),
          rate:        weeklyRateKg != null ? toLbs(weeklyRateKg) : null,
          tenHigh:     toLbs(tenHiKg),
          twoWeekLoss: twoWeekLossKg != null ? toLbs(twoWeekLossKg) : null,
        };
      });
    }

    const MAX_DOSE_MG = 15;
    const DOSE_STEP_MG = 0.5;

    function doseGuidance(twoWeekLbs) {
      if (twoWeekLbs == null) return null;
      if (twoWeekLbs > 8)  return { action: 'contact', label: 'Contact prescriber', note: '>8 lbs/2wk', color: '#ff3b30', bg: '#fff1f0' };
      if (twoWeekLbs >= 5) return { action: 'monitor', label: 'Stay — monitor',     note: '5–8 lbs/2wk', color: '#ff9500', bg: '#fff8ee' };
      if (twoWeekLbs >= 3) return { action: 'stay',    label: 'Stay at dose',       note: '3–4 lbs/2wk', color: '#34c759', bg: '#f0fdf4' };
      if (twoWeekLbs >= 0) return { action: 'increase', label: 'Consider ↑ dose',   note: '<3 lbs/2wk',  color: '#ff9500', bg: '#fff8ee' };
      return { action: 'gained', label: 'Gained weight', note: twoWeekLbs.toFixed(1) + ' lbs', color: '#ff3b30', bg: '#fff1f0' };
    }

    function recommendedDose(currentDoseMg, twoWeekLbs) {
      const g = doseGuidance(twoWeekLbs);
      if (!g) return null;
      if (g.action === 'increase') {
        const next = Math.round((currentDoseMg + DOSE_STEP_MG) * 10) / 10;
        const dose = next <= MAX_DOSE_MG ? next : null; // null = already at max
        return { dose, g };
      }
      return { dose: currentDoseMg, g };
    }

    // Parses CSV text, merges with stored data, returns { logbook, meta } or throws.
    function processCSVText(text) {
      const parsed = parseCSV(text);
      if (!parsed.length) throw new Error('CSV is empty.');
      const schema = detectSchema(Object.keys(parsed[0]), parsed);
      if (schema.format === 'unknown') throw new Error(`Couldn't identify schema. Headers: ${Object.keys(parsed[0]).join(', ')}`);
      if (schema.format === 'long' && !schema.weightMetric) {
        const sample = (schema.allMetrics ?? []).slice(0, 8).join(', ');
        throw new Error(`No weight metric found. Metrics present: ${sample}`);
      }
      const newDaily = buildDailyMap(parsed, schema);
      if (!newDaily.length) throw new Error('No valid weight entries found.');
      const daily   = mergeWithStored(newDaily);
      const logbook = computeLogbook(daily);
      const srcCol  = Object.keys(parsed[0]).find(h => h.toLowerCase() === 'source');
      const wRows   = schema.format === 'long' ? parsed.filter(r => r[schema.metricCol] === schema.weightMetric) : parsed;
      const source  = srcCol ? [...new Set(wRows.map(r => r[srcCol]).filter(Boolean))].join(', ') : '';
      const meta    = { metric: schema.weightMetric ?? 'Weight', source };
      const calorieData = schema.format === 'long' ? buildCalorieMap(parsed, schema) : [];
      return { logbook, meta, calorieData };
    }

    /* ─── Pharmacokinetics ───────────────────────────────────────────────────── */
    // One-compartment first-order absorption model (Bateman equation)
    // t½ elim = 5 days (120 h), Ka gives Tmax ≈ 36 h
    const T_HALF   = 5;
    const KE_H     = Math.LN2 / (T_HALF * 24); // elimination rate, h⁻¹
    const KA_H     = 0.078125;                  // absorption rate, h⁻¹
    const KA_SCALE = KA_H / (KA_H - KE_H);     // pre-computed Bateman factor

    function pkContrib(doseMg, dtDays) {
      if (dtDays < 0) return 0;
      const t = dtDays * 24; // hours
      return doseMg * KA_SCALE * (Math.exp(-KE_H * t) - Math.exp(-KA_H * t));
    }
    function pkTotal(injections, evalMs) {
      return injections.reduce((sum, inj) => {
        // _ms allows synthetic future injections to use their exact scheduled timestamp
        const injMs = inj._ms ?? new Date(inj.date + 'T12:00:00').getTime();
        return sum + pkContrib(inj.doseMg, (evalMs - injMs) / 86400000);
      }, 0);
    }

    // Given a ms timestamp, return the next scheduled injection ms per the config.
    // schedule = [{ day: 0-6, ampm: 'am'|'pm' }]  (0=Sun … 6=Sat)
    function nextScheduledMs(afterMs, schedule) {
      if (!schedule || schedule.length === 0) return null;
      const base = new Date(afterMs);
      for (let d = 1; d <= 7; d++) {
        const cand = new Date(base);
        cand.setDate(cand.getDate() + d);
        const slot = schedule.find(s => s.day === cand.getDay());
        if (slot) {
          cand.setHours(slot.ampm === 'am' ? 8 : 20, 0, 0, 0);
          return cand.getTime();
        }
      }
      return null;
    }

    /* ─── Logbook item builder ───────────────────────────────────────────────── */
    function buildItems(rows, injections) {
      const injDesc = [...injections].sort((a, b) => b.date.localeCompare(a.date));
      const injSet  = new Set(injections.map(i => i.date));
      const items   = [];
      let   injIdx  = 0;
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        while (injIdx < injDesc.length && injDesc[injIdx].date >= row.date) {
          items.push({ type: 'injection', ...injDesc[injIdx] });
          injIdx++;
        }
        items.push({ type: 'row', ...row, isInjDay: injSet.has(row.date), isLast: i === rows.length - 1 });
      }
      while (injIdx < injDesc.length) items.push({ type: 'injection', ...injDesc[injIdx++] });
      return items;
    }

    /* ─── Formatting ─────────────────────────────────────────────────────────── */
    const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const fmtDate  = s => { const d = new Date(s + 'T12:00:00'); return { mo: MO[d.getMonth()], day: d.getDate(), wd: WD[d.getDay()] }; };
    const fmtShort = s => { const { mo, day } = fmtDate(s); return `${mo} ${day}`; };
    // Convert a ms timestamp to a local YYYY-MM-DD string (avoids UTC-date shift for e.g. 8pm injections)
    const msToLocalDate = ms => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const fw = v => v != null ? v.toFixed(1) : '—';

    function rateInfo(v) {
      if (v == null) return null;
      const abs = Math.abs(v).toFixed(2);
      if (v < -0.01) return { label: `↓ ${abs}`, cls: 'loss' };
      if (v >  0.01) return { label: `↑ ${abs}`, cls: 'gain' };
      return { label: `→ ${abs}`, cls: 'flat' };
    }
    const BADGE = {
      loss: { background: '#e6f9ef', color: '#1a7f3c' },
      gain: { background: '#fff2f0', color: '#c0392b' },
      flat: { background: '#f2f2f7', color: '#8e8e93' },
    };
    const today = () => new Date().toLocaleDateString('en-CA');

    // Shared by CalorieChart and PkChart's range-selector dropdowns.
    function windowDaysForRange(rangeMode, customDays) {
      switch (rangeMode) {
        case '7d': return 7;
        case '14d': return 14;
        case '30d': return 30;
        case 'custom': return Math.max(0, Number(customDays) || 0);
        default: return 0; // 'all'
      }
    }

    /* ─── Calorie Chart ──────────────────────────────────────────────────────── */
    function CalorieChart({ calorieData }) {
      const [rangeMode, setRangeMode] = useState('30d');
      const [customDays, setCustomDays] = useState(30);
      const [windowOffset, setWindowOffset] = useState(0);
      const [tip, setTip] = useState(null);
      const [sharing, setSharing] = useState(false);
      const svgRef = useRef(null);
      const selectRange = (mode) => { setRangeMode(mode); setWindowOffset(0); };

      if (!calorieData || calorieData.length < 2) return null;

      const VW = 360, VH = 140;
      const PAD = { t: 10, r: 8, b: 28, l: 32 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;
      const GOAL = 1709;
      const STEP = 86400000;

      const sorted = [...calorieData].sort((a, b) => a.date.localeCompare(b.date));
      if (sorted.length === 0) return null;

      const todayMs = new Date().setHours(0,0,0,0);
      const startMs = new Date(sorted[0].date + 'T00:00:00').getTime();

      // Window management — windowOffset is a page count (one full window per
      // click), matching the PK chart's Earlier/Later paging behavior.
      const windowDays = windowDaysForRange(rangeMode, customDays);
      const refEnd = todayMs + STEP;
      const pageShift = windowOffset * windowDays * STEP;
      const visStartMs = windowDays ? refEnd - windowDays * STEP - pageShift : startMs;
      const visEndMs = windowDays ? refEnd - pageShift : todayMs + STEP;
      const canScrollEarlier = windowDays && startMs < visStartMs;
      const canScrollLater = windowDays && windowOffset > 0;

      // Build data for view
      let pts = [];
      if (rangeMode === 'all') {
        const weeks = {};
        for (const d of sorted) {
          const dms = new Date(d.date + 'T00:00:00').getTime();
          const sunMs = new Date(dms).getTime() - (new Date(dms).getDay() || 7) * STEP;
          const wk = new Date(sunMs).toISOString().slice(0, 10);
          if (!weeks[wk]) weeks[wk] = [];
          weeks[wk].push(d);
        }
        pts = Object.entries(weeks).map(([wk, days]) => {
          const avgCals = days.reduce((sum, d) => sum + (d.Calories || 0), 0) / days.length;
          const avgBurned = days.reduce((sum, d) => sum + (d.ActiveEnergy || 0), 0) / days.length;
          return { date: wk, Calories: avgCals, burned: avgBurned, net: avgCals - avgBurned, ms: new Date(wk + 'T00:00:00').getTime() + 3*STEP };
        });
      } else {
        pts = sorted
          .filter(d => {
            const ms = new Date(d.date + 'T00:00:00').getTime();
            return ms >= visStartMs && ms < visEndMs;
          })
          .map(d => ({
            date: d.date,
            Calories: d.Calories || 0,
            burned: d.ActiveEnergy || 0,
            net: (d.Calories || 0) - (d.ActiveEnergy || 0),
            ms: new Date(d.date + 'T00:00:00').getTime()
          }));
      }

      if (pts.length === 0) return null;

      // Dynamic y-axis based on data, with -500 minimum
      const allVals = pts.flatMap(p => [p.Calories, p.burned, p.net]);
      const dataMin = Math.min(...allVals);
      const dataMax = Math.max(...allVals);
      const minVal = Math.min(dataMin - 100, -500);
      const maxVal = dataMax + 100;
      const rangeVal = maxVal - minVal;

      const xOf = (ms) => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const yOf = (val) => PAD.t + cH - ((val - minVal) / rangeVal) * cH;

      // Bar width scales down as more days are shown, so the gap *between* days'
      // bar-pairs stays visible even at wide ranges — the two bars within a single
      // day touch (no inner gap), keeping the pair visually grouped instead of
      // ambiguously merging with a neighboring day's bars once the chart is dense.
      const slotW = cW / pts.length;
      const barW = Math.max(0.3, Math.min(2, slotW * 0.3));

      // Period summary stats — computed from the full daily series, not the
      // possibly weekly-averaged `pts` (averaging-then-summing would misrepresent totals in 'all' mode).
      const periodDaily = sorted.filter(d => {
        const ms = new Date(d.date + 'T00:00:00').getTime();
        return ms >= visStartMs && ms < visEndMs;
      });
      const totalConsumed = periodDaily.reduce((s, d) => s + (d.Calories || 0), 0);
      const totalBurned = periodDaily.reduce((s, d) => s + (d.ActiveEnergy || 0), 0);
      const netForPeriod = totalConsumed - totalBurned;
      const periodRangeStr = `${fmtShort(msToLocalDate(visStartMs))} – ${fmtShort(msToLocalDate(Math.min(todayMs, visEndMs)))}`;

      // Renders the chart (header text + SVG) onto a canvas and shares it via
      // the Web Share API (native share sheet) when available, falling back
      // to a plain PNG download otherwise.
      const shareChart = async () => {
        if (!svgRef.current || sharing) return;
        setSharing(true);
        try {
          const scale = 3, headerH = 54;
          const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif";

          const svgClone = svgRef.current.cloneNode(true);
          svgClone.setAttribute('width', VW * scale);
          svgClone.setAttribute('height', VH * scale);
          const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
          styleEl.textContent = `text { font-family: ${FONT}; }`;
          svgClone.insertBefore(styleEl, svgClone.firstChild);
          const svgString = new XMLSerializer().serializeToString(svgClone);
          const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

          const img = new Image();
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = svgUrl;
          });

          const canvas = document.createElement('canvas');
          canvas.width = VW * scale;
          canvas.height = (VH + headerH) * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#1c1c1e';
          ctx.font = `700 13px ${FONT}`;
          ctx.fillText('My Net Calories', 14, 18);
          ctx.fillStyle = '#8e73de';
          ctx.font = `700 10px ${FONT}`;
          ctx.fillText(`🍔 ${Math.round(totalConsumed).toLocaleString()} · 🔥 ${Math.round(totalBurned).toLocaleString()} · Net ${netForPeriod >= 0 ? '+' : ''}${Math.round(netForPeriod).toLocaleString()} cal`, 14, 34);
          ctx.fillStyle = '#8e8e93';
          ctx.font = `400 9px ${FONT}`;
          ctx.fillText(periodRangeStr, 14, 46);
          ctx.drawImage(img, 0, headerH, VW, VH);

          const fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const file = new File([fileBlob], 'net-calories.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: 'My Net Calories',
              text: `Net ${netForPeriod >= 0 ? '+' : ''}${Math.round(netForPeriod).toLocaleString()} cal · ${periodRangeStr}`,
            });
          } else {
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = url; a.download = 'net-calories.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        } catch (e) {
          if (e.name !== 'AbortError') console.warn('[CalorieChart] share failed:', e);
        } finally {
          setSharing(false);
        }
      };

      return (
        <div>
          {/* Controls */}
          <div style={{ display: 'flex', gap: 6, padding: '8px 14px 4px', alignItems: 'center' }}>
            <select value={rangeMode} onChange={e => selectRange(e.target.value)}
                    style={{ fontSize: 10, fontWeight: 600, padding: '5px 8px', borderRadius: 8,
                             background: '#f2f2f7', color: '#3c3c43', border: 'none', outline: 'none', cursor: 'pointer' }}>
              <option value="7d">7 Days</option>
              <option value="14d">14 Days</option>
              <option value="30d">Month</option>
              <option value="all">All</option>
              <option value="custom">Custom</option>
            </select>
            {rangeMode === 'custom' && (
              <input type="number" min="1" step="1" value={customDays}
                     onChange={e => setCustomDays(e.target.value)}
                     placeholder="days"
                     style={{ width: 56, fontSize: 10, fontWeight: 600, padding: '5px 6px', borderRadius: 8,
                              border: '1px solid #d1d1d6', background: '#f9f9f9', color: '#1c1c1e', outline: 'none' }} />
            )}
          </div>

          {/* Scroll controls */}
          {windowDays !== 0 && (
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                          padding: '0 14px 2px', fontSize: 9, color: '#aeaeb2' }}>
              <button onClick={() => canScrollEarlier && setWindowOffset(o => o + 1)}
                      disabled={!canScrollEarlier}
                      style={{ fontSize: 9, fontWeight: 600, padding: '2px 8px', borderRadius: 6,
                               background: canScrollEarlier ? '#e5e5ea' : 'transparent',
                               color: canScrollEarlier ? '#3c3c43' : '#c7c7cc',
                               border: 'none', cursor: canScrollEarlier ? 'pointer' : 'default' }}>
                ← Earlier
              </button>
              <span>{new Date(visStartMs).toISOString().slice(5,10)} – {new Date(Math.min(todayMs, visEndMs)).toISOString().slice(5,10)}</span>
              <button onClick={() => canScrollLater && setWindowOffset(o => o - 1)}
                      disabled={!canScrollLater}
                      style={{ fontSize: 9, fontWeight: 600, padding: '2px 8px', borderRadius: 6,
                               background: canScrollLater ? '#e5e5ea' : 'transparent',
                               color: canScrollLater ? '#3c3c43' : '#c7c7cc',
                               border: 'none', cursor: canScrollLater ? 'pointer' : 'default' }}>
                Later →
              </button>
            </div>
          )}

          {/* Chart */}
          <svg ref={svgRef} viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', height: 'auto', display: 'block', overflow: 'hidden' }}
               onMouseMove={(e) => {
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = (e.clientX - rect.left) / rect.width * VW;
                 if (x < PAD.l || x > PAD.l + cW) { setTip(null); return; }
                 // Convert cursor x back to a timestamp, then find the nearest
                 // data point by time — avoids index-space vs time-space mismatch
                 // that caused the hit zone to appear shifted right.
                 const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                 let idx = 0, minDist = Infinity;
                 pts.forEach((p, i) => {
                   const d = Math.abs(p.ms - targetMs);
                   if (d < minDist) { minDist = d; idx = i; }
                 });
                 setTip({ idx, ...pts[idx] });
               }}
               onMouseLeave={() => setTip(null)}>
            {/* Bars: ingested (blue) and burned (orange) — touching, no inner gap,
                so the slot's empty space all goes toward separating one day's
                pair from the next rather than splitting the pair itself */}
            {pts.map(p => {
              const x = xOf(p.ms);
              return (
                <g key={`bars-${p.date}`}>
                  <rect x={x - barW} y={yOf(p.Calories)} width={barW} height={PAD.t + cH - yOf(p.Calories)}
                        fill="#2c5f8a" />
                  <rect x={x} y={yOf(p.burned)} width={barW} height={PAD.t + cH - yOf(p.burned)}
                        fill="#f4a300" />
                </g>
              );
            })}

            {/* Goal line at 1709 */}
            <line x1={PAD.l} y1={yOf(GOAL)} x2={PAD.l + cW} y2={yOf(GOAL)}
                  stroke="#34c759" strokeWidth="0.8" strokeDasharray="2,2" opacity="0.5" />

            {/* Net calories line */}
            <polyline points={pts.map(p => `${xOf(p.ms)},${yOf(p.net)}`).join(' ')}
                      fill="none" stroke="#8e73de" strokeWidth="1.2" />

            {/* Axes */}
            <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="0.5" />
            <line x1={PAD.l} y1={PAD.t + cH} x2={PAD.l + cW} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="0.5" />

            {/* Y labels: dynamic scale in 500-calorie intervals */}
            {(() => {
              const step = 500;
              const labels = [];
              for (let v = Math.ceil(minVal / step) * step; v <= maxVal; v += step) {
                labels.push(v);
              }
              return labels.map(v => (
                <g key={`yax-${v}`}>
                  <line x1={PAD.l - 2} y1={yOf(v)} x2={PAD.l + cW} y2={yOf(v)}
                        stroke="rgba(0,0,0,.05)" strokeWidth="0.5" />
                  <text x={PAD.l - 3} y={yOf(v) + 2} textAnchor="end"
                        fontSize="7" fill="#aeaeb2">{v}</text>
                </g>
              ));
            })()}

            {/* X labels */}
            {pts.filter((_, i) => i % Math.max(1, Math.floor(pts.length / 4)) === 0).map(p => (
              <text key={p.date} x={xOf(p.ms)} y={PAD.t + cH + 10} textAnchor="middle"
                    fontSize="7" fill="#aeaeb2">{p.date.slice(5)}</text>
            ))}

            {/* Tooltip - anchored inside the top of the chart so it's never clipped */}
            {tip && (() => {
              const TW = 66, TH = 19;
              const tx = Math.max(PAD.l, Math.min(xOf(tip.ms) - TW / 2, PAD.l + cW - TW));
              const ty = PAD.t + 2;
              return (
                <g style={{ pointerEvents: 'none' }}>
                  <line x1={xOf(tip.ms)} y1={PAD.t} x2={xOf(tip.ms)} y2={PAD.t + cH}
                        stroke="rgba(28,28,30,.25)" strokeWidth="1" />
                  <rect x={tx} y={ty} width={TW} height={TH} rx={3} fill="#1c1c1e" opacity="0.9" />
                  <text x={tx + TW / 2} y={ty + 7} textAnchor="middle" fontSize="4.5" fill="#aeaeb2">
                    {(d => `${d.wd} ${d.mo} ${d.day}`)(fmtDate(tip.date))}
                  </text>
                  <text x={tx + TW / 2} y={ty + 15} textAnchor="middle" fontSize="5.5" fontWeight="600">
                    <tspan fill="#6cb2ff">🍔{parseInt(tip.Calories)}</tspan>
                    <tspan fill="#48484a">  </tspan>
                    <tspan fill="#ffb04d">🔥{parseInt(tip.burned)}</tspan>
                    <tspan fill="#48484a">  </tspan>
                    <tspan fill="#b9a6ef">{parseInt(tip.net)}</tspan>
                  </text>
                </g>
              );
            })()}
          </svg>

          {/* Period stats */}
          <div style={{ display: 'flex', padding: '8px 14px 4px', gap: 12, alignItems: 'flex-start' }}>
            <PkStat label="Consumed" value={Math.round(totalConsumed).toLocaleString() + ' cal'} color="#4a90d9" />
            <PkStat label="Burned" value={Math.round(totalBurned).toLocaleString() + ' cal'} color="#ff9500" />
            <PkStat label="Net" value={(netForPeriod >= 0 ? '+' : '') + Math.round(netForPeriod).toLocaleString() + ' cal'} color="#8e73de" />
          </div>

          {/* Legend */}
          <div style={{ padding: '6px 14px', fontSize: 11, fontWeight: 600, color: '#3c3c43', display: 'flex', gap: 14 }}>
            <div><span style={{ display: 'inline-block', width: 12, height: 12, background: '#2c5f8a', marginRight: 5, verticalAlign: 'middle' }}></span>Ingested</div>
            <div><span style={{ display: 'inline-block', width: 12, height: 12, background: '#f4a300', marginRight: 5, verticalAlign: 'middle' }}></span>Burned</div>
            <div><span style={{ display: 'inline-block', width: 12, height: 12, background: '#8e73de', marginRight: 5, verticalAlign: 'middle' }}></span>Net</div>
            <div><span style={{ display: 'inline-block', width: 12, height: 2, background: '#34c759', marginRight: 5, verticalAlign: 'middle' }}></span>Goal</div>
          </div>

          {/* Share */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
                        gap: 10, padding: '6px 14px 10px' }}>
            <button onClick={shareChart} disabled={sharing}
                    style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 11, fontWeight: 600,
                             color: '#4a90d9', background: '#f0f6ff', border: 'none', borderRadius: 12,
                             padding: '4px 10px', cursor: sharing ? 'default' : 'pointer', opacity: sharing ? .6 : 1 }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4a90d9" strokeWidth="2.2"
                   strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .09 1.74L8.91 9.13a3 3 0 1 0 0 5.74l6.18 3.39A3 3 0 1 0 18 16a3 3 0 0 0-2.6 1.51l-6.19-3.4a3 3 0 0 0 0-.22l6.19-3.4A3 3 0 0 0 18 8z" />
              </svg>
              {sharing ? 'Preparing…' : 'Share'}
            </button>
          </div>
        </div>
      );
    }

    /* ─── Rides Chart ────────────────────────────────────────────────────────── */
    function RidesChart({ ridesData }) {
      const [rangeMode, setRangeMode] = useState('30d');
      const [customDays, setCustomDays] = useState(30);
      const [windowOffset, setWindowOffset] = useState(0);
      const [tip, setTip] = useState(null);
      const [selectedDate, setSelectedDate] = useState(null);
      const [sharing, setSharing] = useState(false);
      const svgRef = useRef(null);
      const rideCardsRef = useRef(null);
      useEffect(() => {
        if (selectedDate && rideCardsRef.current) {
          rideCardsRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, [selectedDate]);
      const selectRange = mode => { setRangeMode(mode); setWindowOffset(0); setSelectedDate(null); };

      const sorted = Object.values(ridesData)
        .filter(d => d.totalDurSecs > 0)
        .sort((a, b) => a.date.localeCompare(b.date));

      if (sorted.length === 0) return null;

      const VW = 360, VH = 140;
      const PAD = { t: 10, r: 8, b: 28, l: 40 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;
      const STEP = 86400000;

      const todayMs = new Date().setHours(0, 0, 0, 0);
      const startMs = new Date(sorted[0].date + 'T00:00:00').getTime();

      const windowDays = windowDaysForRange(rangeMode, customDays);
      const refEnd = todayMs + STEP;
      const pageShift = windowOffset * windowDays * STEP;
      const visStartMs = windowDays ? refEnd - windowDays * STEP - pageShift : startMs;
      const visEndMs   = windowDays ? refEnd - pageShift : todayMs + STEP;
      const canScrollEarlier = windowDays && startMs < visStartMs;
      const canScrollLater   = windowDays && windowOffset > 0;

      const pts = sorted.filter(d => {
        const ms = new Date(d.date + 'T00:00:00').getTime();
        return ms >= visStartMs && ms < visEndMs;
      }).map(d => ({ ...d, ms: new Date(d.date + 'T00:00:00').getTime() }));

      const periodData = sorted.filter(d => {
        const ms = new Date(d.date + 'T00:00:00').getTime();
        return ms >= visStartMs && ms < visEndMs;
      });
      const totalDurSecs = periodData.reduce((s, d) => s + d.totalDurSecs, 0);
      const totalDistMi  = periodData.reduce((s, d) => s + d.totalDistM, 0) / 1609.34;
      const totalCal     = periodData.reduce((s, d) => s + d.totalCal, 0);
      const periodRangeStr = `${fmtShort(msToLocalDate(visStartMs))} – ${fmtShort(msToLocalDate(Math.min(todayMs, visEndMs)))}`;

      const fmtDur = secs => {
        const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
        return h > 0 ? `${h}h ${m}m` : `${m}m`;
      };

      const maxMins = Math.max(...pts.map(p => p.totalDurSecs / 60), 1);
      const yMax = maxMins * 1.15;

      const xOf = ms  => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const yOf = min => PAD.t + cH - (min / yMax) * cH;

      const slotW = cW / Math.max(1, pts.length);
      const barW  = Math.max(0.5, Math.min(4, slotW * 0.6));

      // Y-axis labels in h:mm or mm format
      const yTicks = [];
      const tickStep = yMax > 180 ? 60 : yMax > 60 ? 30 : 15;
      for (let v = 0; v <= yMax; v += tickStep) yTicks.push(v);

      // Share
      const shareChart = async () => {
        if (!svgRef.current || sharing) return;
        setSharing(true);
        try {
          const scale = 3, headerH = 54;
          const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif";
          const svgClone = svgRef.current.cloneNode(true);
          svgClone.setAttribute('width', VW * scale);
          svgClone.setAttribute('height', VH * scale);
          const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
          styleEl.textContent = `text { font-family: ${FONT}; }`;
          svgClone.insertBefore(styleEl, svgClone.firstChild);
          const svgString = new XMLSerializer().serializeToString(svgClone);
          const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
          const img = new Image();
          await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = svgUrl; });
          const canvas = document.createElement('canvas');
          canvas.width = VW * scale; canvas.height = (VH + headerH) * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#1c1c1e'; ctx.font = `700 13px ${FONT}`;
          ctx.fillText('My Rides', 14, 18);
          ctx.fillStyle = '#4a90d9'; ctx.font = `700 10px ${FONT}`;
          ctx.fillText(`${fmtDur(totalDurSecs)} · ${totalDistMi.toFixed(1)} mi · ${Math.round(totalCal).toLocaleString()} cal`, 14, 34);
          ctx.fillStyle = '#8e8e93'; ctx.font = `400 9px ${FONT}`;
          ctx.fillText(periodRangeStr, 14, 46);
          ctx.drawImage(img, 0, headerH, VW, VH);
          const fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const file = new File([fileBlob], 'rides.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'My Rides', text: `${fmtDur(totalDurSecs)} · ${totalDistMi.toFixed(1)} mi · ${periodRangeStr}` });
          } else {
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = url; a.download = 'rides.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        } catch (e) { if (e.name !== 'AbortError') console.warn('[RidesChart] share failed:', e); }
        finally { setSharing(false); }
      };

      return (
        <div>
          {/* Controls */}
          <div style={{ display:'flex', gap:6, padding:'8px 14px 4px', alignItems:'center' }}>
            <select value={rangeMode} onChange={e => selectRange(e.target.value)}
                    style={{ fontSize:10, fontWeight:600, padding:'5px 8px', borderRadius:8,
                             background:'#f2f2f7', color:'#3c3c43', border:'none', outline:'none', cursor:'pointer' }}>
              <option value="7d">7 Days</option>
              <option value="14d">14 Days</option>
              <option value="30d">Month</option>
              <option value="all">All</option>
              <option value="custom">Custom</option>
            </select>
            {rangeMode === 'custom' && (
              <input type="number" min="1" step="1" value={customDays}
                     onChange={e => setCustomDays(e.target.value)} placeholder="days"
                     style={{ width:56, fontSize:10, fontWeight:600, padding:'5px 6px', borderRadius:8,
                              border:'1px solid #d1d1d6', background:'#f9f9f9', color:'#1c1c1e', outline:'none' }} />
            )}
          </div>

          {/* Earlier/Later */}
          {windowDays !== 0 && (
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center',
                          padding:'0 14px 2px', fontSize:9, color:'#aeaeb2' }}>
              <button onClick={() => canScrollEarlier && setWindowOffset(o => o + 1)} disabled={!canScrollEarlier}
                      style={{ fontSize:9, fontWeight:600, padding:'2px 8px', borderRadius:6,
                               background: canScrollEarlier ? '#e5e5ea' : 'transparent',
                               color: canScrollEarlier ? '#3c3c43' : '#c7c7cc',
                               border:'none', cursor: canScrollEarlier ? 'pointer' : 'default' }}>← Earlier</button>
              <span>{new Date(visStartMs).toISOString().slice(5,10)} – {new Date(Math.min(todayMs, visEndMs)).toISOString().slice(5,10)}</span>
              <button onClick={() => canScrollLater && setWindowOffset(o => o - 1)} disabled={!canScrollLater}
                      style={{ fontSize:9, fontWeight:600, padding:'2px 8px', borderRadius:6,
                               background: canScrollLater ? '#e5e5ea' : 'transparent',
                               color: canScrollLater ? '#3c3c43' : '#c7c7cc',
                               border:'none', cursor: canScrollLater ? 'pointer' : 'default' }}>Later →</button>
            </div>
          )}

          {/* Chart */}
          <svg ref={svgRef} viewBox={`0 0 ${VW} ${VH}`}
               style={{ width:'100%', height:'auto', display:'block', overflow:'hidden', cursor:'pointer' }}
               onMouseMove={e => {
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = (e.clientX - rect.left) / rect.width * VW;
                 if (x < PAD.l || x > PAD.l + cW || pts.length === 0) { setTip(null); return; }
                 const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                 let idx = 0, minDist = Infinity;
                 pts.forEach((p, i) => { const d = Math.abs(p.ms - targetMs); if (d < minDist) { minDist = d; idx = i; } });
                 setTip({ ...pts[idx], x });
               }}
               onMouseLeave={() => setTip(null)}
               onClick={e => {
                 // Click anywhere in chart finds nearest data point — bars are too thin to click precisely
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = (e.clientX - rect.left) / rect.width * VW;
                 if (x < PAD.l || x > PAD.l + cW || pts.length === 0) return;
                 const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                 let idx = 0, minDist = Infinity;
                 pts.forEach((p, i) => { const d = Math.abs(p.ms - targetMs); if (d < minDist) { minDist = d; idx = i; } });
                 const date = pts[idx].date;
                 setSelectedDate(d => d === date ? null : date);
               }}>

            {/* Y grid + labels */}
            {yTicks.map(v => (
              <g key={v}>
                <line x1={PAD.l} y1={yOf(v)} x2={PAD.l + cW} y2={yOf(v)}
                      stroke="rgba(0,0,0,.05)" strokeWidth="0.5" />
                <text x={PAD.l - 3} y={yOf(v) + 2} textAnchor="end" fontSize="7" fill="#aeaeb2">
                  {v >= 60 ? `${Math.floor(v/60)}h` : `${v}m`}
                </text>
              </g>
            ))}

            {/* Axes */}
            <line x1={PAD.l} y1={PAD.t} x2={PAD.l} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="0.5" />
            <line x1={PAD.l} y1={PAD.t + cH} x2={PAD.l + cW} y2={PAD.t + cH} stroke="rgba(0,0,0,.1)" strokeWidth="0.5" />

            {/* Bars */}
            {pts.map(p => {
              const x = xOf(p.ms);
              const mins = p.totalDurSecs / 60;
              return (
                <rect key={p.date}
                      x={x - barW / 2} y={yOf(mins)} width={barW} height={PAD.t + cH - yOf(mins)}
                      fill="#4a90d9" opacity="0.8" />
              );
            })}

            {/* X labels — calendar ticks spaced by time, not by ride-data density */}
            {(() => {
              const winMs = visEndMs - visStartMs;
              const tickMs = winMs > 60 * STEP ? 14 * STEP
                           : winMs > 20 * STEP ?  7 * STEP
                           :                       3 * STEP;
              const first = Math.ceil(visStartMs / tickMs) * tickMs;
              const ticks = [];
              for (let ms = first; ms <= visEndMs; ms += tickMs) ticks.push(ms);
              return ticks.map(ms => (
                <text key={ms} x={xOf(ms)} y={PAD.t + cH + 10} textAnchor="middle"
                      fontSize="7" fill="#aeaeb2">
                  {new Date(ms).toISOString().slice(5,10)}
                </text>
              ));
            })()}

            {/* Tooltip */}
            {tip && pts.length > 0 && (() => {
              const TW = 90, TH = 57, TR = 3;
              const tx = Math.max(PAD.l, Math.min(tip.x - TW / 2, PAD.l + cW - TW));
              const ty = PAD.t + 2;
              const { wd, mo, day } = fmtDate(tip.date);
              const pwr = tip.rides.reduce((s, r) => r.pwr ? s + r.pwr : s, 0);
              const pwrN = tip.rides.filter(r => r.pwr).length;
              const hr  = tip.rides.reduce((s, r) => r.hr ? s + r.hr : s, 0);
              const hrN = tip.rides.filter(r => r.hr).length;
              let row = ty + 7;
              return (
                <g style={{ pointerEvents:'none' }}>
                  <line x1={xOf(tip.ms)} y1={PAD.t} x2={xOf(tip.ms)} y2={PAD.t + cH}
                        stroke="rgba(28,28,30,.25)" strokeWidth="1" />
                  <rect x={tx} y={ty} width={TW} height={TH} rx={TR} fill="rgba(28,28,30,.9)" />
                  <text x={tx+5} y={row} fontSize="5" fill="rgba(255,255,255,.5)">{wd} {mo} {day}</text>
                  <text x={tx+5} y={row+=9} fontSize="6.5" fontWeight="700" fill="#fff">{fmtDur(tip.totalDurSecs)}</text>
                  <text x={tx+5} y={row+=9} fontSize="6" fill="#aeaeb2">
                    <tspan fill="#6cb2ff">⬡ {(tip.totalDistM/1609.34).toFixed(1)} mi</tspan>
                    <tspan fill="#48484a">  </tspan>
                    <tspan fill="#ffb04d">🔥{Math.round(tip.totalCal)}</tspan>
                  </text>
                  <text x={tx+5} y={row+=9} fontSize="6" fill="#aeaeb2">
                    {pwrN ? <tspan fill="#bf5af2">⚡{Math.round(pwr/pwrN)}W</tspan> : <tspan>— W</tspan>}
                    <tspan fill="#48484a">  </tspan>
                    {hrN ? <tspan fill="#ff375f">♥ {Math.round(hr/hrN)} bpm</tspan> : <tspan>— bpm</tspan>}
                  </text>
                  <text x={tx+5} y={row+=9} fontSize="5" fill="rgba(255,255,255,.4)">
                    {tip.rides.length} {tip.rides.length === 1 ? 'activity' : 'activities'}
                  </text>
                </g>
              );
            })()}
          </svg>

          {/* Period stats */}
          <div style={{ display:'flex', padding:'8px 14px 4px', gap:12, alignItems:'flex-start' }}>
            <PkStat label="Time" value={fmtDur(totalDurSecs)} color="#4a90d9" />
            <PkStat label="Distance" value={totalDistMi.toFixed(1) + ' mi'} color="#ff9500" />
            <PkStat label="Calories" value={Math.round(totalCal).toLocaleString() + ' cal'} color="#8e73de" />
          </div>

          {/* Ride cards — visible after clicking a bar */}
          {selectedDate && ridesData[selectedDate] && (
            <div ref={rideCardsRef} style={{ padding:'8px 14px 12px', borderTop:'.5px solid rgba(0,0,0,.06)' }}>
              <div style={{ fontSize:11, fontWeight:600, color:'#8e8e93', marginBottom:8 }}>
                {(d => `${d.wd} ${d.mo} ${d.day}`)(fmtDate(selectedDate))}
              </div>
              {ridesData[selectedDate].rides.map((r, i) => {
                // intervals.icu activity URLs use an 'i' prefix: /activities/i162107047
                const actId  = r.id ? (String(r.id).startsWith('i') ? String(r.id) : `i${r.id}`) : null;
                const actUrl = actId ? `https://intervals.icu/activities/${actId}` : null;
                console.log('[RidesChart] ride', i, 'id:', r.id, '→ url:', actUrl);
                return (
                  <div key={String(r.id || i)}
                       style={{ padding:'10px 12px', borderRadius:10, background:'#f9f9f9',
                                marginBottom: i < ridesData[selectedDate].rides.length - 1 ? 8 : 0 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:'#1c1c1e', marginBottom:3 }}>
                      {r.sport && r.sport !== 'Ride' && r.sport !== 'VirtualRide' ? `${r.sport} · ` : ''}{r.name}
                    </div>
                    <div style={{ fontSize:11, color:'#8e8e93', marginBottom:8 }}>
                      {fmtDur(r.durSecs)} · {(r.distM / 1609.34).toFixed(1)} mi · 🔥{Math.round(r.cal)} cal
                      {r.pwr ? ` · ⚡${Math.round(r.pwr)}W` : ''}
                      {r.hr  ? ` · ♥ ${Math.round(r.hr)} bpm` : ''}
                    </div>
                    {actUrl ? (
                      <a href={actUrl} target="_blank" rel="noopener noreferrer"
                         style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:12,
                                  fontWeight:600, color:'#4a90d9', background:'#e8f0ff',
                                  borderRadius:8, padding:'5px 12px', textDecoration:'none' }}>
                        Open on Intervals.icu ↗
                      </a>
                    ) : (
                      <span style={{ fontSize:11, color:'#aeaeb2' }}>No link (id: {String(r.id)})</span>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* Share */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'center', padding:'6px 14px 10px' }}>
            <button onClick={shareChart} disabled={sharing}
                    style={{ display:'flex', alignItems:'center', gap:4, fontSize:11, fontWeight:600,
                             color:'#4a90d9', background:'#f0f6ff', border:'none', borderRadius:12,
                             padding:'4px 10px', cursor: sharing ? 'default' : 'pointer', opacity: sharing ? .6 : 1 }}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#4a90d9" strokeWidth="2.2"
                   strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .09 1.74L8.91 9.13a3 3 0 1 0 0 5.74l6.18 3.39A3 3 0 1 0 18 16a3 3 0 0 0-2.6 1.51l-6.19-3.4a3 3 0 0 0 0-.22l6.19-3.4A3 3 0 0 0 18 8z" />
              </svg>
              {sharing ? 'Preparing…' : 'Share'}
            </button>
          </div>
        </div>
      );
    }

    /* ─── PK Chart ───────────────────────────────────────────────────────────── */
    function PkChart({ injections, rows, isAdmin, injSchedule, onSaveSchedule }) {
      if (!injections.length) return null;
      const [tip, setTip] = useState(null); // { x, y, level, dateStr, wLbs }
      const [splitManual, setSplitManual] = useState(
        () => localStorage.getItem(LS_SPLIT_KEY) === 'true'
      );
      const [sharing,      setSharing]      = useState(false);
      const svgRef = useRef(null);
      const [rangeMode,    setRangeMode]    = useState('30d'); // '7d' | '14d' | '30d' | 'all' | 'custom'
      const [customDays,   setCustomDays]   = useState(30);
      const [windowOffset, setWindowOffset] = useState(0);
      const selectRange = (mode) => { setRangeMode(mode); setWindowOffset(0); };
      const toggleSplit = () => {
        const next = !splitManual;
        setSplitManual(next);
        localStorage.setItem(LS_SPLIT_KEY, String(next));
      };

      const sortedInj = [...injections].sort((a, b) => a.date.localeCompare(b.date));

      const startMs = new Date(sortedInj[0].date + 'T12:00:00').getTime();
      const todayD  = new Date(); todayD.setHours(12, 0, 0, 0);
      const todayMs = todayD.getTime();
      const endMs   = todayMs + 21 * 86400000;

      const windowDays       = windowDaysForRange(rangeMode, customDays);
      const refEnd           = windowDays ? todayMs - windowOffset * windowDays * 86400000 : null;
      const visStartMs       = (() => {
        if (windowDays) return refEnd - windowDays * 86400000;
        // "all" view: snap to first of the month so month labels land inside the chart
        const d = new Date(startMs); d.setDate(1); d.setHours(12, 0, 0, 0);
        return d.getTime();
      })();
      const visEndMs         = windowDays ? (windowOffset === 0 ? todayMs + 7 * 86400000 : refEnd) : todayMs + 7 * 86400000;
      const canScrollEarlier = !!windowDays && visStartMs > startMs;
      const canScrollLater   = windowOffset > 0;

      const STEP = 6 * 3600000;
      const pts  = [];
      for (let ms = startMs; ms <= endMs; ms += STEP) {
        pts.push({ ms, v: pkTotal(sortedInj, ms) });
      }
      const visPts = pts.filter(p => p.ms >= visStartMs && p.ms <= visEndMs);
      const weeklyPkPts = (() => {
        const weeks = {};
        pts.forEach(p => {
          const d = new Date(p.ms);
          const sun = new Date(d); sun.setDate(d.getDate() - d.getDay()); sun.setHours(12,0,0,0);
          const key = sun.getTime();
          if (!weeks[key]) weeks[key] = { ms: sun.getTime() + 3.5*86400000, sum: 0, n: 0 };
          weeks[key].sum += p.v; weeks[key].n++;
        });
        return Object.values(weeks).map(w => ({ ms: w.ms, v: w.sum/w.n })).sort((a,b) => a.ms - b.ms);
      })();
      const displayPts = (() => {
        const base = (rangeMode === 'all' ? weeklyPkPts : visPts).filter(p => p.ms <= visEndMs);
        if (rangeMode !== 'all') return base;
        // Weekly midpoints can fall before visStartMs when the week's Sunday is in the
        // prior month. Filter those out and anchor the line at (visStartMs, 0) instead.
        const visible = base.filter(p => p.ms >= visStartMs);
        return visible.length < base.length ? [{ ms: visStartMs, v: 0 }, ...visible] : visible;
      })();
      // Include visPts (full visible PK trajectory including near-future from current dose)
      // so the y-scale isn't clipped when a recent dose increase raises future peaks.
      const maxV = Math.max(...displayPts.map(p => p.v), ...visPts.map(p => p.v), 0.01);
      const yMax = maxV * 1.5; // 50% headroom so scheduled-injection projected peaks don't touch the top

      const VW = 360, VH = 190;
      const PAD = { t: 18, r: 40, b: rangeMode === 'all' ? 22 : 60, l: 36 };
      const cW  = VW - PAD.l - PAD.r;
      const cH  = VH - PAD.t - PAD.b;

      // Weight line: all data for y-axis scaling; visible/averaged subset for display
      const wAllPts = (rows ?? [])
        .map(r => ({ ms: new Date(r.date + 'T12:00:00').getTime(), lbs: r.lbs }))
        .filter(p => p.ms >= startMs && p.ms <= todayMs)
        .sort((a, b) => a.ms - b.ms);
      const wVals = wAllPts.map(p => p.lbs);
      const wMin  = wVals.length ? Math.min(...wVals) : 0;
      const wMax  = wVals.length ? Math.max(...wVals) : 1;
      const wPad  = Math.max((wMax - wMin) * 0.15, 2);
      const wLo   = wMin - wPad;
      const wHi   = wMax + wPad;
      const yOfW  = lbs => PAD.t + cH - ((lbs - wLo) / (wHi - wLo)) * cH;
      const wWeeklyPts = (() => {
        const weeks = {};
        wAllPts.forEach(p => {
          const d = new Date(p.ms);
          const sun = new Date(d); sun.setDate(d.getDate() - d.getDay()); sun.setHours(12,0,0,0);
          const key = sun.getTime();
          if (!weeks[key]) weeks[key] = { ms: sun.getTime() + 3.5*86400000, sum: 0, n: 0 };
          weeks[key].sum += p.lbs; weeks[key].n++;
        });
        return Object.values(weeks).map(w => ({ ms: w.ms, lbs: w.sum/w.n })).sort((a,b) => a.ms - b.ms);
      })();
      const wPts = (() => {
        if (rangeMode !== 'all') {
          return wAllPts.filter(p => p.ms >= visStartMs && p.ms <= Math.min(todayMs, visEndMs));
        }
        // Anchor the line at visStartMs (mirrors the PK line's anchor fix above) so it
        // reaches the left edge whether the earliest weekly bucket's midpoint falls
        // after visStartMs (weight logging started a few days into the month — the
        // common case) or before it (week's Sunday in the prior month). Either way,
        // hold flat at the nearest known weight rather than leaving a gap.
        const visible = wWeeklyPts.filter(p => p.ms >= visStartMs);
        if (!wWeeklyPts.length || (visible.length && visible[0].ms === visStartMs)) return visible;
        const prior = wWeeklyPts.filter(p => p.ms < visStartMs);
        const anchorLbs = prior.length ? prior[prior.length - 1].lbs : wWeeklyPts[0].lbs;
        return [{ ms: visStartMs, lbs: anchorLbs }, ...visible];
      })();

      // Interpolate weight at any ms for tooltip
      const interpW = (ms) => {
        if (!wAllPts.length) return null;
        let lo = null, hi = null;
        for (const p of wAllPts) {
          if (p.ms <= ms) lo = p; else if (!hi) hi = p;
        }
        if (!lo && !hi) return null;
        if (!lo) return hi.lbs;
        if (!hi) return lo.lbs;
        return lo.lbs + (ms - lo.ms) / (hi.ms - lo.ms) * (hi.lbs - lo.lbs);
      };

      // Period summary stats — average on-board level from the full-resolution
      // `pts` (not `displayPts`, which is weekly-bucketed and zero-anchored in 'all' mode).
      const periodPts = pts.filter(p => p.ms >= visStartMs && p.ms <= visEndMs);
      const avgOnBoard = periodPts.length
        ? periodPts.reduce((s, p) => s + p.v, 0) / periodPts.length
        : 0;

      // Weight change over the period, using the smoothed 7-day moving average
      // (movAvg) for consistency with the rest of the app's trend calculations.
      const wMaAllPts = (rows ?? [])
        .map(r => ({ ms: new Date(r.date + 'T12:00:00').getTime(), ma: r.movAvg }))
        .filter(p => p.ms >= startMs && p.ms <= todayMs && p.ma != null)
        .sort((a, b) => a.ms - b.ms);
      const interpMovAvg = (ms) => {
        if (!wMaAllPts.length) return null;
        let lo = null, hi = null;
        for (const p of wMaAllPts) {
          if (p.ms <= ms) lo = p; else if (!hi) hi = p;
        }
        if (!lo && !hi) return null;
        if (!lo) return hi.ma;
        if (!hi) return lo.ma;
        return lo.ma + (ms - lo.ms) / (hi.ms - lo.ms) * (hi.ma - lo.ma);
      };
      // Use raw weight interpolation (interpW) to match the tooltip's calculation
      // — interpMovAvg uses the 7-day smoothed series which diverges by ~1 lb.
      const periodStartW = interpW(Math.max(visStartMs, startMs));
      const periodEndW   = interpW(Math.min(visEndMs, todayMs));
      const periodWeightChange = (periodStartW != null && periodEndW != null)
        ? periodEndW - periodStartW
        : null;

      const xOf = ms => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const yOf = v  => PAD.t + cH - Math.min(v / yMax, 1) * cH;

      const monthTicks = (() => {
        const ticks = [];
        const d = new Date(visStartMs); d.setDate(1); d.setHours(12,0,0,0);
        while (d.getTime() <= visEndMs) {
          ticks.push({ ms: d.getTime(), label: MO[d.getMonth()] + ' \'' + String(d.getFullYear()).slice(2) });
          d.setMonth(d.getMonth() + 1);
        }
        return ticks;
      })();

      const line = displayPts.map((p, i) =>
        `${i === 0 ? 'M' : 'L'}${xOf(p.ms).toFixed(1)},${yOf(p.v).toFixed(1)}`
      ).join(' ');
      const area = `${line} L${xOf(visEndMs).toFixed(1)},${(PAD.t+cH).toFixed(1)} L${xOf(visStartMs).toFixed(1)},${(PAD.t+cH).toFixed(1)} Z`;

      const todayX   = xOf(todayMs);
      const curLevel = pkTotal(sortedInj, todayMs);
      const lastInjMs = new Date(sortedInj[sortedInj.length - 1].date + 'T12:00:00').getTime();

      // Detect split-dose from the single most recent interval only.
      // Averaging multiple intervals masks a recent switch to 2x/wk.
      let injInterval = 7;
      if (sortedInj.length >= 2) {
        const a = new Date(sortedInj[sortedInj.length - 2].date + 'T12:00:00').getTime();
        const b = new Date(sortedInj[sortedInj.length - 1].date + 'T12:00:00').getTime();
        injInterval = (b - a) / 86400000;
      }
      const scheduleActive = injSchedule && injSchedule.length > 0;
      const isSplitDose = scheduleActive ? injSchedule.length >= 2 : (splitManual || injInterval < 5);
      // Number of injections per week from schedule
      const injPerWeek = scheduleActive ? injSchedule.length : (isSplitDose ? 2 : 1);
      // Weekly dose = last injection × 2 in split mode (works at any dose level,
      // including during transitions where the two most recent shots differ).
      const weeklyDose = isSplitDose
        ? sortedInj[sortedInj.length - 1].doseMg * 2
        : sortedInj[sortedInj.length - 1].doseMg;

      const nextInjMs = scheduleActive
        ? (nextScheduledMs(lastInjMs, injSchedule) ?? lastInjMs + injInterval * 86400000)
        : lastInjMs + injInterval * 86400000;

      // All upcoming injection dates within the visible window
      const upcomingInjMs = (() => {
        if (scheduleActive) {
          const dates = [];
          let after = lastInjMs;
          for (let i = 0; i < 10; i++) {
            const ms = nextScheduledMs(after, injSchedule);
            if (!ms || ms > visEndMs) break;
            dates.push(ms);
            after = ms;
          }
          return dates;
        }
        return nextInjMs <= visEndMs ? [nextInjMs] : [];
      })();
      const troughLevel = pkTotal(sortedInj, nextInjMs - 3600000);

      // Future projection: PK curve + interval averages assuming scheduled doses at current dose
      const lastDoseMg = sortedInj[sortedInj.length - 1].doseMg;
      const projInjs = scheduleActive
        ? [...sortedInj, ...upcomingInjMs.map(ms => ({ _ms: ms, doseMg: lastDoseMg }))]
        : sortedInj;
      const projPts = scheduleActive && upcomingInjMs.length > 0 ? (() => {
        const ps = [];
        for (let ms = todayMs; ms <= visEndMs; ms += STEP) {
          ps.push({ ms, v: pkTotal(projInjs, ms) });
        }
        return ps;
      })() : [];
      const futureIntervalAvgs = scheduleActive && projPts.length > 0
        ? upcomingInjMs.map((ms, i) => {
            const iEnd = upcomingInjMs[i + 1] ?? visEndMs;
            const iPts = projPts.filter(p => p.ms >= ms && p.ms < iEnd);
            const mean = iPts.length ? iPts.reduce((s, p) => s + p.v, 0) / iPts.length : 0;
            return { startMs: ms, endMs: iEnd, mean };
          }).filter(s => s.mean > 0)
        : [];

      const yTicks = [maxV * 0.5, maxV];
      const yLabelPivot = PAD.t + cH + 4; // baseline for rotated injection labels

      // Weekly grid lines aligned to calendar Sundays (for 30d/60d views)
      const xWeekTicks = [];
      const firstSun = new Date(visStartMs); firstSun.setHours(12, 0, 0, 0);
      firstSun.setDate(firstSun.getDate() - firstSun.getDay());
      for (let tw = new Date(firstSun); tw.getTime() <= visEndMs; tw.setDate(tw.getDate() + 7)) {
        if (tw.getTime() >= visStartMs) xWeekTicks.push(tw.getTime());
      }

      // Per-injection-interval average; last interval extends to next scheduled injection
      const intervalAvgs = sortedInj.map((inj, i) => {
        const iStart = new Date(inj.date + 'T12:00:00').getTime();
        const iEnd   = i < sortedInj.length - 1
          ? new Date(sortedInj[i + 1].date + 'T12:00:00').getTime()
          : nextInjMs;
        const iPts = pts.filter(p => p.ms >= iStart && p.ms <= iEnd);
        const mean = iPts.length ? iPts.reduce((s, p) => s + p.v, 0) / iPts.length : 0;
        return { startMs: iStart, endMs: iEnd, mean, isLast: i === sortedInj.length - 1 };
      }).filter(s => s.mean > 0);

      const handleMouseMove = (e) => {
        const rect  = e.currentTarget.getBoundingClientRect();
        const svgX  = (e.clientX - rect.left) / rect.width * VW;
        if (svgX < PAD.l || svgX > PAD.l + cW) { setTip(null); return; }
        const frac    = (svgX - PAD.l) / cW;
        const ms      = visStartMs + frac * (visEndMs - visStartMs);
        const level   = pkTotal(sortedInj, ms);
        const wLbs    = interpW(ms);
        const dateStr = new Date(ms).toISOString().slice(0, 10);
        const seg     = intervalAvgs.find(s => ms >= s.startMs && ms <= s.endMs);
        const segAvg  = seg ? seg.mean : null;
        setTip({ x: svgX, y: yOf(level), level, dateStr, wLbs, segAvg });
      };

      // Tooltip box dimensions
      const TW = 62, TR = 4;

      const shareChart = async () => {
        if (!svgRef.current || sharing) return;
        setSharing(true);
        try {
          const scale = 3, headerH = 48;
          const FONT = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif";
          const svgClone = svgRef.current.cloneNode(true);
          svgClone.setAttribute('width', VW * scale);
          svgClone.setAttribute('height', VH * scale);
          const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
          styleEl.textContent = `text { font-family: ${FONT}; }`;
          svgClone.insertBefore(styleEl, svgClone.firstChild);
          const svgString = new XMLSerializer().serializeToString(svgClone);
          const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);
          const img = new Image();
          await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = svgUrl; });
          const canvas = document.createElement('canvas');
          canvas.width = VW * scale; canvas.height = (VH + headerH) * scale;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.scale(scale, scale);
          ctx.fillStyle = '#1c1c1e'; ctx.font = `700 13px ${FONT}`;
          ctx.fillText('Tirzepatide · Drug on Board', 14, 18);
          ctx.fillStyle = '#4a90d9'; ctx.font = `700 10px ${FONT}`;
          ctx.fillText(`On board now: ${curLevel.toFixed(2)} mg · Weekly dose: ${weeklyDose} mg`, 14, 34);
          ctx.fillStyle = '#8e8e93'; ctx.font = `400 9px ${FONT}`;
          ctx.fillText(`Trough: ${troughLevel.toFixed(2)} mg · ${fmtShort(msToLocalDate(nextInjMs))}`, 14, 44);
          ctx.drawImage(img, 0, headerH, VW, VH);
          const fileBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
          const file = new File([fileBlob], 'tirz-on-board.png', { type: 'image/png' });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Tirzepatide · Drug on Board',
              text: `On board now: ${curLevel.toFixed(2)} mg · ${weeklyDose} mg/wk` });
          } else {
            const url = URL.createObjectURL(fileBlob);
            const a = document.createElement('a');
            a.href = url; a.download = 'tirz-on-board.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
        } catch (e) { if (e.name !== 'AbortError') console.warn('[PkChart] share failed:', e); }
        finally { setSharing(false); }
      };

      return (
        <div>


          {/* View range selector */}
          <div style={{ display: 'flex', gap: 6, padding: '8px 14px 4px', alignItems: 'center' }}>
            <select value={rangeMode} onChange={e => selectRange(e.target.value)}
                    style={{ fontSize: 11, fontWeight: 600, padding: '5px 8px', borderRadius: 10,
                             background: '#e5e5ea', color: '#3c3c43', border: 'none', outline: 'none', cursor: 'pointer' }}>
              <option value="7d">7 Days</option>
              <option value="14d">14 Days</option>
              <option value="30d">Month</option>
              <option value="all">All · Weekly</option>
              <option value="custom">Custom</option>
