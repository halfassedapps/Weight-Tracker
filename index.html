<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Weight Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
           background: #f2f2f7; margin: 0; }
    .row-in { animation: fadeSlide .12s ease-out; }
    @keyframes fadeSlide { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:none; } }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useRef, useEffect, useMemo } = React;

    const LS_KEY          = 'weight-tracker-data';
    const LS_INJ_KEY      = 'weight-tracker-injections';
    const LS_SCHED_KEY    = 'weight-tracker-inj-schedule';
    const LS_LAST_CSV_KEY = 'weight-tracker-last-csv';
    const LS_GIST_PAT_KEY  = 'weight-tracker-gist-pat';
    const LS_SPLIT_KEY     = 'weight-tracker-split-dose';
    const LS_VIAL_CONC_KEY    = 'weight-tracker-vial-conc';
    const LS_VIAL_MG_KEY      = 'weight-tracker-vial-mg';
    const LS_VIAL_VOL_KEY     = 'weight-tracker-vial-vol';
    const LS_SYRINGE_UNITS_KEY = 'weight-tracker-syringe-units';
    const LS_POPOVER_DISMISS_KEY = 'weight-tracker-inj-popover-dismiss-date';
    // Local-only staging value for a banner-completed survey before its
    // injection has actually been logged — deliberately not synced to the
    // Gist (transient same-device convenience, consumed once the matching
    // injection is logged; see addInjection).
    const LS_PENDING_SURVEY_KEY = 'weight-tracker-pending-injection-survey';
    const LS_CALORIE_KEY         = 'weight-tracker-calories';
    const LS_CALORIE_TARGETS_KEY = 'weight-tracker-calorie-targets';
    // Watcher-computed { calMap, ridesMap, syncedAt } cache — no API key inside,
    // see IntervalsPanel/parseGistPayload.
    const LS_INTERVALS_ACTIVITIES_KEY = 'weight-tracker-intervals-activities';
    const LS_BP_KEY               = 'weight-tracker-blood-pressure';
    const EXPORT_RE       = /^(Automation_Daily_export|HealthExport)_\d{4}-\d{2}-\d{2}_\d{6}(\.csv)?$/i;
    function lastImportIsToday() {
      const name = localStorage.getItem(LS_LAST_CSV_KEY) ?? '';
      const m = name.match(/(\d{4}-\d{2}-\d{2})/);
      return !!m && m[1] === today();
    }
    const GIST_ID         = 'aa6e7ae2259f94c7a91637b447a0cd99';
    const GIST_USER       = 'halfassedapps';

    /* ─── IndexedDB (directory handle storage) ───────────────────────────────── */
    function openIDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open('weight-tracker-fs', 1);
        req.onupgradeneeded = () => req.result.createObjectStore('handles');
        req.onsuccess  = () => res(req.result);
        req.onerror    = () => rej(req.error);
      });
    }
    async function idbGet(key) {
      const db = await openIDB();
      return new Promise((res, rej) => {
        const req = db.transaction('handles','readonly').objectStore('handles').get(key);
        req.onsuccess = () => res(req.result ?? null);
        req.onerror   = () => rej(req.error);
      });
    }
    async function idbSet(key, val) {
      const db = await openIDB();
      return new Promise((res, rej) => {
        const tx = db.transaction('handles','readwrite');
        tx.objectStore('handles').put(val, key);
        tx.oncomplete = res;
        tx.onerror    = () => rej(tx.error);
      });
    }

    /* ─── Export folder helpers ──────────────────────────────────────────────── */
    // Extract the YYYY-MM-DD_HHMMSS portion so sort is date-based regardless of filename prefix.
    const exportTs = name => { const m = name.match(/(\d{4}-\d{2}-\d{2}_\d{6})/); return m ? m[1] : ''; };

    async function findLatestExport(dirHandle) {
      const matches = [];
      console.log(`[Weight Tracker] Scanning folder: ${dirHandle.name}`);
      for await (const [name, handle] of dirHandle.entries()) {
        const matched = EXPORT_RE.test(name);
        console.log(`  ${matched ? '✓' : '✗'} ${name}${matched ? '  ts=' + exportTs(name) : ''}`);
        if (matched) matches.push({ name, handle });
      }
      if (!matches.length) { console.log('[Weight Tracker] No matching export files found.'); return null; }
      matches.sort((a, b) => exportTs(b.name).localeCompare(exportTs(a.name)));
      console.log(`[Weight Tracker] Latest export: ${matches[0].name} (ts=${exportTs(matches[0].name)})`);
      return matches[0];
    }

    // getFile() on an iCloud-evicted file triggers a download but may take a few seconds.
    // Retry up to maxAttempts times with a short delay between each.
    async function readFileWithRetry(fileHandle, { maxAttempts = 5, delayMs = 1500, onWaiting } = {}) {
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        try {
          const file = await fileHandle.getFile();
          return await file.text();
        } catch (ex) {
          const isCloudError = ex.name === 'NotReadableError' || ex.message?.includes('cloud');
          if (!isCloudError || attempt === maxAttempts - 1) throw ex;
          if (onWaiting) onWaiting(attempt + 1);
          await new Promise(r => setTimeout(r, delayMs));
        }
      }
    }

    /* ─── Injection sites ────────────────────────────────────────────────────── */
    const INJECTION_SITES = [
      'Abdomen – Left, Upper', 'Abdomen – Left, Middle', 'Abdomen – Left, Lower',
      'Abdomen – Right, Upper', 'Abdomen – Right, Middle', 'Abdomen – Right, Lower',
      'Left Thigh', 'Right Thigh',
      'Left Upper Arm', 'Right Upper Arm',
    ];

    // Shared by addInjection/saveEditInjection (and mirrored by patchGist's/
    // exportJSON's own re-serialization) — site/nausea/hunger/foodNoise are
    // all optional and omitted entirely when unanswered, same convention.
    function buildInjEntry(date, doseMg, site, nausea, hunger, foodNoise) {
      const e = { date, doseMg };
      if (site) e.site = site;
      if (nausea != null && nausea !== '') e.nausea = Number(nausea);
      if (hunger != null && hunger !== '') e.hunger = Number(hunger);
      if (foodNoise != null && foodNoise !== '') e.foodNoise = Number(foodNoise);
      return e;
    }

    // Re-serializes an already-built injection object for the Gist/export —
    // same optional-field convention as buildInjEntry, just from an object
    // instead of raw form fields (used by patchGist and exportJSON, which
    // both explicitly reconstruct injection objects rather than passing them
    // through as-is, so any field missing here would be silently dropped).
    function serializeInjEntry({ date, doseMg, site, nausea, hunger, foodNoise }) {
      const e = { date, doseMg };
      if (site) e.site = site;
      if (nausea != null) e.nausea = nausea;
      if (hunger != null) e.hunger = hunger;
      if (foodNoise != null) e.foodNoise = foodNoise;
      return e;
    }

    /* ─── Injection localStorage ─────────────────────────────────────────────── */
    function lsLoadInjections() {
      try {
        const raw = localStorage.getItem(LS_INJ_KEY);
        if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) return p; }
      } catch (_) {}
      return [];
    }
    function lsSaveInjections(list) {
      try { localStorage.setItem(LS_INJ_KEY, JSON.stringify(list)); } catch (_) {}
    }

    /* ─── Injection Schedule localStorage ────────────────────────────────────── */
    function lsLoadSchedule() {
      try {
        const raw = localStorage.getItem(LS_SCHED_KEY);
        if (raw) { const p = JSON.parse(raw); if (Array.isArray(p) || isIntervalSchedule(p)) return p; }
      } catch (_) {}
      return [];
    }
    function lsSaveSchedule(sched) {
      try { localStorage.setItem(LS_SCHED_KEY, JSON.stringify(sched)); } catch (_) {}
    }

    /* ─── Calorie target localStorage ────────────────────────────────────────── */
    // Dated history, not a single value — the daily calorie budget changes over
    // time (e.g. as MyFitnessPal's recommendation is updated), and past chart
    // days need to compare against whatever target was active *then*, not today's.
    const DEFAULT_CALORIE_TARGETS = [
      { date: '2026-05-02', target: 1709 },
      { date: '2026-07-30', target: 1500 },
    ];
    function lsLoadCalorieTargets() {
      try {
        const raw = localStorage.getItem(LS_CALORIE_TARGETS_KEY);
        if (raw) { const p = JSON.parse(raw); if (Array.isArray(p) && p.length) return p; }
      } catch (_) {}
      return DEFAULT_CALORIE_TARGETS;
    }
    function lsSaveCalorieTargets(targets) {
      try { localStorage.setItem(LS_CALORIE_TARGETS_KEY, JSON.stringify(targets)); } catch (_) {}
    }
    // Most recent target with date <= dateStr (both 'YYYY-MM-DD', so string
    // comparison is safe). `targets` must be sorted ascending by date.
    function targetActiveAt(targets, dateStr) {
      let t = null;
      for (const entry of targets) { if (entry.date <= dateStr) t = entry.target; else break; }
      return t;
    }

    // How far off-target a day's *intake* was (consumed − target). TDEE cancels
    // out of this on purpose: your net-calorie goal for a day is (target − TDEE),
    // so actual-net-vs-goal-net simplifies to just consumed-vs-target regardless
    // of how much you burned that day.
    //
    // Deliberately asymmetric: undereating relative to plan is treated as "bad"
    // much sooner than overeating is — a big unplanned deficit risks muscle loss/
    // metabolic adaptation and usually means a logging gap, while overshooting
    // the target by the same amount is just a normal high-appetite day.
    const NET_GOOD_BAND = 150;     // within ±150 cal of target = good, either direction
    const NET_UNDEREAT_BAD = 400;  // more than 400 cal *under* target = bad
    const NET_OVEREAT_BAD = 600;   // more than 600 cal *over* target = bad (more leeway)
    const NET_TIER_COLOR = { good: '#0ca30c', ok: '#fab219', bad: '#d03b3b' };
    function netTier(deviation) {
      if (Math.abs(deviation) <= NET_GOOD_BAND) return 'good';
      return deviation < 0
        ? (deviation < -NET_UNDEREAT_BAD ? 'bad' : 'ok')
        : (deviation > NET_OVEREAT_BAD ? 'bad' : 'ok');
    }

    // Per-day deviation from calorie target, crediting exercise back into the
    // budget (MFP-style Goal + Exercise − Food). Prefers real per-workout
    // calories from intervals.icu, falling back to that day's HealthKit Active
    // Energy on other logged-workout days — see CaloriesVsTargetChart's own
    // comment block for the full reasoning. Shared so the Nutrition tab's chart
    // and the dosing recommendation's appetite-suppression signal are always
    // looking at the exact same number, never two silently-diverging ones.
    function calorieDeviationFor(d, calorieTargets, intervalsCalories) {
      const baseTarget = targetActiveAt(calorieTargets, d.date);
      const rideCal = intervalsCalories ? intervalsCalories[d.date] : null;
      const exercise = rideCal != null ? rideCal : (d.HasWorkout ? (d.ActiveEnergy || 0) : 0);
      const target = baseTarget != null ? baseTarget + exercise : null;
      const deviation = target != null ? (d.Calories || 0) - target : null;
      return { baseTarget, exercise, target, deviation };
    }

    // Trailing-window average calorie-target deviation — a secondary signal for
    // the dosing recommendation. A deep, sustained deficit (especially with
    // exercise credited back in) suggests appetite is already well-suppressed
    // at the current dose, which argues for caution before increasing further,
    // independent of what the weight-trend signal alone would say. Returns null
    // when there's too little data to say anything meaningful (falls back to
    // today's existing weight-only behavior — never a regression).
    function appetiteSuppressionSignal(calories, calorieTargets, intervalsCalories, todayMs, windowDays = 14) {
      const cutoff = msToLocalDate(todayMs - windowDays * 86400000);
      const today = msToLocalDate(todayMs);
      const deviations = (calories || [])
        .filter(d => d.date >= cutoff && d.date <= today)
        .map(d => calorieDeviationFor(d, calorieTargets, intervalsCalories).deviation)
        .filter(v => v != null);
      if (deviations.length < 7) return null;
      return { avgDeviation: avg(deviations), days: deviations.length };
    }

    // Trailing-window average nausea across injections with a nausea score
    // logged — a safety-relevant signal that takes priority over the
    // appetite-suppression override above (checked first in doseGuidance).
    // windowDays is picked at the upper end of "2-4 weeks" so a typical
    // weekly/biweekly injection cadence still reliably captures 2+ readings.
    const GI_TOLERANCE_WINDOW_DAYS = 28;
    const GI_NAUSEA_BAD = 7;
    const GI_SEVERE_TODAY_BAD = 9;

    function giToleranceSignal(sortedInj, todayMs, windowDays = GI_TOLERANCE_WINDOW_DAYS) {
      const cutoff = msToLocalDate(todayMs - windowDays * 86400000);
      const withNausea = (sortedInj || []).filter(inj => inj.nausea != null);
      const inWindow = withNausea.filter(inj => inj.date >= cutoff);
      if (!inWindow.length) return null;
      const avgNausea = avg(inWindow.map(inj => inj.nausea));
      // Most recent surveyed reading, independent of the window average — a
      // single severe day (>= GI_SEVERE_TODAY_BAD) can hold the dose even
      // when the trailing average is otherwise fine, since one bad reading
      // shouldn't get smoothed away by a mild recent history. See doseGuidance.
      const latestNausea = withNausea[withNausea.length - 1].nausea;
      // Persistent-intolerance flag: the last two SURVEYED injections (not
      // necessarily the last two calendar injections) at the same dose both
      // individually >= 7 — informational only, never changes the mechanical
      // recommendation on its own.
      let persistent = false, persistentDoseMg = null;
      if (withNausea.length >= 2) {
        const [prev, last] = withNausea.slice(-2);
        if (prev.doseMg === last.doseMg && prev.nausea >= GI_NAUSEA_BAD && last.nausea >= GI_NAUSEA_BAD) {
          persistent = true;
          persistentDoseMg = last.doseMg;
        }
      }
      return { avgNausea, latestNausea, count: inWindow.length, persistent, persistentDoseMg };
    }

    // Cross-checks the existing appetite-suppression override against
    // reported hunger/food-noise: corroborates it when both are low, flags a
    // possible alternate explanation (checking nausea first) when either is
    // still high despite the deep calorie deficit. Only meaningful — and
    // only called — when appetiteSuppressionSignal already fired.
    function subjectiveAppetiteCrossCheck(sortedInj, todayMs, giSignal, windowDays = GI_TOLERANCE_WINDOW_DAYS) {
      const cutoff = msToLocalDate(todayMs - windowDays * 86400000);
      const inWindow = (sortedInj || []).filter(inj => inj.date >= cutoff);
      const hungerVals = inWindow.map(i => i.hunger).filter(v => v != null);
      const noiseVals  = inWindow.map(i => i.foodNoise).filter(v => v != null);
      if (!hungerVals.length && !noiseVals.length) return null;
      const avgHunger = hungerVals.length ? avg(hungerVals) : null;
      const avgNoise  = noiseVals.length ? avg(noiseVals) : null;
      const stillHungry = (avgHunger != null && avgHunger >= 6) || (avgNoise != null && avgNoise >= 6);
      if (!stillHungry) {
        return (avgHunger != null && avgNoise != null && avgHunger <= 3 && avgNoise <= 3)
          ? { type: 'corroborated', note: 'consistent with reported low hunger/food noise' }
          : null;
      }
      const note = giSignal && giSignal.avgNausea >= GI_NAUSEA_BAD
        ? 'still hungry despite the deficit — may reflect GI symptoms rather than true appetite suppression'
        : 'still hungry despite the deficit — the deficit may not reflect true appetite suppression';
      return { type: 'contradicted', note };
    }

    /* ─── Protein target localStorage ────────────────────────────────────────── */
    // Same dated-history shape as calorieTargets — the minimum-protein floor
    // can change over time and past days must compare against whatever floor
    // was active *then*.
    const LS_PROTEIN_TARGETS_KEY = 'weight-tracker-protein-targets';
    const DEFAULT_PROTEIN_TARGETS = [
      { date: '2026-05-02', target: 171 },
    ];
    function lsLoadProteinTargets() {
      try {
        const raw = localStorage.getItem(LS_PROTEIN_TARGETS_KEY);
        if (raw) { const p = JSON.parse(raw); if (Array.isArray(p) && p.length) return p; }
      } catch (_) {}
      return DEFAULT_PROTEIN_TARGETS;
    }
    function lsSaveProteinTargets(targets) {
      try { localStorage.setItem(LS_PROTEIN_TARGETS_KEY, JSON.stringify(targets)); } catch (_) {}
    }

    // Protein is a floor, not a target with headroom — hitting or clearing it
    // is simply "good," full stop, with no separate reward for going further
    // over. Undershooting is asymmetric on purpose: a single day 85-99% of the
    // floor isn't a problem if the weekly average still clears it, but a
    // meaningful shortfall (<85%) is where muscle-preservation risk actually
    // shows up, especially stacked on a ride day where net calories are tight.
    const PROTEIN_SHORTFALL_RATIO = 0.85; // below this fraction of target = red
    function proteinTier(value, target) {
      if (target == null) return null;
      if (value >= target) return 'good';
      return value >= target * PROTEIN_SHORTFALL_RATIO ? 'ok' : 'bad';
    }

    /* ─── Weight localStorage ────────────────────────────────────────────────── */
    function lsSave(rows, meta) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          meta,
          entries: rows.map(r => ({ date: r.date, wKg: r.wKg })),
        }));
      } catch (_) {}
    }
    function lsLoad() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        const { meta, entries } = JSON.parse(raw);
        if (!Array.isArray(entries) || !entries.length) return null;
        const daily = entries
          .filter(e => e.date && e.wKg != null)
          .sort((a, b) => b.date.localeCompare(a.date));
        return { logbook: computeLogbook(daily), meta: meta ?? { metric: 'Weight', source: '' } };
      } catch (_) { return null; }
    }
    function lsLoadRaw() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return {};
        const { entries } = JSON.parse(raw);
        if (!Array.isArray(entries)) return {};
        const map = {};
        entries.forEach(e => { if (e.date && e.wKg != null) map[e.date] = e.wKg; });
        return map;
      } catch (_) { return {}; }
    }
    function mergeWithStored(newDaily) {
      const map = lsLoadRaw();
      newDaily.forEach(e => { map[e.date] = e.wKg; });
      return Object.entries(map)
        .map(([date, wKg]) => ({ date, wKg }))
        .sort((a, b) => b.date.localeCompare(a.date));
    }

    /* ─── Calorie localStorage ───────────────────────────────────────────────── */
    // Each export file only covers a rolling ~week, so calorie history is
    // accumulated here by date across imports rather than replaced each time.
    function lsLoadCaloriesRaw() {
      try {
        const raw = localStorage.getItem(LS_CALORIE_KEY);
        const map = raw ? JSON.parse(raw) : {};
        return (map && typeof map === 'object') ? map : {};
      } catch (_) { return {}; }
    }
    function mergeCaloriesWithStored(newCalRows) {
      const map = lsLoadCaloriesRaw();
      for (const d of newCalRows) {
        map[d.date] = { date: d.date, Calories: d.Calories || 0, ActiveEnergy: d.ActiveEnergy || 0, BasalEnergy: d.BasalEnergy || 0,
                        Protein: d.Protein || 0, Carbs: d.Carbs || 0, Fat: d.Fat || 0, HasWorkout: !!d.HasWorkout };
      }
      try { localStorage.setItem(LS_CALORIE_KEY, JSON.stringify(map)); } catch (_) {}
      return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
    }

    /* ─── Blood pressure localStorage ────────────────────────────────────────── */
    // Raw readings only (not reduced) — keyed by ms, each reading's own
    // timestamp, since that's already a stable, naturally-unique identity
    // across re-imports.
    function lsLoadBpRaw() {
      try {
        const raw = localStorage.getItem(LS_BP_KEY);
        const map = raw ? JSON.parse(raw) : {};
        return (map && typeof map === 'object') ? map : {};
      } catch (_) { return {}; }
    }
    function mergeBpWithStored(newReadings) {
      const map = lsLoadBpRaw();
      for (const r of newReadings) {
        map[r.ms] = r;
      }
      try { localStorage.setItem(LS_BP_KEY, JSON.stringify(map)); } catch (_) {}
      return Object.values(map).sort((a, b) => a.ms - b.ms);
    }

    /* ─── GitHub Gist sync ───────────────────────────────────────────────────── */
    function parseGistPayload({ meta, entries = [], injections = [], injSchedule = [], calories = [], intervalsActivities = null, calorieTargets = [], proteinTargets = [], bloodPressure = [] }) {
      const seen = new Set();
      const daily = entries
        .filter(e => e.date && e.wKg != null)
        .sort((a, b) => b.date.localeCompare(a.date))
        .filter(e => { if (seen.has(e.date)) return false; seen.add(e.date); return true; });
      return {
        logbook:      daily.length ? computeLogbook(daily) : [],
        meta:         meta ?? { metric: 'Weight', source: '' },
        injections:   injections.filter(i => i.date && i.doseMg),
        injSchedule:  (Array.isArray(injSchedule) || isIntervalSchedule(injSchedule)) ? injSchedule : [],
        calories:     Array.isArray(calories) ? calories.filter(c => c.date) : [],
        // Written only by the watcher (watcher/weight_export_watcher.py), from a
        // Keychain-held key that never touches the Gist — see patchGist above.
        intervalsActivities: intervalsActivities && (intervalsActivities.calMap || intervalsActivities.ridesMap) ? intervalsActivities : null,
        calorieTargets: Array.isArray(calorieTargets) && calorieTargets.length
          ? [...calorieTargets].sort((a, b) => a.date.localeCompare(b.date))
          : DEFAULT_CALORIE_TARGETS,
        proteinTargets: Array.isArray(proteinTargets) && proteinTargets.length
          ? [...proteinTargets].sort((a, b) => a.date.localeCompare(b.date))
          : DEFAULT_PROTEIN_TARGETS,
        bloodPressure: Array.isArray(bloodPressure)
          ? bloodPressure.filter(s => s.date && s.systolic != null && s.diastolic != null)
          : [],
      };
    }

    // Fetches MP4 files from the body-scans/ folder in the repo and parses
    // dates + label from the filename: YYYY-MM-DD_YYYY-MM-DD[_Label].mp4
    const BODY_SCANS_RE = /^(\d{4}-\d{2}-\d{2})_(\d{4}-\d{2}-\d{2})(?:_(.+))?\.mp4$/i;
    async function fetchBodyScans() {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${GIST_USER}/Weight-Tracker/contents/body-scans?ref=github-pages-gist`,
          { headers: { Accept: 'application/vnd.github.v3+json' } }
        );
        if (!res.ok) return [];
        const files = await res.json();
        return files
          .filter(f => BODY_SCANS_RE.test(f.name))
          .map(f => {
            const [, startDate, endDate, rawLabel] = f.name.match(BODY_SCANS_RE);
            const label = rawLabel ? rawLabel.replace(/[-_]/g, ' ') : undefined;
            return { startDate, endDate, label, url: f.download_url };
          })
          .sort((a, b) => a.startDate.localeCompare(b.startDate));
      } catch { return []; }
    }

    async function fetchGist(gistId, pat) {
      if (pat) {
        // Authenticated: use API (needed for writes + detecting missing file)
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github.v3+json' },
        });
        if (!res.ok) throw new Error(`Gist fetch ${res.status}`);
        const gist = await res.json();
        const content = gist.files['weight-data.json']?.content;
        if (!content) return null;
        return parseGistPayload(JSON.parse(content));
      } else {
        // Unauthenticated: raw URL works for secret gists without auth
        const res = await fetch(
          `https://gist.githubusercontent.com/${GIST_USER}/${gistId}/raw/weight-data.json?t=${Date.now()}`
        );
        if (!res.ok) throw new Error(`Gist fetch ${res.status}`);
        return parseGistPayload(await res.json());
      }
    }

    // No apiKey/athleteId param: the raw intervals.icu key must never be written
    // to the Gist (it's fetched unauthenticated by anyone with the page URL) — only
    // the watcher (local Keychain-held key) computes and writes intervalsActivities.
    // The client still has to pass that field's *current* value through on every
    // write, same as calorieTargets/proteinTargets — this is a full-content PATCH
    // of weight-data.json, so any field the caller omits here is deleted from the
    // Gist, not merely left unmodified.
    async function patchGist(gistId, pat, rows, meta, injections, injSchedule = [], calories = [], calorieTargets = [], proteinTargets = [], bloodPressure = [], intervalsActivities = null) {
      const payload = {
        version: 1, savedAt: new Date().toISOString(), meta,
        injSchedule,
        injections: injections.map(serializeInjEntry),
        entries:    rows.map(r => ({ date: r.date, wKg: r.wKg })),
        calories:   calories.map(({ date, Calories, ActiveEnergy, BasalEnergy, Protein, Carbs, Fat, HasWorkout }) =>
          ({ date, Calories, ActiveEnergy, BasalEnergy, Protein: Protein || 0, Carbs: Carbs || 0, Fat: Fat || 0, HasWorkout: !!HasWorkout })),
        calorieTargets: calorieTargets.map(({ date, target }) => ({ date, target })),
        proteinTargets: proteinTargets.map(({ date, target }) => ({ date, target })),
        bloodPressure: bloodPressure.map(({ date, ms, systolic, diastolic }) =>
          ({ date, ms, systolic, diastolic })),
      };
      if (intervalsActivities) payload.intervalsActivities = intervalsActivities;
      const content = JSON.stringify(payload, null, 2);
      const res = await fetch(`https://api.github.com/gists/${gistId}`, {
        method: 'PATCH',
        headers: {
          Authorization: `token ${pat}`, Accept: 'application/vnd.github.v3+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ files: { 'weight-data.json': { content } } }),
      });
      if (!res.ok) throw new Error(`Gist write ${res.status}`);
    }

    /* ─── intervals.icu ──────────────────────────────────────────────────────── */
    // No client-side fetch/push to intervals.icu — that used to run from every
    // visitor's browser using a key shared via the Gist, which meant anyone
    // with the page URL received (and could trigger requests with) the owner's
    // real intervals.icu API key. The watcher (weight_export_watcher.py) now
    // does the actual sync from a local Keychain-held key and publishes only
    // the resulting ride/calorie data (intervalsActivities, no key inside it)
    // into the Gist for every viewer — see parseGistPayload/patchGist above.

    /* ─── CSV parser ─────────────────────────────────────────────────────────── */
    function splitLine(line) {
      const out = []; let cur = ''; let q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { q = !q; }
        else if (c === ',' && !q) { out.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
        else { cur += c; }
      }
      out.push(cur.trim().replace(/^"|"$/g, ''));
      return out;
    }
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      if (lines.length < 2) return [];
      const headers = splitLine(lines[0]);
      return lines.slice(1).map(line => {
        const vals = splitLine(line);
        const row = {};
        headers.forEach((h, i) => { row[h] = (vals[i] ?? '').trim(); });
        return row;
      });
    }

    /* ─── Schema detection ───────────────────────────────────────────────────── */
    function detectSchema(headers, rows) {
      const lc  = h => h.toLowerCase().replace(/[\s_\-]/g, '');
      const find = (...keys) => headers.find(h => keys.some(k => lc(h) === k || lc(h).includes(k)));
      const dateCol   = find('date', 'startdate', 'datetime', 'timestamp');
      const metricCol = find('metric', 'metricname', 'type', 'category', 'name');
      const valueCol  = find('value', 'qty');
      const unitCol   = find('unit', 'units');
      if (metricCol && valueCol && dateCol) {
        const metricValues = [...new Set(rows.map(r => r[metricCol]).filter(Boolean))];
        const weightMetric = metricValues.find(m =>
          ['bodyweight', 'body weight', 'weight', 'bodymass', 'body mass']
            .includes(m.toLowerCase().replace(/\s+/g, ' ').trim())
        ) ?? metricValues.find(m => m.toLowerCase().includes('weight'));
        return { format: 'long', dateCol, metricCol, valueCol, unitCol, weightMetric, allMetrics: metricValues };
      }
      const wideValue = find('weight', 'bodymass', 'body mass', 'mass', 'value');
      if (dateCol && wideValue) return { format: 'wide', dateCol, valueCol: wideValue, unitCol };
      return { format: 'unknown', dateCol, valueCol, unitCol };
    }

    // Blood Pressure metric name matching — unlike weight/calories there are two
    // paired metrics (systolic + diastolic) sharing one timestamp per reading.
    const BP_SYSTOLIC_RE  = /blood pressure.*systolic|systolic.*blood pressure/i;
    const BP_DIASTOLIC_RE = /blood pressure.*diastolic|diastolic.*blood pressure/i;
    function findBpMetrics(allMetrics) {
      const systolic  = (allMetrics || []).find(m => BP_SYSTOLIC_RE.test(m));
      const diastolic = (allMetrics || []).find(m => BP_DIASTOLIC_RE.test(m));
      return { systolic, diastolic };
    }

    /* ─── Data processing ────────────────────────────────────────────────────── */
    function toKg(weight, unit) {
      const u = (unit ?? '').toLowerCase().trim();
      if (u === 'lb' || u === 'lbs' || u === 'pound' || u === 'pounds') return weight / 2.20462;
      return weight;
    }
    const toLbs = kg => kg * 2.20462;

    /* ─── Calorie data extraction ─────────────────────────────────────────────── */
    function buildCalorieMap(rows, schema) {
      const map = {};
      const calorieMetrics = {};
      let found = 0;
      for (const row of rows) {
        const rawDate = row[schema.dateCol];
        if (!rawDate) continue;
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) continue;
        const metric = row[schema.metricCol];
        if (!metric) continue;
        const key = msToLocalDate(d.getTime());
        if (!map[key]) map[key] = { date: key, ts: d, Calories: 0, ActiveEnergy: 0, BasalEnergy: 0, Protein: 0, Carbs: 0, Fat: 0, HasWorkout: false };
        // "Workout" rows use a different column layout (activity type + duration,
        // not a plain numeric value) — just flag the day, don't try to parse a number.
        if (metric.toLowerCase() === 'workout') { map[key].HasWorkout = true; continue; }
        const rawVal = (row[schema.valueCol] ?? '').replace(/,/g, '');
        const val = parseFloat(rawVal);
        if (isNaN(val)) continue;
        if (metric.toLowerCase().includes('calor')) { calorieMetrics[key] = (calorieMetrics[key] ?? 0) + val; found++; }
        else if (metric.toLowerCase().includes('active energy')) { map[key].ActiveEnergy += val; found++; }
        else if (metric.toLowerCase().includes('basal energy')) { map[key].BasalEnergy += val; found++; }
        else if (metric.toLowerCase().includes('protein')) { map[key].Protein += val; found++; }
        else if (metric.toLowerCase().includes('carbohydrate')) { map[key].Carbs += val; found++; }
        else if (metric.toLowerCase().includes('total fat')) { map[key].Fat += val; found++; }
      }
      Object.entries(calorieMetrics).forEach(([key, total]) => {
        if (map[key]) map[key].Calories = total;
      });
      const result = Object.values(map)
        .filter(d => d.Calories > 0 || d.ActiveEnergy > 0)
        .sort((a, b) => b.date.localeCompare(a.date));
      console.log(`[Calorie] Extracted ${result.length} days, found ${found} metrics`);
      return result;
    }

    /* ─── Blood pressure extraction ──────────────────────────────────────────── */
    // Pairs Systolic/Diastolic rows sharing the same exact timestamp into single
    // readings. Long-format CSV: two rows per real-world cuff reading.
    function buildBpReadings(rows, schema) {
      if (schema.format !== 'long') return [];
      const { systolic, diastolic } = findBpMetrics(schema.allMetrics);
      if (!systolic || !diastolic) return [];
      const byTs = {}; // ms-as-string -> { ms, systolic, diastolic }
      for (const row of rows) {
        const metric = row[schema.metricCol];
        if (metric !== systolic && metric !== diastolic) continue;
        const rawDate = row[schema.dateCol];
        if (!rawDate) continue;
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) continue;
        const val = parseFloat((row[schema.valueCol] ?? '').replace(/,/g, ''));
        if (isNaN(val)) continue;
        const key = String(d.getTime());
        if (!byTs[key]) byTs[key] = { ms: d.getTime() };
        if (metric === systolic) byTs[key].systolic = val;
        else byTs[key].diastolic = val;
      }
      return Object.values(byTs)
        .filter(r => r.systolic != null && r.diastolic != null) // only fully-paired readings
        .sort((a, b) => a.ms - b.ms);
    }

    // Raw readings, shaped for storage — one row per real-world cuff reading,
    // no reduction. Sitting/outlier/daily-average logic lives entirely in
    // BpChart at display time (see clusterBpReadings/computeDailyBp) so the
    // stored data stays a single source of truth and the UI can always show
    // every actual reading on hover, regardless of how they get combined.
    function buildBpMap(rows, schema) {
      return buildBpReadings(rows, schema).map(r => ({ date: msToLocalDate(r.ms), ...r }));
    }

    const BP_SESSION_GAP_MIN = 15;

    // Groups same local-day raw readings into "sittings" purely by time gap (no
    // fixed AM/PM cutoff): a gap > BP_SESSION_GAP_MIN minutes to the previous
    // reading starts a new sitting. Within a sitting of 2+ readings, keeps the
    // lowest-two-by-systolic and averages their systolic/diastolic as a paired
    // unit (never mixing systolic from one reading with diastolic from
    // another) — this discards an artificially-high first reading the way
    // retaking your BP a couple minutes later to "get a truer number" intends.
    // A lone reading passes through as-is. Display-time only; not persisted.
    function clusterBpReadings(readings) {
      if (!readings.length) return [];
      const gapMs = BP_SESSION_GAP_MIN * 60000;
      const sittings = [];
      let cur = [readings[0]];
      for (let i = 1; i < readings.length; i++) {
        const prev = readings[i - 1], r = readings[i];
        if (r.ms - prev.ms <= gapMs && msToLocalDate(r.ms) === msToLocalDate(prev.ms)) {
          cur.push(r);
        } else {
          sittings.push(cur); cur = [r];
        }
      }
      sittings.push(cur);

      return sittings.map(group => {
        const firstMs = group[0].ms;
        const date = msToLocalDate(firstMs);
        let systolic, diastolic;
        if (group.length === 1) {
          systolic = group[0].systolic; diastolic = group[0].diastolic;
        } else if (group.length === 2) {
          // Exactly two: use the lower reading outright, not an average of both.
          const lower = group[0].systolic <= group[1].systolic ? group[0] : group[1];
          systolic = lower.systolic; diastolic = lower.diastolic;
        } else {
          // Three or more: average the lowest two (paired, not cross-matched).
          const lowest2 = [...group].sort((a, b) => a.systolic - b.systolic).slice(0, 2);
          systolic = avg(lowest2.map(r => r.systolic));
          diastolic = avg(lowest2.map(r => r.diastolic));
        }
        return {
          date, ms: firstMs,
          systolic:  Math.round(systolic * 10) / 10,
          diastolic: Math.round(diastolic * 10) / 10,
          readingCount: group.length,
        };
      });
    }

    // One point per calendar day: groups raw readings into sittings (see
    // clusterBpReadings), then averages sitting-level results together when a
    // day holds more than one sitting (e.g. separate AM and PM readings, or
    // two readings far enough apart not to count as the same sitting) — so a
    // day always renders as exactly one chart point, however many times BP
    // was actually taken that day. Each point carries its day's raw readings
    // (sorted) for a hover table showing exactly what went into it.
    function computeDailyBp(readings) {
      const sittings = clusterBpReadings(readings);
      const byDate = {};
      for (const s of sittings) (byDate[s.date] ??= []).push(s);
      const rawByDate = {};
      for (const r of readings) (rawByDate[msToLocalDate(r.ms)] ??= []).push(r);
      return Object.entries(byDate).map(([date, sits]) => ({
        date, ms: sits[0].ms,
        systolic:  Math.round(avg(sits.map(s => s.systolic)) * 10) / 10,
        diastolic: Math.round(avg(sits.map(s => s.diastolic)) * 10) / 10,
        sittingCount: sits.length,
        readings: (rawByDate[date] || []).slice().sort((a, b) => a.ms - b.ms),
      })).sort((a, b) => a.ms - b.ms);
    }

    function buildDailyMap(rows, schema) {
      const map = {};
      for (const row of rows) {
        if (schema.format === 'long' && row[schema.metricCol] !== schema.weightMetric) continue;
        const rawDate = row[schema.dateCol];
        if (!rawDate) continue;
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) continue;
        const rawVal = (row[schema.valueCol] ?? '').replace(/,/g, '');
        const wRaw = parseFloat(rawVal);
        if (isNaN(wRaw)) continue;
        const unit = schema.unitCol ? row[schema.unitCol] : '';
        const wKg  = toKg(wRaw, unit);
        const key  = msToLocalDate(d.getTime());
        if (!map[key] || d > map[key].ts) map[key] = { date: key, wKg, ts: d };
      }
      return Object.values(map).sort((a, b) => b.date.localeCompare(a.date));
    }

    const avg = arr => arr.reduce((s, v) => s + v, 0) / arr.length;

    function computeLogbook(data) {
      const n = data.length;
      return data.map((entry, i) => {
        const maSlice  = data.slice(i, i + 7).map(d => d.wKg);
        const movAvgKg = avg(maSlice);
        let weeklyRateKg = null;
        if (i + 7 < n) {
          const prev = data.slice(i + 7, i + 14).map(d => d.wKg);
          if (prev.length) weeklyRateKg = movAvgKg - avg(prev);
        }
        const hiSlice    = data.slice(i, i + 10).map(d => d.wKg);
        const tenHiKg    = Math.max(...hiSlice);
        const prev2wSlice = data.slice(i + 14, i + 21).map(d => d.wKg);
        const twoWeekLossKg = prev2wSlice.length >= 3 ? avg(prev2wSlice) - movAvgKg : null;
        return {
          ...entry,
          lbs:         toLbs(entry.wKg),
          movAvg:      toLbs(movAvgKg),
          rate:        weeklyRateKg != null ? toLbs(weeklyRateKg) : null,
          tenHigh:     toLbs(tenHiKg),
          twoWeekLoss: twoWeekLossKg != null ? toLbs(twoWeekLossKg) : null,
        };
      });
    }

    const MAX_DOSE_MG = 15;
    const DOSE_STEP_MG = 0.5;

    // appetiteSignal may only ever soften an 'increase' into a 'stay' — it must
    // never touch 'stay'/'monitor'/'contact', which exist to catch weight loss
    // that's too *fast* (a safety concern orthogonal to appetite mechanism and
    // never softened by how much someone is or isn't eating).
    function doseGuidance(twoWeekLbs, appetiteSignal, giSignal, appetiteCrossCheck) {
      if (twoWeekLbs == null) return null;
      // giSignal never changes the action for these three safety bands — it
      // can only append context to the message (checked once, appended below).
      // Fires on either the sustained window average OR today's reading alone
      // being severe — a single very bad day shouldn't get smoothed away by
      // an otherwise-mild recent history.
      const giAvgBad    = giSignal && giSignal.avgNausea >= GI_NAUSEA_BAD;
      const giTodayBad  = giSignal && giSignal.latestNausea != null && giSignal.latestNausea >= GI_SEVERE_TODAY_BAD;
      const giNote = (giAvgBad || giTodayBad)
        ? ` — also reporting significant GI symptoms (avg nausea ${giSignal.avgNausea.toFixed(1)}/10)` : '';
      if (twoWeekLbs > 8)  return { action: 'contact', label: 'Contact prescriber', note: `>8 lbs/2wk${giNote}`, color: '#ff3b30', bg: '#fff1f0' };
      if (twoWeekLbs >= 5) return { action: 'monitor', label: 'Stay — monitor',     note: `5–8 lbs/2wk${giNote}`, color: '#ff9500', bg: '#fff8ee' };
      if (twoWeekLbs >= 3) return { action: 'stay',    label: 'Stay at dose',       note: `3–5 lbs/2wk${giNote}`, color: '#34c759', bg: '#f0fdf4' };
      // Would otherwise be "consider increasing" — GI tolerance is checked
      // first (safety-relevant, takes priority), then the calorie-deficit
      // appetite override only if GI didn't already downgrade the rec.
      if (giAvgBad || giTodayBad) {
        return {
          action: 'stay', giOverride: true,
          label: 'Stay — GI tolerability limiting',
          note: giAvgBad
            ? `avg nausea ${giSignal.avgNausea.toFixed(1)}/10 over the last ${GI_TOLERANCE_WINDOW_DAYS} days`
            : `today's nausea (${giSignal.latestNausea}/10) is severe enough to hold this week`,
          color: '#34c759', bg: '#f0fdf4',
        };
      }
      // A deep, sustained calorie deficit (same 400-cal/day threshold that
      // marks a Nutrition-tab day as concerning undereating) suggests
      // appetite is already well suppressed at the current dose, so hold
      // instead. Restricted to actual (if slow) weight *loss* — twoWeekLbs <
      // 0 means gaining weight despite a supposedly deep deficit, a
      // contradictory signal that needs a look, not a reassuring "you're
      // fine, hold."
      //
      // But: if the hunger/food-noise cross-check *contradicts* this story
      // (still hungry despite the deficit), don't hold on an explanation the
      // subjective data doesn't support — a deficit maintained through
      // apparent effort rather than suppressed appetite is a case for more
      // drug, not confirmation none is needed. Let the trend-based increase
      // stand instead; crossCheckBypassed flags this specific case so the UI
      // can show the contradiction alongside the increase.
      const deficitQualifies = twoWeekLbs >= 0 && appetiteSignal && appetiteSignal.avgDeviation <= -NET_UNDEREAT_BAD;
      const contradicted = appetiteCrossCheck && appetiteCrossCheck.type === 'contradicted';
      if (deficitQualifies && !contradicted) {
        return {
          action: 'stay', overridden: true,
          label: 'Stay — appetite well suppressed',
          note: `${Math.round(Math.abs(appetiteSignal.avgDeviation))} cal/day under target`,
          color: '#34c759', bg: '#f0fdf4',
        };
      }
      return {
        action: 'increase', label: 'Consider ↑ dose', note: `<3 lbs/2wk${giNote}`,
        color: '#ff9500', bg: '#fff8ee',
        crossCheckBypassed: deficitQualifies && contradicted,
      };
    }

    function recommendedDose(currentDoseMg, twoWeekLbs, appetiteSignal, giSignal, appetiteCrossCheck) {
      const g = doseGuidance(twoWeekLbs, appetiteSignal, giSignal, appetiteCrossCheck);
      if (!g) return null;
      if (g.action === 'increase') {
        const next = Math.round((currentDoseMg + DOSE_STEP_MG) * 10) / 10;
        const dose = next <= MAX_DOSE_MG ? next : null; // null = already at max
        return { dose, g };
      }
      return { dose: currentDoseMg, g };
    }

    // Parses CSV text, merges with stored data, returns { logbook, meta } or throws.
    function processCSVText(text) {
      const parsed = parseCSV(text);
      if (!parsed.length) throw new Error('CSV is empty.');
      const schema = detectSchema(Object.keys(parsed[0]), parsed);
      if (schema.format === 'unknown') throw new Error(`Couldn't identify schema. Headers: ${Object.keys(parsed[0]).join(', ')}`);
      if (schema.format === 'long' && !schema.weightMetric) {
        const sample = (schema.allMetrics ?? []).slice(0, 8).join(', ');
        throw new Error(`No weight metric found. Metrics present: ${sample}`);
      }
      const newDaily = buildDailyMap(parsed, schema);
      if (!newDaily.length) throw new Error('No valid weight entries found.');
      const daily   = mergeWithStored(newDaily);
      const logbook = computeLogbook(daily);
      const srcCol  = Object.keys(parsed[0]).find(h => h.toLowerCase() === 'source');
      const wRows   = schema.format === 'long' ? parsed.filter(r => r[schema.metricCol] === schema.weightMetric) : parsed;
      const source  = srcCol ? [...new Set(wRows.map(r => r[srcCol]).filter(Boolean))].join(', ') : '';
      const meta    = { metric: schema.weightMetric ?? 'Weight', source };
      const calorieData = schema.format === 'long' ? buildCalorieMap(parsed, schema) : [];
      const bpData = schema.format === 'long' ? buildBpMap(parsed, schema) : [];
      return { logbook, meta, calorieData, bpData };
    }

    /* ─── Pharmacokinetics ───────────────────────────────────────────────────── */
    // One-compartment first-order absorption model (Bateman equation)
    // t½ elim = 5 days (120 h), Ka gives Tmax ≈ 36 h
    const T_HALF   = 5;
    const KE_H     = Math.LN2 / (T_HALF * 24); // elimination rate, h⁻¹
    const KA_H     = 0.078125;                  // absorption rate, h⁻¹
    const KA_SCALE = KA_H / (KA_H - KE_H);     // pre-computed Bateman factor

    function pkContrib(doseMg, dtDays) {
      if (dtDays < 0) return 0;
      const t = dtDays * 24; // hours
      return doseMg * KA_SCALE * (Math.exp(-KE_H * t) - Math.exp(-KA_H * t));
    }
    function pkTotal(injections, evalMs) {
      return injections.reduce((sum, inj) => {
        // _ms allows synthetic future injections to use their exact scheduled timestamp
        const injMs = inj._ms ?? new Date(inj.date + 'T12:00:00').getTime();
        return sum + pkContrib(inj.doseMg, (evalMs - injMs) / 86400000);
      }, 0);
    }

    // Two mutually-exclusive schedule shapes:
    //   weekday mode:  [{ day: 0-6, ampm: 'am'|'pm' }, ...]  (0=Sun … 6=Sat)
    //   interval mode: { mode: 'interval', everyNDays: N, ampm: 'am'|'pm' }
    const isIntervalSchedule = s => !!s && s.mode === 'interval';
    const isWeekdaySchedule  = s => Array.isArray(s) && s.length > 0;

    // Given a ms timestamp, return the next scheduled injection ms per the config.
    // `lastInjMs` anchors interval-mode schedules (next dose = last logged
    // injection + N days) and is unused for weekday-mode schedules.
    function nextScheduledMs(afterMs, schedule, lastInjMs) {
      if (isIntervalSchedule(schedule)) {
        if (lastInjMs == null) return null;
        const stepMs = schedule.everyNDays * 86400000;
        let n = Math.max(1, Math.ceil((afterMs - lastInjMs) / stepMs));
        let cand = new Date(lastInjMs + n * stepMs);
        cand.setHours(schedule.ampm === 'am' ? 8 : 20, 0, 0, 0);
        if (cand.getTime() <= afterMs) {
          cand = new Date(lastInjMs + (n + 1) * stepMs);
          cand.setHours(schedule.ampm === 'am' ? 8 : 20, 0, 0, 0);
        }
        return cand.getTime();
      }
      if (!schedule || schedule.length === 0) return null;
      const base = new Date(afterMs);
      for (let d = 1; d <= 7; d++) {
        const cand = new Date(base);
        cand.setDate(cand.getDate() + d);
        const slot = schedule.find(s => s.day === cand.getDay());
        if (slot) {
          cand.setHours(slot.ampm === 'am' ? 8 : 20, 0, 0, 0);
          return cand.getTime();
        }
      }
      return null;
    }

    const round1 = n => Math.round(n * 10) / 10;

    // Unifies the schedule/cadence math that PkChart and DosePanel both need:
    // current per-injection dose, doses/week (continuous, not just 1 or 2),
    // and the resulting true weekly total.
    function getDoseSchedule(injections, injSchedule) {
      if (!injections || injections.length === 0) return null;
      const sortedInj = [...injections].sort((a, b) => a.date.localeCompare(b.date));
      const lastInj   = sortedInj[sortedInj.length - 1];
      const lastInjMs = new Date(lastInj.date + 'T12:00:00').getTime();
      const lastDose  = lastInj.doseMg;

      let injInterval = 7;
      if (sortedInj.length >= 2) {
        const prevMs = new Date(sortedInj[sortedInj.length - 2].date + 'T12:00:00').getTime();
        injInterval = (lastInjMs - prevMs) / 86400000;
      }

      const weekdayActive  = isWeekdaySchedule(injSchedule);
      const intervalActive = isIntervalSchedule(injSchedule);
      const scheduleActive = weekdayActive || intervalActive;
      const splitManual    = localStorage.getItem(LS_SPLIT_KEY) === 'true';

      const injPerWeek = weekdayActive  ? injSchedule.length
                       : intervalActive ? 7 / injSchedule.everyNDays
                       : (splitManual || injInterval < 5 ? 2 : 1);

      const weeklyDose = lastDose * injPerWeek;

      const nextInjMs = scheduleActive
        ? (nextScheduledMs(lastInjMs, injSchedule, lastInjMs) ?? lastInjMs + injInterval * 86400000)
        : lastInjMs + injInterval * 86400000;

      return { sortedInj, lastInj, lastInjMs, lastDose, injInterval,
               scheduleActive, weekdayActive, intervalActive, injPerWeek, weeklyDose, nextInjMs };
    }

    // Trend-based increase/stay/monitor/contact guidance, expressed at the
    // schedule's current cadence (perInjMg = the true partial per-injection
    // amount, not the weekly total).
    function getRecommendation(rows, ds, calories, calorieTargets, intervalsCalories, todayMs, pendingSurvey) {
      if (!ds) return null;
      const recent = rows.find(r => r.twoWeekLoss != null);
      if (!recent) return null;
      const appetite = appetiteSuppressionSignal(calories, calorieTargets, intervalsCalories, todayMs);
      // Fold in today's saved-but-not-yet-logged survey (if any) as a
      // synthetic entry at the current dose — otherwise the whole point of
      // asking before you draw up today's dose is defeated, since the
      // recommendation would only ever reflect it *after* the injection (and
      // its side effects) already happened. Only applies when today isn't
      // already logged for real — once it is, the real record takes over.
      const todayStr = msToLocalDate(todayMs);
      const alreadyLoggedToday = ds.sortedInj.some(i => i.date === todayStr);
      const sortedInjForSignals = (pendingSurvey && pendingSurvey.date === todayStr && !alreadyLoggedToday)
        ? [...ds.sortedInj, { date: todayStr, doseMg: ds.lastDose, ...pendingSurvey }]
        : ds.sortedInj;
      const gi = giToleranceSignal(sortedInjForSignals, todayMs);
      // Computed unconditionally, ahead of recommendedDose — doseGuidance
      // needs to know whether hunger/food-noise contradict the appetite
      // signal *before* deciding whether to apply the override at all, not
      // just to annotate it afterward.
      const crossCheck = subjectiveAppetiteCrossCheck(sortedInjForSignals, todayMs, gi);
      const rec = recommendedDose(ds.weeklyDose, recent.twoWeekLoss, appetite, gi, crossCheck);
      const recWeekly = rec.dose != null ? rec.dose : ds.weeklyDose;
      return { g: rec.g, dose: rec.dose, recWeekly, perInjMg: recWeekly / ds.injPerWeek, appetite, gi, crossCheck };
    }

    // Computes a "weekly dose" timeline for the chart pills — two different
    // strategies depending on schedule mode, because neither one alone covers
    // both real cases:
    //   - weekday mode (e.g. Sun+Thu): doses/week is a whole number and every
    //     calendar week reliably contains that many shots, so summing whatever
    //     actually landed in each Sun-Sat week is exact — including uneven
    //     splits (e.g. 1mg + 1.25mg the same week while titrating).
    //   - interval mode (e.g. every 2 days) or no schedule: doses/week is
    //     often fractional (7/2 = 3.5) and calendar weeks don't align with the
    //     cycle, so a literal per-calendar-week sum would just alternate
    //     between two noisy counts (e.g. 3mg one week, 4mg the next) instead
    //     of a stable figure. Use the same continuous estimate DosePanel/PkChart
    //     already show instead: perInjectionDose × injPerWeek, re-evaluated
    //     each time the per-injection dose itself changes.
    // `ds` is a getDoseSchedule(...) result (or null/undefined).
    function buildWeeklyDoseCycles(injections, ds) {
      const sortedInj = [...(injections || [])].sort((a, b) => a.date.localeCompare(b.date));
      const injPerWeek = ds ? ds.injPerWeek : 1;

      if (ds && ds.weekdayActive) {
        const weekStartMs = ms => {
          const d = new Date(ms);
          d.setHours(0, 0, 0, 0);
          d.setDate(d.getDate() - d.getDay());
          return d.getTime();
        };
        const weekGroups = {};
        for (const inj of sortedInj) {
          const ms = new Date(inj.date + 'T12:00:00').getTime();
          const wk = weekStartMs(ms);
          if (!weekGroups[wk]) weekGroups[wk] = { doseMg: 0, firstMs: ms, count: 0 };
          weekGroups[wk].doseMg += inj.doseMg;
          weekGroups[wk].firstMs = Math.min(weekGroups[wk].firstMs, ms);
          weekGroups[wk].count++;
        }
        const currentWkMs = weekStartMs(Date.now());
        const cycles = Object.values(weekGroups)
          .sort((a, b) => a.firstMs - b.firstMs)
          .map((g, i, arr) => {
            const doseMg = Math.round(g.doseMg * 1000) / 1000;
            const isLast = i === arr.length - 1;
            // Only in-progress current week gets projected, and only when partial
            // (fewer shots logged so far than the schedule's usual doses/week).
            const effectiveDose = (isLast && weekStartMs(g.firstMs) === currentWkMs && g.count < injPerWeek)
              ? Math.round((doseMg / g.count) * injPerWeek * 1000) / 1000
              : doseMg;
            return { startMs: g.firstMs, doseMg: effectiveDose, count: g.count };
          });
        return dedupCycles(cycles);
      }

      // Interval mode / fallback: one cycle per contiguous run of same
      // per-injection dose, shown as a continuous weekly estimate.
      const periods = [];
      for (const inj of sortedInj) {
        const ms = new Date(inj.date + 'T12:00:00').getTime();
        const last = periods[periods.length - 1];
        if (last && last.rawDose === inj.doseMg) { last.count++; last.lastMs = ms; }
        else { periods.push({ rawDose: inj.doseMg, startMs: ms, lastMs: ms, count: 1 }); }
      }
      const cycles = periods.map(p =>
        ({ startMs: p.startMs, doseMg: Math.round(p.rawDose * injPerWeek * 1000) / 1000, count: p.count }));
      return dedupCycles(cycles);
    }
    // Dedup consecutive cycles that land on the same weekly total.
    function dedupCycles(cycles) {
      const deduped = [];
      let prevDose = null;
      for (const c of cycles) {
        if (c.doseMg !== prevDose) { deduped.push(c); prevDose = c.doseMg; }
      }
      return deduped;
    }
    // Which weekly dose was active as of `ms` (most recent cycle at-or-before ms).
    function doseActiveAt(cycles, ms) {
      let d = null;
      for (const c of cycles) { if (c.startMs <= ms) d = c.doseMg; else break; }
      return d;
    }

    /* ─── Logbook item builder ───────────────────────────────────────────────── */
    function buildItems(rows, injections) {
      const injDesc = [...injections].sort((a, b) => b.date.localeCompare(a.date));
      const injSet  = new Set(injections.map(i => i.date));
      const items   = [];
      let   injIdx  = 0;
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        while (injIdx < injDesc.length && injDesc[injIdx].date >= row.date) {
          items.push({ type: 'injection', ...injDesc[injIdx] });
          injIdx++;
        }
        items.push({ type: 'row', ...row, isInjDay: injSet.has(row.date), isLast: i === rows.length - 1 });
      }
      while (injIdx < injDesc.length) items.push({ type: 'injection', ...injDesc[injIdx++] });
      return items;
    }

    /* ─── Formatting ─────────────────────────────────────────────────────────── */
    const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const fmtDate  = s => { const d = new Date(s + 'T12:00:00'); return { mo: MO[d.getMonth()], day: d.getDate(), wd: WD[d.getDay()] }; };
    const fmtShort = s => { const { mo, day } = fmtDate(s); return `${mo} ${day}`; };
    // Convert a ms timestamp to a local YYYY-MM-DD string (avoids UTC-date shift for e.g. 8pm injections)
    const msToLocalDate = ms => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const fw = v => v != null ? v.toFixed(1) : '—';

    function rateInfo(v) {
      if (v == null) return null;
      const abs = Math.abs(v).toFixed(2);
      if (v < -0.01) return { label: `↓ ${abs}`, cls: 'loss' };
      if (v >  0.01) return { label: `↑ ${abs}`, cls: 'gain' };
      return { label: `→ ${abs}`, cls: 'flat' };
    }
    const BADGE = {
      loss: { background: '#e6f9ef', color: '#1a7f3c' },
      gain: { background: '#fff2f0', color: '#c0392b' },
      flat: { background: '#f2f2f7', color: '#8e8e93' },
    };
    const today = () => new Date().toLocaleDateString('en-CA');

    // Shared by CalorieChart and PkChart's range-selector dropdowns.
    function windowDaysForRange(rangeMode, customDays) {
      switch (rangeMode) {
        case '7d': return 7;
        case '14d': return 14;
        case '30d': return 30;
        case 'custom': return Math.max(0, Number(customDays) || 0);
        default: return 0; // 'all'
      }
    }

    // An SVG <path> 'd' for a bar rounded only at the data-end — the end
    // touching the baseline stays square. A plain <rect rx> rounds all 4
    // corners, which is wrong for a bar (the baseline-touching end isn't a
    // data-end). Handles bars that grow up from a bottom baseline (yEnd <
    // yBaseline) and bars that flip direction by sign around a center
    // baseline (diverging charts), since direction is a parameter here, not
    // assumed.
    function roundedBarPath(x, w, yBaseline, yEnd, r) {
      const up = yEnd < yBaseline;
      const rr = Math.max(0, Math.min(r, w / 2, Math.abs(yBaseline - yEnd)));
      if (rr === 0) return `M${x},${yBaseline} H${x+w} V${yEnd} H${x} Z`;
      return up
        ? `M${x},${yBaseline} V${yEnd+rr} Q${x},${yEnd} ${x+rr},${yEnd} H${x+w-rr} Q${x+w},${yEnd} ${x+w},${yEnd+rr} V${yBaseline} Z`
        : `M${x},${yBaseline} V${yEnd-rr} Q${x},${yEnd} ${x+rr},${yEnd} H${x+w-rr} Q${x+w},${yEnd} ${x+w},${yEnd-rr} V${yBaseline} Z`;
    }

    /* ─── Calories & Nutrition ───────────────────────────────────────────────── */
    // Small shared bits used by all three cards below.
    const CAL_CARD = { borderRadius: 18, overflow: 'hidden', background: '#fff',
                        border: '.5px solid rgba(0,0,0,.08)', marginBottom: 10 };
    const CAL_HEADER = { padding: '10px 14px 6px', borderBottom: '.5px solid rgba(0,0,0,.06)' };
    const CAL_TITLE = { fontSize: 13, fontWeight: 700, color: '#1c1c1e' };
    const swatch = (color) => ({ display: 'inline-block', width: 12, height: 12, background: color,
                                  marginRight: 5, verticalAlign: 'middle', borderRadius: 3 });

    function CaloriesActivitySection({ calorieData, rows, calorieTargets, proteinTargets, onSaveProteinTargets, isAdmin, onSaveCalorieTargets, intervalsCalories }) {
      const [rangeMode, setRangeMode] = useState('30d');
      const [customDays, setCustomDays] = useState(30);
      const [windowOffset, setWindowOffset] = useState(0);
      const selectRange = (mode) => { setRangeMode(mode); setWindowOffset(0); };

      if (!calorieData || calorieData.length < 2) return null;

      const STEP = 86400000;
      const sorted = [...calorieData].sort((a, b) => a.date.localeCompare(b.date));
      const todayMs = new Date().setHours(0, 0, 0, 0);
      const startMs = new Date(sorted[0].date + 'T00:00:00').getTime();

      const windowDays = windowDaysForRange(rangeMode, customDays);
      const refEnd = todayMs + STEP;
      const pageShift = windowOffset * windowDays * STEP;
      const visStartMs = windowDays ? refEnd - windowDays * STEP - pageShift : startMs;
      const visEndMs = windowDays ? refEnd - pageShift : todayMs + STEP;
      const canScrollEarlier = windowDays && startMs < visStartMs;
      const canScrollLater = windowDays && windowOffset > 0;

      const periodDaily = sorted
        .filter(d => {
          const ms = new Date(d.date + 'T00:00:00').getTime();
          return ms >= visStartMs && ms < visEndMs;
        })
        .map(d => ({ ...d, ms: new Date(d.date + 'T00:00:00').getTime() }));

      if (periodDaily.length === 0) return null;

      return (
        <>
          <div style={CAL_CARD}>
            <div style={CAL_HEADER}><div style={CAL_TITLE}>Calories &amp; Nutrition</div></div>
            <div style={{ display: 'flex', gap: 6, padding: '8px 14px 4px', alignItems: 'center' }}>
              <select value={rangeMode} onChange={e => selectRange(e.target.value)}
                      style={{ fontSize: 10, fontWeight: 600, padding: '5px 8px', borderRadius: 8,
                               background: '#f2f2f7', color: '#3c3c43', border: 'none', outline: 'none', cursor: 'pointer' }}>
                <option value="7d">7 Days</option>
                <option value="14d">14 Days</option>
                <option value="30d">Month</option>
                <option value="all">All</option>
                <option value="custom">Custom</option>
              </select>
              {rangeMode === 'custom' && (
                <input type="number" min="1" step="1" value={customDays}
                       onChange={e => setCustomDays(e.target.value)}
                       placeholder="days"
                       style={{ width: 56, fontSize: 10, fontWeight: 600, padding: '5px 6px', borderRadius: 8,
                                border: '1px solid #d1d1d6', background: '#f9f9f9', color: '#1c1c1e', outline: 'none' }} />
              )}
            </div>
            {windowDays !== 0 && (
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                            padding: '0 14px 10px', fontSize: 9, color: '#aeaeb2' }}>
                <button onClick={() => canScrollEarlier && setWindowOffset(o => o + 1)}
                        disabled={!canScrollEarlier}
                        style={{ fontSize: 9, fontWeight: 600, padding: '2px 8px', borderRadius: 6,
                                 background: canScrollEarlier ? '#e5e5ea' : 'transparent',
                                 color: canScrollEarlier ? '#3c3c43' : '#c7c7cc',
                                 border: 'none', cursor: canScrollEarlier ? 'pointer' : 'default' }}>
                  ← Earlier
                </button>
                <span>{new Date(visStartMs).toISOString().slice(5,10)} – {new Date(Math.min(todayMs, visEndMs)).toISOString().slice(5,10)}</span>
                <button onClick={() => canScrollLater && setWindowOffset(o => o - 1)}
                        disabled={!canScrollLater}
                        style={{ fontSize: 9, fontWeight: 600, padding: '2px 8px', borderRadius: 6,
                                 background: canScrollLater ? '#e5e5ea' : 'transparent',
                                 color: canScrollLater ? '#3c3c43' : '#c7c7cc',
                                 border: 'none', cursor: canScrollLater ? 'pointer' : 'default' }}>
                  Later →
                </button>
              </div>
            )}
          </div>

          <div style={CAL_CARD}>
            <div style={CAL_HEADER}><div style={CAL_TITLE}>Calories: Intake vs Burn</div></div>
            <TdeeChart periodDaily={periodDaily} visStartMs={visStartMs} visEndMs={visEndMs}
                       calorieTargets={calorieTargets} isAdmin={isAdmin} onSaveCalorieTargets={onSaveCalorieTargets} />
          </div>

          <div style={CAL_CARD}>
            <div style={CAL_HEADER}><div style={CAL_TITLE}>Calories vs Target</div></div>
            <CaloriesVsTargetChart periodDaily={periodDaily} visStartMs={visStartMs} visEndMs={visEndMs} todayMs={todayMs}
                                   rows={rows} calorieTargets={calorieTargets} intervalsCalories={intervalsCalories} />
          </div>

          <div style={CAL_CARD}>
            <div style={CAL_HEADER}><div style={CAL_TITLE}>Protein</div></div>
            <ProteinChart periodDaily={periodDaily} visStartMs={visStartMs} visEndMs={visEndMs}
                          proteinTargets={proteinTargets} isAdmin={isAdmin} onSaveProteinTargets={onSaveProteinTargets} />
          </div>
        </>
      );
    }

    /* ─── Card 1: Calories: Intake vs Burn ───────────────────────────────────── */
    function TdeeChart({ periodDaily, visStartMs, visEndMs, calorieTargets, isAdmin, onSaveCalorieTargets }) {
      const [tip, setTip] = useState(null);
      const [editing, setEditing] = useState(false);
      const [draftTarget, setDraftTarget] = useState('');
      const [saving, setSaving] = useState(false);
      const [saveErr, setSaveErr] = useState('');

      const VW = 360, VH = 150;
      const PAD = { t: 10, r: 8, b: 28, l: 34 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;

      const pts = periodDaily.map(d => ({
        ...d,
        tdee: (d.BasalEnergy || 0) + (d.ActiveEnergy || 0),
        target: targetActiveAt(calorieTargets, d.date),
      }));

      const maxVal = Math.max(...pts.map(p => Math.max(p.Calories || 0, p.tdee, p.target || 0)), 100) * 1.15;
      const xOf = ms => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const yOf = v => PAD.t + cH - (v / maxVal) * cH;
      const yBaseline = PAD.t + cH;

      const slotW = cW / pts.length;
      // barW*2 + GAP is deliberately well under slotW so there's real
      // whitespace between one day's pair and the next, not just between
      // the two bars within a day.
      const barW = Math.max(0.5, Math.min(12, slotW * 0.32));
      const GAP = Math.max(0.3, slotW * 0.06);

      const avgConsumed = avg(pts.map(p => p.Calories || 0));
      const avgTdee = avg(pts.map(p => p.tdee));
      const withTarget = pts.filter(p => p.target != null);
      const pctOverTarget = withTarget.length
        ? Math.round(withTarget.filter(p => (p.Calories || 0) > p.target).length / withTarget.length * 100)
        : null;

      const currentTarget = targetActiveAt(calorieTargets, today());
      const startEdit = () => { setDraftTarget(String(currentTarget ?? 1500)); setEditing(true); setSaveErr(''); };
      const saveTarget = async () => {
        const n = parseFloat(draftTarget);
        if (isNaN(n) || n <= 0) { setSaveErr('Enter a valid number'); return; }
        setSaving(true); setSaveErr('');
        const ok = await onSaveCalorieTargets(n);
        setSaving(false);
        if (ok) setEditing(false); else setSaveErr("Couldn't save — try again.");
      };

      return (
        <div>
          <svg viewBox={`0 0 ${VW} ${VH}`} style={{ width: '100%', height: 'auto', display: 'block' }}
               onMouseMove={(e) => {
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = (e.clientX - rect.left) / rect.width * VW;
                 if (x < PAD.l || x > PAD.l + cW) { setTip(null); return; }
                 const targetMs = visStartMs + (x - PAD.l) / cW * (visEndMs - visStartMs);
                 let idx = 0, minDist = Infinity;
                 pts.forEach((p, i) => { const d = Math.abs(p.ms - targetMs); if (d < minDist) { minDist = d; idx = i; } });
                 setTip(pts[idx]);
               }}
               onMouseLeave={() => setTip(null)}>
            {pts.map(p => {
              const cx = xOf(p.ms);
              const xTdee = cx - GAP / 2 - barW;
              const xCons = cx + GAP / 2;
              const yBasalTop = yOf(p.BasalEnergy || 0);
              const stackGap = 1;
              const yActiveBottom = Math.min(yBasalTop, yBaseline) - ((p.BasalEnergy||0) > 0 ? stackGap : 0);
              const yActiveTop = yOf(p.tdee);
              const rx = Math.min(2, barW * 0.3);
              return (
                <g key={p.date}>
                  {/* TDEE stack: basal (aqua) + active (orange), 1-unit gap between */}
                  <rect x={xTdee} y={Math.min(yBasalTop, yBaseline)} width={barW}
                        height={Math.max(0, yBaseline - Math.min(yBasalTop, yBaseline))} fill="#1baf7a" />
                  <path d={roundedBarPath(xTdee, barW, yActiveBottom, yActiveTop, rx)} fill="#eb6834" />
                  {/* Consumed */}
                  <path d={roundedBarPath(xCons, barW, yBaseline, yOf(p.Calories || 0), rx)} fill="#2a78d6" />
                  {/* Target — a solid tick over this day's Consumed bar, extending
                      slightly past it so it reads as a line even at narrow bar
                      widths (a dash pattern this short just looked like dots). */}
                  {p.target != null && (
                    <line x1={xCons - barW * 0.2} x2={xCons + barW * 1.2} y1={yOf(p.target)} y2={yOf(p.target)}
                          stroke="#1c1c1e" strokeWidth="1.1" strokeLinecap="round" opacity="0.8" />
                  )}
                </g>
              );
            })}

            <line x1={PAD.l} y1={yBaseline} x2={PAD.l + cW} y2={yBaseline} stroke="rgba(0,0,0,.12)" strokeWidth="0.5" />

            {(() => {
              const step = maxVal > 3000 ? 1000 : 500;
              const labels = [];
              for (let v = 0; v <= maxVal; v += step) labels.push(v);
              return labels.map(v => (
                <g key={`y-${v}`}>
                  <line x1={PAD.l - 2} y1={yOf(v)} x2={PAD.l + cW} y2={yOf(v)} stroke="rgba(0,0,0,.05)" strokeWidth="0.5" />
                  <text x={PAD.l - 3} y={yOf(v) + 2} textAnchor="end" fontSize="7" fill="#aeaeb2">{v}</text>
                </g>
              ));
            })()}

            {pts.filter((_, i) => i % Math.max(1, Math.floor(pts.length / 4)) === 0).map(p => (
              <text key={p.date} x={xOf(p.ms)} y={yBaseline + 10} textAnchor="middle" fontSize="7" fill="#aeaeb2">{p.date.slice(5)}</text>
            ))}

            {tip && (() => {
              const TW = 86, TH = 32;
              const tx = Math.max(PAD.l, Math.min(xOf(tip.ms) - TW / 2, PAD.l + cW - TW));
              const ty = PAD.t + 2;
              return (
                <g style={{ pointerEvents: 'none' }}>
                  <line x1={xOf(tip.ms)} y1={PAD.t} x2={xOf(tip.ms)} y2={yBaseline} stroke="rgba(28,28,30,.2)" strokeWidth="1" />
                  <rect x={tx} y={ty} width={TW} height={TH} rx={3} fill="#1c1c1e" opacity="0.92" />
                  <text x={tx + TW / 2} y={ty + 8} textAnchor="middle" fontSize="4.5" fill="#aeaeb2">{tip.date.slice(5)}</text>
                  <text x={tx + TW / 2} y={ty + 16} textAnchor="middle" fontSize="5" fontWeight="600">
                    <tspan fill="#6ba9e8">{Math.round(tip.Calories || 0)} consumed</tspan>
                  </text>
                  <text x={tx + TW / 2} y={ty + 23} textAnchor="middle" fontSize="4.5" fontWeight="600">
                    <tspan fill="#5ec99a">{Math.round(tip.BasalEnergy || 0)} basal</tspan>
                    <tspan fill="#48484a"> + </tspan>
                    <tspan fill="#f0a978">{Math.round(tip.ActiveEnergy || 0)} active</tspan>
                  </text>
                  <text x={tx + TW / 2} y={ty + 29} textAnchor="middle" fontSize="4" fill="#aeaeb2">
                    = {Math.round(tip.tdee)} burned
                  </text>
                </g>
              );
            })()}
          </svg>

          <div style={{ display: 'flex', padding: '8px 14px 4px', gap: 12, alignItems: 'flex-start' }}>
            <PkStat label="Avg Consumed" value={Math.round(avgConsumed).toLocaleString() + ' cal'} color="#2a78d6" />
            <PkStat label="Avg TDEE" value={Math.round(avgTdee).toLocaleString() + ' cal'} color="#eb6834" />
            <PkStat label="Over Target" value={pctOverTarget != null ? pctOverTarget + '%' : '—'} note="of days" color="#3c3c43" />
          </div>

          <div style={{ padding: '6px 14px', fontSize: 11, fontWeight: 600, color: '#3c3c43', display: 'flex', gap: 14, flexWrap: 'wrap' }}>
            <div><span style={swatch('#1baf7a')}></span>Basal</div>
            <div><span style={swatch('#eb6834')}></span>Active</div>
            <div><span style={swatch('#2a78d6')}></span>Consumed</div>
            <div><span style={{ display: 'inline-block', width: 12, height: 2, background: '#1c1c1e',
                                 marginRight: 5, verticalAlign: 'middle', opacity: .8 }}></span>Target</div>
          </div>

          <div style={{ padding: '0 14px 12px', display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            {!editing ? (
              <>
                <span style={{ fontSize: 11, color: '#8e8e93' }}>
                  Target: {currentTarget != null ? `${currentTarget} cal` : 'not set'}
                </span>
                {isAdmin && (
                  <button onClick={startEdit}
                          style={{ fontSize: 11, color: '#2a78d6', background: 'none', border: 'none',
                                   cursor: 'pointer', fontWeight: 600 }}>Edit</button>
                )}
              </>
            ) : (
              <>
                <input type="number" step="10" value={draftTarget} onChange={e => setDraftTarget(e.target.value)}
                       style={{ width: 68, fontSize: 12, padding: '4px 6px', borderRadius: 6,
                                border: '1px solid #d1d1d6', background: '#f9f9f9', outline: 'none' }} />
                <button onClick={saveTarget} disabled={saving}
                        style={{ fontSize: 11, fontWeight: 600, color: '#fff',
                                 background: saving ? '#a9c8ea' : '#2a78d6', border: 'none', borderRadius: 6,
                                 padding: '5px 10px', cursor: saving ? 'default' : 'pointer' }}>
                  {saving ? 'Saving…' : 'Save'}
                </button>
                <button onClick={() => { setEditing(false); setSaveErr(''); }} disabled={saving}
                        style={{ fontSize: 11, color: '#8e8e93', background: 'none', border: 'none', cursor: 'pointer' }}>
                  Cancel
                </button>
                {saveErr && <span style={{ fontSize: 11, color: '#d03b3b' }}>{saveErr}</span>}
              </>
            )}
          </div>
        </div>
      );
    }

    /* ─── Card 2: Calories vs Target ─────────────────────────────────────────── */
    // Deliberately does NOT re-derive a "goal deficit" from TDEE. Your calorie
    // target already has an estimated TDEE baked in from when it was set (MFP's
    // own methodology) — subtracting today's actual, noisy Basal+Active on top
    // of that double-counts TDEE and produces a wildly swinging "goal" that can
    // look like a prescribed 1800-calorie deficit on a big exercise day. It
    // isn't one; it's a measurement artifact (Apple's active-energy estimate
    // alone carries ~30% error). The only thing that's actually safe to hold
    // you to daily is whether you hit the number you *chose*: consumed vs
    // target. TDEE/energy-balance still matters, but only as a multi-day
    // trend (the Predicted Pace stat below), never a single day's headline.
    //
    // Exercise credit: the target is bumped up on workout days, mirroring
    // MFP's own "Goal + Exercise − Food" convention. Prefers the *real*
    // per-workout calorie figure from intervals.icu (same source RidesChart
    // shows — all logged activities there, not just cycling, despite the
    // chart's name — e.g. the actual 1590 cal Strava reported for a given
    // ride), since that's the one source in this app precise enough to
    // trust. Only falls back to that day's HealthKit Active Energy total (on
    // days flagged via a "Workout" row in the Health export, e.g. an activity
    // intervals.icu never saw) when no intervals.icu figure exists for the
    // date — that fallback runs lower than Strava's own number, since
    // HealthKit's day-level aggregate isn't workout-specific.
    // Crediting Active Energy on *every* day (tried first, before the
    // HasWorkout gate existed) is wrong regardless of source: ordinary NEAT
    // (walking, chores, standing) happens every day, not just workout days,
    // and inflating the target daily painted almost the whole chart red as a
    // fake "way under" reading. Still additive only (never lowers the target
    // below the base MFP number), so it can't reproduce the TDEE-subtraction
    // danger warned about above.
    function CaloriesVsTargetChart({ periodDaily, visStartMs, visEndMs, todayMs, rows, calorieTargets, intervalsCalories }) {
      const [tip, setTip] = useState(null);

      const VW = 360, VH = 140;
      const PAD = { t: 10, r: 8, b: 28, l: 34 };
      const cW = VW - PAD.l - PAD.r;
      const cH = VH - PAD.t - PAD.b;

      const pts = periodDaily.map(d => {
        const tdee = (d.BasalEnergy || 0) + (d.ActiveEnergy || 0);
        const net = (d.Calories || 0) - tdee;
        const { baseTarget, exercise, target, deviation } = calorieDeviationFor(d, calorieTargets, intervalsCalories);
        const tier = deviation != null ? netTier(deviation) : null;
        return { ...d, tdee, net, baseTarget, exercise, target, deviation, tier };
      });
      const withDeviation = pts.filter(p => p.deviation != null);

      const maxAbs = Math.max(...withDeviation.map(p => Math.abs(p.deviation)), 300) * 1.15;
      const yZero = PAD.t + cH / 2;
      const yOf = v => yZero - (v / maxAbs) * (cH / 2);
      const xOf = ms => PAD.l + ((ms - visStartMs) / (visEndMs - visStartMs)) * cW;
      const barW = Math.max(0.5, Math.min(10, (cW / pts.length) * 0.55));

      // Multi-day energy-balance trend — averaging over the whole visible
